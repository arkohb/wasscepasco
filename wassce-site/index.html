ng things and give one example of each.<br>(c) State three differences between insects and arachnids.", "sol": ["(a) To make the study of the great variety of organisms easier and more orderly; to show relationships and evolutionary links between organisms; to make identification and communication among scientists easier (any two).", "(b) Monera — bacteria; Protista — <i>Amoeba</i>/<i>Paramecium</i>; Fungi — mushroom/mould; Plantae — maize; Animalia — goat.", "(c) 1. Insects have three body parts (head, thorax, abdomen); arachnids have two (cephalothorax and abdomen).", "2. Insects have three pairs of legs; arachnids have four pairs.", "3. Insects have antennae and usually wings; arachnids have neither."], "marks": 10, "tip": null, "fig": null, "id": "classify-6", "topic": "classify"}, {"type": "obj", "q": "Which structure is found in a plant cell but NOT in an animal cell?", "opts": ["Mitochondrion", "Cell membrane", "Cell wall", "Nucleus"], "ans": 2, "sol": ["The cellulose cell wall is found only in plant cells."], "tip": null, "fig": null, "id": "cells-1", "topic": "cells"}, {"type": "obj", "q": "The part of the cell that controls the entry and exit of substances is the ___", "opts": ["cell membrane", "cell wall", "nucleus", "vacuole"], "ans": 0, "sol": ["The cell membrane is selectively (semi-) permeable."], "tip": null, "fig": null, "id": "cells-2", "topic": "cells"}, {"type": "obj", "q": "Energy is released in the cell mainly in the ___", "opts": ["vacuole", "nucleus", "mitochondria", "ribosomes"], "ans": 2, "sol": ["Mitochondria are the sites of aerobic respiration, so they are called the powerhouse of the cell."], "tip": null, "fig": null, "id": "cells-3", "topic": "cells"}, {"type": "obj", "q": "A fresh piece of yam placed in concentrated salt solution becomes soft and loses weight. This is because water moves out of the cells by ___", "opts": ["active transport", "transpiration", "osmosis", "diffusion of salt"], "ans": 2, "sol": ["Water passes from the dilute cell sap to the more concentrated salt solution through the semi-permeable membrane — osmosis."], "tip": null, "fig": null, "id": "cells-4", "topic": "cells"}, {"type": "obj", "q": "The correct order of organisation in a living organism is ___", "opts": ["tissue → cell → organ → system", "cell → tissue → organ → system", "organ → tissue → cell → system", "cell → organ → tissue → system"], "ans": 1, "sol": ["Cells of the same kind form tissues, tissues form organs, and organs working together form a system."], "tip": null, "fig": null, "id": "cells-5", "topic": "cells"}, {"type": "thy", "q": "(a) Draw and label a plant cell (six labels).<br>(b) State three differences between a plant cell and an animal cell.<br>(c) Describe an experiment to demonstrate osmosis using a fresh potato or yam tuber.", "sol": ["(a) Labels: cell wall, cell membrane, cytoplasm, nucleus, chloroplast, vacuole (also: cell sap, mitochondrion).", "(b) 1. A plant cell has a cellulose cell wall; an animal cell has only a cell membrane.", "2. A plant cell has chloroplasts; an animal cell has none.", "3. A plant cell has one large permanent vacuole; an animal cell has small temporary vacuoles or none.", "(c) Cut two equal cups out of a peeled potato/yam tuber. Half-fill one with concentrated sugar or salt solution (A) and leave the other empty (B, the control).", "Stand both in a dish of water so that the water is below the rim, and leave for about an hour.", "<b>Result:</b> the level of solution in A rises, while B stays as it was.", "<b>Conclusion:</b> water moved from the dish (dilute) through the living tuber tissue into the concentrated solution — osmosis."], "marks": 12, "tip": null, "fig": null, "id": "cells-6", "topic": "cells"}, {"type": "obj", "q": "An atom has an atomic number of 11 and a mass number of 23. How many neutrons does it have?", "opts": ["34", "11", "23", "12"], "ans": 3, "sol": ["Neutrons = mass number − atomic number", "= 23 − 11 = 12"], "tip": null, "fig": null, "id": "matter-1", "topic": "matter"}, {"type": "obj", "q": "Which of the following is a compound?", "opts": ["Water", "Soil", "Brass", "Air"], "ans": 0, "sol": ["Water is made of hydrogen and oxygen chemically combined in a fixed ratio.", "Air, brass and soil are mixtures."], "tip": null, "fig": null, "id": "matter-2", "topic": "matter"}, {"type": "obj", "q": "Which method would you use to obtain pure water from sea water?", "opts": ["Filtration", "Distillation", "Decantation", "Evaporation to dryness"], "ans": 1, "sol": ["Distillation vaporises the water and condenses it, leaving the dissolved salts behind.", "Evaporation to dryness would give the salt, not the water."], "tip": null, "fig": null, "id": "matter-3", "topic": "matter"}, {"type": "obj", "q": "The electron configuration of an element with atomic number 12 is ___", "opts": ["2, 2, 8", "2, 8, 8", "8, 2, 2", "2, 8, 2"], "ans": 3, "sol": ["Fill the shells in order: 2, then 8, leaving 2 — so 2, 8, 2.", "Two electrons in the outermost shell means it is in Group II (magnesium)."], "tip": null, "fig": null, "id": "matter-4", "topic": "matter"}, {"type": "obj", "q": "A mixture of iron filings and sulphur can best be separated by ___", "opts": ["using a magnet", "heating strongly", "filtering", "distilling"], "ans": 0, "sol": ["Iron is magnetic and sulphur is not, so a magnet separates them.", "Heating would make them react chemically to form iron(II) sulphide."], "tip": null, "fig": null, "id": "matter-5", "topic": "matter"}, {"type": "thy", "q": "(a) Give three differences between a compound and a mixture.<br>(b) An atom of an element X has 17 protons and 18 neutrons. State (i) its atomic number; (ii) its mass number; (iii) its electron configuration; (iv) the group to which it belongs.<br>(c) Describe how you would obtain pure salt from a mixture of salt and sand.", "sol": ["(a) 1. The parts of a compound are chemically combined; those of a mixture are only physically mixed.", "2. A compound has a fixed composition by mass; a mixture can be in any proportion.", "3. A compound's properties differ from those of its elements, and it can only be separated chemically; a mixture keeps the properties of its parts and separates physically.", "(b)(i) <b>17</b> &nbsp;(ii) 17 + 18 = <b>35</b> &nbsp;(iii) <b>2, 8, 7</b> &nbsp;(iv) seven outer electrons ⇒ <b>Group VII</b> (it is chlorine).", "(c) Add water to the mixture and stir — the salt dissolves and the sand does not.", "Filter: the sand remains on the filter paper as residue and the salt solution passes through as filtrate.", "Evaporate the filtrate to the point of crystallisation and allow it to cool, or evaporate to dryness, to obtain the salt."], "marks": 12, "tip": null, "fig": null, "id": "matter-6", "topic": "matter"}, {"type": "obj", "q": "A solution turns blue litmus paper red. The solution is most likely to have a pH of ___", "opts": ["9", "7", "3", "12"], "ans": 2, "sol": ["Turning blue litmus red shows an acid, so the pH must be below 7."], "tip": null, "fig": null, "id": "acids-1", "topic": "acids"}, {"type": "obj", "q": "Which gas is produced when dilute hydrochloric acid reacts with zinc?", "opts": ["Carbon dioxide", "Nitrogen", "Oxygen", "Hydrogen"], "ans": 3, "sol": ["Acid + metal → salt + hydrogen.", "The gas burns with a 'pop' sound when tested with a lighted splint."], "tip": null, "fig": null, "id": "acids-2", "topic": "acids"}, {"type": "obj", "q": "The reaction between an acid and a base to form salt and water only is called ___", "opts": ["oxidation", "displacement", "neutralisation", "hydrolysis"], "ans": 2, "sol": ["It is neutralisation: H⁺ from the acid joins OH⁻ from the base to form water."], "tip": null, "fig": null, "id": "acids-3", "topic": "acids"}, {"type": "obj", "q": "Which of these would best relieve indigestion caused by excess acid in the stomach?", "opts": ["Vinegar", "Lemon juice", "Common salt", "Magnesium hydroxide"], "ans": 3, "sol": ["Magnesium hydroxide is a base, so it neutralises the excess hydrochloric acid.", "Lemon juice and vinegar are themselves acids."], "tip": null, "fig": null, "id": "acids-4", "topic": "acids"}, {"type": "obj", "q": "When dilute acid is added to a carbonate, the gas given off turns lime water milky. The gas is ___", "opts": ["oxygen", "ammonia", "carbon dioxide", "hydrogen"], "ans": 2, "sol": ["Acid + carbonate → salt + water + carbon dioxide, and CO₂ turns lime water milky."], "tip": null, "fig": null, "id": "acids-5", "topic": "acids"}, {"type": "thy", "q": "(a) State three properties each of acids and of bases.<br>(b) Write a word equation for the reaction between hydrochloric acid and sodium hydroxide.<br>(c) Describe how you would use litmus paper to show that wood ash solution is basic.<br>(d) State two uses of neutralisation in everyday life.", "sol": ["(a) <b>Acids:</b> turn blue litmus red; taste sour; have pH below 7; react with metals to give hydrogen; react with carbonates to give CO₂.", "<b>Bases:</b> turn red litmus blue; feel soapy or slippery; have pH above 7; neutralise acids to give salt and water.", "(b) hydrochloric acid + sodium hydroxide → sodium chloride + water", "(c) Dissolve a little wood ash in water and filter. Dip a piece of red litmus paper into the filtrate. The red litmus turns blue, showing that the solution is basic (alkaline).", "(d) 1. Treating soil that is too acidic by adding lime. 2. Taking antacids for indigestion. (Others: toothpaste neutralising mouth acids; treating wasp or ant stings; treating acidic factory waste before discharge.)"], "marks": 12, "tip": null, "fig": null, "id": "acids-6", "topic": "acids"}, {"type": "obj", "q": "Rusting of iron takes place only in the presence of ___", "opts": ["oxygen and carbon dioxide", "oxygen and water", "water and nitrogen", "oxygen only"], "ans": 1, "sol": ["Iron in dry air does not rust, and iron in boiled water under oil does not rust.", "Both oxygen and water must be present."], "tip": null, "fig": null, "id": "metals-1", "topic": "metals"}, {"type": "obj", "q": "Which of these is a non-metal that conducts electricity?", "opts": ["Sulphur", "Phosphorus", "Graphite", "Iodine"], "ans": 2, "sol": ["Graphite, a form of carbon, has free electrons between its layers, so it conducts."], "tip": null, "fig": null, "id": "metals-2", "topic": "metals"}, {"type": "obj", "q": "Coating iron with zinc to prevent rusting is called ___", "opts": ["galvanising", "electroplating", "smelting", "annealing"], "ans": 0, "sol": ["Zinc is more reactive than iron, so it corrodes first and protects the iron — galvanising."], "tip": null, "fig": null, "id": "metals-3", "topic": "metals"}, {"type": "obj", "q": "Brass is an alloy of ___", "opts": ["iron and carbon", "lead and tin", "copper and zinc", "copper and tin"], "ans": 2, "sol": ["Brass = copper + zinc.", "Copper + tin gives bronze; iron + carbon gives steel."], "tip": null, "fig": null, "id": "metals-4", "topic": "metals"}, {"type": "obj", "q": "Which property of metals allows them to be drawn into wires?", "opts": ["Conductivity", "Malleability", "Ductility", "Sonority"], "ans": 2, "sol": ["Ductility is the ability to be drawn into wires.", "Malleability is the ability to be hammered into sheets."], "tip": null, "fig": null, "id": "metals-5", "topic": "metals"}, {"type": "thy", "q": "(a) State four physical properties of metals.<br>(b) Describe an experiment to show that both air and water are needed for rusting.<br>(c) State three methods of preventing rusting and give one place where each is used.", "sol": ["(a) Shiny (lustrous) when polished; malleable; ductile; good conductors of heat and electricity; sonorous; usually have high melting points and high density.", "(b) Set up three test tubes, each with a clean iron nail.", "Tube A: nail in water and air (open tube). Tube B: nail in boiled water covered with a layer of oil (water, no air). Tube C: nail in dry air over anhydrous calcium chloride, sealed (air, no water).", "Leave for a few days. <b>Result:</b> only the nail in tube A rusts.", "<b>Conclusion:</b> rusting needs both air (oxygen) and water.", "(c) Painting — bridges, roofing sheets and vehicle bodies; oiling or greasing — machine parts and bicycle chains; galvanising — roofing sheets, buckets and nails; electroplating with chromium — taps and car fittings; using stainless steel — cutlery."], "marks": 12, "tip": null, "fig": null, "id": "metals-6", "topic": "metals"}, {"type": "obj", "q": "Hard water is water that ___", "opts": ["does not lather easily with soap", "boils above 100 °C", "contains no dissolved substances", "is unfit for drinking"], "ans": 0, "sol": ["Calcium and magnesium salts react with soap to form scum, so hard water wastes soap.", "Hard water is not necessarily unsafe to drink."], "tip": null, "fig": null, "id": "water-1", "topic": "water"}, {"type": "obj", "q": "Temporary hardness of water can be removed by ___", "opts": ["adding common salt", "filtering", "boiling", "adding more soap"], "ans": 2, "sol": ["Boiling decomposes calcium hydrogen carbonate, depositing it as an insoluble carbonate."], "tip": null, "fig": null, "id": "water-2", "topic": "water"}, {"type": "obj", "q": "In water treatment, alum is added mainly to ___", "opts": ["kill germs", "add minerals", "make suspended particles settle", "remove hardness"], "ans": 2, "sol": ["Alum is a coagulant: it makes fine suspended particles clump together and settle.", "Germs are killed by chlorination."], "tip": null, "fig": null, "id": "water-3", "topic": "water"}, {"type": "obj", "q": "A solution in which no more solute can dissolve at a given temperature is said to be ___", "opts": ["unsaturated", "saturated", "dilute", "concentrated"], "ans": 1, "sol": ["That is the definition of a saturated solution."], "tip": null, "fig": null, "id": "water-4", "topic": "water"}, {"type": "obj", "q": "Which of the following is NOT a use of water in the body?", "opts": ["Regulating body temperature", "Removing waste in urine", "Supplying energy", "Transporting nutrients"], "ans": 2, "sol": ["Water supplies no energy — it contains no calories.", "The other three are genuine roles of water in the body."], "tip": null, "fig": null, "id": "water-5", "topic": "water"}, {"type": "thy", "q": "(a) State three differences between hard and soft water.<br>(b) Explain how temporary hardness of water is caused and how it can be removed.<br>(c) Outline the stages in treating water for town supply.<br>(d) State two advantages and two disadvantages of hard water.", "sol": ["(a) 1. Hard water does not lather easily with soap; soft water lathers readily.", "2. Hard water forms scum with soap; soft water does not.", "3. Hard water contains dissolved calcium/magnesium salts; soft water contains little or none.", "(b) Rain water containing dissolved carbon dioxide passes through limestone, forming soluble calcium hydrogen carbonate. Boiling breaks it down into insoluble calcium carbonate (the 'fur' in kettles), carbon dioxide and water, so the hardness is removed.", "(c) Screening → sedimentation → coagulation with alum → filtration through sand and gravel → chlorination → storage and distribution.", "(d) <b>Advantages:</b> supplies calcium for bones and teeth; better taste; useful in brewing and tanning.", "<b>Disadvantages:</b> wastes soap; furs kettles, boilers and pipes, which wastes fuel and may cause them to burst."], "marks": 15, "tip": null, "fig": null, "id": "water-6", "topic": "water"}, {"type": "obj", "q": "Which soil type has the largest particles and drains most quickly?", "opts": ["Clay soil", "Loamy soil", "Sandy soil", "Silt"], "ans": 2, "sol": ["Sand particles are the largest, so the spaces between them are big and water passes through quickly."], "tip": null, "fig": null, "id": "soil-1", "topic": "soil"}, {"type": "obj", "q": "The organic matter formed from decayed plant and animal remains in soil is called ___", "opts": ["humus", "leachate", "compost activator", "loam"], "ans": 0, "sol": ["Humus improves soil structure, water retention and nutrient supply."], "tip": null, "fig": null, "id": "soil-2", "topic": "soil"}, {"type": "obj", "q": "Which of the following is NOT a method of controlling soil erosion?", "opts": ["Bush burning", "Mulching", "Contour ploughing", "Afforestation"], "ans": 0, "sol": ["Bush burning destroys the vegetation cover and the humus, so it INCREASES erosion."], "tip": null, "fig": null, "id": "soil-3", "topic": "soil"}, {"type": "obj", "q": "The removal of soluble mineral salts from the topsoil by water moving downwards is called ___", "opts": ["capillarity", "weathering", "leaching", "erosion"], "ans": 2, "sol": ["Leaching washes nutrients down beyond the reach of roots; erosion carries soil away from the surface."], "tip": null, "fig": null, "id": "soil-4", "topic": "soil"}, {"type": "obj", "q": "A farmer whose soil is too acidic should add ___", "opts": ["lime", "ammonium sulphate", "common salt", "sulphur"], "ans": 0, "sol": ["Lime (calcium hydroxide/carbonate) is basic and neutralises soil acidity.", "Ammonium sulphate would make the soil more acidic."], "tip": null, "fig": null, "id": "soil-5", "topic": "soil"}, {"type": "thy", "q": "(a) Name the three main types of soil and state one characteristic of each.<br>(b) Explain why loamy soil is the best for crop growth.<br>(c) Describe an experiment to compare the rate of drainage of sandy soil and clay soil.<br>(d) State four ways of maintaining soil fertility.", "sol": ["(a) Sandy — large particles, drains quickly, poor in nutrients. Clay — very fine particles, holds water, poorly aerated and sticky when wet. Loamy — a mixture of sand, silt and clay with humus.", "(b) It holds enough water for plants but allows excess to drain away; it is well aerated; and it is rich in humus and plant nutrients.", "(c) Set up two filter funnels with cotton wool at the neck, one holding dry sandy soil and the other an equal mass of dry clay soil. Stand each over a measuring cylinder. Pour equal volumes of water (say 100 cm³) into each at the same time and record the volume collected after five minutes.", "<b>Result:</b> much more water drains through the sandy soil. <b>Conclusion:</b> sandy soil drains faster than clay soil.", "(d) Applying organic manure or compost; crop rotation; planting leguminous cover crops; applying fertilisers correctly; mulching; avoiding bush burning; fallowing (any four)."], "marks": 15, "tip": null, "fig": null, "id": "soil-6", "topic": "soil"}, {"type": "obj", "q": "The general formula of alkanes is ___", "opts": ["C<sub>n</sub>H<sub>2n</sub>", "C<sub>n</sub>H<sub>n</sub>", "C<sub>n</sub>H<sub>2n+2</sub>", "C<sub>n</sub>H<sub>2n−2</sub>"], "ans": 2, "sol": ["Alkanes are saturated hydrocarbons with the formula CnH2n+2 — for example methane, CH₄ (n = 1)."], "tip": null, "fig": null, "id": "organic-1", "topic": "organic"}, {"type": "obj", "q": "Which of these is an unsaturated hydrocarbon?", "opts": ["Ethane", "Methane", "Ethene", "Propane"], "ans": 2, "sol": ["Ethene (C₂H₄) contains a carbon-to-carbon double bond, so it is unsaturated."], "tip": null, "fig": null, "id": "organic-2", "topic": "organic"}, {"type": "obj", "q": "Crude oil is separated into its various fractions by ___", "opts": ["crystallisation", "filtration", "fractional distillation", "chromatography"], "ans": 2, "sol": ["The fractions have different boiling points, so they condense at different heights in the fractionating column."], "tip": null, "fig": null, "id": "organic-3", "topic": "organic"}, {"type": "obj", "q": "Which fraction of crude oil is used as fuel for aircraft and for lamps?", "opts": ["Petrol", "Lubricating oil", "Kerosene", "Bitumen"], "ans": 2, "sol": ["Kerosene is used for jet engines and for lanterns and stoves."], "tip": null, "fig": null, "id": "organic-4", "topic": "organic"}, {"type": "obj", "q": "A major environmental problem caused by plastics is that they ___", "opts": ["are non-biodegradable", "evaporate easily", "rust quickly", "dissolve in water"], "ans": 0, "sol": ["Most plastics are not broken down by micro-organisms, so they block drains and litter the land for many years."], "tip": null, "fig": null, "id": "organic-5", "topic": "organic"}, {"type": "thy", "q": "(a) What are hydrocarbons? Give two examples.<br>(b) State two differences between alkanes and alkenes.<br>(c) Name four fractions obtained from crude oil and state one use of each.<br>(d) Suggest three ways of reducing plastic pollution in your community.", "sol": ["(a) Hydrocarbons are organic compounds made up of carbon and hydrogen only. Examples: methane (CH₄), ethane (C₂H₆), ethene (C₂H₄).", "(b) 1. Alkanes have only single bonds (saturated); alkenes have at least one double bond (unsaturated).", "2. Alkanes do not decolourise bromine water; alkenes do. (Also: general formulae CnH2n+2 and CnH2n.)", "(c) Petroleum gas — cooking (LPG); petrol — fuel for cars; kerosene — lamps, stoves and jet fuel; diesel — trucks and generators; lubricating oil — oiling machines; bitumen — surfacing roads (any four).", "(d) Reduce, reuse and recycle plastic containers; use cloth or paper bags instead of polythene; separate waste at home and support collection points that buy sachets and bottles; enforce laws against dumping in drains and gutters."], "marks": 15, "tip": null, "fig": null, "id": "organic-6", "topic": "organic"}, {"type": "obj", "q": "The percentage by volume of nitrogen in the atmosphere is about ___", "opts": ["21%", "78%", "0.03%", "50%"], "ans": 1, "sol": ["Nitrogen makes up roughly 78% of dry air, and oxygen about 21%."], "tip": null, "fig": null, "id": "air-1", "topic": "air"}, {"type": "obj", "q": "Which organism converts atmospheric nitrogen into nitrogen compounds in the root nodules of legumes?", "opts": ["<i>Plasmodium</i>", "<i>Rhizobium</i>", "<i>Nitrobacter</i>", "<i>Escherichia coli</i>"], "ans": 1, "sol": ["<i>Rhizobium</i> lives in the root nodules of legumes such as cowpea and groundnut and fixes nitrogen for the plant."], "tip": null, "fig": null, "id": "air-2", "topic": "air"}, {"type": "obj", "q": "Which instrument measures the speed of wind?", "opts": ["Wind vane", "Barometer", "Anemometer", "Hygrometer"], "ans": 2, "sol": ["An anemometer measures wind speed; a wind vane shows the direction."], "tip": null, "fig": null, "id": "air-3", "topic": "air"}, {"type": "obj", "q": "A gas that turns lime water milky is ___", "opts": ["hydrogen", "oxygen", "nitrogen", "carbon dioxide"], "ans": 3, "sol": ["Carbon dioxide reacts with lime water (calcium hydroxide) to form insoluble calcium carbonate — the milkiness."], "tip": null, "fig": null, "id": "air-4", "topic": "air"}, {"type": "obj", "q": "The process by which nitrates in the soil are converted back into free nitrogen gas is called ___", "opts": ["nitrification", "ammonification", "denitrification", "nitrogen fixation"], "ans": 2, "sol": ["Denitrifying bacteria in waterlogged soils release nitrogen back to the atmosphere, reducing soil fertility."], "tip": null, "fig": null, "id": "air-5", "topic": "air"}, {"type": "thy", "q": "(a) Draw a simple diagram of the nitrogen cycle and describe THREE processes in it.<br>(b) Describe an experiment to show that about one-fifth of air is oxygen.<br>(c) State three ways in which farmers can increase the nitrogen content of the soil.", "sol": ["(a) <b>Nitrogen fixation:</b> free nitrogen is changed into nitrogen compounds by lightning, by <i>Rhizobium</i> in legume nodules and by industry.", "<b>Nitrification:</b> soil bacteria change ammonium compounds to nitrites and then to nitrates, which plants absorb.", "<b>Ammonification (decay):</b> bacteria and fungi break down dead plants, animals and excreta into ammonium compounds.", "<b>Denitrification:</b> denitrifying bacteria change nitrates back to free nitrogen.", "(b) Float a candle on water in a trough, light it and cover it with a graduated gas jar. As the candle burns, it uses up the oxygen and goes out, and the water rises into the jar.", "<b>Result:</b> the water rises by about one-fifth of the volume of the jar, showing that oxygen is about 20% of air. (A cleaner version uses moist iron filings left in a graduated tube for several days.)", "(c) Plant leguminous crops or use them in rotation; apply nitrogenous fertilisers such as ammonium sulphate or urea; apply organic manure and compost; avoid bush burning; practise green manuring."], "marks": 15, "tip": null, "fig": null, "id": "air-6", "topic": "air"}, {"type": "obj", "q": "The change of water vapour into liquid droplets in the atmosphere is called ___", "opts": ["precipitation", "evaporation", "transpiration", "condensation"], "ans": 3, "sol": ["Rising air cools and its water vapour condenses into droplets, forming clouds."], "tip": null, "fig": null, "id": "hydro-1", "topic": "hydro"}, {"type": "obj", "q": "The loss of water vapour from the leaves of plants to the atmosphere is called ___", "opts": ["evaporation", "guttation", "transpiration", "respiration"], "ans": 2, "sol": ["Transpiration is the loss of water vapour from the aerial parts of a plant, mainly through the stomata."], "tip": null, "fig": null, "id": "hydro-2", "topic": "hydro"}, {"type": "obj", "q": "Which of these diseases is spread mainly through drinking contaminated water?", "opts": ["Measles", "Tetanus", "Cholera", "Tuberculosis"], "ans": 2, "sol": ["Cholera is caused by <i>Vibrio cholerae</i> in water contaminated with faeces."], "tip": null, "fig": null, "id": "hydro-3", "topic": "hydro"}, {"type": "obj", "q": "The simplest and most reliable way of making water from a stream safe for drinking at home is to ___", "opts": ["pour it through cloth", "leave it to settle", "add sugar", "boil it"], "ans": 3, "sol": ["Boiling for a few minutes kills the disease-causing organisms.", "Settling and filtering through cloth only remove solid particles."], "tip": null, "fig": null, "id": "hydro-4", "topic": "hydro"}, {"type": "obj", "q": "Mercury used in small-scale gold mining pollutes rivers and can cause ___", "opts": ["hardness of water", "damage to the nervous system", "an increase in dissolved oxygen", "improved fish growth"], "ans": 1, "sol": ["Mercury is a cumulative poison that damages the brain, nerves and kidneys, and it builds up in fish that people eat."], "tip": null, "fig": null, "id": "hydro-5", "topic": "hydro"}, {"type": "thy", "q": "(a) Describe the water cycle.<br>(b) State four causes of water pollution in Ghana and one effect of each.<br>(c) Describe two methods of purifying water in the home.", "sol": ["(a) Heat from the sun evaporates water from seas, rivers and lakes, and plants add water vapour by transpiration. The vapour rises, cools and condenses into clouds. When the droplets become heavy enough they fall as rain (precipitation). Some of the water runs off into rivers and the sea, and some soaks into the ground to become ground water, and the cycle repeats.", "(b) 1. Small-scale mining (galamsey) — muddy rivers and mercury poisoning of fish and people.", "2. Dumping refuse and sewage into drains and rivers — cholera and typhoid outbreaks.", "3. Industrial waste discharged untreated — death of fish and other aquatic life.", "4. Farm chemicals washed into streams — fertiliser causes algal growth that removes oxygen from the water.", "(c) <b>Boiling:</b> heat the water until it has boiled for at least three minutes, then cool it in a clean covered container; this kills pathogens.", "<b>Filtering and chlorination:</b> pass the water through a clean filter or ceramic candle to remove solids, then add the recommended chlorine tablet or a measured amount of bleach and leave it for thirty minutes."], "marks": 15, "tip": null, "fig": null, "id": "hydro-6", "topic": "hydro"}, {"type": "obj", "q": "The life cycle of the mosquito is: egg → ___ → pupa → adult", "opts": ["caterpillar", "larva", "cocoon", "nymph"], "ans": 1, "sol": ["A mosquito undergoes complete metamorphosis, so the stage after the egg is the larva (the 'wriggler')."], "tip": null, "fig": null, "id": "pests-1", "topic": "pests"}, {"type": "obj", "q": "Which insect undergoes incomplete metamorphosis?", "opts": ["Cockroach", "Mosquito", "Butterfly", "Housefly"], "ans": 0, "sol": ["The cockroach hatches as a nymph that resembles the adult; there is no pupal stage."], "tip": null, "fig": null, "id": "pests-2", "topic": "pests"}, {"type": "obj", "q": "The mosquito that transmits the malaria parasite is ___", "opts": ["female <i>Anopheles</i>", "male <i>Anopheles</i>", "male <i>Culex</i>", "female <i>Aedes</i>"], "ans": 0, "sol": ["Only the female takes blood meals, which is how the <i>Plasmodium</i> parasite is passed on.", "<i>Aedes</i> spreads yellow fever and dengue."], "tip": null, "fig": null, "id": "pests-3", "topic": "pests"}, {"type": "obj", "q": "Which stage of the mosquito's life cycle is described as the 'tumbler' and does not feed?", "opts": ["Egg", "Pupa", "Adult", "Larva"], "ans": 1, "sol": ["The comma-shaped pupa tumbles when disturbed and takes no food while it develops into an adult."], "tip": null, "fig": null, "id": "pests-4", "topic": "pests"}, {"type": "obj", "q": "The most effective long-term way of controlling mosquitoes in a community is to ___", "opts": ["sleep with the windows open", "clear all stagnant water", "burn rubbish at night", "spray adults every evening"], "ans": 1, "sol": ["Removing breeding sites stops the cycle at the egg and larval stages; spraying only kills the adults present."], "tip": null, "fig": null, "id": "pests-5", "topic": "pests"}, {"type": "thy", "q": "(a) Draw and describe the life cycle of the housefly.<br>(b) State three ways the housefly spreads disease.<br>(c) Name two diseases transmitted by mosquitoes and state three ways of controlling mosquitoes.", "sol": ["(a) <b>Egg → larva (maggot) → pupa → adult.</b> The female lays batches of eggs on refuse, faeces or rotting matter. The eggs hatch in about a day into white legless maggots, which feed and moult. The maggot then moves to a drier place and forms a barrel-shaped pupa, from which the adult fly emerges after a few days. The whole cycle can be completed in one to two weeks.", "(b) It carries germs on its hairy legs and body from faeces and refuse to food; it vomits saliva onto food before feeding; and it passes out faeces on food. Diseases spread this way include cholera, typhoid, dysentery and diarrhoea.", "(c) Diseases: <b>malaria</b> (<i>Anopheles</i>) and <b>yellow fever</b> or <b>dengue</b> (<i>Aedes</i>); filariasis (<i>Culex</i>).", "Control: drain or fill stagnant water and clear choked gutters; sleep under insecticide-treated nets; spray or fog with insecticide; put oil on standing water to suffocate the larvae; stock ponds with larva-eating fish; screen windows and doors; treat infected people to remove the reservoir of parasites."], "marks": 15, "tip": null, "fig": null, "id": "pests-6", "topic": "pests"}, {"type": "obj", "q": "Which crop is propagated by stem cuttings?", "opts": ["Maize", "Cassava", "Rice", "Cowpea"], "ans": 1, "sol": ["Cassava is planted from mature stem cuttings; the others are grown from seed."], "tip": null, "fig": null, "id": "crop-1", "topic": "crop"}, {"type": "obj", "q": "A fertiliser rich in nitrogen is applied mainly to promote ___", "opts": ["flower colour", "leaf and stem growth", "root development", "fruit ripening"], "ans": 1, "sol": ["Nitrogen is part of chlorophyll and protein, so it gives healthy green leafy growth."], "tip": null, "fig": null, "id": "crop-2", "topic": "crop"}, {"type": "obj", "q": "The practice of growing different crops on the same piece of land in a planned order from season to season is ___", "opts": ["shifting cultivation", "mixed cropping", "mono-cropping", "crop rotation"], "ans": 3, "sol": ["Crop rotation prevents the build-up of pests and diseases and helps maintain soil fertility, especially when a legume is included."], "tip": null, "fig": null, "id": "crop-3", "topic": "crop"}, {"type": "obj", "q": "Covering the soil around crops with dry grass or leaves is called ___", "opts": ["mulching", "harrowing", "manuring", "thinning"], "ans": 0, "sol": ["Mulching conserves soil moisture, controls weeds, moderates soil temperature and adds humus as it decays."], "tip": null, "fig": null, "id": "crop-4", "topic": "crop"}, {"type": "obj", "q": "Yellowing of the older leaves of a maize crop is most likely to indicate a deficiency of ___", "opts": ["iron", "calcium", "potassium", "nitrogen"], "ans": 3, "sol": ["Nitrogen is mobile in the plant, so it moves to the young leaves and the older ones turn yellow first."], "tip": null, "fig": null, "id": "crop-5", "topic": "crop"}, {"type": "thy", "q": "(a) Outline the steps in preparing land for planting maize.<br>(b) State three advantages of crop rotation.<br>(c) Name three methods of vegetative propagation and give one crop for each.<br>(d) State three ways of storing farm produce to prevent losses.", "sol": ["(a) Clearing the vegetation → removing stumps and burning off or packing the trash → ploughing to loosen the soil → harrowing to break the clods → ridging or making mounds/beds → marking out and planting at the correct spacing.", "(b) It maintains soil fertility (especially with a legume in the rotation); it breaks the life cycles of pests and diseases; it controls weeds; it makes use of nutrients at different soil depths; and it spreads the farmer's risk and income.", "(c) Stem cuttings — cassava or sugar cane; suckers — plantain or banana or pineapple; setts (tubers) — yam; slips or vines — sweet potato; budding or grafting — citrus and mango.", "(d) Dry the produce properly before storage; store in clean, dry, well-ventilated barns, cribs or silos; treat against weevils with the recommended chemicals or with hermetic (airtight) bags; protect against rodents with rat guards; process into a form that keeps longer (gari, flour)."], "marks": 15, "tip": null, "fig": null, "id": "crop-6", "topic": "crop"}, {"type": "obj", "q": "Which of these animals is a ruminant?", "opts": ["Goat", "Pig", "Rabbit", "Fowl"], "ans": 0, "sol": ["Goats, like cattle and sheep, chew the cud and have a four-chambered stomach."], "tip": null, "fig": null, "id": "animal-1", "topic": "animal"}, {"type": "obj", "q": "The rearing of poultry in cages where birds cannot move about freely is known as the ___ system.", "opts": ["free range", "extensive", "semi-intensive", "battery cage"], "ans": 3, "sol": ["In the battery cage system birds are kept in cages, which makes egg collection easy and feeding efficient."], "tip": null, "fig": null, "id": "animal-2", "topic": "animal"}, {"type": "obj", "q": "A viral disease of poultry that spreads rapidly and is controlled mainly by vaccination is ___", "opts": ["coccidiosis", "Newcastle disease", "anthrax", "foot and mouth disease"], "ans": 1, "sol": ["Newcastle disease is viral and very contagious; coccidiosis is caused by a protozoan, and anthrax and foot-and-mouth affect livestock."], "tip": null, "fig": null, "id": "animal-3", "topic": "animal"}, {"type": "obj", "q": "Which nutrient must be increased in the ration of a laying bird to give strong egg shells?", "opts": ["Calcium", "Fat", "Carbohydrate", "Vitamin C"], "ans": 0, "sol": ["Egg shell is largely calcium carbonate, so layers need extra calcium — often from oyster shell or limestone."], "tip": null, "fig": null, "id": "animal-4", "topic": "animal"}, {"type": "obj", "q": "The main product obtained from a broiler is ___", "opts": ["meat", "wool", "milk", "eggs"], "ans": 0, "sol": ["Broilers are raised for meat; layers are kept for eggs."], "tip": null, "fig": null, "id": "animal-5", "topic": "animal"}, {"type": "thy", "q": "(a) State three differences between the deep litter and the battery cage systems of poultry keeping.<br>(b) State four ways of preventing disease on a poultry farm.<br>(c) Name the four chambers of a ruminant's stomach and state the function of the first.<br>(d) Give three reasons why fish farming should be encouraged in Ghana.", "sol": ["(a) 1. In deep litter the birds move freely on litter; in the battery system they are confined in cages.", "2. Eggs are collected from nest boxes in deep litter, but roll out onto a tray in the battery system, so fewer are dirty or broken.", "3. Deep litter allows exercise and normal behaviour but risks disease spreading through the flock; the battery system gives better control of feeding and disease but has a higher set-up cost.", "(b) Vaccinate according to the programme; keep the house and equipment clean and disinfected; provide a foot bath and restrict visitors; isolate and treat sick birds; avoid overcrowding; supply clean water and a balanced ration; dispose of dead birds properly.", "(c) <b>Rumen, reticulum, omasum, abomasum.</b> In the rumen, micro-organisms break down cellulose in the food by fermentation, and the partly digested food is later returned to the mouth to be chewed again as cud.", "(d) It supplies cheap animal protein; it creates employment and income; it reduces pressure on wild fish stocks; it makes use of land and water that may be unsuitable for crops; and it can earn foreign exchange."], "marks": 15, "tip": null, "fig": null, "id": "animal-6", "topic": "animal"}, {"type": "obj", "q": "A food substance turns blue-black when iodine solution is added. The food contains ___", "opts": ["reducing sugar", "fat", "protein", "starch"], "ans": 3, "sol": ["Iodine gives a blue-black colour with starch."], "tip": null, "fig": null, "id": "nutrition-1", "topic": "nutrition"}, {"type": "obj", "q": "The enzyme in saliva that acts on starch is ___", "opts": ["trypsin", "lipase", "pepsin", "amylase (ptyalin)"], "ans": 3, "sol": ["Salivary amylase breaks starch down into maltose."], "tip": null, "fig": null, "id": "nutrition-2", "topic": "nutrition"}, {"type": "obj", "q": "Kwashiorkor in children is caused mainly by a shortage of ___", "opts": ["vitamin C", "iron", "protein", "carbohydrate"], "ans": 2, "sol": ["Kwashiorkor results from too little protein in a diet that may still have enough energy; it shows as swelling (oedema) and a thin, pale skin."], "tip": null, "fig": null, "id": "nutrition-3", "topic": "nutrition"}, {"type": "obj", "q": "Bile helps in the digestion of fats by ___", "opts": ["changing them to glucose", "acting as an enzyme on them", "emulsifying them", "absorbing them into the blood"], "ans": 2, "sol": ["Bile breaks large fat droplets into tiny ones, giving lipase a much larger surface area to work on. Bile contains no enzyme."], "tip": null, "fig": null, "id": "nutrition-4", "topic": "nutrition"}, {"type": "obj", "q": "Most of the absorption of digested food takes place in the ___", "opts": ["stomach", "colon", "ileum", "oesophagus"], "ans": 2, "sol": ["The ileum is long and folded, with villi that give a very large surface area and a rich blood supply."], "tip": null, "fig": null, "id": "nutrition-5", "topic": "nutrition"}, {"type": "thy", "q": "(a) Name the seven classes of food and give one source and one function of each of any four.<br>(b) Describe the test for (i) starch; (ii) protein.<br>(c) Explain why a person on a diet of only cassava and plantain may develop kwashiorkor.<br>(d) State the function of roughage in the diet.", "sol": ["(a) Carbohydrates (rice, yam — supply energy); proteins (fish, beans — growth and repair); fats and oils (palm oil, groundnut — energy and warmth); vitamins (fruits and vegetables — protect against disease); mineral salts (milk, leafy vegetables — bones, teeth, blood); water (drinks, foods — transport and temperature control); roughage (unrefined cereals, vegetables).", "(b)(i) <b>Starch:</b> put a little of the food in a test tube, add two drops of iodine solution; a blue-black colour shows starch is present.", "(ii) <b>Protein:</b> to the food solution add sodium hydroxide solution, then a few drops of copper(II) sulphate solution (the Biuret test); a purple or violet colour shows protein.", "(c) Cassava and plantain are almost entirely carbohydrate. Such a diet supplies energy but very little protein, so the body lacks the amino acids needed for growth, repair and the making of plasma proteins, and the child develops kwashiorkor.", "(d) Roughage (dietary fibre) adds bulk to the food, holds water and stimulates the muscles of the gut so that waste moves along easily, preventing constipation."], "marks": 15, "tip": null, "fig": null, "id": "nutrition-6", "topic": "nutrition"}, {"type": "obj", "q": "The equation 'glucose + oxygen → carbon dioxide + water + energy' represents ___", "opts": ["aerobic respiration", "anaerobic respiration", "transpiration", "photosynthesis"], "ans": 0, "sol": ["Respiration using oxygen is aerobic respiration.", "Photosynthesis is the reverse: carbon dioxide + water → glucose + oxygen."], "tip": null, "fig": null, "id": "respcirc-1", "topic": "respcirc"}, {"type": "obj", "q": "During strenuous exercise, the substance that accumulates in muscles and causes cramp is ___", "opts": ["lactic acid", "urea", "glucose", "ethanol"], "ans": 0, "sol": ["When oxygen is insufficient, glucose is broken down anaerobically to lactic acid."], "tip": null, "fig": null, "id": "respcirc-2", "topic": "respcirc"}, {"type": "obj", "q": "Which component of blood is mainly responsible for transporting oxygen?", "opts": ["Plasma", "White blood cells", "Platelets", "Red blood cells"], "ans": 3, "sol": ["Haemoglobin in the red cells combines with oxygen to form oxyhaemoglobin."], "tip": null, "fig": null, "id": "respcirc-3", "topic": "respcirc"}, {"type": "obj", "q": "During inhalation, the diaphragm ___", "opts": ["remains still", "flattens and moves down", "moves sideways", "relaxes and domes up"], "ans": 1, "sol": ["The diaphragm muscle contracts and flattens, which increases the volume of the chest cavity and lowers the pressure inside it."], "tip": null, "fig": null, "id": "respcirc-4", "topic": "respcirc"}, {"type": "obj", "q": "Blood is carried from the heart to the lungs by the ___", "opts": ["aorta", "pulmonary artery", "pulmonary vein", "vena cava"], "ans": 1, "sol": ["The pulmonary artery carries deoxygenated blood from the right ventricle to the lungs — the only artery that carries deoxygenated blood."], "tip": null, "fig": null, "id": "respcirc-5", "topic": "respcirc"}, {"type": "thy", "q": "(a) State three differences between aerobic and anaerobic respiration.<br>(b) Describe what happens to the ribs, diaphragm and chest volume during inhalation and exhalation.<br>(c) Name the four chambers of the human heart and trace the path of blood from the body back to the body.<br>(d) State two differences between arteries and veins.", "sol": ["(a) 1. Aerobic respiration uses oxygen; anaerobic does not. 2. Aerobic gives carbon dioxide and water; anaerobic gives lactic acid (in animals) or ethanol and carbon dioxide (in yeast). 3. Aerobic releases much more energy per molecule of glucose.", "(b) <b>Inhalation:</b> the intercostal muscles contract, the ribs move upwards and outwards, the diaphragm contracts and flattens, the chest volume increases, the pressure inside falls below atmospheric, and air rushes into the lungs.", "<b>Exhalation:</b> the muscles relax, the ribs move down and in, the diaphragm domes upwards, the volume decreases, the pressure rises, and air is forced out.", "(c) <b>Right atrium, right ventricle, left atrium, left ventricle.</b>", "Body → vena cava → right atrium → right ventricle → pulmonary artery → lungs (oxygenated) → pulmonary vein → left atrium → left ventricle → aorta → body.", "(d) Arteries carry blood away from the heart, usually oxygenated, at high pressure and have thick muscular walls with no valves; veins carry blood towards the heart, usually deoxygenated, at low pressure, with thinner walls and valves to prevent backflow."], "marks": 15, "tip": null, "fig": null, "id": "respcirc-6", "topic": "respcirc"}, {"type": "obj", "q": "Which organ excretes urea from the human body?", "opts": ["Pancreas", "Lung", "Liver", "Kidney"], "ans": 3, "sol": ["The liver makes urea from excess amino acids, but the kidney excretes it in urine."], "tip": null, "fig": null, "id": "excskel-1", "topic": "excskel"}, {"type": "obj", "q": "The functional unit of the kidney is the ___", "opts": ["neurone", "nephridium", "alveolus", "nephron"], "ans": 3, "sol": ["Each kidney contains about a million nephrons, where filtration and reabsorption take place."], "tip": null, "fig": null, "id": "excskel-2", "topic": "excskel"}, {"type": "obj", "q": "The type of joint found at the elbow is a ___ joint.", "opts": ["pivot", "hinge", "gliding", "ball-and-socket"], "ans": 1, "sol": ["A hinge joint allows movement in one plane only, like a door."], "tip": null, "fig": null, "id": "excskel-3", "topic": "excskel"}, {"type": "obj", "q": "The part of the brain that controls balance and coordination of movement is the ___", "opts": ["cerebrum", "hypothalamus", "cerebellum", "medulla oblongata"], "ans": 2, "sol": ["The cerebellum coordinates muscular activity and balance; the cerebrum handles thought and voluntary action."], "tip": null, "fig": null, "id": "excskel-4", "topic": "excskel"}, {"type": "obj", "q": "Withdrawing your hand quickly from a hot object is an example of ___", "opts": ["a voluntary action", "a reflex action", "a conditioned response", "tropism"], "ans": 1, "sol": ["It is automatic, rapid and does not involve the will — a simple reflex action."], "tip": null, "fig": null, "id": "excskel-5", "topic": "excskel"}, {"type": "thy", "q": "(a) Name four excretory organs in the human body and the substance each removes.<br>(b) State four functions of the skeleton.<br>(c) Describe a reflex arc, using the withdrawal of the hand from a hot object as an example.<br>(d) State two ways of keeping the kidneys healthy.", "sol": ["(a) Kidneys — urea, excess water and mineral salts; lungs — carbon dioxide and water vapour; skin — sweat (water, salts and a little urea); liver — bile pigments from broken-down red cells.", "(b) Support for the body; protection of delicate organs (skull–brain, ribs–heart and lungs); movement, by giving muscles a place of attachment and acting as levers; production of blood cells in the red bone marrow; storage of calcium and phosphorus; and giving the body its shape.", "(c) The heat stimulates receptors in the skin. A sensory neurone carries the impulse to the spinal cord, where a relay neurone passes it to a motor neurone. The motor neurone carries the impulse to the muscle of the arm (the effector), which contracts and pulls the hand away. The brain is informed afterwards, which is why you feel the pain after moving.", "(d) Drink plenty of clean water each day; avoid the abuse of drugs and painkillers; treat infections promptly; reduce excessive salt; go for regular medical check-ups."], "marks": 15, "tip": null, "fig": null, "id": "excskel-6", "topic": "excskel"}, {"type": "obj", "q": "The male reproductive part of a flower is the ___", "opts": ["sepal", "receptacle", "stamen", "carpel"], "ans": 2, "sol": ["The stamen consists of the anther, which produces pollen grains, and the filament that holds it up."], "tip": null, "fig": null, "id": "repro-1", "topic": "repro"}, {"type": "obj", "q": "In flowering plants, fertilisation results in the ovule developing into a ___", "opts": ["flower", "fruit", "seed", "stem"], "ans": 2, "sol": ["The ovule becomes the seed and the ovary becomes the fruit."], "tip": null, "fig": null, "id": "repro-2", "topic": "repro"}, {"type": "obj", "q": "Which features show that a flower is wind-pollinated?", "opts": ["Small dull petals and feathery stigma", "Brightly coloured sepals and nectar guides", "Large coloured petals and nectar", "Sticky pollen and strong scent"], "ans": 0, "sol": ["Wind-pollinated flowers do not need to attract insects; they produce large amounts of light pollen and have exposed, feathery stigmas."], "tip": null, "fig": null, "id": "repro-3", "topic": "repro"}, {"type": "obj", "q": "In humans, fertilisation normally takes place in the ___", "opts": ["fallopian tube", "vagina", "ovary", "uterus"], "ans": 0, "sol": ["The sperm meets the egg in the fallopian tube (oviduct); the fertilised egg then moves to the uterus to implant."], "tip": null, "fig": null, "id": "repro-4", "topic": "repro"}, {"type": "obj", "q": "The structure through which the developing foetus obtains food and oxygen from the mother is the ___", "opts": ["placenta", "amnion", "umbilical vein only", "uterus wall"], "ans": 0, "sol": ["The placenta allows exchange of nutrients, oxygen and waste between the mother's blood and the foetal blood, which do not mix."], "tip": null, "fig": null, "id": "repro-5", "topic": "repro"}, {"type": "thy", "q": "(a) Draw and label the parts of a typical flower (six labels).<br>(b) State four differences between wind-pollinated and insect-pollinated flowers.<br>(c) Describe what happens from pollination to seed formation in a flowering plant.<br>(d) State three functions of the placenta.", "sol": ["(a) Labels: sepal, petal, anther, filament, stigma, style, ovary, ovule, receptacle (any six).", "(b) 1. Wind: small, dull petals or none; Insect: large, brightly coloured petals. 2. Wind: no scent or nectar; Insect: scented, with nectar. 3. Wind: pollen light, smooth and in large amounts; Insect: pollen sticky or spiky and in smaller amounts. 4. Wind: anthers and feathery stigmas hang outside the flower; Insect: anthers and sticky stigmas are inside.", "(c) A pollen grain lands on the stigma and germinates, growing a pollen tube down the style to the ovary. The male gamete passes down the tube and fuses with the egg cell in the ovule — fertilisation. The fertilised ovule develops into a seed, containing an embryo and stored food, while the ovary wall develops into the fruit. The petals, stamens and style usually wither and fall off.", "(d) It allows food and oxygen to pass from the mother's blood to the foetus; it allows carbon dioxide and urea to pass from the foetus to the mother; it acts as a barrier against some harmful substances and germs; and it produces hormones that maintain the pregnancy."], "marks": 15, "tip": null, "fig": null, "id": "repro-6", "topic": "repro"}, {"type": "obj", "q": "The raw materials for photosynthesis are ___", "opts": ["carbon dioxide and glucose", "oxygen and water", "glucose and oxygen", "carbon dioxide and water"], "ans": 3, "sol": ["Light energy trapped by chlorophyll combines carbon dioxide and water to make glucose and oxygen."], "tip": null, "fig": null, "id": "photo-1", "topic": "photo"}, {"type": "obj", "q": "Why is a plant kept in the dark for 48 hours before an experiment on photosynthesis?", "opts": ["To kill the leaf cells", "To increase the chlorophyll", "To remove the starch already in the leaves", "To open the stomata"], "ans": 2, "sol": ["Destarching makes sure that any starch found afterwards was made during the experiment."], "tip": null, "fig": null, "id": "photo-2", "topic": "photo"}, {"type": "obj", "q": "A leaf is boiled in alcohol during the starch test in order to ___", "opts": ["kill bacteria", "remove the chlorophyll", "add iodine to the leaf", "soften the leaf"], "ans": 1, "sol": ["The green colour would hide the blue-black result, so the chlorophyll is dissolved out in hot alcohol (heated in a water bath, as alcohol is flammable)."], "tip": null, "fig": null, "id": "photo-3", "topic": "photo"}, {"type": "obj", "q": "Which condition is NOT necessary for the germination of a maize grain?", "opts": ["Oxygen", "Water", "A suitable temperature", "Light"], "ans": 3, "sol": ["Seeds germinate underground in the dark; light is needed only after the seedling appears above the ground."], "tip": null, "fig": null, "id": "photo-4", "topic": "photo"}, {"type": "obj", "q": "Transpiration is fastest on a day that is ___", "opts": ["cool, humid and still", "warm and humid", "cold and rainy", "hot, dry and windy"], "ans": 3, "sol": ["Heat and wind increase evaporation from the leaf surfaces, and dry air keeps the diffusion gradient steep."], "tip": null, "fig": null, "id": "photo-5", "topic": "photo"}, {"type": "thy", "q": "(a) Write the word equation for photosynthesis and state its importance to living things.<br>(b) Describe an experiment to show that light is necessary for photosynthesis.<br>(c) State three conditions necessary for the germination of seeds and describe how you would show that one of them is needed.", "sol": ["(a) carbon dioxide + water --(sunlight, chlorophyll)--> glucose + oxygen", "Importance: it is the source of all food in nature; it releases the oxygen used in respiration; it removes carbon dioxide from the air; and it stores energy in a form that other organisms can use.", "(b) Destarch a potted plant by keeping it in the dark for 48 hours. Cover part of one leaf on both sides with black paper (the covered part is the control) and put the plant in sunlight for several hours.", "Remove the leaf, boil it in water to kill it, boil it in alcohol in a water bath to remove the chlorophyll, wash it in warm water and add iodine.", "<b>Result:</b> the exposed part turns blue-black; the covered part stays brown. <b>Conclusion:</b> light is necessary for photosynthesis.", "(c) Water, oxygen (air) and a suitable temperature.", "To show that water is needed: put equal numbers of similar seeds in two containers on cotton wool. Keep one moist and the other dry, leaving both in the same warm place with air. Only the seeds in the moist container germinate, showing that water is needed."], "marks": 15, "tip": null, "fig": null, "id": "photo-6", "topic": "photo"}, {"type": "obj", "q": "The energy change that takes place in a dry cell torch is ___", "opts": ["light → electrical → chemical", "mechanical → electrical → light", "electrical → chemical → light", "chemical → electrical → light"], "ans": 3, "sol": ["The cell stores chemical energy, which becomes electrical energy in the circuit and then light (and heat) in the bulb."], "tip": null, "fig": null, "id": "energy-1", "topic": "energy"}, {"type": "obj", "q": "Which of these is a renewable source of energy?", "opts": ["Natural gas", "Crude oil", "Wind", "Coal"], "ans": 2, "sol": ["Wind is continuously replaced by nature; the others are fossil fuels that take millions of years to form."], "tip": null, "fig": null, "id": "energy-2", "topic": "energy"}, {"type": "obj", "q": "The energy possessed by a stone held at the top of a building is ___", "opts": ["potential energy", "sound energy", "kinetic energy", "chemical energy"], "ans": 0, "sol": ["Energy due to position above the ground is gravitational potential energy."], "tip": null, "fig": null, "id": "energy-3", "topic": "energy"}, {"type": "obj", "q": "The energy of the sun is produced by the process of ___", "opts": ["nuclear fusion", "combustion", "radiation of heat from its core", "nuclear fission"], "ans": 0, "sol": ["Hydrogen nuclei join to form helium, releasing enormous energy — nuclear fusion."], "tip": null, "fig": null, "id": "energy-4", "topic": "energy"}, {"type": "obj", "q": "Which statement best expresses the law of conservation of energy?", "opts": ["Energy can be changed from one form to another but cannot be created or destroyed.", "Energy can be created in a generator.", "Energy is always lost as heat in every machine.", "The total energy of a body increases with its speed."], "ans": 0, "sol": ["The law states that the total energy of a closed system remains constant; machines only convert energy from one form to another."], "tip": null, "fig": null, "id": "energy-5", "topic": "energy"}, {"type": "thy", "q": "(a) State the law of conservation of energy.<br>(b) Give the energy transformation in each of the following: (i) an electric fan; (ii) a solar panel lighting a lamp; (iii) a microphone; (iv) a car battery being charged.<br>(c) State three advantages and two disadvantages of using solar energy in Ghana.", "sol": ["(a) Energy can neither be created nor destroyed; it can only be transformed from one form to another, and the total energy remains constant.", "(b)(i) electrical → mechanical (+ some heat and sound)", "(ii) solar (light) → electrical → light (+ heat)", "(iii) sound → electrical", "(iv) electrical → chemical", "(c) <b>Advantages:</b> sunshine is abundant and free all year in Ghana; it causes no pollution; it can be used in remote areas with no national grid; running costs are low and panels need little maintenance.", "<b>Disadvantages:</b> the initial cost of panels and batteries is high; it is not available at night and is reduced in the rainy or harmattan season, so storage batteries are needed."], "marks": 12, "tip": null, "fig": null, "id": "energy-6", "topic": "energy"}, {"type": "obj", "q": "Heat transfer in liquids and gases takes place mainly by ___", "opts": ["convection", "conduction", "radiation", "induction"], "ans": 0, "sol": ["Warmed fluid becomes less dense and rises, while cooler fluid sinks, setting up convection currents."], "tip": null, "fig": null, "id": "heat-1", "topic": "heat"}, {"type": "obj", "q": "Calculate the heat needed to raise the temperature of 2 kg of water from 25 °C to 55 °C. [c = 4200 J/kg K]", "opts": ["210000 J", "8400 J", "462000 J", "252000 J"], "ans": 3, "sol": ["Q = mcΔθ = 2 × 4200 × (55 − 25)", "= 2 × 4200 × 30 = 252000 J"], "tip": null, "fig": null, "id": "heat-2", "topic": "heat"}, {"type": "obj", "q": "Which surface is the best absorber of radiant heat?", "opts": ["Smooth glass", "Polished silver", "Dull black", "Shiny white"], "ans": 2, "sol": ["Dull black surfaces absorb (and emit) radiation best; shiny, light surfaces reflect it."], "tip": null, "fig": null, "id": "heat-3", "topic": "heat"}, {"type": "obj", "q": "The silvering of the inside walls of a vacuum flask reduces heat loss by ___", "opts": ["radiation", "evaporation", "conduction", "convection"], "ans": 0, "sol": ["The silvered surfaces reflect radiant heat back, while the vacuum deals with conduction and convection."], "tip": null, "fig": null, "id": "heat-4", "topic": "heat"}, {"type": "obj", "q": "During the melting of ice at 0 °C, the temperature does not change because the heat supplied is used to ___", "opts": ["break the bonds holding the particles in the solid", "expand the ice", "make the water molecules heavier", "raise the kinetic energy of the particles"], "ans": 0, "sol": ["The energy absorbed is latent heat of fusion: it separates the particles rather than raising their temperature."], "tip": null, "fig": null, "id": "heat-5", "topic": "heat"}, {"type": "thy", "q": "(a) Define specific heat capacity.<br>(b) Calculate the heat energy given out when 500 g of water cools from 90 °C to 30 °C. [c = 4200 J/kg K]<br>(c) Explain why the handle of a cooking pot is made of wood or plastic.<br>(d) Describe an experiment to show that a dull black surface is a better absorber of heat than a shiny surface.", "sol": ["(a) Specific heat capacity is the quantity of heat required to raise the temperature of 1 kg of a substance by 1 K (or 1 °C).", "(b) m = 500 g = 0.5 kg; Δθ = 90 − 30 = 60 K", "Q = mcΔθ = 0.5 × 4200 × 60 = <b>126 000 J</b> (126 kJ)", "(c) Wood and plastic are poor conductors (insulators) of heat, so heat from the pot does not travel quickly to the hand and the cook is not burnt.", "(d) Take two identical metal plates, one painted dull black and the other polished. Fix a cork to the back of each with candle wax, and place both at equal distances from a heat source such as a Bunsen flame or an electric heater.", "<b>Result:</b> the wax on the dull black plate melts first and its cork falls sooner. <b>Conclusion:</b> a dull black surface absorbs radiant heat better than a shiny one."], "marks": 12, "tip": null, "fig": null, "id": "heat-6", "topic": "heat"}, {"type": "obj", "q": "A ray of light strikes a plane mirror at an angle of incidence of 35°. What is the angle of reflection?", "opts": ["145°", "55°", "70°", "35°"], "ans": 3, "sol": ["By the law of reflection, the angle of reflection equals the angle of incidence."], "tip": null, "fig": null, "id": "light-1", "topic": "light"}, {"type": "obj", "q": "The image formed in a plane mirror is ___", "opts": ["real, erect and the same size", "virtual, inverted and diminished", "real, inverted and magnified", "virtual, erect and laterally inverted"], "ans": 3, "sol": ["A plane mirror image cannot be caught on a screen (virtual), is the right way up, the same size and left-right reversed."], "tip": null, "fig": null, "id": "light-2", "topic": "light"}, {"type": "obj", "q": "A stick placed partly in water appears bent. This is due to ___", "opts": ["dispersion", "diffraction", "reflection", "refraction"], "ans": 3, "sol": ["Light from the submerged part changes direction as it leaves the water, so the stick appears bent at the surface."], "tip": null, "fig": null, "id": "light-3", "topic": "light"}, {"type": "obj", "q": "Which defect of vision is corrected with a convex lens?", "opts": ["Short sight (myopia)", "Colour blindness", "Astigmatism", "Long sight (hypermetropia)"], "ans": 3, "sol": ["In long sight the image forms behind the retina, so a converging (convex) lens is used to bring it forward."], "tip": null, "fig": null, "id": "light-4", "topic": "light"}, {"type": "obj", "q": "The splitting of white light into its component colours by a prism is called ___", "opts": ["refraction", "dispersion", "reflection", "diffraction"], "ans": 1, "sol": ["Different colours are refracted by different amounts, so they separate — dispersion."], "tip": null, "fig": null, "id": "light-5", "topic": "light"}, {"type": "thy", "q": "(a) State the laws of reflection of light.<br>(b) List four characteristics of the image formed by a plane mirror.<br>(c) With the aid of a diagram, explain how short sight is corrected.<br>(d) State two uses of a convex lens.", "sol": ["(a) 1. The angle of incidence is equal to the angle of reflection. 2. The incident ray, the reflected ray and the normal at the point of incidence all lie in the same plane.", "(b) It is virtual; erect (upright); the same size as the object; laterally inverted; and as far behind the mirror as the object is in front.", "(c) In short sight the eyeball is too long or the lens too strong, so parallel rays are brought to a focus IN FRONT of the retina and distant objects look blurred. A concave (diverging) lens is placed before the eye; it spreads the rays slightly so that the eye lens then focuses them exactly on the retina. (Diagram: parallel rays → concave lens → eye lens → focus on retina.)", "(d) In a magnifying glass; in cameras, projectors, microscopes and telescopes; and in spectacles for long sight."], "marks": 12, "tip": null, "fig": null, "id": "light-6", "topic": "light"}, {"type": "obj", "q": "Sound cannot travel through ___", "opts": ["a vacuum", "water", "air", "steel"], "ans": 0, "sol": ["Sound needs particles to pass the vibrations along, so it cannot travel through a vacuum."], "tip": null, "fig": null, "id": "sound-1", "topic": "sound"}, {"type": "obj", "q": "A sound wave has a frequency of 220 Hz and a wavelength of 1.5 m. Calculate its speed.", "opts": ["330 m/s", "0.0068 m/s", "146.7 m/s", "221.5 m/s"], "ans": 0, "sol": ["v = fλ = 220 × 1.5", "= 330 m/s"], "tip": null, "fig": null, "id": "sound-2", "topic": "sound"}, {"type": "obj", "q": "A man claps his hands and hears the echo from a cliff 2 seconds later. If sound travels at 330 m/s, how far is the cliff?", "opts": ["330 m", "165 m", "1320 m", "660 m"], "ans": 0, "sol": ["The sound travels to the cliff and back, so the total distance is 330 × 2 = 660 m", "Distance to the cliff = 660 ÷ 2 = 330 m"], "tip": null, "fig": null, "id": "sound-3", "topic": "sound"}, {"type": "obj", "q": "The pitch of a sound depends on its ___", "opts": ["frequency", "loudness", "amplitude", "speed"], "ans": 0, "sol": ["The higher the frequency, the higher the pitch. Amplitude determines loudness."], "tip": null, "fig": null, "id": "sound-4", "topic": "sound"}, {"type": "obj", "q": "Sound travels fastest in ___", "opts": ["water", "steel", "a vacuum", "air"], "ans": 1, "sol": ["Particles in a solid are closest together, so vibrations pass on most quickly."], "tip": null, "fig": null, "id": "sound-5", "topic": "sound"}, {"type": "thy", "q": "(a) State three differences between sound waves and light waves.<br>(b) A boy standing 660 m from a wall claps once and hears the echo after 4 s. Calculate the speed of sound in air.<br>(c) Explain why thunder is heard some seconds after lightning is seen.<br>(d) State two uses of echoes.", "sol": ["(a) 1. Sound needs a material medium; light can travel through a vacuum. 2. Sound waves are longitudinal; light waves are transverse. 3. Sound travels at about 330 m/s in air; light travels at 3 × 10<sup>8</sup> m/s. (Also: light can be polarised, sound cannot.)", "(b) Total distance travelled = 2 × 660 = 1320 m; time = 4 s", "Speed = distance ÷ time = 1320 ÷ 4 = <b>330 m/s</b>", "(c) Light travels about a million times faster than sound, so the flash reaches the observer almost at once while the sound takes about three seconds for every kilometre.", "(d) Echo-sounding to find the depth of the sea or to locate shoals of fish; ultrasound scanning in hospitals; locating cracks in metal castings; bats use echoes to find their way and their prey."], "marks": 12, "tip": null, "fig": null, "id": "sound-6", "topic": "sound"}, {"type": "obj", "q": "A resistor of 4 Ω is connected to a 12 V battery. Calculate the current flowing.", "opts": ["8 A", "3 A", "48 A", "0.33 A"], "ans": 1, "sol": ["V = IR ⇒ I = V ÷ R", "= 12 ÷ 4 = 3 A"], "tip": null, "fig": null, "id": "elec-1", "topic": "elec"}, {"type": "obj", "q": "Two resistors of 6 Ω and 3 Ω are connected in parallel. What is their combined resistance?", "opts": ["18 Ω", "2 Ω", "4.5 Ω", "9 Ω"], "ans": 1, "sol": ["1/R = 1/6 + 1/3 = 1/6 + 2/6 = 3/6 = 1/2", "R = 2 Ω"], "tip": null, "fig": null, "id": "elec-2", "topic": "elec"}, {"type": "obj", "q": "An electric iron rated 2 kW is used for 3 hours. If electricity costs GH₵ 1.50 per kWh, what is the cost of the energy used?", "opts": ["GH₵ 6.00", "GH₵ 3.00", "GH₵ 4.50", "GH₵ 9.00"], "ans": 3, "sol": ["Energy = 2 kW × 3 h = 6 kWh", "Cost = 6 × 1.50 = GH₵ 9.00"], "tip": null, "fig": null, "id": "elec-3", "topic": "elec"}, {"type": "obj", "q": "In domestic wiring, the fuse and the switch should be connected in the ___ wire.", "opts": ["neutral and earth", "live", "neutral", "earth"], "ans": 1, "sol": ["Putting them in the live wire means that when the fuse blows or the switch is off, the appliance is completely cut off from the high voltage."], "tip": null, "fig": null, "id": "elec-4", "topic": "elec"}, {"type": "obj", "q": "The only sure test for a magnet is ___", "opts": ["repulsion of a like pole", "attraction of iron filings", "pointing north when suspended", "attraction of a piece of steel"], "ans": 0, "sol": ["A magnet attracts magnetic materials, but only another magnet is REPELLED by a like pole."], "tip": null, "fig": null, "id": "elec-5", "topic": "elec"}, {"type": "thy", "q": "(a) State Ohm's law.<br>(b) Three resistors of 2 Ω, 3 Ω and 5 Ω are connected in series to a 20 V battery. Calculate (i) the total resistance; (ii) the current in the circuit; (iii) the potential difference across the 5 Ω resistor.<br>(c) State three safety precautions to observe when using electricity in the home.<br>(d) Give two differences between an electromagnet and a permanent magnet.", "sol": ["(a) The current flowing through a conductor is directly proportional to the potential difference across its ends, provided the temperature and other physical conditions remain constant.", "(b)(i) R = 2 + 3 + 5 = <b>10 Ω</b>", "(ii) I = V ÷ R = 20 ÷ 10 = <b>2 A</b>", "(iii) V = IR = 2 × 5 = <b>10 V</b>", "(c) Do not touch switches or appliances with wet hands; use the correct fuse rating and never replace a fuse with wire or foil; earth all metal-cased appliances; avoid overloading a socket with many appliances; repair worn or joined cables; switch off at the mains before repairs.", "(d) An electromagnet's magnetism can be switched on and off and its strength varied with the current, while a permanent magnet's cannot; an electromagnet is usually made of soft iron and loses its magnetism easily, whereas a permanent magnet is made of steel and keeps it."], "marks": 15, "tip": null, "fig": null, "id": "elec-6", "topic": "elec"}, {"type": "obj", "q": "Which of these materials is a semiconductor?", "opts": ["Silicon", "Copper", "Glass", "Rubber"], "ans": 0, "sol": ["Silicon and germanium conduct better than insulators but less well than metals, and their conductivity rises with temperature and doping."], "tip": null, "fig": null, "id": "electron-1", "topic": "electron"}, {"type": "obj", "q": "The electronic component that allows current to flow in only one direction is the ___", "opts": ["capacitor", "diode", "transformer", "resistor"], "ans": 1, "sol": ["This property makes the diode useful for changing a.c. to d.c. — rectification."], "tip": null, "fig": null, "id": "electron-2", "topic": "electron"}, {"type": "obj", "q": "A transistor is used mainly to ___", "opts": ["amplify or switch signals", "convert a.c. to d.c.", "store charge", "step up voltage"], "ans": 0, "sol": ["A small base current controls a much larger current, so a transistor works as an amplifier or as a fast switch."], "tip": null, "fig": null, "id": "electron-3", "topic": "electron"}, {"type": "obj", "q": "Which of these is an input device of a computer?", "opts": ["Scanner", "Printer", "Speaker", "Monitor"], "ans": 0, "sol": ["A scanner puts information into the computer; the other three take information out."], "tip": null, "fig": null, "id": "electron-4", "topic": "electron"}, {"type": "obj", "q": "Adding a controlled impurity to a pure semiconductor to change its conductivity is called ___", "opts": ["doping", "insulating", "amplifying", "rectifying"], "ans": 0, "sol": ["Doping with, for example, phosphorus gives n-type material and with boron gives p-type."], "tip": null, "fig": null, "id": "electron-5", "topic": "electron"}, {"type": "thy", "q": "(a) State two differences between conductors and insulators, giving one example of each.<br>(b) What is rectification? Name the component used for it.<br>(c) Name the four main units of a computer system and state the function of each.<br>(d) State three ways in which ICT has helped education in Ghana.", "sol": ["(a) Conductors have many free electrons and allow current to flow easily (copper, aluminium); insulators have almost no free electrons and do not allow current to flow (rubber, plastic, dry wood). Conductors are used for cables; insulators are used to cover them.", "(b) Rectification is the process of changing alternating current (a.c.) into direct current (d.c.). The component used is the <b>diode</b>.", "(c) <b>Input unit</b> — feeds data into the computer (keyboard, mouse). <b>Central processing unit</b> — carries out the instructions and controls the other units. <b>Storage/memory unit</b> — holds data and programs (RAM, hard disk). <b>Output unit</b> — presents the results (monitor, printer).", "(d) Access to learning material and past questions online; distance and online learning; faster processing of results and school records; use of projectors, videos and simulations in teaching; communication between schools, teachers and parents."], "marks": 12, "tip": null, "fig": null, "id": "electron-6", "topic": "electron"}, {"type": "obj", "q": "In the food chain 'grass → grasshopper → lizard → hawk', the lizard is a ___", "opts": ["secondary consumer", "primary consumer", "decomposer", "producer"], "ans": 0, "sol": ["Grass is the producer, the grasshopper the primary consumer and the lizard, which eats the grasshopper, the secondary consumer."], "tip": null, "fig": null, "id": "eco-1", "topic": "eco"}, {"type": "obj", "q": "Which group of organisms is responsible for returning nutrients from dead bodies to the soil?", "opts": ["Herbivores", "Carnivores", "Decomposers", "Producers"], "ans": 2, "sol": ["Bacteria and fungi break down dead matter, releasing mineral salts that plants can use again."], "tip": null, "fig": null, "id": "eco-2", "topic": "eco"}, {"type": "obj", "q": "The relationship between <i>Rhizobium</i> bacteria and a cowpea plant is an example of ___", "opts": ["parasitism", "mutualism", "predation", "commensalism"], "ans": 1, "sol": ["The bacteria get food and shelter while the plant gets fixed nitrogen — both benefit."], "tip": null, "fig": null, "id": "eco-3", "topic": "eco"}, {"type": "obj", "q": "Approximately what percentage of the energy at one trophic level is passed on to the next?", "opts": ["50%", "100%", "90%", "10%"], "ans": 3, "sol": ["Most energy is lost as heat, in respiration and in undigested material, so only about a tenth is passed on."], "tip": null, "fig": null, "id": "eco-4", "topic": "eco"}, {"type": "obj", "q": "The place where an organism lives is called its ___", "opts": ["community", "habitat", "niche", "population"], "ans": 1, "sol": ["A habitat is the physical place; the niche is the role the organism plays there."], "tip": null, "fig": null, "id": "eco-5", "topic": "eco"}, {"type": "thy", "q": "(a) Define the terms: (i) ecosystem; (ii) food web; (iii) trophic level.<br>(b) Construct a food chain of four organisms found on a Ghanaian farm and name the trophic level of each.<br>(c) Explain why food chains rarely have more than five links.<br>(d) State two effects of removing all the carnivores from an ecosystem.", "sol": ["(a)(i) An <b>ecosystem</b> is a community of living organisms interacting with one another and with the non-living parts of their environment.", "(ii) A <b>food web</b> is a network of interconnected food chains in a community.", "(iii) A <b>trophic level</b> is a feeding level in a food chain.", "(b) maize (producer) → grasshopper (primary consumer/herbivore) → toad (secondary consumer) → snake (tertiary consumer). Decomposers act on all of them.", "(c) Because only about 10% of the energy at each level is passed on; after four or five links there is too little energy left to support another population.", "(d) The population of herbivores would increase sharply at first; the vegetation would then be overgrazed and destroyed, after which the herbivores themselves would starve and disease would spread — the ecosystem loses its balance."], "marks": 15, "tip": null, "fig": null, "id": "eco-6", "topic": "eco"}, {"type": "obj", "q": "A body of mass 5 kg is acted on by a force of 20 N. Calculate its acceleration.", "opts": ["25 m/s²", "100 m/s²", "4 m/s²", "0.25 m/s²"], "ans": 2, "sol": ["F = ma ⇒ a = F ÷ m", "= 20 ÷ 5 = 4 m/s²"], "tip": null, "fig": null, "id": "force-1", "topic": "force"}, {"type": "obj", "q": "A car moving at 5 m/s accelerates uniformly to 20 m/s in 3 s. Calculate its acceleration.", "opts": ["6.7 m/s²", "15 m/s²", "45 m/s²", "5 m/s²"], "ans": 3, "sol": ["a = (v − u) ÷ t = (20 − 5) ÷ 3", "= 15 ÷ 3 = 5 m/s²"], "tip": null, "fig": null, "id": "force-2", "topic": "force"}, {"type": "obj", "q": "A force of 200 N acts on an area of 0.5 m². Calculate the pressure exerted.", "opts": ["100 Pa", "40 Pa", "0.0025 Pa", "400 Pa"], "ans": 3, "sol": ["P = F ÷ A = 200 ÷ 0.5", "= 400 Pa"], "tip": null, "fig": null, "id": "force-3", "topic": "force"}, {"type": "obj", "q": "Calculate the pressure at a point 2 m below the surface of water. [density = 1000 kg/m³, g = 10 m/s²]", "opts": ["500 Pa", "5000 Pa", "2000 Pa", "20000 Pa"], "ans": 3, "sol": ["P = ρgh = 1000 × 10 × 2", "= 20000 Pa (20 kPa)"], "tip": null, "fig": null, "id": "force-4", "topic": "force"}, {"type": "obj", "q": "The weight of a body of mass 8 kg on the earth's surface is ___ [g = 10 m/s²]", "opts": ["0.8 N", "80 N", "8 N", "800 N"], "ans": 1, "sol": ["W = mg = 8 × 10 = 80 N"], "tip": null, "fig": null, "id": "force-5", "topic": "force"}, {"type": "thy", "q": "(a) State the difference between mass and weight.<br>(b) A vehicle of mass 1200 kg starts from rest and reaches a speed of 24 m/s in 8 s. Calculate (i) its acceleration; (ii) the force applied.<br>(c) Explain why the walls of a dam are made thicker at the bottom than at the top.<br>(d) A rectangular block of weight 60 N rests on a surface with its base measuring 0.2 m by 0.3 m. Calculate the pressure on the surface.", "sol": ["(a) Mass is the quantity of matter in a body; it is measured in kilograms with a beam balance and is the same everywhere. Weight is the force with which gravity pulls the body; it is measured in newtons with a spring balance and varies from place to place.", "(b)(i) a = (24 − 0) ÷ 8 = <b>3 m/s²</b>", "(ii) F = ma = 1200 × 3 = <b>3600 N</b>", "(c) Pressure in a liquid increases with depth (P = ρgh), so the water pushes hardest at the bottom; the thicker wall there withstands the greater pressure.", "(d) Area = 0.2 × 0.3 = 0.06 m²", "P = F ÷ A = 60 ÷ 0.06 = <b>1000 Pa</b>"], "marks": 15, "tip": null, "fig": null, "id": "force-6", "topic": "force"}, {"type": "obj", "q": "A man pushes a load with a force of 50 N through a distance of 4 m. Calculate the work done.", "opts": ["200 J", "54 J", "12.5 J", "0.08 J"], "ans": 0, "sol": ["Work = force × distance = 50 × 4", "= 200 J"], "tip": null, "fig": null, "id": "machines-1", "topic": "machines"}, {"type": "obj", "q": "A machine does 600 J of work in 30 s. Calculate its power.", "opts": ["18000 W", "20 W", "0.05 W", "630 W"], "ans": 1, "sol": ["Power = work ÷ time = 600 ÷ 30", "= 20 W"], "tip": null, "fig": null, "id": "machines-2", "topic": "machines"}, {"type": "obj", "q": "A pulley system is used to raise a load of 200 N with an effort of 50 N. Calculate the mechanical advantage.", "opts": ["4", "0.25", "250", "150"], "ans": 0, "sol": ["MA = load ÷ effort = 200 ÷ 50 = 4"], "tip": null, "fig": null, "id": "machines-3", "topic": "machines"}, {"type": "obj", "q": "A machine with a velocity ratio of 5 has a mechanical advantage of 4. Calculate its efficiency.", "opts": ["20%", "90%", "80%", "125%"], "ans": 2, "sol": ["Efficiency = (MA ÷ VR) × 100% = (4 ÷ 5) × 100%", "= 80%"], "tip": null, "fig": null, "id": "machines-4", "topic": "machines"}, {"type": "obj", "q": "A wheelbarrow is an example of a ___ class lever.", "opts": ["third", "first", "second", "fourth"], "ans": 2, "sol": ["In a wheelbarrow the load is between the fulcrum (the wheel) and the effort (the hands) — a second-class lever."], "tip": null, "fig": null, "id": "machines-5", "topic": "machines"}, {"type": "thy", "q": "(a) Define mechanical advantage, velocity ratio and efficiency.<br>(b) An effort of 150 N is used to raise a load of 450 N using a pulley system in which the effort moves 6 m while the load rises 1.5 m. Calculate (i) MA; (ii) VR; (iii) efficiency.<br>(c) Give two reasons why the efficiency of a machine is always less than 100%.<br>(d) Name the class of lever in each case: scissors, tongs, bottle opener.", "sol": ["(a) <b>MA</b> = load ÷ effort. <b>VR</b> = distance moved by effort ÷ distance moved by load. <b>Efficiency</b> = (work output ÷ work input) × 100%, or (MA ÷ VR) × 100%.", "(b)(i) MA = 450 ÷ 150 = <b>3</b>", "(ii) VR = 6 ÷ 1.5 = <b>4</b>", "(iii) Efficiency = (3 ÷ 4) × 100 = <b>75%</b>", "(c) Some of the work input is used to overcome friction between the moving parts, and some is used to lift the moving parts of the machine itself (ropes, pulley blocks). Both appear mainly as heat, so the useful work output is always less than the work input.", "(d) Scissors — <b>first class</b>; tongs — <b>third class</b>; bottle opener — <b>second class</b>."], "marks": 15, "tip": null, "fig": null, "id": "machines-6", "topic": "machines"}, {"type": "obj", "q": "Malaria is caused by a ___", "opts": ["protozoan", "virus", "bacterium", "fungus"], "ans": 0, "sol": ["The parasite is <i>Plasmodium</i>, a protozoan, carried by the female <i>Anopheles</i> mosquito."], "tip": null, "fig": null, "id": "health-1", "topic
