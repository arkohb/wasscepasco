= /dəʊ/ and <i>through</i> = /θruː/."], "tip": null, "fig": null, "id": "vowel-4", "topic": "vowel"}, {"type": "obj", "q": "Which of these words contains a diphthong?", "opts": ["boy", "bought", "ball", "born"], "ans": 0, "sol": ["A diphthong glides between two vowel qualities.", "<b>Boy</b> = /bɔɪ/. The other three all have the pure long vowel /ɔː/."], "tip": null, "fig": null, "id": "vowel-5", "topic": "vowel"}, {"type": "obj", "q": "Choose the word that has the same vowel sound as the one underlined: p<u>u</u>t", "opts": ["part", "cut", "full", "cute"], "ans": 2, "sol": ["<i>Put</i> has the short /ʊ/.", "<b>Full</b> = /fʊl/. <i>Cut</i> is /ʌ/, <i>cute</i> is /juː/ and <i>part</i> is /ɑː/."], "tip": null, "fig": null, "id": "vowel-6", "topic": "vowel"}, {"type": "thy", "q": "(a) Give the phonetic symbol for the vowel sound in each word: (i) heart (ii) hurt (iii) hat (iv) hot (v) hate.<br>(b) Write two words that rhyme with each of the following: (i) fight (ii) care (iii) cow.", "sol": ["(a)(i) heart = <b>/ɑː/</b> &nbsp;(ii) hurt = <b>/ɜː/</b> &nbsp;(iii) hat = <b>/æ/</b> &nbsp;(iv) hot = <b>/ɒ/</b> &nbsp;(v) hate = <b>/eɪ/</b> (a diphthong)", "(b)(i) fight — <b>night, kite, write, height</b> (all /aɪt/)", "(ii) care — <b>fair, bear, share, their</b> (all /eə/)", "(iii) cow — <b>now, bough, allow, plough</b> (all /aʊ/)", "Notice that rhyme depends on sound, not spelling: <i>height</i> rhymes with <i>fight</i>, and <i>bear</i> with <i>care</i>."], "marks": 8, "tip": null, "fig": null, "id": "vowel-7", "topic": "vowel"}, {"type": "obj", "q": "In which word is the final <i>-s</i> pronounced /z/?", "opts": ["cakes", "bags", "cats", "books"], "ans": 1, "sol": ["/ɡ/ is voiced, so the -s after it is also voiced: <b>bags</b> = /bæɡz/.", "The others end in the voiceless /t/ or /k/, so their -s is /s/."], "tip": null, "fig": null, "id": "cons-1", "topic": "cons"}, {"type": "obj", "q": "In which word is the underlined letter SILENT? ", "opts": ["<u>k</u>ettle", "<u>k</u>een", "<u>k</u>nee", "<u>k</u>ind"], "ans": 2, "sol": ["The k before n is not pronounced: <b>knee</b> = /niː/.", "The same happens in <i>knife, knock, know</i>."], "tip": null, "fig": null, "id": "cons-2", "topic": "cons"}, {"type": "obj", "q": "Which word contains the sound /ʃ/?", "opts": ["sun", "snake", "sing", "sugar"], "ans": 3, "sol": ["<b>Sugar</b> begins with /ʃ/ — /ˈʃʊɡə/.", "The others begin with /s/."], "tip": null, "fig": null, "id": "cons-3", "topic": "cons"}, {"type": "obj", "q": "Choose the word in which <i>th</i> is pronounced as in <i>these</i>.", "opts": ["father", "thin", "think", "thick"], "ans": 0, "sol": ["<i>These</i> has the voiced /ð/.", "<b>Father</b> = /ˈfɑːðə/. The other three have the voiceless /θ/."], "tip": null, "fig": null, "id": "cons-4", "topic": "cons"}, {"type": "obj", "q": "Which word begins with a cluster of THREE consonant sounds?", "opts": ["splash", "train", "school", "black"], "ans": 0, "sol": ["<b>Splash</b> begins with /spl/ — three consonants.", "<i>Black</i> = /bl/, <i>train</i> = /tr/, <i>school</i> = /sk/ — two each."], "tip": null, "fig": null, "id": "cons-5", "topic": "cons"}, {"type": "obj", "q": "In which word is the <i>-ed</i> ending pronounced /ɪd/?", "opts": ["wanted", "played", "begged", "walked"], "ans": 0, "sol": ["After /t/ or /d/, the ending is /ɪd/: <b>wanted</b> = /ˈwɒntɪd/.", "<i>Walked</i> ends /t/; <i>played</i> and <i>begged</i> end /d/."], "tip": null, "fig": null, "id": "cons-6", "topic": "cons"}, {"type": "thy", "q": "(a) State how the <i>-ed</i> ending is pronounced in each word: (i) stopped (ii) landed (iii) cleaned (iv) laughed (v) needed.<br>(b) Underline the silent letter in each word: (i) debt (ii) psalm (iii) listen (iv) honest (v) writing.", "sol": ["(a)(i) stopped = <b>/t/</b> (after voiceless /p/) &nbsp;(ii) landed = <b>/ɪd/</b> (after /d/) &nbsp;(iii) cleaned = <b>/d/</b> (after voiced /n/)", "(iv) laughed = <b>/t/</b> (the <i>gh</i> is /f/, which is voiceless) &nbsp;(v) needed = <b>/ɪd/</b>", "(b)(i) de<b>b</b>t &nbsp;(ii) <b>p</b>salm (the <i>l</i> is also silent) &nbsp;(iii) lis<b>t</b>en &nbsp;(iv) <b>h</b>onest &nbsp;(v) <b>w</b>riting"], "marks": 10, "tip": null, "fig": null, "id": "cons-7", "topic": "cons"}, {"type": "obj", "q": "In which syllable is the word <i>development</i> stressed?", "opts": ["first", "second", "fourth", "third"], "ans": 1, "sol": ["It is said de-VEL-op-ment, so the stress is on the <b>second</b> syllable."], "tip": null, "fig": null, "id": "stress-1", "topic": "stress"}, {"type": "obj", "q": "Which of these words is stressed on the FIRST syllable?", "opts": ["photography", "photographic", "photograph", "photographer"], "ans": 2, "sol": ["<b>PHO</b>-to-graph is stressed first.", "pho-<b>TO</b>-gra-pher and pho-<b>TO</b>-gra-phy are stressed second, and pho-to-<b>GRA</b>-phic third."], "tip": null, "fig": null, "id": "stress-2", "topic": "stress"}, {"type": "obj", "q": "In the sentence 'It was AMA who cooked the rice', the stressed word answers the question ___", "opts": ["What did Ama cook?", "Who cooked the rice?", "Where did Ama cook the rice?", "What did Ama do to the rice?"], "ans": 1, "sol": ["The force falls on <i>Ama</i>, so the sentence is telling us WHO did it."], "tip": null, "fig": null, "id": "stress-3", "topic": "stress"}, {"type": "obj", "q": "In the sentence 'He bought a RED car', the stress shows that the speaker is answering ___", "opts": ["When did he buy the car?", "What colour of car did he buy?", "What did he buy?", "Who bought the car?"], "ans": 1, "sol": ["The stressed word names the colour, so the point at issue is the colour of the car."], "tip": null, "fig": null, "id": "stress-4", "topic": "stress"}, {"type": "obj", "q": "Which sentence is normally said with a RISING tune?", "opts": ["She travelled yesterday.", "Where do you live?", "Are you coming with us?", "Please close the door."], "ans": 2, "sol": ["Yes/no questions end on a rising tune.", "Commands, wh-questions and plain statements normally fall."], "tip": null, "fig": null, "id": "stress-5", "topic": "stress"}, {"type": "obj", "q": "In the sentence 'There has been an increase in school fees', the word <i>increase</i> is stressed on the ___ syllable.", "opts": ["last", "third", "second", "first"], "ans": 3, "sol": ["Here <i>increase</i> is a noun, and the noun is stressed on the <b>first</b> syllable: <b>IN</b>crease.", "As a verb it would be in<b>CREASE</b>."], "tip": null, "fig": null, "id": "stress-6", "topic": "stress"}, {"type": "thy", "q": "(a) Indicate the stressed syllable in each word: (i) advantage (ii) necessary (iii) examination (iv) compare (v) agriculture.<br>(b) In each sentence, the word in capitals carries the emphatic stress. Write the question each sentence answers.<br>(i) KOFI swept the classroom yesterday.<br>(ii) Kofi SWEPT the classroom yesterday.<br>(iii) Kofi swept the CLASSROOM yesterday.<br>(iv) Kofi swept the classroom YESTERDAY.", "sol": ["(a)(i) ad-<b>VAN</b>-tage &nbsp;(ii) <b>NE</b>-ces-sa-ry &nbsp;(iii) e-xa-mi-<b>NA</b>-tion &nbsp;(iv) com-<b>PARE</b> &nbsp;(v) <b>A</b>-gri-cul-ture", "(b)(i) <b>Who swept the classroom yesterday?</b>", "(ii) <b>What did Kofi do to the classroom yesterday?</b>", "(iii) <b>What did Kofi sweep yesterday?</b>", "(iv) <b>When did Kofi sweep the classroom?</b>"], "marks": 10, "tip": null, "fig": null, "id": "stress-7", "topic": "stress"}, {"type": "obj", "q": "<div class=\"passage\"><span class=\"lbl\">Passage</span><p>The lorry station at dawn is a world of its own. Long before the first light touches the rusty roofs, the drivers are already awake, wiping the dew from their windscreens and arguing about the price of fuel. Traders arrive with basins of bread and sachets of water balanced on their heads, and the air fills with the smell of engine oil and fried plantain.</p><p>Kwesi had been coming to this station for eleven years. He knew every pothole on the road to the north, and he could tell, from the sound of an engine alone, whether a vehicle would reach Tamale or sleep on the roadside. The younger drivers laughed at his caution. They loaded their vehicles until the springs groaned, and they drove as though the road belonged to them. Kwesi refused to do the same. <u>He would rather arrive late than not arrive at all</u>, he often said, and the older passengers chose his bus for that reason.</p><p>On this particular morning, however, the station was unusually quiet. News had come during the night of an accident near Kintampo, and the drivers spoke about it in low voices, each one thinking of the same thing and none of them saying it.</p></div>According to the passage, why did older passengers prefer Kwesi's bus?", "opts": ["Because he knew the traders", "Because his fares were lower", "Because his bus was new", "Because he drove carefully"], "ans": 3, "sol": ["The passage says he refused to overload or race, and 'the older passengers chose his bus for that reason'.", "The reason given is his caution — <b>he drove carefully</b>."], "tip": null, "fig": null, "id": "comp-1", "topic": "comp"}, {"type": "obj", "q": "<div class=\"passage\"><span class=\"lbl\">Passage</span><p>The lorry station at dawn is a world of its own. Long before the first light touches the rusty roofs, the drivers are already awake, wiping the dew from their windscreens and arguing about the price of fuel. Traders arrive with basins of bread and sachets of water balanced on their heads, and the air fills with the smell of engine oil and fried plantain.</p><p>Kwesi had been coming to this station for eleven years. He knew every pothole on the road to the north, and he could tell, from the sound of an engine alone, whether a vehicle would reach Tamale or sleep on the roadside. The younger drivers laughed at his caution. They loaded their vehicles until the springs groaned, and they drove as though the road belonged to them. Kwesi refused to do the same. <u>He would rather arrive late than not arrive at all</u>, he often said, and the older passengers chose his bus for that reason.</p><p>On this particular morning, however, the station was unusually quiet. News had come during the night of an accident near Kintampo, and the drivers spoke about it in low voices, each one thinking of the same thing and none of them saying it.</p></div>The expression <u>He would rather arrive late than not arrive at all</u> means that Kwesi ___", "opts": ["valued safety more than speed", "was always a slow worker", "did not care about his passengers", "disliked travelling at night"], "ans": 0, "sol": ["The sentence contrasts arriving late with never arriving — that is, with an accident.", "So Kwesi <b>valued safety more than speed</b>."], "tip": null, "fig": null, "id": "comp-2", "topic": "comp"}, {"type": "obj", "q": "<div class=\"passage\"><span class=\"lbl\">Passage</span><p>The lorry station at dawn is a world of its own. Long before the first light touches the rusty roofs, the drivers are already awake, wiping the dew from their windscreens and arguing about the price of fuel. Traders arrive with basins of bread and sachets of water balanced on their heads, and the air fills with the smell of engine oil and fried plantain.</p><p>Kwesi had been coming to this station for eleven years. He knew every pothole on the road to the north, and he could tell, from the sound of an engine alone, whether a vehicle would reach Tamale or sleep on the roadside. The younger drivers laughed at his caution. They loaded their vehicles until the springs groaned, and they drove as though the road belonged to them. Kwesi refused to do the same. <u>He would rather arrive late than not arrive at all</u>, he often said, and the older passengers chose his bus for that reason.</p><p>On this particular morning, however, the station was unusually quiet. News had come during the night of an accident near Kintampo, and the drivers spoke about it in low voices, each one thinking of the same thing and none of them saying it.</p></div>What grammatical name is given to the expression 'Long before the first light touches the rusty roofs'?", "opts": ["An adverbial clause of time", "A noun clause", "An adjectival clause", "An adverbial clause of reason"], "ans": 0, "sol": ["It has a finite verb (<i>touches</i>) and tells us WHEN the drivers are awake.", "So it is an <b>adverbial clause of time</b>, modifying the verb <i>are</i> (awake)."], "tip": null, "fig": null, "id": "comp-3", "topic": "comp"}, {"type": "obj", "q": "<div class=\"passage\"><span class=\"lbl\">Passage</span><p>The lorry station at dawn is a world of its own. Long before the first light touches the rusty roofs, the drivers are already awake, wiping the dew from their windscreens and arguing about the price of fuel. Traders arrive with basins of bread and sachets of water balanced on their heads, and the air fills with the smell of engine oil and fried plantain.</p><p>Kwesi had been coming to this station for eleven years. He knew every pothole on the road to the north, and he could tell, from the sound of an engine alone, whether a vehicle would reach Tamale or sleep on the roadside. The younger drivers laughed at his caution. They loaded their vehicles until the springs groaned, and they drove as though the road belonged to them. Kwesi refused to do the same. <u>He would rather arrive late than not arrive at all</u>, he often said, and the older passengers chose his bus for that reason.</p><p>On this particular morning, however, the station was unusually quiet. News had come during the night of an accident near Kintampo, and the drivers spoke about it in low voices, each one thinking of the same thing and none of them saying it.</p></div>The phrase 'until the springs groaned' suggests that the young drivers ___", "opts": ["drove very old vehicles", "carried noisy passengers", "overloaded their vehicles", "repaired their vehicles badly"], "ans": 2, "sol": ["Springs groan under too much weight, so the writer is telling us the vehicles were <b>overloaded</b>."], "tip": null, "fig": null, "id": "comp-4", "topic": "comp"}, {"type": "obj", "q": "<div class=\"passage\"><span class=\"lbl\">Passage</span><p>The lorry station at dawn is a world of its own. Long before the first light touches the rusty roofs, the drivers are already awake, wiping the dew from their windscreens and arguing about the price of fuel. Traders arrive with basins of bread and sachets of water balanced on their heads, and the air fills with the smell of engine oil and fried plantain.</p><p>Kwesi had been coming to this station for eleven years. He knew every pothole on the road to the north, and he could tell, from the sound of an engine alone, whether a vehicle would reach Tamale or sleep on the roadside. The younger drivers laughed at his caution. They loaded their vehicles until the springs groaned, and they drove as though the road belonged to them. Kwesi refused to do the same. <u>He would rather arrive late than not arrive at all</u>, he often said, and the older passengers chose his bus for that reason.</p><p>On this particular morning, however, the station was unusually quiet. News had come during the night of an accident near Kintampo, and the drivers spoke about it in low voices, each one thinking of the same thing and none of them saying it.</p></div>In the last paragraph, 'each one thinking of the same thing and none of them saying it' shows that the drivers were ___", "opts": ["angry with the police", "unwilling to work that day", "afraid it could happen to them", "planning to go to Kintampo"], "ans": 2, "sol": ["The unspoken shared thought, after news of an accident, is the fear that the same could happen to them."], "tip": null, "fig": null, "id": "comp-5", "topic": "comp"}, {"type": "obj", "q": "<div class=\"passage\"><span class=\"lbl\">Passage</span><p>The lorry station at dawn is a world of its own. Long before the first light touches the rusty roofs, the drivers are already awake, wiping the dew from their windscreens and arguing about the price of fuel. Traders arrive with basins of bread and sachets of water balanced on their heads, and the air fills with the smell of engine oil and fried plantain.</p><p>Kwesi had been coming to this station for eleven years. He knew every pothole on the road to the north, and he could tell, from the sound of an engine alone, whether a vehicle would reach Tamale or sleep on the roadside. The younger drivers laughed at his caution. They loaded their vehicles until the springs groaned, and they drove as though the road belonged to them. Kwesi refused to do the same. <u>He would rather arrive late than not arrive at all</u>, he often said, and the older passengers chose his bus for that reason.</p><p>On this particular morning, however, the station was unusually quiet. News had come during the night of an accident near Kintampo, and the drivers spoke about it in low voices, each one thinking of the same thing and none of them saying it.</p></div>Give another word for 'caution' as used in the passage.", "opts": ["fear", "carefulness", "warning", "slowness"], "ans": 1, "sol": ["In this passage, <i>caution</i> describes Kwesi's careful way of driving, so <b>carefulness</b> fits.", "<i>Caution</i> can also mean a warning, but that is not the meaning here."], "tip": null, "fig": null, "id": "comp-6", "topic": "comp"}, {"type": "thy", "q": "<div class=\"passage\"><span class=\"lbl\">Passage</span><p>The lorry station at dawn is a world of its own. Long before the first light touches the rusty roofs, the drivers are already awake, wiping the dew from their windscreens and arguing about the price of fuel. Traders arrive with basins of bread and sachets of water balanced on their heads, and the air fills with the smell of engine oil and fried plantain.</p><p>Kwesi had been coming to this station for eleven years. He knew every pothole on the road to the north, and he could tell, from the sound of an engine alone, whether a vehicle would reach Tamale or sleep on the roadside. The younger drivers laughed at his caution. They loaded their vehicles until the springs groaned, and they drove as though the road belonged to them. Kwesi refused to do the same. <u>He would rather arrive late than not arrive at all</u>, he often said, and the older passengers chose his bus for that reason.</p><p>On this particular morning, however, the station was unusually quiet. News had come during the night of an accident near Kintampo, and the drivers spoke about it in low voices, each one thinking of the same thing and none of them saying it.</p></div>(a) What two activities show that the station is busy at dawn?<br>(b) Why could Kwesi judge a vehicle by the sound of its engine?<br>(c) 'They drove as though the road belonged to them.' What does this tell us about the young drivers?<br>(d) What grammatical name is given to 'that a vehicle would reach Tamale' and what is its function?<br>(e) For each of the following words, give another word or phrase that means the same as it is used in the passage: (i) arguing (ii) refused (iii) unusually.", "sol": ["(a) The drivers wipe the dew from their windscreens and argue about the price of fuel, while traders arrive with bread and sachets of water. (Any two.)", "(b) Because of long experience — he had been using the route for eleven years and knew the vehicles and the road well.", "(c) That they were reckless and inconsiderate, driving fast without regard for other road users.", "(d) It is a <b>noun clause</b>; its function is the <b>object of the verb 'tell'</b> (it names what he could tell).", "(e)(i) arguing — <b>quarrelling / disagreeing</b> &nbsp;(ii) refused — <b>declined / would not agree</b> &nbsp;(iii) unusually — <b>strangely / abnormally</b>", "<div class=\"model\">Marking note: answers in your own words score more than lifted sentences. Each answer should be a complete sentence.</div>"], "marks": 20, "tip": null, "fig": null, "id": "comp-7", "topic": "comp"}, {"type": "thy", "q": "<div class=\"passage\"><span class=\"lbl\">Passage</span><p>When the district assembly announced that a new market would be built at Asuoso, the reaction of the townspeople was not what the planners had expected. Instead of rejoicing, the traders met under the mango tree behind the old lorry park and drew up a petition. They did not object to the market itself. What worried them was the site.</p><p>The chosen land lay on the far side of the river, twenty minutes from the town on foot and much longer for a woman carrying a basin of tomatoes. In the rainy season the wooden bridge was often under water, and for several days at a time nothing could cross it. The traders argued that a market no one could reach would soon become a market no one used. They had seen it happen at a neighbouring town, where a fine new building now stood empty while the trading went on, as it always had, by the roadside.</p><p>The assembly replied that the site had been chosen because the land was cheap and level, and because the town centre was already congested. Both sides were partly right. What neither side had done was to sit down with the other before the decision was taken, and it was this, more than the site itself, that turned a building project into a quarrel.</p></div>(a) Why did the traders write a petition?<br>(b) State two disadvantages of the chosen site.<br>(c) What lesson had the traders learnt from the neighbouring town?<br>(d) 'Both sides were partly right.' In one sentence, explain what the writer means.<br>(e) What grammatical name is given to 'that a market no one could reach would soon become a market no one used' and what is its function?<br>(f) Give another word or phrase for each of the following as used in the passage: (i) reaction (ii) congested (iii) quarrel.", "sol": ["(a) Because they objected to the site chosen for the new market, not to the market itself.", "(b) It is far from the town — about twenty minutes' walk, and longer for traders carrying heavy loads; and the wooden bridge to it floods in the rainy season, cutting it off for days.", "(c) That a market built in the wrong place will be abandoned, however fine the building is, because traders will simply continue trading where the buyers are.", "(d) The writer means that the traders were right about the difficulty of reaching the site, while the assembly was right about the cost of land and the congestion in the town centre.", "(e) It is a <b>noun clause</b>; its function is the <b>object of the verb 'argued'</b>.", "(f)(i) reaction — <b>response</b> &nbsp;(ii) congested — <b>overcrowded</b> &nbsp;(iii) quarrel — <b>dispute / disagreement</b>"], "marks": 20, "tip": null, "fig": null, "id": "comp-8", "topic": "comp"}, {"type": "obj", "q": "Which is the best summary of this sentence? 'Although the government has built many schools in the district, few of them have enough trained teachers.'", "opts": ["There are no trained teachers in the district's schools.", "The district has many schools but not enough trained teachers.", "The government should train more teachers for the district.", "The government has built many schools in the district."], "ans": 1, "sol": ["A summary keeps BOTH ideas of the original and adds nothing.", "Option 2 drops the second idea, option 3 overstates it ('no teachers'), and option 4 adds a recommendation that the sentence does not make."], "tip": null, "fig": null, "id": "summary-1", "topic": "summary"}, {"type": "obj", "q": "Which is the best summary of this sentence? 'The rains came late, and when they did come they fell so heavily that much of the seed was washed away.'", "opts": ["The rains came late in the season.", "Heavy rain is always a danger to farmers.", "Late and heavy rains destroyed much of the seed.", "The farmers planted their seed too early that year."], "ans": 2, "sol": ["<b>Late and heavy rains destroyed much of the seed</b> keeps both causes and the result, in fewer words.", "The others add information, generalise, or leave out the result."], "tip": null, "fig": null, "id": "summary-2", "topic": "summary"}, {"type": "obj", "q": "In summary writing, which of these should NOT be included?", "opts": ["The main reason given by the writer", "A condition the writer attaches to a point", "A result stated in the passage", "Examples used to illustrate a point"], "ans": 3, "sol": ["Examples merely illustrate a point that has already been made, so they are left out.", "Reasons, results and conditions are part of the point itself."], "tip": null, "fig": null, "id": "summary-3", "topic": "summary"}, {"type": "obj", "q": "A summary question asks for the points 'in three sentences, one for each'. A candidate writes four sentences. What is the likely outcome?", "opts": ["The fourth sentence is not marked", "All four sentences are marked", "The whole answer is cancelled", "Two marks are added for extra effort"], "ans": 0, "sol": ["Examiners mark the number of sentences asked for, in order; anything beyond that is ignored.", "Writing more wastes time and can also spoil an otherwise correct answer if the good point is in the extra sentence."], "tip": null, "fig": null, "id": "summary-4", "topic": "summary"}, {"type": "obj", "q": "Which of these openings is best for a summary sentence about the causes of flooding?", "opts": ["In my own opinion, flooding is a serious problem in our cities.", "Firstly, secondly and thirdly, flooding has causes.", "The passage says that flooding is caused by many things.", "Flooding is caused by the blocking of drains with refuse."], "ans": 3, "sol": ["A summary sentence states the point itself, directly.", "Referring to 'the passage', giving your own opinion or writing empty ordering words all waste words and earn no marks."], "tip": null, "fig": null, "id": "summary-5", "topic": "summary"}, {"type": "obj", "q": "Which word best replaces the underlined words in a summary? 'The chief was <u>not at all willing to agree</u> to the proposal.'", "opts": ["unable", "ready", "reluctant", "angry"], "ans": 2, "sol": ["<b>Reluctant</b> says in one word what the underlined phrase says in six — exactly the skill summary tests."], "tip": null, "fig": null, "id": "summary-6", "topic": "summary"}, {"type": "thy", "q": "<div class=\"passage\"><span class=\"lbl\">Passage</span><p>Small-scale mining has changed the face of many communities in the south-west of the country. Where cocoa farms once stood, there are now pits and heaps of gravel, and rivers that were clear ten years ago run the colour of milky tea. The damage is not only to the landscape. Farmers who sold their land for a single payment now have neither land nor income, and the mercury used to separate the gold enters the water that families downstream still drink and cook with.</p><p>Yet the trade continues, and it is not difficult to see why. For a young man in a village with no factory and no office, mining offers money today, in cash, without a certificate. Families depend on what he sends home. Officials who are sent to close the pits are sometimes met with anger, and sometimes with an envelope, and the pits reopen within a week of their leaving.</p><p>Those who have studied the problem agree on one thing: the answer is not enforcement alone. Unless the young people who mine are offered work that pays comparably, and unless the farmers who own the land are given a reason to keep it, the pits will continue to spread whatever the law says.</p></div>(a) In three sentences, one for each, state three effects of small-scale mining described in the passage.<br>(b) In two sentences, one for each, state two reasons why the trade continues.", "sol": ["(a) Sample answers:", "<div class=\"model\">1. Farmland, including cocoa farms, has been destroyed and replaced by pits and gravel heaps.<br>2. Rivers have been polluted, so that water once clear is now dirty and carries mercury into homes downstream.<br>3. Farmers who sold their land have been left with neither land nor a source of income.</div>", "(b) Sample answers:", "<div class=\"model\">1. Mining offers young men in villages immediate cash income that no other work there provides.<br>2. Attempts to close the pits fail because officials are resisted or bribed, so the pits soon reopen.</div>", "Note how each sentence carries exactly one point and uses the candidate's own words. The third paragraph is about solutions, not effects or reasons, so nothing from it belongs in this answer."], "marks": 20, "tip": null, "fig": null, "id": "summary-7", "topic": "summary"}, {"type": "obj", "q": "Which ending goes with the salutation 'Dear Sir'?", "opts": ["Your faithfully", "Yours sincerely", "Yours faithfully", "Yours truly friend"], "ans": 2, "sol": ["<b>Yours faithfully</b> is used when the receiver is not named.", "<i>Yours sincerely</i> is used after a name, as in 'Dear Mr Mensah'."], "tip": null, "fig": null, "id": "essay-1", "topic": "essay"}, {"type": "obj", "q": "In a formal letter, where is the writer's address placed?", "opts": ["At the end of the letter", "At the top left-hand corner", "Below the salutation", "At the top right-hand corner"], "ans": 3, "sol": ["The writer's address goes at the <b>top right</b>, with the date under it; the receiver's address goes on the left, below it."], "tip": null, "fig": null, "id": "essay-2", "topic": "essay"}, {"type": "obj", "q": "Which of these is an essential feature of a speech but NOT of an article?", "opts": ["A conclusion", "Vocatives such as 'Mr Chairman, ladies and gentlemen'", "Paragraphs", "A title"], "ans": 1, "sol": ["A speech must address its audience directly with vocatives at the opening (and often at intervals).", "Titles, paragraphs and conclusions belong to both."], "tip": null, "fig": null, "id": "essay-3", "topic": "essay"}, {"type": "obj", "q": "Which title is most suitable for an argumentative essay?", "opts": ["My first day at school", "How to prepare banku", "Mobile phones should not be allowed in senior high schools", "A description of my village"], "ans": 2, "sol": ["An argumentative essay takes a position that can be argued for and against.", "The others call for narration, exposition or description."], "tip": null, "fig": null, "id": "essay-4", "topic": "essay"}, {"type": "obj", "q": "In an informal letter to a friend, which of these should NOT appear?", "opts": ["The receiver's address", "The date", "The writer's address", "A closing such as 'Your friend'"], "ans": 0, "sol": ["The receiver's address is a feature of formal letters only."], "tip": null, "fig": null, "id": "essay-5", "topic": "essay"}, {"type": "obj", "q": "A candidate is asked to write a report to the head teacher on a football competition. Which feature is essential?", "opts": ["Dialogue between the players", "A title and the writer's name and position at the end", "A rhyming opening", "An address for the referee"], "ans": 1, "sol": ["A report carries a title, states facts in an orderly way, and ends with the name and position of the writer (e.g. 'Kofi Asare, Sports Prefect')."], "tip": null, "fig": null, "id": "essay-6", "topic": "essay"}, {"type": "thy", "q": "Write a letter to the District Chief Executive of your area complaining about the poor state of the road leading to your town, and suggesting two ways the problem could be solved.", "sol": ["<b>Plan.</b> Writer's address and date (top right); receiver's address (left); salutation 'Dear Sir/Madam'; title: POOR STATE OF THE KOFORIDUA–ASUOSO ROAD; three or four paragraphs; 'Yours faithfully' and your full name.", "Paragraph 1 — who you are and why you are writing.", "Paragraph 2 — the state of the road: potholes, dust, erosion after rain.", "Paragraph 3 — the effects: higher fares, damaged vehicles, farm produce spoiling, ambulances unable to pass.", "Paragraph 4 — your two suggestions: immediate grading and filling of potholes before the rains, and a proper drainage system with tarring in the next budget.", "Paragraph 5 — a polite appeal for action.", "<div class=\"model\"><b>Sample opening</b><br>P.O. Box 24<br>Asuoso<br>17th September, 2026<br><br>The District Chief Executive<br>Asuoso District Assembly<br>Asuoso<br><br>Dear Sir,<br><br><b>POOR STATE OF THE ASUOSO–KINTAMPO ROAD</b><br><br>I am a resident of Asuoso and a student of Asuoso Senior High School. I write, on behalf of the people of my community, to draw your attention to the deplorable condition of the road that links our town to the main highway, and to suggest two measures that could bring us relief.<br><br>Since the last rainy season, the road has become almost impassable. Potholes as wide as a vehicle now cover the stretch between the river and the market, and the gullies cut by running water have left the surface uneven and dangerous…</div>", "End with: <i>Yours faithfully,</i> then your signature and your full name in capitals."], "marks": 30, "tip": null, "fig": null, "id": "essay-7", "topic": "essay"}, {"type": "thy", "q": "'Mobile phones should not be allowed in senior high schools.' Write an article for your school magazine, arguing FOR or AGAINST this statement.", "sol": ["<b>Plan (arguing against the ban).</b> Title and by-line; introduction stating your position; three arguments, each in its own paragraph with an example; one opposing view answered; conclusion.", "Argument 1 — phones give access to learning material where textbooks are few.", "Argument 2 — they keep students in touch with parents, which matters for safety and for fees and emergencies.", "Argument 3 — a supervised policy (phones kept off during lessons, used at set times) teaches responsibility better than a total ban.", "Opposing view answered — yes, phones can distract and can be used to cheat; but the answer is supervision and clear rules, not removal.", "<div class=\"model\"><b>Sample opening</b><br><b>SHOULD THE PHONE STAY OUT OF SCHOOL?</b><br><i>by Ama Serwaa, Form Three Arts</i><br><br>Every term the same argument returns to our assembly ground: the mobile phone is the enemy of learning and must be kept beyond the school gate. I disagree. The phone is a tool, and like every tool in this school — from the laboratory burner to the workshop saw — it is useful or dangerous according to the rules that govern its use…</div>", "Remember: an article needs a title, a by-line, clear paragraphs and a definite conclusion. Keep a consistent, reasonably formal tone."], "marks": 30, "tip": null, "fig": null, "id": "essay-8", "topic": "essay"}, {"type": "thy", "q": "Write a story that ends with the words: '…and from that day I never took my mother's advice for granted again.'", "sol": ["<b>Plan.</b> A narrative essay needs one clear incident, told in order, with a setting, a problem, a turning point and the given ending.", "Paragraph 1 — set the scene: the place, the time and the advice your mother gave.", "Paragraph 2 — why you ignored it (impatience, friends, pride).", "Paragraph 3 — the event that followed, told in detail and at a slower pace — this is where the marks for content lie.", "Paragraph 4 — the consequence and who helped you.", "Paragraph 5 — the lesson, ending with the EXACT words given. Do not change a single word of the given sentence.", "<div class=\"model\"><b>Tips that earn marks</b><br>• Use the past tense consistently.<br>• Use dialogue sparingly but effectively — one or two exchanges bring the story to life.<br>• Show feeling through action ('my hands would not stop shaking') rather than telling ('I was afraid').<br>• Keep to one incident; a story that covers three years cannot be developed in 450 words.</div>"], "marks": 30, "tip": null, "fig": null, "id": "essay-9", "topic": "essay"}, {"type": "obj", "q": "Choose the word nearest in meaning to the underlined word: The chairman gave a <u>terse</u> reply to the question.", "opts": ["confusing", "angry", "brief", "polite"], "ans": 2, "sol": ["<i>Terse</i> means short and to the point, sometimes abruptly so.", "The nearest word offered is <b>brief</b>."], "tip": null, "fig": null, "id": "syn-8", "topic": "syn"}, {"type": "obj", "q": "Choose the word nearest in meaning to the underlined word: The disease spread at an <u>alarming</u> rate.", "opts": ["frightening", "slow", "steady", "unusual"], "ans": 0, "sol": ["Something <i>alarming</i> causes fear or worry — <b>frightening</b>."], "tip": null, "fig": null, "id": "syn-9", "topic": "syn"}, {"type": "obj", "q": "Choose the word nearest in meaning to the underlined word: The old man was <u>reluctant</u> to leave his village.", "opts": ["unwilling", "too weak", "afraid", "unable"], "ans": 0, "sol": ["<i>Reluctant</i> means hesitating or unwilling to do something.", "Note the difference from <i>unable</i>, which is about capacity, not willingness."], "tip": null, "fig": null, "id": "syn-10", "topic": "syn"}, {"type": "obj", "q": "Choose the word most nearly OPPOSITE in meaning: The road to the village is very <u>narrow</u>.", "opts": ["rough", "steep", "broad", "long"], "ans": 2, "sol": ["The opposite of <i>narrow</i> (in width) is <b>broad</b> or wide."], "tip": null, "fig": null, "id": "ant-8", "topic": "ant"}, {"type": "obj", "q": "Choose the word most nearly OPPOSITE in meaning: Her explanation was <u>vague</u>.", "opts": ["brief", "false", "precise", "loud"], "ans": 2, "sol": ["<i>Vague</i> = unclear and imprecise, so the opposite is <b>precise</b>.", "<i>False</i> is the opposite of <i>true</i>, not of <i>vague</i>."], "tip": null, "fig": null, "id": "ant-9", "topic": "ant"}, {"type": "obj", "q": "Choose the word most nearly OPPOSITE in meaning: The soldiers were <u>reluctant</u> to withdraw.", "opts": ["eager", "ordered", "afraid", "unable"], "ans": 0, "sol": ["The opposite of unwilling is <b>eager</b> (very willing)."], "tip": null, "fig": null, "id": "ant-10", "topic": "ant"}, {"type": "obj", "q": "Choose the option that best explains the underlined expression: The new manager decided to <u>turn over a new leaf</u>.", "opts": ["employ new workers", "plant new crops", "begin a new book", "change for the better"], "ans": 3, "sol": ["<i>To turn over a new leaf</i> is to change one's behaviour for the better."], "tip": null, "fig": null, "id": "idiom-8", "topic": "idiom"}, {"type": "obj", "q": "Choose the option that best explains the underlined expression: The contract was signed <u>in the nick of time</u>.", "opts": ["in great secrecy", "without witnesses", "after a long delay", "just in time"], "ans": 3, "sol": ["<i>In the nick of time</i> means at the last possible moment, just before it was too late."], "tip": null, "fig": null, "id": "idiom-9", "topic": "idiom"}, {"type": "obj", "q": "Choose the option that best explains the underlined expression: He was asked to <u>foot the bill</u> for the repairs.", "opts": ["check the account", "walk to the shop", "delay the payment", "pay the cost"], "ans": 3, "sol": ["To <i>foot the bill</i> is to pay for something."], "tip": null, "fig": null, "id": "idiom-10", "topic": "idiom"}, {"type": "obj", "q": "The words <i>trawler, net, creek</i> and <i>bait</i> belong to the register of ___.", "opts": ["building", "hunting", "fishing", "farming"], "ans": 2, "sol": ["All four are used by fishermen."], "tip": null, "fig": null, "id": "reg-8", "topic": "reg"}, {"type": "obj", "q": "The words <i>foundation, lintel, mortar</i> and <i>scaffolding</i> belong to the register of ___.", "opts": ["building", "weaving", "printing", "banking"], "ans": 0, "sol": ["They are all used in construction work."], "tip": null, "fig": null, "id": "reg-9", "topic": "reg"}, {"type": "obj", "q": "A patient who is given medicine to make him unconscious before an operation has been given ___.", "opts": ["an antibiotic", "an anaesthetic", "an antiseptic", "an analgesic"], "ans": 1, "sol": ["<b>Anaesthetic</b> removes sensation or consciousness for surgery.", "An antibiotic fights bacteria, an antiseptic kills germs on a surface, and an analgesic relieves pain."], "tip": null, "fig": null, "id": "reg-10", "topic": "reg"}, {"type": "obj", "q": "Choose the correct word: The team ___ hard every evening.", "opts": ["practices", "practise", "practicing", "practises"], "ans": 3, "sol": ["<b>Practise</b> (with s) is the verb, and it takes -s with a singular subject: <i>practises</i>.", "<i>Practice</i> with a c is the noun."], "tip": null, "fig": null, "id": "form-8", "topic": "form"}, {"type": "obj", "q": "The adjective formed from the noun <i>mystery</i> is ___.", "opts": ["mysteric", "mysteried", "mysteryful", "mysterious"], "ans": 3, "sol": ["The adjective is <b>mysterious</b>."], "tip": null, "fig": null, "id": "form-9", "topic": "form"}, {"type": "obj", "q": "Choose the correct word: The two teams were ___ matched.", "opts": ["evenly", "even", "evening", "evenness"], "ans": 0, "sol": ["An adverb is needed to modify the participle <i>matched</i>: <b>evenly</b>."], "tip": null, "fig": null, "id": "form-10", "topic": "form"}, {"type": "obj", "q": "Choose the correct option: I ___ my keys; I cannot find them anywhere.", "opts": ["lost", "am losing", "have lost", "had lost"], "ans": 2, "sol": ["The loss happened in the past but matters now, so the present perfect is used."], "tip": null, "fig": null, "id": "tense-8", "topic": "tense"}, {"type": "obj", "q": "Choose the correct option: Every morning, the bell ___ at six o'clock.", "opts": ["rings", "has rung", "rang", "is ringing"], "ans": 0, "sol": ["A repeated, habitual action takes the present simple."], "tip": null, "fig": null, "id": "tense-9", "topic": "tense"}, {"type": "obj", "q": "Choose the correct option: They ___ for two hours before the bus finally came.", "opts": ["had been waiting", "are waiting", "waited", "have been waiting"], "ans": 0, "sol": ["The waiting continued up to a point in the past, so the past perfect continuous is used."], "tip": null, "fig": null, "id": "tense-10", "topic": "tense"}, {"type": "obj", "q": "Choose the correct option: The jury ___ divided in their opinion.", "opts": ["are", "is", "was being", "has"], "ans": 0, "sol": ["When a collective noun refers to the members acting separately (<i>in their opinion</i>), a plural verb is used."], "tip": null, "fig": null, "id": "concord-8", "topic": "concord"}, {"type": "obj", "q": "Choose the correct option: There ___ a pen and two pencils on the table.", "opts": ["have been", "were", "are", "is"], "ans": 3, "sol": ["With <i>there is/are</i>, the verb agrees with the first item mentioned: <i>a pen</i> (singular)."], "tip": null, "fig": null, "id": "concord-9", "topic": "concord"}, {"type": "obj", "q": "Choose the correct option: Half of the students ___ absent.", "opts": ["was", "is", "has been", "are"], "ans": 3, "sol": ["With fractions and percentages, the verb agrees with the noun that follows <i>of</i> — <i>students</i> is plural."], "tip": null, "fig": null, "id": "concord-10", "topic": "concord"}, {"type": "obj", "q": "Choose the correct option: She has been suffering ___ malaria for a week.", "opts": ["with", "for", "from", "of"], "ans": 2, "sol": ["The fixed pattern is <i>suffer <b>from</b></i> an illness."], "tip": null, "fig": null, "id": "prep-8", "topic": "prep"}, {"type": "obj", "q": "Choose the correct option: The teacher was angry ___ the boy's rudeness.", "opts": ["for", "to", "on", "at"], "ans": 3, "sol": ["We are angry <b>at</b> or <b>about</b> a thing, and angry <b>with</b> a person."], "tip": null, "fig": null, "id": "prep-9", "topic": "prep"}, {"type": "obj", "q": "Choose the option nearest in meaning to the underlined words: The government has promised to <u>do away with</u> the tax.", "opts": ["increase", "explain", "abolish", "postpone"], "ans": 2, "sol": ["<i>Do away with</i> = <b>abolish</b>, get rid of."], "tip": null, "fig": null, "id": "prep-10", "topic": "prep"}, {"type": "obj", "q": "Identify the sentence type: 'She arrived early because she wanted a good seat, and she waited quietly.'", "opts": ["Simple", "Complex", "Compound", "Compound-complex"], "ans": 3, "sol": ["There are two main clauses (<i>She arrived early</i>, <i>she waited quietly</i>) and one subordinate clause (<i>because she wanted a good seat</i>).", "That combination is a <b>compound-complex</b> sentence."], "tip": null, "fig": null, "id": "clause-8", "topic": "clause"}, {"type": "obj", "q": "What is the function of the underlined clause? My question is <u>whether the money was paid</u>.", "opts": ["Noun clause, complement", "Adjectival clause", "Noun clause, object", "Adverbial clause of condition"], "ans": 0, "sol": ["It follows the linking verb <i>is</i> and completes the meaning of the subject, so it is a noun clause used as the <b>complement</b>."], "tip": null, "fig": null, "id": "clause-9", "topic": "clause"}, {"type": "obj", "q": "What is the function of the underlined phrase? He returned home <u>after the storm</u>.", "opts": ["Adverbial phrase of manner", "Noun phrase", "Adverbial phrase of time", "Adjectival phrase"], "ans": 2, "sol": ["It tells us WHEN he returned, so it is an adverbial phrase of time."], "tip": null, "fig": null, "id": "clause-10", "topic": "clause"}, {"type": "obj", "q": "Which word is correctly spelt?", "opts": ["occurence", "occurrence", "occurrance", "ocurrence"], "ans": 1, "sol": ["<b>Occurrence</b> — double c, double r, ending -ence."], "tip": null, "fig": null, "id": "punct-8", "topic": "punct"}, {"type": "obj", "q": "Which word is correctly spelt?", "opts": ["maintainance", "maintenance", "maintanance", "maintenence"], "ans": 1, "sol": ["The verb is <i>maintain</i>, but the noun drops the i: <b>maintenance</b>."], "tip": null, "fig": null, "id": "punct-9", "topic": "punct"}, {"type": "obj", "q": "Choose the correctly punctuated sentence.", "opts": ["“where are you going?” she asked.", "“Where are you going”? she asked.", "“Where are you going?” she asked.", "“Where are you going?” She asked."], "ans": 2, "sol": ["The question mark belongs inside the quotation marks because the quoted words are the question.", "The reporting clause <i>she asked</i> continues the same sentence, so it begins with a small letter."], "tip": null, "fig": null, "id": "punct-10", "topic": "punct"}, {"type": "obj", "q": "Choose the word that has the same vowel sound as the one underlined: c<u>a</u>r", "opts": ["cat", "heart", "care", "carry"], "ans": 1, "sol": ["<i>Car</i> has the long /ɑː/.", "<b>Heart</b> = /hɑːt/. <i>Care</i> is /eə/, and <i>carry</i> and <i>cat</i> have the short /æ/."], "tip": null, "fig": null, "id": "vowel-8", "topic": "vowel"}, {"type": "obj", "q": "Choose the word whose vowel sound is DIFFERENT from the others.", "opts": ["taught", "caught", "bought", "laugh"], "ans": 3, "sol": ["<i>Bought, caught</i> and <i>taught</i> all have /ɔː/.", "<b>Laugh</b> is /lɑːf/."], "tip": null, "fig": null, "id": "vowel-9", "topic": "vowel"}, {"type": "obj", "q": "In which word is the letter <i>g</i> silent?", "opts": ["guard", "ghost", "gnaw", "goat"], "ans": 2, "sol": ["In <b>gnaw</b>, the initial g is not pronounced: /nɔː/. Compare <i>gnat</i> and <i>gnome</i>."], "tip": null, "fig": null, "id": "cons-8", "topic": "cons"}, {"type": "obj", "q": "Which word ends with the sound /ɪz/?", "opts": ["walks", "watches", "runs", "plays"], "ans": 1, "sol": ["After /tʃ/, the -es ending is pronounced /ɪz/: <b>watches</b> = /ˈwɒtʃɪz/."], "tip": null, "fig": null, "id": "cons-9", "topic": "cons"}, {"type": "obj", "q": "Which of these words is stressed on the SECOND syllable?", "opts": ["beautiful", "successful", "management", "difficult"], "ans": 1, "sol": ["suc-<b>CESS</b>-ful is stressed second.", "<i>BEAU</i>-ti-ful, <i>MAN</i>-age-ment and <i>DIF</i>-fi-cult are all stressed first."], "tip": null, "fig": null, "id": "stress-8", "topic": "stress"}, {"type": "obj", "q": "In the sentence 'Ama travelled to KUMASI last week', the stressed word answers the question ___", "opts": ["When did Ama travel?", "Where did Ama travel to last week?", "Who travelled last week?", "How did Ama travel?"], "ans": 1, "sol": ["The stress falls on the place, so the sentence answers a question about destination."], "tip": null, "fig": null, "id": "stress-9", "topic": "stress"}, {"type": "obj", "q": "Choose the correct sentence.", "opts": ["We discussed on the matter at length.", "We discussed about the matter at length.", "We discussed the matter at length.", "We discussed over the matter at length."], "ans": 2, "sol": ["<i>Discuss</i> already carries the idea of 'about', so no preposition follows it.", "The same applies to <i>request</i>, <i>enter</i>, <i>resemble</i> and <i>emphasise</i>."], "tip": null, "fig": null, "id": "errors-1", "topic": "errors"}, {"type": "obj", "q": "Choose the correct sentence.", "opts": ["Inspite the rain, the match continued.", "Despite of the rain, the match continued.", "Despite the rain, the match continued.", "Despite from the rain, the match continued."], "ans": 2, "sol": ["Use either <i>despite</i> + noun or <i>in spite of</i> + noun.", "'Despite of' mixes the two and is always wrong."], "tip": null, "fig": null, "id": "errors-2", "topic": "errors"}, {"type": "obj", "q": "Correct the error: Kofi borrowed me GH₵ 50 last week.", "opts": ["Kofi lent me GH₵ 50 last week.", "Kofi has borrow me GH₵ 50 last week.", "Kofi borrowed me with GH₵ 50 last week.", "Kofi borrowed from me GH₵ 50 last week."], "ans": 0, "sol": ["The person who GIVES lends; the person who TAKES borrows.", "Kofi gave the money, so he <b>lent</b> it."], "tip": null, "fig": null, "id": "errors-3", "topic": "errors"}, {"type": "obj", "q": "Choose the correct sentence.", "opts": ["He is one of the student who have passed.", "He is one of the students who has passed.", "He is one of the students who have passed.", "He is one of the students which have passed."], "ans": 2, "sol": ["The relative clause describes <i>the students</i> (plural), so the verb is <i>have</i>.", "Use <i>who</i> for people, never <i>which</i>."], "tip": null, "fig": null, "id": "errors-4", "topic": "errors"}, {"type": "obj", "q": "Choose the correct sentence.", "opts": ["The reason for his absence is due to he was ill.", "The reason for his absence is because he was ill.", "The reason for his absence is that he was ill.", "The reason why for his absence is because he was ill."], "ans": 2, "sol": ["'The reason … is <b>that</b>' is the correct pattern.", "'Is because' repeats the idea of reason twice."], "tip": null, "fig": null, "id": "errors-5", "topic": "errors"}, {"type": "thy", "q": "Rewrite each sentence correctly and give the rule in one line.<br>(a) I look forward to see you next week.<br>(b) She prefers tea than coffee.<br>(c) The two brothers resemble with each other.<br>(d) He has been teaching since five years.<br>(e) Each of the candidates were given a form.<br>(f) I enjoyed during the holidays.", "sol": ["(a) <b>I look forward to seeing you next week.</b> — after 'look forward to', the verb takes -ing.", "(b) <b>She prefers tea to coffee.</b> — the pattern is <i>prefer X to Y</i>.", "(c) <b>The two brothers resemble each other.</b> — <i>resemble</i> takes no preposition.", "(d) <b>He has been teaching for five years.</b> — <i>for</i> + a length of time, <i>since</i> + a point in time.", "(e) <b>Each of the candidates was given a form.</b> — <i>each</i> is singular.", "(f) <b>I enjoyed myself during the holidays.</b> — <i>enjoy</i> needs an object."], "marks": 12, "tip": null, "fig": null, "id": "errors-6", "topic": "errors"}, {"type": "obj", "q": "Which of these is essential in a report but NOT in a story?", "opts": ["A title", "Recommendations at the end", "Paragraphs", "Correct spelling"], "ans": 1, "sol": ["A report is written so that someone can act on it, so it ends with conclusions and recommendations.", "Titles, paragraphs and good spelling belong to both."], "tip": null, "fig": null, "id": "report-1", "topic": "report"}, {"type": "obj", "q": "A speech should begin with ___", "opts": ["vocatives addressing the audience", "the writer's address", "the date and venue", "a list of references"], "ans": 0, "sol": ["Vocatives — 'Mr Chairman, ladies and gentlemen' — show that you are speaking TO an audience."], "tip": null, "fig": null, "id": "report-2", "topic": "report"}, {"type": "obj", "q": "Who should sign a report on a school football competition written for the headmaster?", "opts": ["The sports master only", "The headmaster", "No one", "The writer, with his or her position"], "ans": 3, "sol": ["A report ends with the writer's name and position, for example 'Ama Boateng, Sports Prefect'."], "tip": null, "fig": null, "id": "report-3", "topic": "report"}, {"type": "obj", "q": "Which ending is most suitable for an article for a school magazine?", "opts": ["Yours faithfully", "The writer's postal address", "A list of the students interviewed", "A short paragraph summing up the writer's stand"], "ans": 3, "sol": ["An article is not a letter, so it takes no 'Yours faithfully' or address — it ends with a conclusion."], "tip": null, "fig": null, "id": "report-4", "topic": "report"}, {"type": "obj", "q": "In a speech, which expression best keeps the audience involved?", "opts": ["'With reference to your letter …'", "'The undersigned wishes to state …'", "'Please find attached …'", "'As you all know, fellow students, …'"], "ans": 3, "sol": ["A speech speaks directly to the people in front of you; the other three belong to formal letters and memos."], "tip": null, "fig": null, "id": "report-5", "topic": "report"}, {"type": "thy", "q": "As the Health Prefect of your school, write a report to the headmaster on the state of the school's sanitation facilities, suggesting two improvements.", "sol": ["<b>Plan.</b> Title; who asked for the report and when; what you found (three or four points); conclusions; recommendations; your name and position.", "<div class=\"model\"><b>REPORT ON THE STATE OF SANITATION FACILITIES IN THE SCHOOL</b><br><br><b>1. Terms of reference.</b> On 2nd October, 2026, the Headmaster asked me to inspect the school's sanitation facilities and report on their condition.<br><br><b>2. Procedure.</b> Between 3rd and 6th October I inspected the four toilet blocks, the urinals, the refuse site and the water points, and spoke with the cleaners and twelve students.<br><br><b>3. Findings.</b><br>(a) Two of the four toilet blocks have broken doors and no running water.<br>(b) The refuse site behind the dining hall is not cleared regularly and attracts flies.<br>(c) Only three of the nine wash basins have soap.<br><br><b>4. Conclusion.</b> The facilities are inadequate for a student population of 900 and pose a health risk, especially in the rainy season.<br><br><b>5. Recommendations.</b><br>(a) The two damaged blocks should be repaired and connected to the water tank before the end of the term.<br>(b) The refuse should be collected twice a week, and soap provided daily at every wash basin.<br><br>Kwabena Mensah<br>Health Prefect</div>", "Notice the numbered sections, the plain factual tone, and recommendations that can actually be carried out."], "marks": 30, "tip": null, "fig": null, "id": "report-6", "topic": "report"}, {"type": "obj", "q": "Choose the most appropriate response: 'Would you mind closing the window?'", "opts": ["Not at all.", "Of course I would mind.", "Yes, I mind.", "No, thank you."], "ans": 0, "sol": ["'Would you mind…?' is a polite request.", "'Not at all' means 'I am happy to do it'."], "tip": null, "fig": null, "id": "listen-1", "topic": "listen"}, {"type": "obj", "q": "Choose the most appropriate response: 'I'm sorry I stepped on your foot.'", "opts": ["You are welcome to it.", "Please do.", "Not at all costs.", "That's all right."], "ans": 3, "sol": ["An apology is answered by accepting it: 'That's all right' or 'Don't worry about it'."], "tip": null, "fig": null, "id": "listen-2", "topic": "listen"}, {"type": "obj", "q": "Your friend says, 'Congratulations on your result!' The best reply is ___", "opts": ["Thank you very much.", "Don't mention it.", "You are welcome.", "It is nothing serious."], "ans": 0, "sol": ["Congratulations are answered with thanks.", "'Don't mention it' and 'You're welcome' are replies to <i>thank you</i>, not to congratulations."], "tip": null, "fig": null, "id": "listen-3", "topic": "listen"}, {"type": "obj", "q": "Which sentence would normally be said with a FALLING tune?", "opts": ["Did he call you?", "Please close the door.", "Is that your book?", "Are you coming?"], "ans": 1, "sol": ["Commands, statements and wh-questions fall at the end; yes/no questions rise."], "tip": null, "fig": null, "id": "listen-4", "topic": "listen"}, {"type": "obj", "q": "In a listening passage you are asked: 'How many people attended the meeting?' You should listen for ___", "opts": ["the place of the meeting", "the reason for the meeting", "the speaker's name", "a number"], "ans": 3, "sol": ["Match your listening to the question word: <i>how many</i> ⇒ a number; <i>where</i> ⇒ a place; <i>why</i> ⇒ a reason."], "tip": null, "fig": null, "id": "listen-5", "topic": "listen"}, {"type": "thy", "q": "(a) Give a suitable spoken response to each: (i) 'May I use your pen?' (ii) 'Thank you for your help.' (iii) 'How do you do?' (iv) 'Would you like some water?' (v) 'Excuse me, is this seat taken?'<br>(b) State two things you should do before the listening test begins, and two while it is going on.", "sol": ["(a)(i) <b>Certainly / Please do.</b>  (ii) <b>You're welcome / Don't mention it.</b>  (iii) <b>How do you do?</b> (it is a greeting, not a real question).  (iv) <b>Yes, please / No, thank you.</b>  (v) <b>No, it's free — please sit down.</b>", "(b) <b>Before:</b> read the questions and the options quickly so you know what to listen for; settle down and shut out noise.", "<b>During:</b> listen for the key word in each question and mark your answer at once; if you miss one, leave it and move on rather than losing the next question too."], "marks": 10, "tip": null, "fig": null, "id": "listen-6", "topic": "listen"}], "syllabus": [{"section": "Paper 1 — Lexis and Structure (objective test)", "items": [{"t": "Synonyms and word choice in context", "topic": "syn"}, {"t": "Antonyms and opposites, including negative prefixes", "topic": "ant"}, {"t": "Idioms, proverbs and collocations", "topic": "idiom"}, {"t": "Registers: vocabulary of about sixteen fields of work", "topic": "reg"}, {"t": "Word formation, affixes and commonly confused words", "topic": "form"}, {"t": "Figures of speech and literary devices", "topic": "fig"}, {"t": "Tenses and the sequence of tenses", "topic": "tense"}, {"t": "Concord (subject–verb agreement)", "topic": "concord"}, {"t": "Nouns, pronouns and determiners", "topic": "pron"}, {"t": "Prepositions and phrasal verbs", "topic": "prep"}, {"t": "Adjectives, adverbs and degrees of comparison", "topic": "adj"}, {"t": "Question tags, conditionals and reported speech", "topic": "tags"}, {"t": "Phrases, clauses and sentence types", "topic": "clause"}, {"t": "Punctuation, capitalisation and spelling", "topic": "punct"}, {"t": "Active and passive voice", "topic": "voice"}, {"t": "Common errors and sentence improvement", "topic": "errors"}]}, {"section": "Paper 2 — Essay, Comprehension and Summary", "items": [{"t": "Essay writing: letters, narrative, descriptive, argumentative, expository", "topic": "essay"}, {"t": "Reports, speeches and articles", "topic": "report"}, {"t": "Reading comprehension: meaning, inference, grammatical names and functions", "topic": "comp"}, {"t": "Summary writing: selecting and restating points", "topic": "summary"}]}, {"section": "Paper 3 — Test of Orals", "items": [{"t": "Vowels, diphthongs and rhymes", "topic": "vowel"}, {"t": "Consonants, consonant clusters and silent letters", "topic": "cons"}, {"t": "Word stress, emphatic stress and intonation", "topic": "stress"}, {"t": "Listening comprehension and appropriate spoken responses", "topic": "listen"}]}]}, {"id": "science", "name": "Integrated Science", "dot": "#1AA189", "sub": "228 original practice questions with full explanations — WAEC Integrated Science syllabus. Not official past papers.", "cfg": {"objSolLabel": "Explanation", "objSolBtn": "explanation", "thySolLabel": "Answer guide", "thySolBtn": "answer guide", "mockTab": "Mock Paper 1", "mockN": 50, "mockMins": 60, "quickN": 20, "quickMins": 25, "mockBlurb": "50 objective questions in 1 hour — the shape of WAEC Paper 1. Questions are drawn at random from all five syllabus themes, and the paper is marked as soon as you submit.", "paperNote": "Paper 1 carries 50 of the 190 marks for Integrated Science.", "theoryNote": "Answer on paper first, then compare. In Paper 2, points must be stated in full sentences, and labelled diagrams earn marks.", "about": "<b>About these questions.</b> They are original practice questions written to the WAEC Integrated Science syllabus and to the format of Paper 1 (50 objectives, 1 h), Paper 2 (six essay questions, answer four, 1½ h) and Paper 3 (practical, 2 h). They are <b>not</b> reproductions of past WASSCE papers — for those, use WAEC's own e-learning portal and the past-question booklets sold by WAEC Ghana."}, "topics": [{"id": "measure", "name": "Science & measurement", "section": "Diversity of Matter", "notes": ["SI base units: metre (length), kilogram (mass), second (time), kelvin (temperature), ampere (current), mole (amount).", "Density = mass ÷ volume. Units: g/cm³ or kg/m³.  1 g/cm³ = 1000 kg/m³", "Volume of an irregular solid = volume of water displaced (use a eureka can or measuring cylinder).", "Instruments: vernier callipers (small lengths), micrometer screw gauge (wire diameter), beam balance (mass), stop-watch (time).", "The scientific method: observation → hypothesis → experiment → results → conclusion."], "plain": "Measurement is about numbers WITH units. Every answer needs the right unit — 5 alone means nothing, but 5 g/cm³ does. Density simply tells you how heavy something is for its size.", "examples": [{"q": "A piece of metal has a mass of 135 g and a volume of 50 cm³. Find its density.", "steps": ["Step 1. Write the formula: density = mass ÷ volume.", "Step 2. Put in the numbers: 135 ÷ 50.", "Step 3. = <b>2.7 g/cm³</b> (this is the density of aluminium)."], "fig": null}, {"q": "How would you find the volume of a stone in the laboratory?", "steps": ["Step 1. Pour water into a measuring cylinder and read the level, say 50 cm³.", "Step 2. Tie the stone with thread and lower it gently into the water.", "Step 3. Read the new level, say 68 cm³.", "Step 4. Volume of stone = 68 − 50 = <b>18 cm³</b> — the water it pushed out."], "fig": null}], "fig": "<svg viewBox=\"0 0 514 96\" class=\"dia\" role=\"img\" aria-label=\"Steps of the scientific method\" style=\"width:min(100%,520px)\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5.5\" markerHeight=\"5.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dah\"/></marker></defs><text x=\"257.0\" y=\"15.0\" class=\"dmut\" text-anchor=\"middle\" style=\"font-size:12px\">The scientific method</text><rect x=\"10\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"62.0\" y=\"56.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Observation</text><rect x=\"140\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"192.0\" y=\"56.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Hypothesis</text><line x1=\"117.0\" y1=\"53.0\" x2=\"136.0\" y2=\"53.0\" class=\"dline\" marker-end=\"url(#ah)\"/><rect x=\"270\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"322.0\" y=\"56.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Experiment</text><line x1=\"247.0\" y1=\"53.0\" x2=\"266.0\" y2=\"53.0\" class=\"dline\" marker-end=\"url(#ah)\"/><rect x=\"400\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"452.0\" y=\"56.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Conclusion</text><line x1=\"377.0\" y1=\"53.0\" x2=\"396.0\" y2=\"53.0\" class=\"dline\" marker-end=\"url(#ah)\"/></svg>"}, {"id": "living", "name": "Living & non-living things", "section": "Diversity of Matter", "notes": ["Characteristics of living things: Movement, Respiration, Sensitivity, Growth, Reproduction, Excretion, Nutrition (MRS GREN).", "Non-living things may show one or two of these (a car moves, a crystal 'grows') but never all of them.", "Plants and animals differ in nutrition (plants make their own food), movement, growth and response.", "Irritability (sensitivity) is the ability to respond to a stimulus."], "plain": "Living things do seven things: Move, Respire, Sense, Grow, Reproduce, Excrete and feed (Nutrition) — remember MRS GREN. A thing is only alive if it does ALL seven.", "examples": [{"q": "Is a motor car a living thing? Give reasons.", "steps": ["Step 1. Check the list. A car moves, uses fuel (like feeding) and gives out exhaust gases (like excreting).", "Step 2. But it cannot grow by itself, cannot reproduce, and cannot respond to a stimulus on its own.", "Step 3. Because it fails some of the seven, a car is <b>not a living thing</b>."], "fig": null}, {"q": "Give two ways a maize plant differs from a goat.", "steps": ["Step 1. Feeding: the maize makes its own food by photosynthesis; the goat eats ready-made food.", "Step 2. Movement: the maize is fixed in one place; the goat moves about freely.", "Step 3. (Also: plant cells have a cell wall and chloroplasts; the plant keeps growing at its tips all its life.)"], "fig": null}]}, {"id": "classify", "name": "Classification of living things", "section": "Diversity of Matter", "notes": ["Order of classification: Kingdom → Phylum → Class → Order → Family → Genus → Species.", "Five kingdoms: Monera (bacteria), Protista, Fungi, Plantae, Animalia.", "Vertebrates: fish, amphibians, reptiles, birds, mammals.", "Binomial name: genus (capital) + species (small letters), e.g. <i>Homo sapiens</i>, written in italics or underlined.", "Arthropods have jointed legs and an exoskeleton: insects (3 body parts, 6 legs), arachnids (2 parts, 8 legs), crustaceans, myriapods."], "plain": "Classification is grouping living things by what they have in common, so that the millions of species can be studied in an orderly way. The groups go from big to small: kingdom down to species.", "examples": [{"q": "An animal has a hard outer covering, three body parts and six legs. Classify it.", "steps": ["Step 1. A hard outer covering (exoskeleton) and jointed legs ⇒ phylum Arthropoda.", "Step 2. Three body parts (head, thorax, abdomen) and six legs ⇒ class <b>Insecta</b>.", "Step 3. An animal with two body parts and eight legs would be an arachnid, such as a spider."], "fig": null}, {"q": "Why is the name <i>Zea mays</i> written that way?", "steps": ["Step 1. Every organism has a two-word scientific name — the binomial system.", "Step 2. The first word is the GENUS and starts with a capital letter: <i>Zea</i>.", "Step 3. The second is the SPECIES, in small letters: <i>mays</i>. Both are printed in italics or underlined when handwritten."], "fig": null}], "fig": "<svg viewBox=\"0 0 904 96\" class=\"dia\" role=\"img\" aria-label=\"Order of classification\" style=\"width:min(100%,520px)\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5.5\" markerHeight=\"5.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dah\"/></marker></defs><text x=\"452.0\" y=\"15.0\" class=\"dmut\" text-anchor=\"middle\" style=\"font-size:12px\">From the largest group to the smallest</text><rect x=\"10\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"62.0\" y=\"56.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Kingdom</text><rect x=\"140\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"192.0\" y=\"56.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Phylum</text><line x1=\"117.0\" y1=\"53.0\" x2=\"136.0\" y2=\"53.0\" class=\"dline\" marker-end=\"url(#ah)\"/><rect x=\"270\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"322.0\" y=\"56.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Class</text><line x1=\"247.0\" y1=\"53.0\" x2=\"266.0\" y2=\"53.0\" class=\"dline\" marker-end=\"url(#ah)\"/><rect x=\"400\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"452.0\" y=\"56.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Order</text><line x1=\"377.0\" y1=\"53.0\" x2=\"396.0\" y2=\"53.0\" class=\"dline\" marker-end=\"url(#ah)\"/><rect x=\"530\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"582.0\" y=\"56.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Family</text><line x1=\"507.0\" y1=\"53.0\" x2=\"526.0\" y2=\"53.0\" class=\"dline\" marker-end=\"url(#ah)\"/><rect x=\"660\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"712.0\" y=\"56.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Genus</text><line x1=\"637.0\" y1=\"53.0\" x2=\"656.0\" y2=\"53.0\" class=\"dline\" marker-end=\"url(#ah)\"/><rect x=\"790\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"842.0\" y=\"56.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Species</text><line x1=\"767.0\" y1=\"53.0\" x2=\"786.0\" y2=\"53.0\" class=\"dline\" marker-end=\"url(#ah)\"/></svg>"}, {"id": "cells", "name": "Cells & their structures", "section": "Diversity of Matter", "notes": ["The cell is the basic unit of life. Cell → tissue → organ → system → organism.", "Plant cells have a cellulose cell wall, chloroplasts and a large permanent vacuole; animal cells do not.", "Nucleus controls the cell; mitochondria release energy; ribosomes make protein; the cell membrane controls what enters and leaves.", "Osmosis is the movement of water from a dilute to a concentrated solution through a semi-permeable membrane.", "Diffusion is the movement of particles from a region of higher to lower concentration."], "plain": "All living things are made of cells — tiny building blocks. A plant cell has a stiff wall, chloroplasts for making food and a big water bag (vacuole); an animal cell has none of these three.", "examples": [{"q": "Name three structures found in a plant cell but not in an animal cell, and say what each does.", "steps": ["Step 1. <b>Cell wall</b> — made of cellulose; gives the cell shape and support.", "Step 2. <b>Chloroplast</b> — contains chlorophyll and traps sunlight for photosynthesis.", "Step 3. <b>Large permanent vacuole</b> — stores cell sap and keeps the cell firm."], "fig": "<svg viewBox=\"0 0 320 210\" class=\"dia\" role=\"img\" aria-label=\"Plant cell\" style=\"width:min(100%,368px)\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5.5\" markerHeight=\"5.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dah\"/></marker></defs><rect x=\"24\" y=\"24\" width=\"270\" height=\"160\" rx=\"10\" class=\"dfill\"/><rect x=\"34\" y=\"34\" width=\"250\" height=\"140\" rx=\"8\" class=\"dbox\"/><ellipse cx=\"110\" cy=\"100\" rx=\"26\" ry=\"22\" class=\"dfill\" fill-opacity=\"0.8\"/><text x=\"110.0\" y=\"104.0\" class=\"dmut\" text-anchor=\"middle\">nucleus</text><rect x=\"160\" y=\"70\" width=\"96\" height=\"62\" rx=\"8\" class=\"dbox\"/><text x=\"208.0\" y=\"104.0\" class=\"dmut\" text-anchor=\"middle\">vacuole</text><ellipse cx=\"78\" cy=\"146\" rx=\"22\" ry=\"11\" class=\"dfill\" fill-opacity=\"0.9\"/><text x=\"78.0\" y=\"168.0\" class=\"dmut\" text-anchor=\"middle\">chloroplast</text><text x=\"150.0\" y=\"18.0\" class=\"dmut\" text-anchor=\"middle\">cell wall (outer) · cell membrane (inner)</text><text x=\"150.0\" y=\"200.0\" class=\"dmut\" text-anchor=\"middle\">cytoplasm fills the rest of the cell</text></svg>"}, {"q": "A piece of cassava placed in strong salt solution becomes soft. Explain why.", "steps": ["Step 1. The cell sap inside the cassava is less concentrated than the salt solution outside.", "Step 2. Water moves out of the cells, through the semi-permeable membrane, into the stronger solution.", "Step 3. This movement of water is <b>osmosis</b>; the cells lose water and the tissue becomes soft (flaccid)."], "fig": "<svg viewBox=\"0 0 320 210\" class=\"dia\" role=\"img\" aria-label=\"Animal cell for comparison\" style=\"width:min(100%,368px)\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5.5\" markerHeight=\"5.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dah\"/></marker></defs><ellipse cx=\"160\" cy=\"104\" rx=\"130\" ry=\"76\" class=\"dfill\"/><ellipse cx=\"150\" cy=\"100\" rx=\"30\" ry=\"25\" class=\"dbox\"/><text x=\"150.0\" y=\"104.0\" class=\"dmut\" text-anchor=\"middle\">nucleus</text><ellipse cx=\"236\" cy=\"132\" rx=\"22\" ry=\"11\" class=\"dbox\"/><text x=\"236.0\" y=\"136.0\" class=\"dmut\" text-anchor=\"middle\" style=\"font-size:8px\">mitochondrion</text><text x=\"160.0\" y=\"22.0\" class=\"dmut\" text-anchor=\"middle\">cell membrane (no cell wall)</text><text x=\"160.0\" y=\"196.0\" class=\"dmut\" text-anchor=\"middle\">cytoplasm — no chloroplasts, no large vacuole</text></svg>"}]}, {"id": "matter", "name": "Matter, elements, compounds & mixtures", "section": "Diversity of Matter", "notes": ["Matter is anything that has mass and occupies space; it exists as solid, liquid or gas.", "An atom has protons (+) and neutrons in the nucleus, with electrons (−) in shells: 2, 8, 8…", "Atomic number = number of protons; mass number = protons + neutrons.", "A compound's parts are chemically combined in fixed proportions; a mixture's are not, and can be separated physically.", "Separation: filtration (insoluble solid), evaporation/crystallisation (dissolved solid), distillation (solvent), chromatography (dyes), magnet (iron)."], "plain": "Everything around you is matter. An element is made of one kind of atom; a compound is two or more elements chemically joined; a mixture is just things put together and can be separated physically.", "examples": [{"q": "An atom of an element has 19 protons and 20 neutrons. State its atomic number, mass number and electron arrangement.", "steps": ["Step 1. Atomic number = number of protons = <b>19</b>.", "Step 2. Mass number = protons + neutrons = 19 + 20 = <b>39</b>.", "Step 3. Fill the shells 2, 8, 8, then what is left: <b>2, 8, 8, 1</b>.", "Step 4. One electron in the outer shell ⇒ Group I (it is potassium)."], "fig": null}, {"q": "How would you separate a mixture of sand, salt and iron filings?", "steps": ["Step 1. Run a magnet over the mixture — the <b>iron filings</b> stick to it.", "Step 2. Add water and stir: the salt dissolves, the sand does not. Filter — the <b>sand</b> stays on the paper.", "Step 3. Evaporate the filtrate to get the <b>salt</b> back."], "fig": null}]}, {"id": "acids", "name": "Acids, bases & salts", "section": "Diversity of Matter", "notes": ["Acids turn blue litmus red, have pH below 7 and react with metals to give hydrogen.", "Bases (alkalis when soluble) turn red litmus blue and have pH above 7.", "Acid + base → salt + water (neutralisation);  acid + carbonate → salt + water + carbon dioxide.", "pH 7 is neutral (pure water). The lower the pH, the stronger the acid.", "Everyday acids: citric (citrus), acetic (vinegar), lactic (sour milk), tannic (tea). Bases: wood ash, lime, caustic soda, antacids."], "plain": "Acids taste sour (lime, vinegar) and turn blue litmus red. Bases are their opposites and feel soapy. When they meet they cancel each other out — that is neutralisation.", "examples": [{"q": "You are given three solutions, A (pH 2), B (pH 7) and C (pH 12). Describe each.", "steps": ["Step 1. Below 7 is acidic: <b>A is an acid</b>, and pH 2 means a strong one.", "Step 2. Exactly 7 is <b>neutral</b> — B could be pure water.", "Step 3. Above 7 is basic (alkaline): <b>C is a strong base</b>, such as caustic soda solution."], "fig": null}, {"q": "A farmer's soil is too acidic. What should he add, and why?", "steps": ["Step 1. To cancel an acid you need a base.", "Step 2. The cheap farm base is <b>lime</b> (calcium hydroxide or ground limestone).", "Step 3. It neutralises the acid, raising the pH so that crops can take up nutrients properly."], "fig": null}]}, {"id": "metals", "name": "Metals, non-metals & rusting", "section": "Diversity of Matter", "notes": ["Metals are shiny, malleable, ductile and good conductors; non-metals are usually dull, brittle and poor conductors (graphite is the exception).", "Rusting of iron needs BOTH oxygen and water; salt speeds it up.", "Rust is hydrated iron(III) oxide.", "Rusting is prevented by painting, oiling/greasing, galvanising (zinc coating), electroplating, and alloying to make stainless steel.", "Alloys: brass = copper + zinc;  bronze = copper + tin;  steel = iron + carbon."], "plain": "Metals are shiny, bend without breaking and carry heat and electricity well. Their big enemy is rusting, which needs BOTH air and water — remove either one and iron will not rust.", "examples": [{"q": "Why does a bicycle chain rust quickly in the rainy season but not when it is oiled?", "steps": ["Step 1. Rusting needs oxygen (from the air) and water together.", "Step 2. In the rainy season both are present, so rusting is fast.", "Step 3. Oil forms a layer that keeps air and water away from the metal, so rusting is prevented."], "fig": null}, {"q": "Name three ways of preventing rusting and where each is used.", "steps": ["Step 1. <b>Painting</b> — roofing sheets, bridges, vehicle bodies.", "Step 2. <b>Oiling or greasing</b> — machine parts and chains.", "Step 3. <b>Galvanising</b> (coating with zinc) — buckets, nails and roofing sheets."], "fig": null}]}, {"id": "water", "name": "Water & solutions", "section": "Diversity of Matter", "notes": ["Water is a universal solvent; pure water boils at 100 °C and freezes at 0 °C at sea level.", "Hard water contains dissolved calcium and magnesium salts, wastes soap and forms scum.", "Temporary hardness (hydrogen carbonates) is removed by boiling; permanent hardness (sulphates) needs washing soda or an ion-exchange resin.", "A solution = solute + solvent. Saturated solution: no more solute will dissolve at that temperature.", "Water treatment: sedimentation → coagulation (alum) → filtration → chlorination."], "plain": "Water dissolves more substances than any other liquid. Hard water contains dissolved calcium and magnesium salts, which fight with soap and waste it.", "examples": [{"q": "How can you tell whether the water in a village is hard, and what can be done about it?", "steps": ["Step 1. Test: shake a little soap solution with the water. If it forms scum instead of lather, it is hard.", "Step 2. Temporary hardness is removed by <b>boiling</b>.", "Step 3. Permanent hardness needs <b>washing soda</b> or an ion-exchange (water softener) unit."], "fig": null}, {"q": "Describe how water from a river is treated for town supply.", "steps": ["Step 1. Screening removes sticks and rubbish; sedimentation lets heavy particles settle.", "Step 2. Alum is added so that fine particles clump together and settle (coagulation).", "Step 3. The water is filtered through sand and gravel, then chlorinated to kill germs before storage."], "fig": "<svg viewBox=\"0 0 514 96\" class=\"dia\" role=\"img\" aria-label=\"Water treatment stages\" style=\"width:min(100%,520px)\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5.5\" markerHeight=\"5.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dah\"/></marker></defs><text x=\"257.0\" y=\"15.0\" class=\"dmut\" text-anchor=\"middle\" style=\"font-size:12px\">Treating water for town supply</text><rect x=\"10\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"62.0\" y=\"56.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Sedimentation</text><rect x=\"140\" y=\"24\" width=\"104\" heigh
