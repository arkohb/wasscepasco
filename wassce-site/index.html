 them.", "3. It provides an orderly and peaceful way of choosing and changing governments, which promotes stability.", "4. It is the supreme law, so any law or act inconsistent with it is void; this makes the state predictable and attracts investment.", "(c) An independent judiciary, with judges protected in their tenure and conditions of service; the right of any citizen to go to court to enforce a right or challenge an unlawful act; institutions such as CHRAJ, the Auditor-General and a free press that expose abuses; equality before the law, so that public officers are also prosecuted when they break the law; public education on rights and duties by the National Commission for Civic Education."], "marks": 20, "tip": null, "fig": null, "id": "constit-6", "topic": "constit"}, {"type": "obj", "q": "Which of these is a way of acquiring Ghanaian citizenship?", "opts": ["Naturalisation", "Employment in the civil service", "Attending school in Ghana", "Owning land in Ghana"], "ans": 0, "sol": ["Citizenship may be acquired by birth, descent, registration (as by marriage) or naturalisation."], "tip": null, "fig": null, "id": "citizen-1", "topic": "citizen"}, {"type": "obj", "q": "Which of the following is a DUTY rather than a right of a citizen?", "opts": ["Freedom of worship", "Fair trial", "Paying taxes", "Freedom of speech"], "ans": 2, "sol": ["The other three are rights; paying tax is an obligation the citizen owes the state."], "tip": null, "fig": null, "id": "citizen-2", "topic": "citizen"}, {"type": "obj", "q": "The body responsible for educating Ghanaians on their civic rights and responsibilities is the ___", "opts": ["Electoral Commission", "National Media Commission", "National Commission for Civic Education", "Ghana Education Service"], "ans": 2, "sol": ["The NCCE has the constitutional duty to create awareness of the Constitution and to educate citizens on civic responsibilities."], "tip": null, "fig": null, "id": "citizen-3", "topic": "citizen"}, {"type": "obj", "q": "The rights of a citizen may be limited when ___", "opts": ["the citizen is poor", "an election is approaching", "the citizen belongs to a minority group", "their exercise threatens public safety or the rights of others"], "ans": 3, "sol": ["Rights are exercised subject to the law and to respect for the rights and freedoms of others."], "tip": null, "fig": null, "id": "citizen-4", "topic": "citizen"}, {"type": "obj", "q": "A citizen who sees a public official taking a bribe should ___", "opts": ["demand a share of the money", "report it to the appropriate authority", "spread it only on social media as a rumour", "keep quiet to avoid trouble"], "ans": 1, "sol": ["Reporting to CHRAJ, the police, the Office of the Special Prosecutor or an anti-corruption hotline is the responsible civic action."], "tip": null, "fig": null, "id": "citizen-5", "topic": "citizen"}, {"type": "thy", "q": "(a) State four ways of acquiring citizenship.<br>(b) Explain four rights and four responsibilities of a Ghanaian citizen.<br>(c) Explain why rights go with responsibilities.", "sol": ["(a) By <b>birth</b> (born in Ghana with a Ghanaian parent or grandparent); by <b>descent</b> (born outside Ghana to a Ghanaian parent); by <b>registration</b> (as by marriage to a Ghanaian); by <b>naturalisation</b> (a foreigner who satisfies the legal requirements and is granted citizenship); and by <b>adoption</b> of a child by Ghanaian citizens.", "(b) <b>Rights:</b> the right to life and personal liberty; the right to education; freedom of speech, assembly and worship; the right to own property and to a fair trial; the right to vote and be voted for.", "<b>Responsibilities:</b> obeying the laws of the land; paying taxes honestly and promptly; protecting public property and the environment; defending the nation and voting in elections; respecting the rights and dignity of other people.", "(c) Rights are exercised in a society where others hold the same rights. If citizens enjoy rights without performing duties, the state will lack the taxes, order and public spirit needed to provide the schools, courts, security and services that make those rights real. For example, the right to education depends on citizens paying taxes, and free speech is possible only if others' dignity is respected."], "marks": 20, "tip": null, "fig": null, "id": "citizen-6", "topic": "citizen"}, {"type": "obj", "q": "The arm of government responsible for making laws is the ___", "opts": ["Council of State", "Executive", "Judiciary", "Legislature"], "ans": 3, "sol": ["Parliament makes, amends and repeals the laws of Ghana."], "tip": null, "fig": null, "id": "democracy-1", "topic": "democracy"}, {"type": "obj", "q": "The head of the Judiciary in Ghana is the ___", "opts": ["Speaker of Parliament", "Chief Justice", "Inspector-General of Police", "Attorney-General"], "ans": 1, "sol": ["The Chief Justice heads the Judiciary and presides over the Supreme Court."], "tip": null, "fig": null, "id": "democracy-2", "topic": "democracy"}, {"type": "obj", "q": "Which of these is a feature of a democratic government?", "opts": ["Censorship of all newspapers", "One-party rule with no opposition", "Rule by decree", "Periodic free and fair elections"], "ans": 3, "sol": ["Regular elections, the rule of law, human rights, a free press and an independent judiciary mark a democracy."], "tip": null, "fig": null, "id": "democracy-3", "topic": "democracy"}, {"type": "obj", "q": "A bill passed by Parliament becomes law only when it is ___", "opts": ["assented to by the President", "approved by the Council of State", "accepted by the district assemblies", "published in a newspaper"], "ans": 0, "sol": ["The President's assent turns a bill into an Act of Parliament."], "tip": null, "fig": null, "id": "democracy-4", "topic": "democracy"}, {"type": "obj", "q": "The Executive arm of government in Ghana is headed by the ___", "opts": ["Speaker of Parliament", "Chief Justice", "President", "Chief of Defence Staff"], "ans": 2, "sol": ["The President is Head of State, Head of Government and Commander-in-Chief of the Armed Forces."], "tip": null, "fig": null, "id": "democracy-5", "topic": "democracy"}, {"type": "thy", "q": "(a) What is democracy?<br>(b) Describe the functions of the three arms of government.<br>(c) Explain four ways in which Parliament checks the Executive.", "sol": ["(a) Democracy is a system of government in which power belongs to the people, who exercise it directly or through freely elected representatives, under the rule of law and with respect for the rights of all.", "(b) <b>The Executive</b> (President, Vice-President, ministers and the civil service) implements laws and policies, maintains law and order, conducts foreign relations and prepares the national budget.", "<b>The Legislature</b> (Parliament) makes, amends and repeals laws, approves taxes and government spending, ratifies treaties and international agreements, and scrutinises the work of ministers.", "<b>The Judiciary</b> (the courts, headed by the Chief Justice) interprets the Constitution and the laws, settles disputes between persons and between persons and the state, and protects the rights of citizens.", "(c) It approves or rejects the budget and any new taxes; it vets and approves the President's ministerial nominees; its committees summon ministers and public officers to answer questions and examine the Auditor-General's reports; it can pass a vote of censure on a minister; and it must approve loans and international agreements before they take effect."], "marks": 20, "tip": null, "fig": null, "id": "democracy-6", "topic": "democracy"}, {"type": "obj", "q": "The body responsible for conducting public elections in Ghana is the ___", "opts": ["National Commission for Civic Education", "Electoral Commission", "National Media Commission", "Ghana Police Service"], "ans": 1, "sol": ["The EC compiles the register and conducts and supervises elections and referenda."], "tip": null, "fig": null, "id": "elect-1", "topic": "elect"}, {"type": "obj", "q": "The minimum age for voting in Ghana is ___ years.", "opts": ["16", "18", "21", "25"], "ans": 1, "sol": ["Every citizen aged 18 years and above and of sound mind is entitled to be registered and to vote."], "tip": null, "fig": null, "id": "elect-2", "topic": "elect"}, {"type": "obj", "q": "For a candidate to be declared president of Ghana in the first round, he or she must obtain ___", "opts": ["more than 50% of the valid votes cast", "two-thirds of the seats in Parliament", "the highest number of votes, however small", "40% of the votes cast"], "ans": 0, "sol": ["If no candidate exceeds 50%, a second election (run-off) is held between the two leading candidates."], "tip": null, "fig": null, "id": "elect-3", "topic": "elect"}, {"type": "obj", "q": "Which of these is an electoral malpractice?", "opts": ["Holding a rally after obtaining police notice", "Campaigning peacefully from house to house", "Buying votes with money or gifts", "Displaying posters in approved places"], "ans": 2, "sol": ["Vote buying, impersonation, multiple voting, intimidation and ballot stuffing are offences."], "tip": null, "fig": null, "id": "elect-4", "topic": "elect"}, {"type": "obj", "q": "Apart from voting, a citizen can participate in politics by ___", "opts": ["boycotting all public meetings", "attacking supporters of other parties", "attending rallies and joining a political party", "refusing to pay taxes"], "ans": 2, "sol": ["Participation includes joining a party, standing for office, attending town hall meetings, serving as a polling agent and taking part in public debate."], "tip": null, "fig": null, "id": "elect-5", "topic": "elect"}, {"type": "thy", "q": "(a) State four functions of the Electoral Commission of Ghana.<br>(b) Explain four ways in which citizens can participate in the governance of their country.<br>(c) State four effects of electoral malpractices on a country.", "sol": ["(a) Compiling and revising the register of voters; demarcating electoral boundaries; conducting and supervising presidential, parliamentary, district assembly elections and referenda; educating the public on the electoral process; and declaring the results of elections.", "(b) 1. <b>Voting</b> in national and district level elections and referenda.", "2. <b>Joining a political party or standing for office</b> as an assembly member, MP or president.", "3. <b>Attending town hall meetings, durbars and public hearings</b> and making inputs into policies and by-laws.", "4. <b>Holding leaders accountable</b> through the media, civil society organisations, peaceful demonstrations and petitions.", "(c) It produces leaders who do not represent the true will of the people; it causes mistrust, tension and sometimes violence; it discourages honest people from contesting and citizens from voting; and it damages the country's image, scaring away investors and development partners."], "marks": 20, "tip": null, "fig": null, "id": "elect-6", "topic": "elect"}, {"type": "obj", "q": "The highest political and administrative authority in a district is the ___", "opts": ["traditional council", "regional minister", "district assembly", "district court"], "ans": 2, "sol": ["The assembly makes by-laws, plans and budgets for the district and supervises the departments there."], "tip": null, "fig": null, "id": "local-1", "topic": "local"}, {"type": "obj", "q": "The District Chief Executive is ___", "opts": ["nominated by the President and approved by the assembly", "appointed by the chief of the area", "chosen by the district court", "elected by all voters in the district"], "ans": 0, "sol": ["The nominee must be approved by at least two-thirds of the members of the assembly present and voting."], "tip": null, "fig": null, "id": "local-2", "topic": "local"}, {"type": "obj", "q": "The main source of funds for development projects at the district level is the ___", "opts": ["Social Security Fund", "District Assembly Common Fund", "National Health Insurance Fund", "Ghana Education Trust Fund"], "ans": 1, "sol": ["The Common Fund is a percentage of total national revenue shared among the assemblies, though they also raise rates, fees, licences and levies."], "tip": null, "fig": null, "id": "local-3", "topic": "local"}, {"type": "obj", "q": "One advantage of decentralisation is that it ___", "opts": ["removes the need for taxes", "brings decision-making closer to the people", "abolishes traditional authority", "increases the powers of the President"], "ans": 1, "sol": ["Local people can identify their own priorities and monitor projects, and services are delivered faster."], "tip": null, "fig": null, "id": "local-4", "topic": "local"}, {"type": "obj", "q": "Which of these is a function of the district assembly?", "opts": ["Printing the national currency", "Conducting the population census", "Providing sanitation and basic infrastructure", "Appointing the Chief Justice"], "ans": 2, "sol": ["Assemblies handle roads, markets, sanitation, schools, clinics, by-laws and revenue collection in the district."], "tip": null, "fig": null, "id": "local-5", "topic": "local"}, {"type": "thy", "q": "(a) What is decentralisation?<br>(b) State four functions of a district assembly.<br>(c) Explain four problems facing district assemblies in Ghana and suggest a solution to each.", "sol": ["(a) Decentralisation is the transfer of political, administrative and financial power, functions and responsibilities from the central government to local government units such as the metropolitan, municipal and district assemblies, so that people take part in decisions that affect them.", "(b) Making and enforcing by-laws for the district; preparing and executing development plans and budgets; providing and maintaining basic infrastructure such as roads, markets, schools, clinics and sanitation; mobilising revenue through rates, fees and licences; maintaining security and resolving local conflicts with the security agencies; supervising the decentralised departments.", "(c) <b>Inadequate funds</b> — improve internal revenue mobilisation and ensure timely release of the Common Fund. <b>Delay in the release of the Common Fund</b> — enforce the statutory timelines and publish the disbursements. <b>Shortage of qualified staff</b> — provide better conditions of service and training for district staff. <b>Political interference and apathy</b> — educate citizens to attend assembly meetings, and let assembly members report back regularly to their electorate."], "marks": 20, "tip": null, "fig": null, "id": "local-6", "topic": "local"}, {"type": "obj", "q": "Which of these is a quality of a good leader?", "opts": ["Selfishness", "Intolerance of criticism", "Accountability", "Dishonesty"], "ans": 2, "sol": ["A good leader accounts for decisions and for the resources entrusted to him or her."], "tip": null, "fig": null, "id": "leader-1", "topic": "leader"}, {"type": "obj", "q": "A leader who takes decisions alone without consulting members practises ___ leadership.", "opts": ["democratic", "autocratic", "collective", "laissez-faire"], "ans": 1, "sol": ["An autocratic (dictatorial) leader imposes decisions; a democratic leader consults."], "tip": null, "fig": null, "id": "leader-2", "topic": "leader"}, {"type": "obj", "q": "Accountability in public office means that an official ___", "opts": ["keeps all information secret", "does whatever the majority wants", "shares public funds among supporters", "explains and takes responsibility for how resources are used"], "ans": 3, "sol": ["Officials must answer for their decisions and for public funds, to Parliament, the Auditor-General and the people."], "tip": null, "fig": null, "id": "leader-3", "topic": "leader"}, {"type": "obj", "q": "Which of the following shows good followership?", "opts": ["Offering honest advice to a leader", "Spreading rumours about the leader", "Flattering the leader at all times", "Ignoring the rules of the group"], "ans": 0, "sol": ["Good followers support the leader but tell the truth and criticise constructively."], "tip": null, "fig": null, "id": "leader-4", "topic": "leader"}, {"type": "obj", "q": "Bad leadership in a country most often results in ___", "opts": ["improved public services", "mismanagement of resources and loss of public trust", "rapid development", "increased foreign investment"], "ans": 1, "sol": ["Where leaders are dishonest or incompetent, projects fail, resources are wasted and citizens lose confidence in the state."], "tip": null, "fig": null, "id": "leader-5", "topic": "leader"}, {"type": "thy", "q": "(a) Distinguish between leadership and followership.<br>(b) State and explain four qualities of a good leader.<br>(c) Explain four effects of bad leadership on national development.", "sol": ["(a) <b>Leadership</b> is the ability to influence, guide and organise others towards the achievement of a common goal. <b>Followership</b> is the willingness of members to accept direction, co-operate with the leader and contribute to the goal, while offering honest advice.", "(b) 1. <b>Honesty and integrity</b> — the leader can be trusted with public funds and speaks the truth.", "2. <b>Vision</b> — the leader sees ahead, sets clear goals and inspires others to work towards them.", "3. <b>Tolerance and good human relations</b> — the leader accepts criticism and treats all members fairly, regardless of background.", "4. <b>Accountability and discipline</b> — the leader renders account of stewardship and sets an example by obeying the rules.", "(c) Public funds are misapplied, so schools, hospitals and roads are not provided; corruption spreads because those below copy the leader; qualified people are frustrated and may leave the country; investors and development partners lose confidence; and citizens become apathetic or resort to agitation, which threatens stability."], "marks": 20, "tip": null, "fig": null, "id": "leader-6", "topic": "leader"}, {"type": "obj", "q": "The most common cause of conflict in many Ghanaian communities is ___", "opts": ["national festivals", "market days", "the presence of schools", "chieftaincy and land disputes"], "ans": 3, "sol": ["Succession to skins and stools, and disputes over land boundaries and ownership, cause most local conflicts."], "tip": null, "fig": null, "id": "conflict-1", "topic": "conflict"}, {"type": "obj", "q": "Settling a dispute through the help of a neutral third party who helps the parties reach their own agreement is ___", "opts": ["mediation", "arbitration", "adjudication", "litigation"], "ans": 0, "sol": ["A mediator guides discussion but does not impose a decision; an arbitrator gives a binding award, and a judge adjudicates."], "tip": null, "fig": null, "id": "conflict-2", "topic": "conflict"}, {"type": "obj", "q": "Which of these is an effect of prolonged conflict in a community?", "opts": ["Increased school enrolment", "Destruction of lives and property", "Improvement in health care", "More investment in the area"], "ans": 1, "sol": ["Conflict destroys lives, homes, schools and businesses, and drives investors and teachers away."], "tip": null, "fig": null, "id": "conflict-3", "topic": "conflict"}, {"type": "obj", "q": "The body established to deal with chieftaincy disputes in Ghana is the ___", "opts": ["House of Chiefs", "Electoral Commission", "Council of State", "Lands Commission"], "ans": 0, "sol": ["The National and Regional Houses of Chiefs have judicial committees that hear chieftaincy matters."], "tip": null, "fig": null, "id": "conflict-4", "topic": "conflict"}, {"type": "obj", "q": "Which of the following best prevents conflict in a multi-ethnic community?", "opts": ["Favouring the largest ethnic group", "Tolerance and equitable sharing of development projects", "Arming one group for self-defence", "Ignoring small disputes until they grow"], "ans": 1, "sol": ["Fairness and respect for differences, plus early handling of small disputes, keep communities peaceful."], "tip": null, "fig": null, "id": "conflict-5", "topic": "conflict"}, {"type": "thy", "q": "(a) What is conflict?<br>(b) Explain four causes of conflict in Ghanaian communities.<br>(c) Describe four ways of resolving conflicts peacefully.", "sol": ["(a) Conflict is a state of disagreement, struggle or clash between individuals or groups arising from differences in interests, values, needs, or competition over scarce resources such as land, power or money.", "(b) 1. <b>Chieftaincy disputes:</b> rival families or gates contest the right to a stool or skin.", "2. <b>Land and boundary disputes:</b> unclear boundaries, multiple sales of the same land and pressure from mining and farming.", "3. <b>Ethnic and religious intolerance:</b> disrespect for the customs, language or worship of other groups.", "4. <b>Political differences and unequal distribution of resources:</b> a feeling that one area or group is favoured with projects and appointments.", "(c) <b>Dialogue and negotiation:</b> the parties meet and talk directly to reach a compromise. <b>Mediation:</b> a respected neutral person, such as an elder or the National Peace Council, helps them reach their own agreement. <b>Arbitration:</b> the parties submit the matter to a person or panel whose decision they agree to accept. <b>Adjudication:</b> the dispute is taken to the courts or the judicial committee of the House of Chiefs for a legal decision. Education, early warning and fair enforcement of the law also prevent conflicts from starting."], "marks": 20, "tip": null, "fig": null, "id": "conflict-6", "topic": "conflict"}, {"type": "obj", "q": "Corruption can best be defined as ___", "opts": ["the failure of a business", "the payment of taxes", "the abuse of entrusted power for private gain", "poor management of time"], "ans": 2, "sol": ["Bribery, embezzlement, nepotism and extortion are all forms of abusing office for personal benefit."], "tip": null, "fig": null, "id": "corrupt-1", "topic": "corrupt"}, {"type": "obj", "q": "Which of these is a form of corruption?", "opts": ["Nepotism", "Promotion on merit", "Competitive tendering", "Delegation of duty"], "ans": 0, "sol": ["Nepotism is favouring relatives in appointments and contracts; the others are proper practices."], "tip": null, "fig": null, "id": "corrupt-2", "topic": "corrupt"}, {"type": "obj", "q": "Which institution investigates and prosecutes corruption-related offences involving public officers in Ghana?", "opts": ["The Office of the Special Prosecutor", "The Electoral Commission", "The National Media Commission", "The Ghana Standards Authority"], "ans": 0, "sol": ["The OSP investigates and prosecutes corruption and corruption-related offences; CHRAJ, EOCO and the Auditor-General also play roles."], "tip": null, "fig": null, "id": "corrupt-3", "topic": "corrupt"}, {"type": "obj", "q": "Which of the following would MOST reduce corruption in public procurement?", "opts": ["Awarding contracts to friends of officials", "Open, competitive tendering with published contracts", "Sole sourcing for all contracts", "Keeping contract details secret"], "ans": 1, "sol": ["Transparency and competition make it harder to inflate prices or award contracts improperly."], "tip": null, "fig": null, "id": "corrupt-4", "topic": "corrupt"}, {"type": "obj", "q": "A major effect of corruption on national development is that ___", "opts": ["schools receive more books", "taxes fall for everybody", "roads are built faster", "public funds meant for projects are diverted"], "ans": 3, "sol": ["Money meant for schools, hospitals and roads ends up in private pockets, so services suffer and citizens lose trust."], "tip": null, "fig": null, "id": "corrupt-5", "topic": "corrupt"}, {"type": "thy", "q": "(a) What is corruption? Name four forms of it.<br>(b) Explain four causes of corruption in Ghana.<br>(c) Suggest four measures for controlling corruption.", "sol": ["(a) Corruption is the abuse of entrusted power or public office for private gain. Forms: <b>bribery</b> (giving or taking money or favours to influence a decision), <b>embezzlement</b> (stealing funds placed in one's care), <b>nepotism and favouritism</b> (appointing relatives and friends rather than the best candidate), <b>extortion</b> (demanding payment for a service that is due), and <b>vote buying</b>.", "(b) 1. <b>Greed and love of wealth</b>, with a society that honours the rich without asking how they got their money.", "2. <b>Low salaries and poor conditions of service</b>, which tempt officials to take bribes.", "3. <b>Weak enforcement</b> — investigations are slow, cases drag in court and offenders are rarely punished.", "4. <b>Poor systems</b> — cash transactions, weak record keeping, too much discretion in the hands of individual officers and lack of transparency.", "(c) Strengthen and resource CHRAJ, the OSP, EOCO and the Auditor-General, and prosecute offenders promptly whoever they are; digitise services and payments so that transactions leave a record and fewer officials are met face to face; publish contracts, budgets and audit reports so that citizens can monitor them; protect whistle-blowers by law and reward them; and teach honesty and hard work in homes, schools and religious bodies."], "marks": 20, "tip": null, "fig": null, "id": "corrupt-6", "topic": "corrupt"}, {"type": "obj", "q": "ECOWAS was established in ___", "opts": ["1957", "2002", "1963", "1975"], "ans": 3, "sol": ["The Economic Community of West African States was formed by the Treaty of Lagos in 1975."], "tip": null, "fig": null, "id": "intl-1", "topic": "intl"}, {"type": "obj", "q": "The headquarters of the African Union is in ___", "opts": ["Accra", "Addis Ababa", "Abuja", "New York"], "ans": 1, "sol": ["The AU, which replaced the OAU in 2002, has its headquarters in Addis Ababa, Ethiopia."], "tip": null, "fig": null, "id": "intl-2", "topic": "intl"}, {"type": "obj", "q": "Which of these is a benefit Ghana derives from membership of ECOWAS?", "opts": ["Free movement of goods and people within the sub-region", "Automatic loans from the United Nations", "Exemption from paying taxes", "Control of the Ghanaian currency"], "ans": 0, "sol": ["ECOWAS promotes free movement, a common market, joint infrastructure and regional peacekeeping."], "tip": null, "fig": null, "id": "intl-3", "topic": "intl"}, {"type": "obj", "q": "Ghana's contribution to international peace is seen mainly in its ___", "opts": ["large army at home", "refusal to trade with other countries", "participation in United Nations peacekeeping missions", "importation of foreign goods"], "ans": 2, "sol": ["Ghanaian soldiers and police have served in peacekeeping operations in many countries, which also earns the country respect and income."], "tip": null, "fig": null, "id": "intl-4", "topic": "intl"}, {"type": "obj", "q": "The secretariat of the African Continental Free Trade Area is located in ___", "opts": ["Cairo", "Accra", "Nairobi", "Lagos"], "ans": 1, "sol": ["Ghana hosts the AfCFTA Secretariat in Accra."], "tip": null, "fig": null, "id": "intl-5", "topic": "intl"}, {"type": "thy", "q": "(a) Name four international organisations to which Ghana belongs.<br>(b) Explain four benefits Ghana derives from membership of international organisations.<br>(c) State four obligations Ghana owes such organisations.", "sol": ["(a) The United Nations (UN); the African Union (AU); the Economic Community of West African States (ECOWAS); the Commonwealth of Nations; the Non-Aligned Movement; the African Continental Free Trade Area (AfCFTA).", "(b) 1. <b>Trade and investment:</b> access to larger markets and preferential trade arrangements for Ghanaian goods.", "2. <b>Financial and technical assistance:</b> grants, loans and expertise for roads, health, education and agriculture.", "3. <b>Security and peace:</b> collective defence and mediation in conflicts, and training and income from peacekeeping.", "4. <b>Scholarships, employment and prestige:</b> Ghanaians train and work in these bodies, and Ghana has a voice in world affairs.", "(c) Paying its annual dues and contributions promptly; honouring treaties, protocols and decisions it has signed; contributing troops, police and experts to peacekeeping and other missions; respecting the sovereignty of other members and settling disputes peacefully; supporting the programmes of the organisation, such as free movement under ECOWAS protocols."], "marks": 20, "tip": null, "fig": null, "id": "intl-6", "topic": "intl"}, {"type": "obj", "q": "Cocoa farming, fishing and mining belong to the ___ sector of the economy.", "opts": ["secondary", "tertiary", "informal", "primary"], "ans": 3, "sol": ["The primary sector extracts raw materials directly from nature."], "tip": null, "fig": null, "id": "economy-1", "topic": "economy"}, {"type": "obj", "q": "Which of the following is a tertiary economic activity?", "opts": ["Gold mining", "Cocoa farming", "Banking", "Textile manufacturing"], "ans": 2, "sol": ["The tertiary sector provides services — banking, transport, trade, tourism, education and health."], "tip": null, "fig": null, "id": "economy-2", "topic": "economy"}, {"type": "obj", "q": "A persistent rise in the general level of prices in a country is called ___", "opts": ["devaluation", "depreciation", "inflation", "deflation"], "ans": 2, "sol": ["Inflation reduces the purchasing power of money, so the same cedi buys less than before."], "tip": null, "fig": null, "id": "economy-3", "topic": "economy"}, {"type": "obj", "q": "Ghana's economy is said to be over-dependent on the export of raw materials because ___", "opts": ["the country imports no goods", "all factories are owned by foreigners", "most exports are unprocessed cocoa, gold and timber", "the country produces only services"], "ans": 2, "sol": ["Exporting raw materials earns far less than exporting processed goods, and prices swing with the world market."], "tip": null, "fig": null, "id": "economy-4", "topic": "economy"}, {"type": "obj", "q": "The total value of all goods and services produced in a country in a year is its ___", "opts": ["balance of trade", "Gross Domestic Product", "exchange rate", "national debt"], "ans": 1, "sol": ["GDP measures the size of the economy over a year."], "tip": null, "fig": null, "id": "economy-5", "topic": "economy"}, {"type": "thy", "q": "(a) Name the three sectors of the economy and give two examples of activities in each.<br>(b) Explain four problems facing the Ghanaian economy.<br>(c) Suggest four ways of improving the economy.", "sol": ["(a) <b>Primary:</b> crop farming, fishing, mining, lumbering, livestock rearing. <b>Secondary:</b> food processing, textile and garment manufacture, building and construction, furniture making. <b>Tertiary:</b> banking, transport, trade, tourism, teaching, health care.", "(b) 1. <b>Over-dependence on raw material exports</b>, so that a fall in the world price of cocoa or gold upsets the whole budget.", "2. <b>Heavy importation of goods</b> that could be produced locally, which weakens the cedi and drains foreign exchange.", "3. <b>High debt and interest payments</b>, which leave little for development spending.", "4. <b>Unemployment, low productivity and a large informal sector</b> that pays little tax. (Also: inadequate power and road infrastructure, and corruption.)", "(c) Add value to raw materials by processing cocoa, gold and cashew before export; support agriculture with irrigation, credit, storage and ready markets to cut the food import bill; promote small and medium enterprises and TVET so that the youth create jobs; widen the tax net, block revenue leakages and spend borrowed funds on productive projects; and make electricity, roads and the ports efficient so that businesses can compete."], "marks": 20, "tip": null, "fig": null, "id": "economy-6", "topic": "economy"}, {"type": "obj", "q": "The central bank of Ghana is the ___", "opts": ["Bank of Ghana", "National Investment Bank", "Ghana Commercial Bank", "Agricultural Development Bank"], "ans": 0, "sol": ["The Bank of Ghana issues the currency, supervises banks and advises government on monetary policy."], "tip": null, "fig": null, "id": "money-1", "topic": "money"}, {"type": "obj", "q": "Which of the following is NOT a function of money?", "opts": ["Serving as a measure of value", "Acting as a store of value", "Creating employment", "Serving as a medium of exchange"], "ans": 2, "sol": ["Money makes exchange easier, but it does not by itself create jobs."], "tip": null, "fig": null, "id": "money-2", "topic": "money"}, {"type": "obj", "q": "The main advantage of saving in a bank rather than at home is that ___", "opts": ["the money cannot be withdrawn", "it avoids all taxes", "the money is safe and earns interest", "the bank spends it for you"], "ans": 2, "sol": ["Bank savings are secure, earn interest and build a record that supports a future loan application."], "tip": null, "fig": null, "id": "money-3", "topic": "money"}, {"type": "obj", "q": "A household budget is best described as a ___", "opts": ["record of past salaries only", "statement of a company's profit", "list of debts owed", "plan of expected income and expenditure"], "ans": 3, "sol": ["A budget plans ahead, matching what you expect to earn against what you plan to spend and save."], "tip": null, "fig": null, "id": "money-4", "topic": "money"}, {"type": "obj", "q": "Which of these is an example of an informal way of saving in Ghana?", "opts": ["Fixed deposit account", "Susu collection", "Treasury bills", "Shares on the stock exchange"], "ans": 1, "sol": ["Susu is an informal daily or weekly savings arrangement, widely used by traders."], "tip": null, "fig": null, "id": "money-5", "topic": "money"}, {"type": "thy", "q": "(a) State four functions of money.<br>(b) Explain four functions of the Bank of Ghana.<br>(c) State four reasons why young people should cultivate the habit of saving.", "sol": ["(a) <b>Medium of exchange</b> — it is accepted for goods and services, removing the problems of barter. <b>Measure of value</b> — the worth of different goods can be compared in cedis. <b>Store of value</b> — purchasing power can be kept for future use. <b>Standard for deferred payment</b> — debts and future payments can be stated in money terms.", "(b) It issues and redeems the national currency; it acts as banker and adviser to the government; it supervises and licenses banks and other financial institutions; it manages the country's foreign exchange reserves; and it controls the money supply and interest rates to keep inflation low.", "(c) To meet future needs such as further education, tools or capital for a business; to be prepared for emergencies such as illness, without borrowing at high interest; to earn interest and build a credit record that makes a loan possible; and to learn discipline and independence, since savings mobilised through banks also finance national investment."], "marks": 20, "tip": null, "fig": null, "id": "money-6", "topic": "money"}, {"type": "obj", "q": "An entrepreneur is a person who ___", "opts": ["works for a salary in a firm", "organises the factors of production and bears the risk", "lends money to businesses only", "inspects businesses for the government"], "ans": 1, "sol": ["The entrepreneur brings together land, labour and capital, takes the decisions and carries the risk of loss."], "tip": null, "fig": null, "id": "entre-1", "topic": "entre"}, {"type": "obj", "q": "Which of these is the most important quality of a successful entrepreneur?", "opts": ["Willingness to take calculated risks", "Dependence on relatives", "Fear of failure", "Love of leisure"], "ans": 0, "sol": ["Enterprise involves risk; the successful entrepreneur assesses it carefully rather than avoiding it or gambling."], "tip": null, "fig": null, "id": "entre-2", "topic": "entre"}, {"type": "obj", "q": "A document that sets out a proposed business, its market, capital requirement and expected profit is a ___", "opts": ["receipt", "bank statement", "certificate of incorporation", "business plan"], "ans": 3, "sol": ["A business plan guides the owner and is required by banks and investors."], "tip": null, "fig": null, "id": "entre-3", "topic": "entre"}, {"type": "obj", "q": "The commonest source of start-up capital for small businesses in Ghana is ___", "opts": ["insurance claims", "foreign direct investment", "the stock exchange", "personal savings and family support"], "ans": 3, "sol": ["Most small businesses begin with the owner's own savings, susu contributions and help from relatives."], "tip": null, "fig": null, "id": "entre-4", "topic": "entre"}, {"type": "obj", "q": "Which of the following is a major problem facing small-scale businesses in Ghana?", "opts": ["Too many customers", "Low cost of electricity", "Excess of trained workers", "Inadequate capital and poor record keeping"], "ans": 3, "sol": ["Small businesses also struggle with high utility costs, competition from imports and limited management skills."], "tip": null, "fig": null, "id": "entre-5", "topic": "entre"}, {"type": "thy", "q": "(a) Who is an entrepreneur?<br>(b) State and explain four qualities of a good entrepreneur.<br>(c) Explain four ways in which the government can promote entrepreneurship among the youth.", "sol": ["(a) An entrepreneur is a person who identifies a business opportunity, brings together the factors of production — land, labour, capital and enterprise — to produce goods or services, takes the decisions of the business and bears the risk of profit or loss.", "(b) 1. <b>Creativity and innovation:</b> sees opportunities others miss and improves on existing products.", "2. <b>Willingness to take calculated risks:</b> studies the market and invests, accepting that returns are not guaranteed.", "3. <b>Hard work and perseverance:</b> keeps going through slow seasons and early losses.", "4. <b>Honesty and good record keeping:</b> separates business money from personal money, keeps accounts and treats customers fairly, which builds trust and repeat business.", "(c) Provide affordable credit through schemes and microfinance without heavy collateral demands; strengthen TVET and entrepreneurship education in schools so that graduates leave with practical skills; provide business advisory services, incubators and market information through bodies such as the Business Development Authority; reduce the cost of doing business — simpler registration, stable electricity, better roads and fair taxes for start-ups; and patronise local goods through public procurement."], "marks": 20, "tip": null, "fig": null, "id": "entre-6", "topic": "entre"}, {"type": "obj", "q": "Unemployment exists when people who are ___ cannot find work.", "opts": ["unwilling to work", "too old to work", "still in school", "able and willing to work"], "ans": 3, "sol": ["Those who are unwilling to work or are not in the labour force are not counted as unemployed."], "tip": null, "fig": null, "id": "unemp-1", "topic": "unemp"}, {"type": "obj", "q": "A trained tailor who cannot find work because all the demand is for welders is an example of ___ unemployment.", "opts": ["structural", "seasonal", "frictional", "cyclical"], "ans": 0, "sol": ["Structural unemployment arises when workers' skills do not match the jobs available."], "tip": null, "fig": null, "id": "unemp-2", "topic": "unemp"}, {"type": "obj", "q": "Farm labourers who have no work between harvest and the next planting season suffer ___ unemployment.", "opts": ["structural", "disguised", "seasonal", "frictional"], "ans": 2, "sol": ["Seasonal unemployment follows the pattern of the farming or tourist season."], "tip": null, "fig": null, "id": "unemp-3", "topic": "unemp"}, {"type": "obj", "q": "Which of these is an effect of high youth unemployment?", "opts": ["Increase in crime and social vices", "Reduction in rural–urban migration", "Higher national output", "Increase in government revenue"], "ans": 0, "sol": ["Idle youth are drawn into crime, drug abuse and irregular migration, and the country loses their output and taxes."], "tip": null, "fig": null, "id": "unemp-4", "topic": "unemp"}, {"type": "obj", "q": "Which measure would most directly reduce graduate unemployment in Ghana?", "opts": ["Encouraging everybody to seek office jobs", "Teaching employable and entrepreneurial skills in schools", "Reducing the school-going age", "Increasing the number of examinations"], "ans": 1, "sol": ["When graduates leave school able to create work rather than only to look for it, fewer remain unemployed."], "tip": null, "fig": null, "id": "unemp-5", "topic": "unemp"}, {"type": "thy", "q": "(a) What is unemployment? Name four types.<br>(b) Explain four causes of unemployment in Ghana.<br>(c) Suggest four solutions to the problem of unemployment.", "sol": ["(a) Unemployment is the condition in which people who are able, available and willing to work at the going wage cannot find jobs. Types: <b>structural, frictional, seasonal, cyclical, disguised</b> unemployment and <b>underemployment</b>.", "(b) 1. <b>Rapid population growth:</b> the number of job seekers rises faster than the jobs created.", "2. <b>An education system that produced mainly certificate holders</b> for office work, with too little practical and technical training.", "3. <b>Collapse or weakness of industries</b> and of agriculture, partly through competition from cheap imports and high production costs.", "4. <b>Lack of capital and credit</b> for young people who wish to start their own businesses, plus rural–urban migration that crowds the cities with job seekers.", "(c) Expand technical and vocational training and attach it to industry; modernise agriculture and agro-processing, which can absorb large numbers; provide credit, tools and market access for youth enterprises; encourage local industries through 'made in Ghana' patronage and fair protection; develop the rural areas so that the youth are not forced to migrate; and provide reliable labour market information so that training matches real demand."], "marks": 20, "tip": null, "fig": null, "id": "unemp-6", "topic": "unemp"}, {"type": "obj", "q": "Technology can best be described as the ___", "opts": ["making of laws", "collection of taxes", "study of the stars", "application of scientific knowledge to solve practical problems"], "ans": 3, "sol": ["Technology turns scientific knowledge into tools, machines and methods that meet human needs."], "tip": null, "fig": null, "id": "sci-1", "topic": "sci"}, {"type": "obj", "q": "Which of these is an example of appropriate technology for a rural farming community?", "opts": ["A satellite launch pad", "A solar crop dryer", "A high-speed train", "A nuclear power plant"], "ans": 1, "sol": ["Appropriate technology uses local materials and skills, is affordable and can be maintained locally."], "tip": null, "fig": null, "id": "sci-2", "topic": "sci"}, {"type": "obj", "q": "The use of mobile money in Ghana has helped mainly by ___", "opts": ["giving more people access to financial services", "ending the use of the cedi", "abolishing bank accounts", "replacing the Bank of Ghana"], "ans": 0, "sol": ["People far from bank branches can now save, send and receive money and pay bills."], "tip": null, "fig": null, "id": "sci-3", "topic": "sci"}, {"type": "obj", "q": "A major obstacle to technological development in Ghana is ___", "opts": ["too many engineers", "cheap machinery for all", "low investment in research and development", "excess electricity supply"], "ans": 2, "sol": ["Weak funding of research, unreliable power and a poor maintenance culture all slow technological progress."], "tip": null, "fig": null, "id": "sci-4", "topic": "sci"}, {"type": "obj", "q": "Which of the following is a negative effect of technology?", "opts": ["Higher agricultural output", "Retrenchment of workers replaced by machines", "Improved health care", "Faster communication"], "ans": 1, "sol": ["Automation can displace workers, and technology also brings pollution, cybercrime and misuse of social media."], "tip": null, "fig": null, "id": "sci-5", "topic": "sci"}, {"type": "thy", "q": "(a) What is technology?<br>(b) Explain four ways in which science and technology promote national development.<br>(c) State four problems hindering technological development in Ghana and suggest one solution to each.", "sol": ["(a) Technology is the application of scientific knowledge, tools and methods to solve practical human problems and to produce goods and services more efficiently.", "(b) 1. <b>Agriculture:</b> improved seeds, irrigation, tractors and storage raise yields and reduce post-harvest losses.", "2. <b>Industry:</b> machines raise output and quality, and add value to raw materials before export.", "3. <b>Health:</b> vaccines, scanners, laboratories and telemedicine save lives and lengthen life expectancy.", "4. <b>Communication, education and governance:</b> mobile phones, internet and e-government make information, learning and services available quickly and widely.", "(c) <b>Low research funding</b> — allocate a fixed share of the budget to research institutions and link them to industry. <b>Unreliable and costly power</b> — invest in reliable generation, including solar, and cut transmission losses. <b>Poor maintenance culture</b> — train technicians and budget for maintenance when projects are planned. <b>Brain drain</b> — improve conditions of service for scientists and technicians so that they stay and work at home."], "marks": 20, "tip": null, "fig": null, "id": "sci-6", "topic": "sci"}, {"type": "obj", "q": "Sustainable development means meeting the needs of the present ___", "opts": ["by stopping all mining and farming", "by depending only on foreign aid", "without compromising the needs of future generations", "by using up all resources quickly"], "ans": 2, "sol": ["The key idea is using resources today in a way that leaves enough for those who come after us."], "tip": null, "fig": null, "id": "sustain-1", "topic": "sustain"}, {"type": "obj", "q": "Which of the following is a non-renewable resource?", "opts": ["Timber", "Fish", "Solar energy", "Crude oil"], "ans": 3, "sol": ["Crude oil, gold and bauxite cannot be replaced once used; forests, fish and solar energy can be renewed or are unlimited."], "tip": null, "fig": null, "id": "sustain-2", "topic": "sustain"}, {"type": "obj", "q": "Human resource development in a country refers to ___", "opts": ["improving the education, health and skills of the people", "increasing the population only", "importing skilled workers", "building more factories"], "ans": 0, "sol": ["A healthy, well-educated and skilled population is the most valuable resource of any country."], "tip": null, "fig": null, "id": "sustain-3", "topic": "sustain"}, {"type": "obj", "q": "Which practice best supports sustainable use of Ghana's forests?", "opts": ["Replanting trees after harvesting timber", "Mining in forest reserves", "Clearing forests for charcoal", "Burning the bush before farming"], "ans": 0, "sol": ["Selective logging with replanting keeps the forest productive for the future."], "tip": null, "fig": null, "id": "sustain-4", "topic": "sustain"}, {"type": "obj", "q": "The greatest benefit Ghana can obtain from its mineral resources is by ___", "opts": ["processing them locally before export", "leaving them unexploited", "giving them away as aid", "exporting them in raw form"], "ans": 0, "sol": ["Processing (value addition) earns more foreign exchange and creates jobs and skills at home."], "tip": null, "fig": null, "id": "sustain-5", "topic": "sustain"}, {"type": "thy", "q": "(a) Explain the term sustainable development.<br>(b) State and explain four ways of ensuring sustainable use of Ghana's natural resources.<br>(c) Explain why human resource development is important to a country.", "sol": ["(a) Sustainable development is development that meets the needs of the present generation without destroying the ability of future generations to meet their own needs. It balances economic growth, social well-being and protection of the environment.", "(b) 1. <b>Reafforestation and selective logging:</b> replace what is harvested and take only mature trees.", "2. <b>Enforcement of laws and reclamation:</b> insist that mining companies restore mined land and keep out of forest reserves and river bodies.", "3. <b>Recycling and efficient use:</b> recycle metals, plastics and paper, and use energy-saving equipment and renewable energy.", "4. <b>Community participation and education:</b> involve local people and chiefs in managing forests, fisheries and water bodies, with closed seasons for fishing and approved net sizes.", "(c) Natural resources are useless without people who can find, process and manage them. Education, health care and skills training raise productivity, attract investment, produce the professionals the country needs and reduce dependence on expatriates. A healthy, skilled population also innovates, pays taxes and adapts more easily when industries change."], "marks": 20, "tip": null, "fig": null, "id": "sustain-6", "topic": "sustain"}, {"type": "obj", "q": "Which of these is a historical tourist attraction in Ghana?", "opts": ["Kakum canopy walkway", "Cape Coast Castle", "Wli Waterfalls", "Paga crocodile pond"], "ans": 1, "sol": ["The castles and forts are historical monuments; the others are natural attractions."], "tip": null, "fig": null, "id": "tour-1", "topic": "tour"}, {"type": "obj", "q": "The greatest economic benefit of tourism to Ghana is that it ___", "opts": ["increases the population", "earns foreign exchange", "reduces the need for farming", "replaces the mining industry"], "ans": 1, "sol": ["Tourists spend foreign currency on transport, hotels, food and crafts, which strengthens the economy."], "tip": null, "fig": null, "id": "tour-2", "topic": "tour"}, {"type": "obj", "q": "Which of the following is a problem facing the tourism industry in Ghana?", "opts": ["The friendliness of Ghanaians", "Poor roads leading to tourist sites", "The variety of Ghanaian festivals", "Too many tourist attractions"], "ans": 1, "sol": ["Access roads, accommodation, promotion, maintenance and sanitation at sites are the real constraints."], "tip": null, "fig": null, "id": "tour-3", "topic": "tour"}, {"type": "obj", "q": "Tourism helps to promote national unity and international understanding because it ___", "opts": ["brings people of different cultures together", "encourages migration abroad", "reduces the number of festivals", "increases taxes"], "ans": 0, "sol": ["Visitors and hosts learn about one another's way of life, and domestic tourism helps Ghanaians know their own country."], "tip": null, "fig": null, "id": "tour-4", "topic": "tour"}, {"type": "obj", "q": "Which of these is a negative effect of tourism that must be managed?", "opts": ["Littering and damage to natural sites", "Creation of jobs", "Improvement of roads", "Sale of local crafts"], "ans": 0, "sol": ["Large numbers of visitors can damage sensitive sites and bring in habits that weaken local values."], "tip": null, "fig": null, "id": "tour-5", "topic": "tour"}, {"type": "thy", "q": "(a) What is tourism?<br>(b) Name four tourist attractions in Ghana and say what makes each attractive.<br>(c) Explain four ways of developing the tourism industry in Ghana.", "sol": ["(a) Tourism is the act of travelling away from one's usual place of residence, for at least a day, for leisure, business, culture, religion, health or education, together with the services provided for such travellers.", "(b) <b>Cape Coast and Elmina Castles</b> — historical monuments of the era of the slave trade, recognised by UNESCO. <b>Kakum National Park</b> — tropical rainforest with a canopy walkway and rare wildlife. <b>Mole National Park</b> — the largest wildlife park, with elephants, antelopes and baboons. <b>Lake Volta and the Akosombo Dam</b> — the world's largest man-made lake, with cruises and fishing. (Also Wli Falls, Paga crocodile pond, Manhyia Palace, Larabanga Mosque and the festivals.)", "(c) Improve access roads, water, electricity and sanitation at the sites; advertise Ghana's attractions aggressively at home and abroad, including online and through the diaspora; train more workers in hospitality and provide affordable, quality accommodation; preserve and maintain the monuments, parks and beaches, and involve the host communities so that they benefit and protect them; and package festivals and heritage events as annual tourist calendars."], "marks": 20, "tip": null, "fig": null, "id": "tour-6", "topic": "tour"}, {"type": "obj", "q": "The reward for the factor of production called capital is ___", "opts": ["rent", "wages", "profit", "interest"], "ans": 3, "sol": ["Land earns rent, labour earns wages, capital earns interest and the entrepreneur earns profit."], "tip": null, "fig": null, "id": "trade-1", "topic": "trade"}, {"type": "obj", "q": "The difference between the value of a country's visible exports and its visible imports is the ___", "opts": ["balance of trade", "budget deficit", "national income", "balance of payments"], "ans": 0, "sol": ["The balance of trade covers goods only; the balance of payments covers all transactions, including services and transfers."], "tip": null, "fig": null, "id": "trade-2", "topic": "trade"}, {"type": "obj", "q": "A trader who buys goods in large quantities from manufacturers and sells them to retailers is a ___", "opts": ["wholesaler", "producer", "consumer", "broker"], "ans": 0, "sol": ["The wholesaler breaks bulk between the manufacturer and the many retailers."], "tip": null, "fig": null, "id": "trade-3", "topic": "trade"}, {"type": "obj", "q": "The body responsible for ensuring that food and drugs sold in Ghana are safe is the ___", "opts": ["Food and Drugs Authority", "National Petroleum Authority", "Ghana Investment Promotion Centre", "Electoral Commission"], "ans": 0, "sol": ["The FDA registers and inspects food, drugs, cosmetics and household chemicals; the Ghana Standards Authority sets product standards."], "tip": null, "fig": null, "id": "trade-4", "topic": "trade"}, {"type": "obj", "q": "Before buying a packaged product, a wise consumer should FIRST check the ___", "opts": ["colour of the package only", "expiry date and quality", "name of the shop attendant", "number of items on the shelf"], "ans": 1, "sol": ["Checking the expiry date, the seal, the standards mark and the price protects health and money."], "tip": null, "fig": null, "id": "trade-5", "topic": "trade"}, {"type": "thy", "q": "(a) Name the four factors of production and state the reward for each.<br>(b) Explain four benefits of foreign trade to Ghana.<br>(c) State four rights and two duties of a consumer.", "sol": ["(a) <b>Land</b> — rent; <b>Labour</b> — wages or salary; <b>Capital</b> — interest; <b>Entrepreneurship</b> — profit.", "(b) 1. It allows Ghana to obtain goods it cannot produce, such as machinery, vehicles and some medicines.", "2. It earns foreign exchange from exports of cocoa, gold, oil and cashew, which pays for imports and debts.", "3. It widens the market for local producers, encouraging larger scale production and lower costs.", "4. It brings in new technology, skills and ideas, and promotes friendly relations between countries.", "(c) <b>Rights:</b> the right to safety (goods must not endanger health); the right to be informed (correct labelling, price and expiry date); the right to choose from competing products; the right to be heard and to seek redress when a product is defective.", "<b>Duties:</b> to inspect goods and check expiry dates before buying, and to demand and keep receipts; to use goods according to instructions and to report unsafe products to the FDA or Standards Authority."], "marks": 20, "tip": null, "fig": null, "id": "trade-6", "topic": "trade"}, {"type": "obj", "q": "Streetism refers to the situation where ___", "opts": ["streets are not tarred", "people walk instead of driving", "children live and work on the streets", "traders sell along the roadside"], "ans": 2, "sol": ["Street children are exposed to abuse, disease, crime and loss of education."], "tip": null, "fig": null, "id": "probs-1", "topic": "probs"}, {"type": "obj", "q": "Which of these is a major cause of child labour in Ghana?", "opts": ["Free education", "Availability of school buses", "Strict school rules", "Poverty in the family"], "ans": 3, "sol": ["Poor parents often send children to work in fishing, farming or trading to add to the family income."], "tip": null, "fig": null, "id": "probs-2", "topic": "probs"}, {"type": "obj", "q": "Which of the following is an effect of drug abuse on the individual?", "opts": ["Better family relationships", "Improved concentration", "Damage to health and mental illness", "Longer life expectancy"], "ans": 2, "sol": ["Abuse of substances damages the brain, liver and lungs, and destroys studies, work and family ties."], "tip": null, "fig": null, "id": "probs-3", "topic": "probs"}, {"type": "obj", "q": "The best long-term solution to armed robbery in a community is to ___", "opts": ["create jobs and strengthen law enforcement and moral education", "close all the markets", "arm every household", "impose a permanent curfew"], "ans": 0, "sol": ["Addressing unemployment and idleness, together with effective policing and prosecution, deals with the causes as well as the acts."], "tip": null, "fig": null, "id": "probs-4", "topic": "probs"}, {"type": "obj", "q": "Which institution has the primary responsibility for shaping the moral behaviour of a child?", "opts": ["The district assembly", "The Electoral Commission", "The family", "The police service"], "ans": 2, "sol": ["The family is the first agent of socialisation; schools and religious bodies build on what it does."], "tip": null, "fig": null, "id": "probs-5", "topic": "probs"}, {"type": "thy", "q": "(a) Name four social problems facing Ghana today.<br>(b) Explain four causes of drug abuse among the youth.<br>(c) Suggest four ways of solving the problem of child labour.", "sol": ["(a) Poverty; unemployment; child labour and streetism; teenage pregnancy; drug and alcohol abuse; armed robbery and cybercrime; poor sanitation; prostitution.", "(b) 1. <b>Peer pressure:</b> young people take drugs to be accepted by friends.", "2. <b>Broken homes and poor parental care:</b> children without guidance turn to drugs for comfort.", "3. <b>Idleness and unemployment:</b> those with nothing to do are easily drawn into abuse.", "4. <b>Easy access and the influence of the media:</b> drugs are sold openly in some places, and films and music sometimes glamorise them. (Also: the wish to relieve stress or to stay awake while working or studying.)", "(c) Enforce the laws on the minimum age for work and prosecute offenders, including parents and employers; support poor families with livelihood empowerment programmes and free and compulsory basic education, feeding and uniforms; educate communities, especially in fishing and mining areas, on the dangers of child labour; rescue, counsel and reintegrate affected children into school or apprenticeship; and strengthen the Department of Social Welfare and community child protection committees."], "marks": 20, "tip": null, "fig": null, "id": "probs-6", "topic": "probs"}, {"type": "obj", "q": "The body responsible for advising on national development planning in Ghana is the ___", "opts": ["National Development Planning Commission", "Public Services Commission", "Bank of Ghana", "Ghana Statistical Service"], "ans": 0, "sol": ["The NDPC prepares and advises on national development plans and monitors their implementation."], "tip": null, "fig": null, "id": "planning-1", "topic": "planning"}, {"type": "obj", "q": "Which of these is a direct tax?", "opts": ["Personal income tax", "Excise duty", "Import duty", "Value Added Tax"], "ans": 0, "sol": ["Direct taxes are paid by the person on whom they are levied; indirect taxes are collected through the price of goods and services."], "tip": null, "fig": null, "id": "planning-2", "topic": "planning"}, {"type": "obj", "q": "The institution responsible for collecting taxes in Ghana is the ___", "opts": ["Controller and Accountant-General", "Ghana Revenue Authority", "Ghana Standards Authority", "Bank of Ghana"], "ans": 1, "sol": ["The GRA administers income tax, VAT and customs duties."], "tip": null, "fig": null, "id": "planning-3", "topic": "planning"}, {"type": "obj", "q": "The Auditor-General's main duty is to ___", "opts": ["collect import duties", "prepare the national budget", "appoint heads of departments", "audit public accounts and report to Parliament"], "ans": 3, "sol": ["The audit report allows Parliament and the public to see whether public funds were properly used."], "tip": null, "fig": null, "id": "planning-4", "topic": "planning"}, {"type": "obj", "q": "Which of these is the most useful thing an ordinary citizen can do to support national development?", "opts": ["Avoid all community activities", "Criticise every project without evidence", "Wait for the government to do everything", "Pay taxes honestly and monitor local projects"], "ans": 3, "sol": ["Paying taxes funds development, and citizen monitoring makes sure the money is well spent."], "tip": null, "fig": null, "id": "planning-5", "topic": "planning"}, {"type": "thy", "q": "(a) What is a national budget?<br>(b) State four sources of government revenue in Ghana.<br>(c) Explain four roles the individual citizen can play in national development.", "sol": ["(a) A national budget is the government's financial plan for a year, setting out the revenue it expects to raise and how it intends to spend it. It is presented to Parliament for debate and approval before the money can be spent.", "(b) <b>Taxes</b> — income tax, corporate tax, VAT, customs and excise duties; <b>Loans</b> — internal borrowing through treasury bills and bonds, and external loans; <b>Grants and aid</b> from development partners; <b>Earnings of state enterprises, royalties from minerals and oil, fees, fines and licences</b>.", "(c) 1. <b>Paying taxes and rates honestly and promptly</b>, so that government has money for schools, roads and hospitals.", "2. <b>Working hard and acquiring skills</b>, which raises productivity and creates jobs for others.", "3. <b>Protecting public property and the environment</b> — street lights, school furniture, water bodies and forests.", "4. <b>Participating in governance</b> — voting wisely, attending assembly meetings, joining communal labour and monitoring projects so that contractors do proper work."], "marks": 20, "tip": null, "fig": null, "id": "planning-6", "topic": "planning"}, {"type": "obj", "q": "Self-identity can best be described as ___", "opts": ["the number of friends a person keeps", "the amount of money a person has", "the school a person attends", "a person's sense of who he or she is"], "ans": 3, "sol": ["Identity covers name, family, culture, nationality, abilities, beliefs and goals — the whole sense of self."], "tip": null, "fig": null, "id": "identity-1", "topic": "identity"}, {"type": "obj", "q": "Which of these is MOST likely to build a student's self-esteem?", "opts": ["Being praised for work he did not do", "Copying the lifestyle of a celebrity", "Being compared with other students", "Achieving a goal he set and worked for"], "ans": 3, "sol": ["Real achievement, earned by effort, is what makes self-esteem solid.", "False praise collapses the first time the person is tested."], "tip": null, "fig": null, "id": "identity-2", "topic": "identity"}, {"type": "obj", "q": "A student who always follows his friends even when he knows they are wrong lacks ___", "opts": ["intelligence", "energy", "assertiveness", "friends"], "ans": 2, "sol": ["Assertiveness is the ability to state your own position politely and firmly, including saying no."], "tip": null, "fig": null, "id": "identity-3", "topic": "identity"}, {"type": "obj", "q": "Which of these BEST shows self-discipline in a student?", "opts": ["Studying only when the teacher is around", "Reading all night before an examination", "Keeping to a study timetable without being supervised", "Copying notes from a friend"], "ans": 2, "sol": ["Self-discipline is doing what you planned when nobody is watching or forcing you."], "tip": null, "fig": null, "id": "identity-4", "topic": "identity"}, {"type": "obj", "q": "Which factor contributes LEAST to a person's identity?", "opts": ["His religion", "The colour of his school bag", "His culture and language", "His family and upbringing"], "ans": 1, "sol": ["Family, culture, language and religion all shape who a person is; a possession does not."], "tip": null, "fig": null, "id": "identity-5", "topic": "identity"}, {"type": "thy", "q": "(a) Explain the terms self-concept and self-esteem.<br>(b) State four factors that shape a young person's identity.<br>(c) Explain four ways a student can develop a strong, positive personality.", "sol": ["(a) <b>Self-concept</b> is the picture a person has of himself — his abilities, appearance and place in society. <b>Self-esteem</b> is the value he puts on that picture: how much he respects and accepts himself.", "(b) The family and upbringing; culture, language and ethnic background; religion and moral teaching; the school, teachers and peers; the media and personal experiences of success or failure.", "(c) 1. <b>Set clear goals</b> and work towards them, so that confidence rests on real achievement.", "2. <b>Keep good company</b> — friends who study, work and respect others.", "3. <b>Learn to say no</b> politely but firmly to what will harm your future.", "4. <b>Accept correction and learn from failure</b> instead of giving up, and take part in clubs, sports and community service to discover your abilities."], "marks": 20, "tip": null, "fig": null, "id": "identity-6", "topic": "identity"}, {"type": "obj", "q": "Which of the following is determined by SEX rather than by gender?", "opts": ["Being the head of a household", "Cooking for the family", "Working as a nurse", "The ability to bear children"], "ans": 3, "sol": ["Sex is biological and does not change; the others are roles that society assigns and that change with time."], "tip": null, "fig": null, "id": "gender-1", "topic": "gender"}, {"type": "obj", "q": "Gender equality means that men and women should ___", "opts": ["do exactly the same work everywhere", "earn the same amount whatever the job", "have equal rights and opportunities", "live apart from each other"], "ans": 2, "sol": ["Equality is about equal access and fair treatment, not about erasing all differences."], "tip": null, "fig": null, "id": "gender-2", "topic": "gender"}, {"type": "obj", "q": "Which practice MOST limits girls' education in some communities?", "opts": ["Science scholarships for girls", "Early and forced marriage", "Free school uniforms", "School feeding"], "ans": 1, "sol": ["Early marriage takes girls out of school permanently; the other three keep them in school."], "tip": null, "fig": null, "id": "gender-3", "topic": "gender"}, {"type": "obj", "q": "A family has limited money and chooses to educate only the boy. This decision is an example of ___", "opts": ["cultural preservation", "sound financial planning", "fair sharing", "gender discrimination"], "ans": 3, "sol": ["Choosing by sex rather than by ability or need denies the girl an equal opportunity."], "tip": null, "fig": null, "id": "gender-4", "topic": "gender"}, {"type": "obj", "q": "Which of these would best promote gender equality in a school?", "opts": ["Reserving science for boys only", "Giving girls and boys equal chance to lead and to study every subject", "Asking girls to sweep while boys read", "Choosing only boys as prefects"], "ans": 1, "sol": ["Equal access to leadership, subjects and duties is what equality looks like in practice."], "tip": null, "fig": null, "id": "gender-5", "topic": "gender"}, {"type": "thy", "q": "(a) Distinguish between sex and gender.<br>(b) State four effects of gender inequality on national development.<br>(c) Suggest four ways of promoting gender equality in Ghana.", "sol": ["(a) <b>Sex</b> is the biological difference between male and female, fixed at birth and the same everywhere. <b>Gender</b> is the set of roles, duties and expectations a society gives to men and women; it is learnt and it differs from place to place and changes with time.", "(b) 1. The country loses the talent of half its population when girls drop out or are kept from certain careers.", "2. Household incomes stay low, since educated women earn more and invest in their children.", "3. Child health and literacy suffer, because a mother's education strongly affects her children.", "4. Fewer women in decision-making means policies that overlook the needs of women and children.", "(c) Keep girls in school with scholarships, sanitary provision and safe transport; enforce the laws against early and forced marriage and against sexual harassment; share household chores so that girls have study time; promote women into leadership and encourage girls into science and technical courses; educate communities to drop practices that hold women back."], "marks": 20, "tip": null, "fig": null, "id": "gender-6", "topic": "gender"}, {"type": "obj", "q": "The body that deals with chieftaincy matters at the national level is the ___", "opts": ["National Peace Council", "National House of Chiefs", "Council of State", "Electoral Commission"], "ans": 1, "sol": ["The National House of Chiefs, with its judicial committee, handles chieftaincy matters and advises on customary law."], "tip": null, "fig": null, "id": "chief-1", "topic": "chief"}, {"type": "obj", "q": "Which of these is a function of a chief in Ghana today?", "opts": ["Appointing the Chief Justice", "Printing the national currency", "Conducting national elections", "Mobilising his people for development projects"], "ans": 3, "sol": ["Chiefs mobilise communal labour and funds, settle disputes, hold land in trust and preserve custom."], "tip": null, "fig": null, "id": "chief-2", "topic": "chief"}, {"type": "obj", "q": "A chief is NOT allowed to ___", "opts": ["take part in active party politics", "settle land disputes in his area", "sit in the Regional House of Chiefs", "lead his people at a festival"], "ans": 0, "sol": ["The Constitution bars chiefs from active party politics so that the institution remains above partisan division."], "tip": null, "fig": null, "id": "chief-3", "topic": "chief"}, {"type": "obj", "q": "The person who plays a key role in the selection and installation of a chief in many Akan communities is the ___", "opts": ["regional minister", "assembly member", "district chief executive", "queen mother"], "ans": 3, "sol": ["The queen mother, with the kingmakers, nominates a candidate from the royal family."], "tip": null, "fig": null, "id": "chief-4", "topic": "chief"}, {"type": "obj", "q": "Land in many Ghanaian communities is said to be held by the chief ___", "opts": ["on behalf of the central government", "for sale to the highest bidder", "in trust for the people", "as his personal property"], "ans": 2, "sol": ["Stool and skin lands are held in trust: the chief administers them for the benefit of the community, and the revenue is shared as the law provides."], "tip": null, "fig": null, "id": "chief-5", "topic": "chief"}, {"type": "thy", "q": "(a) Who is a chief?<br>(b) State four functions of chiefs in Ghana today.<br>(c) Explain three causes of chieftaincy disputes and two ways of resolving them.", "sol": ["(a) A chief is a person who, hailing from the appropriate family and lineage, has been validly nominated, elected or selected and enstooled, enskinned or installed as a chief in accordance with the relevant customary law and usage.", "(b) 1. <b>Custodian of the land and of custom</b> — holds stool or skin land in trust and upholds tradition.", "2. <b>Settlement of disputes</b> — hears family, land and community cases, easing the pressure on the courts.", "3. <b>Mobilisation for development</b> — organises communal labour, raises funds at festivals and attracts projects to the area.", "4. <b>Preservation of culture</b> — leads festivals, rites and the use of the language, and links the people with government and investors.", "(c) <b>Causes:</b> rival claims between royal gates or families; unclear or disputed customary procedure in nomination and installation; interference by politicians and by people who want the stool lands; money from land sales.", "<b>Resolution:</b> mediation and negotiation by elders, the queen mother and respected persons; reference to the judicial committee of the Regional or National House of Chiefs, whose decision is binding; clear documentation of customary lines of succession to prevent future disputes."], "marks": 20, "tip": null, "fig": null, "id": "chief-6", "topic": "chief"}, {"type": "obj", "q": "Which of these is a right of every child in Ghana?", "opts": ["The right to vote in national elections", "The right to basic education", "The right to work full time in a mine", "The right to drive a vehicle"], "ans": 1, "sol": ["Basic education is a right; voting and driving come with age, and hazardous child labour is forbidden."], "tip": null, "fig": null, "id": "rights-1", "topic": "rights"}, {"type": "obj", "q": "A public office building has no ramp, so a man in a wheelchair cannot enter. This breaches ___", "opts": ["the law on public holidays", "the building's insurance policy", "the rights of persons with disability", "no right at all"], "ans": 2, "sol": ["The Persons with Disability Act requires public buildings and transport to be accessible."], "tip": null, "fig": null, "id": "rights-2", "topic": "rights"}, {"type": "obj", "q": "The police unit that handles cases of domestic violence and abuse is ___", "opts": ["DOVVSU", "the Immigration Service", "the Fire Service", "MTTD"], "ans": 0, "sol": ["The Domestic Violence and Victim Support Unit handles abuse, defilement and family violence cases."], "tip": null, "fig": null, "id": "rights-3", "topic": "rights"}, {"type": "obj", "q": "Which body investigates complaints of human rights abuse by public officials?", "opts": ["The Electoral Commission", "CHRAJ", "The Ghana Standards Authority", "The National Lottery Authority"], "ans": 1, "sol": ["The Commission on Human Rights and Administrative Justice investigates abuses of rights and of office."], "tip": null, "fig": null, "id": "rights-4", "topic": "rights"}, {"type": "obj", "q": "A girl of 15 is withdrawn from school to be married. Which of her rights is being denied?", "opts": ["The right to trade", "The right to vote", "The right to property", "The right to education"], "ans": 3, "sol": ["Early marriage denies the right to education and to protection from harmful practices; marriage under 18 is unlawful in Ghana."], "tip": null, "fig": null, "id": "rights-5", "topic": "rights"}, {"type": "thy", "q": "(a) What are human rights?<br>(b) State four rights of the child and the duty that goes with each.<br>(c) Explain four ways society can protect vulnerable groups.", "sol": ["(a) Human rights are the basic entitlements that belong to every person from birth, simply because they are human — regardless of sex, ethnic group, religion, status or ability. In Ghana they are guaranteed in Chapter Five of the 1992 Constitution.", "(b) <b>Education</b> — the child must attend school and work hard. <b>Health care</b> — the child should follow medical advice and keep clean habits. <b>Protection from abuse and hazardous work</b> — the child should report abuse and avoid dangerous places. <b>A name, nationality and parental care</b> — the child should respect parents and obey reasonable rules.", "(c) 1. <b>Enforce the laws</b> — the Children's Act, the Domestic Violence Act and the Persons with Disability Act, through DOVVSU, CHRAJ and the courts.", "2. <b>Provide services</b> — free basic education, school feeding, health insurance exemptions, ramps and accessible transport, and support grants for the very poor and the aged.", "3. <b>Educate the public</b> through schools, radio and durbars, so that abuse and discrimination are reported rather than hidden.", "4. <b>Support families</b> with livelihood programmes, since poverty is behind much child labour, early marriage and neglect."], "marks": 20, "tip": null, "fig": null, "id": "rights-6", "topic": "rights"}, {"type": "obj", "q": "Which of these is a shared moral value of all the main religions in Ghana?", "opts": ["Fasting in Ramadan", "Baptism", "Pouring of libation", "Honesty"], "ans": 3, "sol": ["Honesty is taught by all of them; the other three are particular practices of one religion."], "tip": null, "fig": null, "id": "religion-1", "topic": "religion"}, {"type": "obj", "q": "Religious bodies in Ghana contribute MOST to development by ___", "opts": ["collecting taxes", "printing the currency", "building and running schools and clinics", "conducting national elections"], "ans": 2, "sol": ["Mission schools, hospitals and vocational centres educate and treat a large share of Ghanaians."], "tip": null, "fig": null, "id": "religion-2", "topic": "religion"}, {"type": "obj", "q": "Religious tolerance means ___", "opts": ["worshipping only in public", "belonging to every religion at once", "respecting the beliefs and worship of others", "abandoning your own faith"], "ans": 2, "sol": ["Tolerance is respect for the right of others to believe differently, while keeping your own faith."], "tip": null, "fig": null, "id": "religion-3", "topic": "religion"}, {"type": "obj", "q": "A preacher tells sick members not to take medicine. This is an example of ___", "opts": ["sound medical advice", "a harmful religious practice", "religious tolerance", "moral uprightness"], "ans": 1, "sol": ["Beliefs that keep people from treatment cost lives; religion and medical care are not in competition."], "tip": null, "fig": null, "id": "religion-4", "topic": "religion"}, {"type": "obj", "q": "Which institution is the FIRST to teach a child right from wrong?", "opts": ["The family", "The school", "The church or mosque", "The district assembly"], "ans": 0, "sol": ["The family is the first agent of socialisation; religious bodies and schools build on what it starts."], "tip": null, "fig": null, "id": "religion-5", "topic": "religion"}, {"type": "thy", "q": "(a) Name the three main religions in Ghana and state two moral values each teaches.<br>(b) Explain four ways religious bodies contribute to national development.<br>(c) State three ways of promoting religious tolerance in a multi-religious country.", "sol": ["(a) <b>Christianity</b> — love for one's neighbour, honesty, forgiveness. <b>Islam</b> — charity (zakat), truthfulness, respect for parents and the needy. <b>African Traditional Religion</b> — respect for elders and the land, communal responsibility, truthfulness and hard work.", "(b) 1. <b>Education</b> — mission and Islamic schools educate a large share of Ghanaian children.", "2. <b>Health</b> — church and mosque clinics and hospitals serve rural communities.", "3. <b>Moral formation</b> — teaching honesty, hard work and respect, which reduces crime and corruption.", "4. <b>Welfare and peace</b> — supporting orphans, the aged and the poor, and mediating in national and community conflicts.", "(c) Teach about one another's beliefs in schools; observe and respect the major festivals of all faiths; include all faiths in national occasions and in peace councils; avoid insulting other people's worship in speech, music and on social media; punish incitement on religious grounds."], "marks": 20, "tip": null, "fig": null, "id": "religion-6", "topic": "religion"}], "syllabus": [{"section": "Section A — The Environment", "items": [{"t": "The environment and its components", "topic": "envcomp"}, {"t": "Environmental degradation and its control", "topic": "degrad"}, {"t": "Population growth and development", "topic":
