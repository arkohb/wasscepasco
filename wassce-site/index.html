<style>
html{color-scheme:light dark}
:root{padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
.sitefoot{max-width:1080px; margin:0 auto; padding:28px 16px 40px; font-size:13px; color:var(--ink-2);
  display:flex; flex-wrap:wrap; gap:6px 16px; align-items:center; border-top:1px solid var(--rule)}
.sitefoot a{color:var(--accent); font-weight:600; text-decoration:none}
.sitefoot a:hover{text-decoration:underline}
.sitefoot .sep{opacity:.5}

<title>WASSCE Core Four</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,600;0,700;1,400&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#EEF1EC; --card:#FFFFFF; --ink:#141C24; --ink-2:#4F6069; --rule:#D4DCD6;
  --grid:#E3EAE3; --graphite:#2A2F36;
  --ok:#0E7A4F; --ok-soft:#E1F1E8; --no:#C24A17; --no-soft:#FBE8DD;
  --accent:#B4295A; --accent-soft:#F7E4EB;
  --shadow:0 1px 2px rgba(20,28,36,.06),0 8px 20px -14px rgba(20,28,36,.30);
  --r:10px; --hh:150px;
}
:root[data-subject="english"]{--accent:#3A46A8; --accent-soft:#E7E9F8}
:root[data-subject="science"]{--accent:#0F7A66; --accent-soft:#DCF0EA}
:root[data-subject="social"]{--accent:#9A5B12; --accent-soft:#F6E9D6}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#11161A; --card:#192026; --ink:#E7ECE8; --ink-2:#9AAAB0; --rule:#2B353C;
    --grid:#222C33; --graphite:#C9D3D6;
    --ok:#54C08C; --ok-soft:#14302A; --no:#F0975C; --no-soft:#32231A;
    --accent:#FF7FA6; --accent-soft:#3A1F2A;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 24px -16px rgba(0,0,0,.8);
  }
  :root:not([data-theme="light"])[data-subject="english"]{--accent:#93A4FF; --accent-soft:#242B52}
  :root:not([data-theme="light"])[data-subject="science"]{--accent:#4FD1B0; --accent-soft:#0E2E27}
  :root:not([data-theme="light"])[data-subject="social"]{--accent:#E6A44E; --accent-soft:#33220E}
}
:root[data-theme="dark"]{
  --paper:#11161A; --card:#192026; --ink:#E7ECE8; --ink-2:#9AAAB0; --rule:#2B353C;
  --grid:#222C33; --graphite:#C9D3D6;
  --ok:#54C08C; --ok-soft:#14302A; --no:#F0975C; --no-soft:#32231A;
  --accent:#FF7FA6; --accent-soft:#3A1F2A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 24px -16px rgba(0,0,0,.8);
}
:root[data-theme="dark"][data-subject="english"]{--accent:#93A4FF; --accent-soft:#242B52}
:root[data-theme="dark"][data-subject="science"]{--accent:#4FD1B0; --accent-soft:#0E2E27}
:root[data-theme="dark"][data-subject="social"]{--accent:#E6A44E; --accent-soft:#33220E}
*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Public Sans",system-ui,-apple-system,Segoe UI,sans-serif; font-size:15px; line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
}
.wrap{max-width:1080px; margin:0 auto; padding:0 16px 64px}
h1,h2,h3{font-family:"STIX Two Text",Georgia,serif; text-wrap:balance; margin:0}
button{font:inherit; color:inherit; cursor:pointer}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}
.lbl{font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-2); font-weight:600}

header{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--paper); border-bottom:1px solid var(--rule)}
.hd{max-width:1080px; margin:0 auto; padding:12px 16px 0; display:flex; flex-wrap:wrap; gap:4px 16px; align-items:baseline}
.hd h1{font-size:22px; font-weight:700; letter-spacing:-.01em}
.hd .sub{font-size:12.5px; color:var(--ink-2); flex:1 1 240px}
.subjects{max-width:1080px; margin:0 auto; padding:9px 16px 0; display:flex; gap:6px; overflow-x:auto}
.sub-chip{display:flex; align-items:center; gap:7px; white-space:nowrap; background:var(--card); border:1px solid var(--rule);
  border-radius:999px; padding:5px 13px 5px 10px; font-size:13px; font-weight:600; color:var(--ink-2)}
.sub-chip i{width:9px; height:9px; border-radius:50%; background:var(--c); flex:none}
.sub-chip small{font-weight:500; opacity:.75; font-family:"IBM Plex Mono",monospace; font-size:11px}
.sub-chip[aria-pressed="true"]{border-color:var(--c); color:var(--ink); background:var(--accent-soft)}
.sub-chip:focus-visible,.tab:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.tabs{max-width:1080px; margin:0 auto; padding:6px 16px 0; display:flex; gap:4px; overflow-x:auto}
.tab{background:none; border:0; border-bottom:2px solid transparent; padding:7px 12px; font-weight:600; font-size:14px; color:var(--ink-2); white-space:nowrap}
.tab[aria-selected="true"]{color:var(--accent); border-color:var(--accent)}

.cols{display:grid; grid-template-columns:238px 1fr; gap:22px; margin-top:20px; align-items:start}
@media(max-width:780px){.cols{grid-template-columns:1fr}}
.side{position:sticky; top:calc(env(safe-area-inset-top,0px) + var(--hh)); max-height:76vh; overflow:auto; padding-right:4px}
@media(max-width:780px){.side{position:static; max-height:none}}
.sec-h{margin:16px 0 6px}
.tbtn{display:flex; width:100%; gap:8px; align-items:center; text-align:left; background:none; border:0; border-radius:8px; padding:6px 8px; font-size:13.5px; line-height:1.3}
.tbtn:hover{background:var(--accent-soft)}
.tbtn[aria-current="true"]{background:var(--accent); color:#fff; font-weight:600}
.tbtn[aria-current="true"] .bar i{background:#fff}
.tbtn span:first-child{flex:1}
.bar{width:34px; height:5px; border-radius:3px; background:var(--rule); overflow:hidden; flex:none}
.bar i{display:block; height:100%; background:var(--ok)}

.card{background:var(--card); border:1px solid var(--rule); border-radius:var(--r); box-shadow:var(--shadow)}
.pad{padding:18px}
@media(max-width:480px){.pad{padding:14px}}
.topic-head{display:flex; flex-wrap:wrap; gap:10px 16px; align-items:flex-end; justify-content:space-between; margin-bottom:14px}
.topic-head h2{font-size:26px}
.facts{border-left:3px solid var(--accent); background:var(--card); border-radius:0 var(--r) var(--r) 0; padding:12px 16px; margin:0 0 18px}
.facts ul{margin:6px 0 0; padding-left:18px}
.facts li{margin:3px 0; font-family:"STIX Two Text",Georgia,serif; font-size:15.5px}
.seg{display:inline-flex; border:1px solid var(--rule); border-radius:999px; background:var(--card); padding:3px; gap:2px}
.seg button{border:0; background:none; border-radius:999px; padding:5px 14px; font-size:13px; font-weight:600; color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--graphite); color:var(--paper)}

.q{margin:14px 0; overflow:hidden}
.q-top{display:flex; gap:12px; padding:16px 18px 6px}
.num{flex:none; width:28px; height:28px; border-radius:50%; border:1.5px solid var(--rule); display:grid; place-items:center; font-size:12px; font-weight:600}
.stem{font-family:"STIX Two Text",Georgia,serif; font-size:17px; line-height:1.5; flex:1}
.opts{list-style:none; margin:4px 0 0; padding:0 18px 12px 58px}
@media(max-width:480px){.opts{padding-left:18px}}
.opt{display:flex; gap:10px; align-items:center; width:100%; text-align:left; background:none; border:1px solid transparent; border-radius:8px; padding:7px 10px; margin:2px 0; font-family:"STIX Two Text",Georgia,serif; font-size:16px}
.opt:hover:not(:disabled){border-color:var(--rule); background:var(--paper)}
.opt:disabled{cursor:default}
.bub{flex:none; width:27px; height:27px; border-radius:50%; border:1.6px solid var(--accent); display:grid; place-items:center;
     font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--accent); transition:background .12s,color .12s}
.opt.picked .bub{background:var(--graphite); border-color:var(--graphite); color:var(--paper)}
.opt.right{background:var(--ok-soft); border-color:var(--ok)}
.opt.right .bub{background:var(--ok); border-color:var(--ok); color:#fff}
.opt.wrong{background:var(--no-soft); border-color:var(--no)}
.opt.wrong .bub{background:var(--no); border-color:var(--no); color:#fff}
.mark{margin-left:auto; font-size:12px; font-weight:700; letter-spacing:.04em; text-transform:uppercase}
.opt.right .mark{color:var(--ok)} .opt.wrong .mark{color:var(--no)}
.qfoot{display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:0 18px 14px 58px}
@media(max-width:480px){.qfoot{padding-left:18px}}
.ghost{background:none; border:1px solid var(--rule); border-radius:999px; padding:5px 13px; font-size:12.5px; font-weight:600; color:var(--ink-2)}
.ghost:hover{border-color:var(--accent); color:var(--accent)}
.ghost.on{background:var(--accent); border-color:var(--accent); color:#fff}
.sol{border-top:1px dashed var(--rule); background:var(--paper); padding:14px 18px 16px}
.sol .lbl{display:block; margin-bottom:6px}
.sol ol{margin:0; padding-left:20px; font-family:"STIX Two Text",Georgia,serif; font-size:16px}
.sol li{margin:5px 0}
.tip{margin-top:10px; font-size:13px; color:var(--ink-2); border-left:2px solid var(--accent); padding-left:10px}
.marks{font-size:11.5px; font-weight:700; color:var(--accent); letter-spacing:.05em}

.fr{display:inline-flex; flex-direction:column; vertical-align:middle; text-align:center; font-size:.92em; line-height:1.15; margin:0 .18em}
.fr>span:first-child{border-bottom:1.2px solid currentColor; padding:0 .25em}
.fr>span:last-child{padding:0 .25em}
.ov{border-top:1.1px solid currentColor; padding:0 .1em}
.mx{display:inline-grid; gap:.15em; vertical-align:middle; padding:.2em .3em; margin:0 .15em;
    border-left:1.6px solid currentColor; border-right:1.6px solid currentColor; border-radius:5px/9px}
.mr{display:flex; gap:.7em; justify-content:center}
table.mt{border-collapse:collapse; margin:8px 0; font-family:"IBM Plex Mono",monospace; font-size:13px}
table.mt th,table.mt td{border:1px solid var(--rule); padding:4px 9px; text-align:center; min-width:34px}
table.mt th{background:var(--paper); font-weight:600}
.scroll{overflow-x:auto; -webkit-overflow-scrolling:touch}
svg.graph{max-width:100%; width:330px; height:auto; margin:10px 0; background:var(--card); border:1px solid var(--rule); border-radius:8px}
.gg{stroke:var(--grid); stroke-width:1}
.ga{stroke:var(--ink-2); stroke-width:1.3}
.gc{fill:none; stroke:var(--accent); stroke-width:2}
.gl{stroke:var(--ink-2); stroke-width:1.6; stroke-dasharray:5 3}
.gs{fill:var(--accent); opacity:.14; stroke:none}
.gp{fill:var(--accent)}
.gt{fill:var(--ink-2); font-family:"IBM Plex Mono",monospace; font-size:10px}
.gpt{fill:var(--ink); font-weight:600}
.passage{background:var(--paper); border:1px solid var(--rule); border-radius:8px; padding:12px 15px; margin:10px 0;
  font-family:"STIX Two Text",Georgia,serif; font-size:16px; line-height:1.65}
.passage p{margin:.5em 0}
.passage .lbl{display:block; margin-bottom:5px}
.model{background:var(--card); border:1px solid var(--rule); border-left:3px solid var(--ok); border-radius:0 8px 8px 0; padding:10px 14px; margin:8px 0}

.mockbar{display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; justify-content:space-between; padding:12px 16px; position:sticky;
         top:calc(env(safe-area-inset-top,0px) + var(--hh) - 8px); z-index:10; background:var(--card); border:1px solid var(--rule); border-radius:var(--r)}
.clock{font-family:"IBM Plex Mono",monospace; font-size:24px; font-weight:500}
.clock.low{color:var(--no)}
.sheet{display:grid; grid-template-columns:repeat(auto-fill,minmax(38px,1fr)); gap:5px; margin-top:12px}
.cell{border:1px solid var(--rule); background:var(--card); border-radius:6px; padding:5px 0; font-family:"IBM Plex Mono",monospace; font-size:11.5px; text-align:center}
.cell.done{background:var(--graphite); color:var(--paper); border-color:var(--graphite)}
.cell.here{outline:2px solid var(--accent); outline-offset:1px}
.btn{background:var(--accent); color:#fff; border:0; border-radius:999px; padding:9px 20px; font-weight:700; font-size:14px}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:var(--graphite); color:var(--paper)}
.big{font-family:"STIX Two Text",Georgia,serif; font-size:44px; font-weight:700; line-height:1}
.row{display:flex; flex-wrap:wrap; gap:12px; align-items:center}
.stat{flex:1 1 130px; border:1px solid var(--rule); border-radius:var(--r); padding:12px 14px; background:var(--card)}
.stat .v{font-family:"IBM Plex Mono",monospace; font-size:22px; font-weight:500}
.plist{display:grid; gap:8px; margin-top:14px}
.prow{display:grid; grid-template-columns:1fr 92px 46px; gap:10px; align-items:center; padding:8px 12px; border:1px solid var(--rule); border-radius:8px; background:var(--card); font-size:13.5px}
.prow .bar{width:100%; height:7px}
.prow .dot{width:9px; height:9px; border-radius:50%; background:var(--c); display:inline-block; margin-right:7px}
.note{font-size:12.5px; color:var(--ink-2)}
.warn{border:1px solid var(--rule); border-left:3px solid var(--accent); border-radius:0 var(--r) var(--r) 0; background:var(--card); padding:12px 16px; margin:18px 0; font-size:13.5px}

.plain{background:var(--accent-soft); border-radius:var(--r); padding:12px 16px; margin:0 0 14px;
  font-family:"STIX Two Text",Georgia,serif; font-size:16.5px; line-height:1.55}
.plain .lbl{display:block; margin-bottom:4px; color:var(--accent)}
.ex{margin:12px 0}
.exhead{display:flex; justify-content:space-between; align-items:baseline; gap:10px; padding:13px 18px 0}
.exq{font-family:"STIX Two Text",Georgia,serif; font-size:16.5px; padding:6px 18px 0; line-height:1.5}
.ex .steps{padding:2px 18px 14px; font-family:"STIX Two Text",Georgia,serif; font-size:16px}
.ex .steps p{margin:7px 0 7px 2px; padding-left:10px; border-left:2px solid var(--accent-soft)}
.figwrap{padding:2px 18px 12px; text-align:center}
.dia{max-width:100%; height:auto; margin:8px 0; background:var(--card); border:1px solid var(--rule); border-radius:8px}
.dbox{fill:var(--paper); stroke:var(--rule); stroke-width:1.2}
.dfill{fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.4}
.dline{fill:none; stroke:var(--ink-2); stroke-width:1.6}
.dacc{fill:none; stroke:var(--accent); stroke-width:2}
.ddash{fill:none; stroke:var(--ink-2); stroke-width:1.3; stroke-dasharray:4 3}
.dtxt{fill:var(--ink); font-family:"Public Sans",system-ui,sans-serif; font-size:11px}
.dmut{fill:var(--ink-2); font-family:"Public Sans",system-ui,sans-serif; font-size:10px}
.dah{fill:var(--ink-2); stroke:none}
.dsolidpt{fill:var(--accent); stroke:none}
.dopenpt{fill:var(--card); stroke:var(--accent); stroke-width:2}

.syl{display:grid; gap:7px; margin-top:8px}
.sylrow{display:grid; grid-template-columns:16px 1fr auto; gap:10px; align-items:baseline; width:100%;
  padding:9px 12px; border:1px solid var(--rule); border-radius:8px; background:var(--card); font-size:14px; text-align:left}
.sylrow:hover{border-color:var(--accent)}
.sylrow .tick{color:var(--ok); font-weight:700}
.sylrow .cnt{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-2); white-space:nowrap}
.sylrow .where{display:block; font-size:12px; color:var(--ink-2); margin-top:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
</style>
</head>
<body>
<header>
  <div class="hd">
    <h1>WASSCE Core Four</h1>
    <span class="sub" id="subline"></span>
  </div>
  <nav class="subjects" id="subjects" aria-label="Subject"></nav>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-topics" aria-selected="true" data-view="topics">Topics</button>
    <button class="tab" role="tab" id="tab-syllabus" aria-selected="false" data-view="syllabus">Syllabus</button>
    <button class="tab" role="tab" id="tab-mock" aria-selected="false" data-view="mock">Mock Paper 1</button>
    <button class="tab" role="tab" id="tab-progress" aria-selected="false" data-view="progress">Progress</button>
  </nav>
</header>

<div class="wrap">
  <section id="view-topics">
    <div class="cols">
      <aside class="side" id="side"></aside>
      <main id="panel"></main>
    </div>
  </section>
  <section id="view-syllabus" hidden></section>
  <section id="view-mock" hidden></section>
  <section id="view-progress" hidden></section>

<script id="bank" type="application/json">{"subjects": [{"id": "maths", "name": "Core Maths", "dot": "#D14A76", "sub": "244 original practice questions with full working — WAEC Core Mathematics syllabus. Not official past papers.", "cfg": {"objSolLabel": "Working", "objSolBtn": "working", "thySolLabel": "Worked solution", "thySolBtn": "worked solution", "mockTab": "Mock Paper 1", "mockN": 50, "mockMins": 90, "quickN": 20, "quickMins": 30, "mockBlurb": "50 objective questions in 1 hour 30 minutes — the shape of WAEC Paper 1. Questions are drawn at random from all 28 topics, and the paper is marked as soon as you submit.", "paperNote": "Paper 1 is 50 marks out of the 150 for the whole subject.", "theoryNote": "Work each question on paper first, then check the steps. In Paper 2 you must show your working to earn method marks.", "about": "<b>About these questions.</b> They are original practice questions written to the WAEC Core Mathematics syllabus and to the format of Paper 1 (50 objectives, 1½ h) and Paper 2 (13 theory questions, 2½ h). They are <b>not</b> reproductions of past WASSCE papers — for those, use WAEC's own e-learning portal and the past-question booklets sold by WAEC Ghana."}, "topics": [{"id": "bases", "name": "Number bases", "section": "Number & Numeration", "notes": ["Place values in base b are …, b<sup>2</sup>, b<sup>1</sup>, b<sup>0</sup> . b<sup>−1</sup>, b<sup>−2</sup> …", "Base b → base 10: multiply each digit by its place value and add.", "Base 10 → base b: divide repeatedly by b and read the remainders from the bottom up.", "A digit in base b must be less than b (base 5 uses only 0–4)."], "plain": "A number base tells you how many digits a counting system uses. We normally count in base ten (digits 0–9). In base five you only have 0, 1, 2, 3 and 4 — so after 4 you start a new column.", "examples": [{"q": "Change 324 in base five to base ten.", "steps": ["Step 1. Write the place values from the right: 5<sup>0</sup> = 1, 5<sup>1</sup> = 5, 5<sup>2</sup> = 25.", "Step 2. Multiply each digit by its place value: 3 × 25 = 75, 2 × 5 = 10, 4 × 1 = 4.", "Step 3. Add them: 75 + 10 + 4 = <b>89</b>."], "fig": null}, {"q": "Change 89 to base five.", "steps": ["Step 1. Divide by 5 again and again, writing the remainder each time.", "89 ÷ 5 = 17 remainder <b>4</b>;  17 ÷ 5 = 3 remainder <b>2</b>;  3 ÷ 5 = 0 remainder <b>3</b>.", "Step 2. Read the remainders from the BOTTOM upwards: <b>324 in base five</b>.", "Step 3. Check: it takes you back to 89, which is where you started."], "fig": null}], "fig": "<svg viewBox=\"0 0 514 96\" class=\"dia\" role=\"img\" aria-label=\"Division method for base conversion\" style=\"width:min(100%,520px)\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5.5\" markerHeight=\"5.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dah\"/></marker></defs><text x=\"257.0\" y=\"15.0\" class=\"dmut\" text-anchor=\"middle\" style=\"font-size:12px\">Changing 89 to base five</text><rect x=\"10\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"62.0\" y=\"49.0\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">89 ÷ 5 = 17 r</text><text x=\"62.0\" y=\"64.0\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">4</text><rect x=\"140\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"192.0\" y=\"56.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">17 ÷ 5 = 3 r 2</text><line x1=\"117.0\" y1=\"53.0\" x2=\"136.0\" y2=\"53.0\" class=\"dline\" marker-end=\"url(#ah)\"/><rect x=\"270\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"322.0\" y=\"56.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">3 ÷ 5 = 0 r 3</text><line x1=\"247.0\" y1=\"53.0\" x2=\"266.0\" y2=\"53.0\" class=\"dline\" marker-end=\"url(#ah)\"/><rect x=\"400\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"452.0\" y=\"56.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Read up: 324</text><line x1=\"377.0\" y1=\"53.0\" x2=\"396.0\" y2=\"53.0\" class=\"dline\" marker-end=\"url(#ah)\"/></svg>"}, {"id": "mod", "name": "Modular arithmetic", "section": "Number & Numeration", "notes": ["a ≡ b (mod m) means a and b leave the same remainder when divided by m.", "Reduce each number first, then add or multiply, then reduce again.", "Days of the week work in mod 7; a 12-hour clock works in mod 12.", "The multiplicative inverse of a (mod m) is the number b with ab ≡ 1 (mod m)."], "plain": "Modulo arithmetic is clock arithmetic. In mod 5 the only answers are 0, 1, 2, 3 and 4 — when you pass 4 you go back to 0, just as a clock goes back to 1 after 12.", "examples": [{"q": "Find 27 (mod 5).", "steps": ["Step 1. Ask: how many complete 5s are in 27?  5 × 5 = 25.", "Step 2. What is left over? 27 − 25 = 2.", "So 27 ≡ <b>2</b> (mod 5)."], "fig": null}, {"q": "Today is Tuesday. What day will it be in 45 days?", "steps": ["Step 1. Days repeat every 7, so work in mod 7.", "Step 2. 45 ÷ 7 = 6 remainder 3, so 45 ≡ 3 (mod 7).", "Step 3. Count 3 days from Tuesday: Wednesday, Thursday, <b>Friday</b>."], "fig": null}], "fig": "<svg viewBox=\"0 0 260 260\" class=\"dia\" role=\"img\" aria-label=\"Modulo 5 clock\" style=\"width:min(100%,299px)\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5.5\" markerHeight=\"5.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dah\"/></marker></defs><circle cx=\"130.0\" cy=\"130.0\" r=\"82\" class=\"ddash\"/><text x=\"130.0\" y=\"133.5\" class=\"dmut\" text-anchor=\"middle\">mod 5</text><rect x=\"84.0\" y=\"31.0\" width=\"92\" height=\"34\" rx=\"7\" class=\"dfill\"/><text x=\"130.0\" y=\"51.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">0</text><path d=\"M172.4,35.0 A104,104 0 0 1 207.2,60.3\" class=\"dline\" marker-end=\"url(#ah)\"/><rect x=\"162.0\" y=\"87.7\" width=\"92\" height=\"34\" rx=\"7\" class=\"dfill\"/><text x=\"208.0\" y=\"108.2\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">1</text><path d=\"M233.4,141.0 A104,104 0 0 1 220.1,181.9\" class=\"dline\" marker-end=\"url(#ah)\"/><rect x=\"132.2\" y=\"179.3\" width=\"92\" height=\"34\" rx=\"7\" class=\"dfill\"/><text x=\"178.2\" y=\"199.8\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">2</text><path d=\"M151.5,231.8 A104,104 0 0 1 108.5,231.8\" class=\"dline\" marker-end=\"url(#ah)\"/><rect x=\"35.8\" y=\"179.3\" width=\"92\" height=\"34\" rx=\"7\" class=\"dfill\"/><text x=\"81.8\" y=\"199.8\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">3</text><path d=\"M39.9,181.9 A104,104 0 0 1 26.6,141.0\" class=\"dline\" marker-end=\"url(#ah)\"/><rect x=\"6.0\" y=\"87.7\" width=\"92\" height=\"34\" rx=\"7\" class=\"dfill\"/><text x=\"52.0\" y=\"108.2\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">4</text><path d=\"M52.8,60.3 A104,104 0 0 1 87.6,35.0\" class=\"dline\" marker-end=\"url(#ah)\"/></svg>"}, {"id": "approx", "name": "Fractions, decimals & approximation", "section": "Number & Numeration", "notes": ["To divide by a fraction, multiply by its reciprocal.", "Standard form: A × 10<sup>n</sup> with 1 ≤ A < 10.", "Significant figures start from the first non-zero digit; decimal places count from the point.", "Percentage error = (error ÷ actual value) × 100%.", "Recurring decimal: 0.ab ab ab… = ab/99."], "plain": "Approximation is about giving an answer that is close enough and easy to read. Significant figures count from the first non-zero digit; decimal places count after the point.", "examples": [{"q": "Round 0.04836 to (a) 2 significant figures (b) 3 decimal places.", "steps": ["(a) The first significant figure is 4, the second is 8. The next digit is 3, which is less than 5, so 8 stays.", "Answer: <b>0.048</b>", "(b) Three places after the point gives 0.048, and the next digit is 3, so it stays.", "Answer: <b>0.048</b>"], "fig": null}, {"q": "A tank holds 2.5 litres but was measured as 2.4 litres. Find the percentage error.", "steps": ["Step 1. Error = 2.5 − 2.4 = 0.1 litres.", "Step 2. Percentage error = <span class=\"fr\"><span>error</span><span>true value</span></span> × 100 = <span class=\"fr\"><span>0.1</span><span>2.5</span></span> × 100.", "Step 3. = <b>4%</b>"], "fig": null}]}, {"id": "intfac", "name": "Integers, factors & multiples", "section": "Number & Numeration", "notes": ["Integers are whole numbers and their negatives: … −3, −2, −1, 0, 1, 2, 3 …", "A factor divides a number exactly; a multiple is what you get when you multiply it.", "Prime numbers have exactly two factors: 2, 3, 5, 7, 11, 13 … (1 is NOT prime).", "HCF = product of the COMMON prime factors, taking the LOWEST power of each.", "LCM = product of ALL prime factors, taking the HIGHEST power of each.", "Rules of signs: (−) × (−) = (+);  (−) × (+) = (−);  a − (−b) = a + b"], "plain": "Factors divide into a number; multiples come out of it. HCF is the biggest number that divides them all, and LCM is the smallest number they all divide into. Prime factors make both easy to find.", "examples": [{"q": "Find the HCF and LCM of 18 and 24 using prime factors.", "steps": ["Step 1. Break each one down: 18 = 2 × 3 × 3 = 2 × 3<sup>2</sup>;  24 = 2 × 2 × 2 × 3 = 2<sup>3</sup> × 3.", "Step 2. HCF — take only the primes in BOTH, at the lowest power: 2 × 3 = <b>6</b>.", "Step 3. LCM — take every prime at its highest power: 2<sup>3</sup> × 3<sup>2</sup> = 8 × 9 = <b>72</b>.", "Step 4. Check: 6 divides both; both divide 72."], "fig": null}, {"q": "A trader has 48 oranges and 60 mangoes. She wants to make identical packs with nothing left over. What is the largest number of packs, and what goes into each?", "steps": ["Step 1. 'Largest number of equal packs with nothing left' means HCF.", "Step 2. 48 = 2<sup>4</sup> × 3;  60 = 2<sup>2</sup> × 3 × 5 ⇒ HCF = 2<sup>2</sup> × 3 = 12.", "Step 3. So <b>12 packs</b>, each with 48 ÷ 12 = <b>4 oranges</b> and 60 ÷ 12 = <b>5 mangoes</b>."], "fig": null}]}, {"id": "indices", "name": "Indices", "section": "Number & Numeration", "notes": ["a<sup>m</sup> × a<sup>n</sup> = a<sup>m+n</sup>;  a<sup>m</sup> ÷ a<sup>n</sup> = a<sup>m−n</sup>;  (a<sup>m</sup>)<sup>n</sup> = a<sup>mn</sup>", "a<sup>0</sup> = 1;  a<sup>−n</sup> = 1/a<sup>n</sup>;  a<sup>m/n</sup> = (ⁿ√a)<sup>m</sup>", "For exponential equations, write both sides with the same base and equate the powers.", "Equations like 5<sup>2x</sup> − 6(5<sup>x</sup>) + 5 = 0 become quadratics: let y = 5<sup>x</sup>."], "plain": "An index (power) tells you how many times a number multiplies itself: 2<sup>4</sup> means 2 × 2 × 2 × 2. The rules simply save you from writing all those multiplications.", "examples": [{"q": "Simplify 2<sup>5</sup> × 2<sup>3</sup> ÷ 2<sup>6</sup>.", "steps": ["Step 1. When multiplying, ADD the powers: 2<sup>5</sup> × 2<sup>3</sup> = 2<sup>5+3</sup> = 2<sup>8</sup>.", "Step 2. When dividing, SUBTRACT: 2<sup>8</sup> ÷ 2<sup>6</sup> = 2<sup>8−6</sup> = 2<sup>2</sup>.", "Step 3. 2<sup>2</sup> = <b>4</b>."], "fig": null}, {"q": "Solve 3<sup>x+2</sup> = 81.", "steps": ["Step 1. Write 81 as a power of 3: 81 = 3<sup>4</sup>.", "Step 2. Now both sides have base 3: 3<sup>x+2</sup> = 3<sup>4</sup>.", "Step 3. Equal bases ⇒ equal powers: x + 2 = 4 ⇒ <b>x = 2</b>."], "fig": null}]}, {"id": "logs", "name": "Logarithms", "section": "Number & Numeration", "notes": ["log_a x = n means a<sup>n</sup> = x.", "log(xy) = log x + log y;  log(x/y) = log x − log y;  log x<sup>n</sup> = n log x", "log_a a = 1 and log_a 1 = 0.", "Change of base: log_a x = log x ÷ log a.", "Always check that solutions keep every log argument positive."], "plain": "A logarithm answers the question: 'to what power must I raise this base to get that number?' So log₂ 8 = 3 because 2³ = 8. A log is just an index written the other way round.", "examples": [{"q": "Evaluate log<sub>5</sub> 125.", "steps": ["Step 1. Ask: 5 to what power gives 125?", "Step 2. 5 × 5 × 5 = 125, so the power is 3.", "log<sub>5</sub> 125 = <b>3</b>"], "fig": null}, {"q": "Given log 2 = 0.3010 and log 5 = 0.6990, find log 40 without tables.", "steps": ["Step 1. Break 40 into numbers you know: 40 = 2<sup>3</sup> × 5.", "Step 2. Use the rules: log 40 = 3 log 2 + log 5.", "Step 3. = 3(0.3010) + 0.6990 = 0.9030 + 0.6990 = <b>1.6020</b>"], "fig": null}]}, {"id": "surds", "name": "Surds", "section": "Number & Numeration", "notes": ["√(ab) = √a × √b;  simplify by pulling out square factors: √75 = √25 × √3 = 5√3.", "Only like surds can be added: 5√3 − 3√3 = 2√3.", "(√a + √b)(√a − √b) = a − b — use the conjugate to rationalise.", "a/√b = a√b / b."], "plain": "A surd is a root that cannot be worked out exactly, such as √2 or √3. We leave it as a root and tidy it up instead of using a decimal, so the answer stays exact.", "examples": [{"q": "Simplify √200.", "steps": ["Step 1. Look for a square number that divides 200: 100 × 2 = 200.", "Step 2. √200 = √100 × √2.", "Step 3. √100 = 10, so √200 = <b>10√2</b>."], "fig": null}, {"q": "Rationalise <span class=\"fr\"><span>3</span><span>2 − √5</span></span>.", "steps": ["Step 1. Multiply top and bottom by the conjugate, 2 + √5.", "Step 2. Bottom: (2 − √5)(2 + √5) = 4 − 5 = −1.", "Step 3. Top: 3(2 + √5) = 6 + 3√5.", "Step 4. <span class=\"fr\"><span>6 + 3√5</span><span>−1</span></span> = <b>−6 − 3√5</b>"], "fig": null}]}, {"id": "seq", "name": "Sequences & series", "section": "Number & Numeration", "notes": ["AP: T_n = a + (n − 1)d;  S_n = n/2 [2a + (n − 1)d]", "GP: T_n = ar<sup>n−1</sup>;  S_n = a(r<sup>n</sup> − 1)/(r − 1)", "Sum to infinity (|r| < 1): S_∞ = a/(1 − r)", "If x, y, z are consecutive AP terms, 2y = x + z; for GP, y<sup>2</sup> = xz."], "plain": "A sequence is a list of numbers that follows a rule. In an AP you ADD the same number each time; in a GP you MULTIPLY by the same number each time.", "examples": [{"q": "Find the 12th term of 7, 10, 13, 16, …", "steps": ["Step 1. Check the type: 10 − 7 = 3 and 13 − 10 = 3, so it is an AP with d = 3, a = 7.", "Step 2. Use T_n = a + (n − 1)d.", "Step 3. T<sub>12</sub> = 7 + 11 × 3 = 7 + 33 = <b>40</b>."], "fig": null}, {"q": "Find the sum of the first 5 terms of 3, 6, 12, 24, …", "steps": ["Step 1. 6 ÷ 3 = 2 and 12 ÷ 6 = 2, so it is a GP with a = 3, r = 2.", "Step 2. S_n = <span class=\"fr\"><span>a(r<sup>n</sup> − 1)</span><span>r − 1</span></span> = <span class=\"fr\"><span>3(2<sup>5</sup> − 1)</span><span>2 − 1</span></span>", "Step 3. = 3(32 − 1) = 3 × 31 = <b>93</b>."], "fig": null}]}, {"id": "sets", "name": "Sets", "section": "Number & Numeration", "notes": ["n(A ∪ B) = n(A) + n(B) − n(A ∩ B)", "Three sets: n(A∪B∪C) = ΣnA − Σn(pairs) + n(A∩B∩C)", "A set with n elements has 2<sup>n</sup> subsets.", "A′ (complement) contains the elements of U that are not in A.", "In Venn diagram problems, fill in the centre (all three) first and work outwards."], "plain": "A set is simply a group of things. Venn diagrams let you SEE the groups: the overlap holds the members that belong to both, and everything is drawn inside the universal set.", "examples": [{"q": "In a class of 40, 22 play football, 18 play volleyball and 5 play both. How many play neither?", "steps": ["Step 1. Fill the middle first: 5 play both.", "Step 2. Football only = 22 − 5 = 17.  Volleyball only = 18 − 5 = 13.", "Step 3. Players inside the circles = 17 + 5 + 13 = 35.", "Step 4. Neither = 40 − 35 = <b>5</b>."], "fig": "<svg viewBox=\"0 0 300 190\" class=\"dia\" role=\"img\" aria-label=\"Football and volleyball\" style=\"width:min(100%,345px)\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5.5\" markerHeight=\"5.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dah\"/></marker></defs><rect x=\"6\" y=\"6\" width=\"288\" height=\"178\" rx=\"6\" class=\"dbox\"/><circle cx=\"118\" cy=\"95\" r=\"62\" class=\"dfill\" fill-opacity=\"0.45\"/><circle cx=\"182\" cy=\"95\" r=\"62\" class=\"dfill\" fill-opacity=\"0.45\"/><text x=\"78.0\" y=\"30.0\" class=\"dtxt\" text-anchor=\"middle\">Football</text><text x=\"224.0\" y=\"30.0\" class=\"dtxt\" text-anchor=\"middle\">Volleyball</text><text x=\"88.0\" y=\"100.0\" class=\"dtxt\" text-anchor=\"middle\">17</text><text x=\"150.0\" y=\"100.0\" class=\"dtxt\" text-anchor=\"middle\">5</text><text x=\"212.0\" y=\"100.0\" class=\"dtxt\" text-anchor=\"middle\">13</text><text x=\"276.0\" y=\"174.0\" class=\"dmut\" text-anchor=\"middle\">5</text><text x=\"20.0\" y=\"22.0\" class=\"dmut\" text-anchor=\"middle\">U</text></svg>"}, {"q": "If n(A) = 18, n(B) = 14 and n(A ∪ B) = 25, find n(A ∩ B).", "steps": ["Step 1. Use n(A ∪ B) = n(A) + n(B) − n(A ∩ B).", "Step 2. 25 = 18 + 14 − n(A ∩ B) = 32 − n(A ∩ B).", "Step 3. n(A ∩ B) = 32 − 25 = <b>7</b>."], "fig": null}]}, {"id": "logic", "name": "Logical reasoning", "section": "Number & Numeration", "notes": ["Negation of 'All X are Y' is 'Some X are not Y'.", "p → q is false only when p is true and q is false.", "Converse: q → p.  Inverse: ~p → ~q.  Contrapositive: ~q → ~p (equivalent to p → q).", "Use Venn diagrams to test whether a conclusion must follow."], "plain": "Logic is about deciding whether an argument really follows. Drawing a Venn diagram of the statements is the quickest way to see whether a conclusion must be true.", "examples": [{"q": "'All teachers are graduates. Kofi is a teacher.' What follows?", "steps": ["Step 1. Draw the graduates circle, and put the teachers circle completely inside it.", "Step 2. Kofi is inside the teachers circle, so he must also be inside the graduates circle.", "Conclusion: <b>Kofi is a graduate</b>. (Note that 'All graduates are teachers' does NOT follow.)"], "fig": "<svg viewBox=\"0 0 300 190\" class=\"dia\" role=\"img\" aria-label=\"All teachers are graduates\" style=\"width:min(100%,345px)\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5.5\" markerHeight=\"5.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dah\"/></marker></defs><rect x=\"6\" y=\"6\" width=\"288\" height=\"178\" rx=\"6\" class=\"dbox\"/><circle cx=\"118\" cy=\"95\" r=\"62\" class=\"dfill\" fill-opacity=\"0.45\"/><circle cx=\"182\" cy=\"95\" r=\"62\" class=\"dfill\" fill-opacity=\"0.45\"/><text x=\"78.0\" y=\"30.0\" class=\"dtxt\" text-anchor=\"middle\">Graduates</text><text x=\"224.0\" y=\"30.0\" class=\"dtxt\" text-anchor=\"middle\">Teachers</text><text x=\"88.0\" y=\"100.0\" class=\"dtxt\" text-anchor=\"middle\"></text><text x=\"150.0\" y=\"100.0\" class=\"dtxt\" text-anchor=\"middle\">Kofi</text><text x=\"212.0\" y=\"100.0\" class=\"dtxt\" text-anchor=\"middle\"></text></svg>"}, {"q": "Write the converse and the contrapositive of 'If a triangle is equilateral, then it is isosceles.'", "steps": ["Step 1. Name the parts: p = 'the triangle is equilateral', q = 'it is isosceles'.", "Step 2. Converse (q → p): If a triangle is isosceles, then it is equilateral. (This one is false.)", "Step 3. Contrapositive (~q → ~p): If a triangle is not isosceles, then it is not equilateral. (This is always true when the original is true.)"], "fig": null}]}, {"id": "matrix", "name": "Matrices & determinants", "section": "Number & Numeration", "notes": ["For A = [a b; c d], the determinant |A| = ad − bc.", "A<sup>−1</sup> = (1/|A|)[d −b; −c a]; A has no inverse when |A| = 0 (a singular matrix).", "Multiply row × column: (AB)<sub>ij</sub> = row i of A · column j of B.", "To solve ax + by = p, cx + dy = q, write X = A<sup>−1</sup>B."], "plain": "A matrix is a box of numbers arranged in rows and columns. It is a neat way of handling several numbers at once — for example, solving two equations in one go.", "examples": [{"q": "Given A = <span class=\"mx\"><span class=\"mr\"><span>2</span><span>3</span></span><span class=\"mr\"><span>1</span><span>4</span></span></span>, find |A| and A<sup>−1</sup>.", "steps": ["Step 1. |A| = (2 × 4) − (3 × 1) = 8 − 3 = <b>5</b>.", "Step 2. For the inverse: swap 2 and 4, change the signs of 3 and 1.", "Step 3. A<sup>−1</sup> = <span class=\"fr\"><span>1</span><span>5</span></span><span class=\"mx\"><span class=\"mr\"><span>4</span><span>−3</span></span><span class=\"mr\"><span>−1</span><span>2</span></span></span>"], "fig": null}, {"q": "Find 3P − Q where P = <span class=\"mx\"><span class=\"mr\"><span>1</span><span>2</span></span><span class=\"mr\"><span>0</span><span>3</span></span></span> and Q = <span class=\"mx\"><span class=\"mr\"><span>2</span><span>−1</span></span><span class=\"mr\"><span>4</span><span>5</span></span></span>.", "steps": ["Step 1. Multiply every number in P by 3: 3P = <span class=\"mx\"><span class=\"mr\"><span>3</span><span>6</span></span><span class=\"mr\"><span>0</span><span>9</span></span></span>.", "Step 2. Subtract the matching numbers of Q.", "Step 3. 3P − Q = <span class=\"mx\"><span class=\"mr\"><span>3−2</span><span>6+1</span></span><span class=\"mr\"><span>0−4</span><span>9−5</span></span></span> = <b><span class=\"mx\"><span class=\"mr\"><span>1</span><span>7</span></span><span class=\"mr\"><span>−4</span><span>4</span></span></span></b>"], "fig": null}]}, {"id": "fin", "name": "Ratio, percentages & financial arithmetic", "section": "Number & Numeration", "notes": ["Simple interest I = PRT/100;  amount A = P + I", "Compound interest A = P(1 + r/100)<sup>n</sup>;  depreciation A = P(1 − r/100)<sup>n</sup>", "Profit % = (profit ÷ cost price) × 100%", "Hire purchase price = deposit + total of the instalments", "To share in the ratio a : b : c, the parts are a/(a+b+c), b/(a+b+c), c/(a+b+c) of the whole."], "plain": "Financial arithmetic is everyday money maths: sharing money, working out profit, discount, interest on savings and the extra you pay when you buy on hire purchase.", "examples": [{"q": "A trader bought a bag of rice for GH₵ 420 and sold it for GH₵ 483. Find the percentage profit.", "steps": ["Step 1. Profit = selling price − cost price = 483 − 420 = GH₵ 63.", "Step 2. Percentage profit = <span class=\"fr\"><span>profit</span><span>cost price</span></span> × 100 = <span class=\"fr\"><span>63</span><span>420</span></span> × 100.", "Step 3. = <b>15%</b>  (always divide by the COST price)."], "fig": null}, {"q": "GH₵ 8,000 is saved at 9% per annum simple interest for 4 years. Find the amount.", "steps": ["Step 1. I = <span class=\"fr\"><span>PRT</span><span>100</span></span> = <span class=\"fr\"><span>8000 × 9 × 4</span><span>100</span></span>.", "Step 2. I = GH₵ 2,880.", "Step 3. Amount = principal + interest = 8000 + 2880 = <b>GH₵ 10,880</b>."], "fig": null}]}, {"id": "var", "name": "Variation", "section": "Number & Numeration", "notes": ["Direct: y ∝ x ⇒ y = kx.   Inverse: y ∝ 1/x ⇒ y = k/x.", "Joint: y ∝ xz ⇒ y = kxz.   Partial: y = a + bx (two constants — you need two pairs of values).", "Always find k first, then write the full equation."], "plain": "Variation describes how one quantity changes when another changes. Direct: both grow together. Inverse: one grows while the other falls. Always find the constant k first.", "examples": [{"q": "y varies inversely as x. When x = 3, y = 8. Find y when x = 12.", "steps": ["Step 1. Write the relation: y = <span class=\"fr\"><span>k</span><span>x</span></span>.", "Step 2. Find k: 8 = k ÷ 3, so k = 24.", "Step 3. y = <span class=\"fr\"><span>24</span><span>12</span></span> = <b>2</b>.  (x became 4 times bigger, so y became 4 times smaller.)"], "fig": null}, {"q": "The cost C of hiring a bus is partly constant and partly varies with the distance d. It costs GH₵ 500 for 100 km and GH₵ 700 for 200 km. Find C when d = 350 km.", "steps": ["Step 1. Write C = a + bd.", "Step 2. 500 = a + 100b … (i);  700 = a + 200b … (ii).", "Step 3. (ii) − (i): 200 = 100b ⇒ b = 2; then a = 500 − 200 = 300.", "Step 4. C = 300 + 2(350) = <b>GH₵ 1,000</b>."], "fig": null}]}, {"id": "alg", "name": "Expressions & linear equations", "section": "Algebraic Processes", "notes": ["Clear fractions first: multiply every term by the LCM of the denominators.", "To change the subject, undo the operations in reverse order.", "Simultaneous equations: use elimination (match coefficients) or substitution.", "(a ± b)<sup>2</sup> = a<sup>2</sup> ± 2ab + b<sup>2</sup>;  a<sup>2</sup> − b<sup>2</sup> = (a − b)(a + b)"], "plain": "Algebra uses letters to stand for numbers we do not know yet. Solving an equation means undoing what was done to the letter, doing the same thing to BOTH sides.", "examples": [{"q": "Solve 5(x − 2) = 3x + 8.", "steps": ["Step 1. Open the bracket: 5x − 10 = 3x + 8.", "Step 2. Take 3x from both sides: 2x − 10 = 8.", "Step 3. Add 10 to both sides: 2x = 18.", "Step 4. Divide by 2: <b>x = 9</b>.  Check: 5(9 − 2) = 35 and 3(9) + 8 = 35 ✓"], "fig": null}, {"q": "Ama bought 3 pens and 2 books for GH₵ 34. Kofi bought 5 pens and 2 books for GH₵ 46. Find the price of a pen and of a book.", "steps": ["Step 1. Let a pen cost p and a book cost b:  3p + 2b = 34 … (i);  5p + 2b = 46 … (ii).", "Step 2. The 2b is the same in both, so subtract (i) from (ii): 2p = 12 ⇒ p = 6.", "Step 3. Put p = 6 into (i): 18 + 2b = 34 ⇒ 2b = 16 ⇒ b = 8.", "<b>A pen costs GH₵ 6 and a book GH₵ 8.</b>"], "fig": null}]}, {"id": "quad", "name": "Quadratic equations & graphs", "section": "Algebraic Processes", "notes": ["Quadratic formula: x = [−b ± √(b<sup>2</sup> − 4ac)] / 2a", "Sum of roots = −b/a;  product of roots = c/a", "Equation with roots α, β: x<sup>2</sup> − (α + β)x + αβ = 0", "Equal roots when b<sup>2</sup> − 4ac = 0.", "On a graph, the roots are where the curve cuts the x-axis; to solve f(x) = k, draw the line y = k."], "plain": "A quadratic has an x² in it, so it usually has TWO answers. Its graph is a smooth U-shaped curve, and the answers are where the curve crosses the x-axis.", "examples": [{"q": "Solve x<sup>2</sup> − 2x − 3 = 0 by factorisation.", "steps": ["Step 1. Find two numbers that multiply to −3 and add to −2: they are −3 and +1.", "Step 2. x<sup>2</sup> − 3x + x − 3 = 0 ⇒ x(x − 3) + 1(x − 3) = 0.", "Step 3. (x − 3)(x + 1) = 0, so x − 3 = 0 or x + 1 = 0.", "Step 4. <b>x = 3 or x = −1</b> — the same two points where the curve cuts the x-axis."], "fig": "<svg viewBox=\"0 0 320 260\" class=\"graph\" role=\"img\" aria-label=\"Graph\"><line x1=\"26.0\" y1=\"234.0\" x2=\"26.0\" y2=\"26.0\" class=\"gg\"/><text x=\"26.0\" y=\"172.7\" class=\"gt\" text-anchor=\"middle\">−3</text><line x1=\"59.5\" y1=\"234.0\" x2=\"59.5\" y2=\"26.0\" class=\"gg\"/><text x=\"59.5\" y=\"172.7\" class=\"gt\" text-anchor=\"middle\">−2</text><line x1=\"93.0\" y1=\"234.0\" x2=\"93.0\" y2=\"26.0\" class=\"gg\"/><text x=\"93.0\" y=\"172.7\" class=\"gt\" text-anchor=\"middle\">−1</text><line x1=\"126.5\" y1=\"234.0\" x2=\"126.5\" y2=\"26.0\" class=\"gg\"/><line x1=\"160.0\" y1=\"234.0\" x2=\"160.0\" y2=\"26.0\" class=\"gg\"/><text x=\"160.0\" y=\"172.7\" class=\"gt\" text-anchor=\"middle\">1</text><line x1=\"193.5\" y1=\"234.0\" x2=\"193.5\" y2=\"26.0\" class=\"gg\"/><text x=\"193.5\" y=\"172.7\" class=\"gt\" text-anchor=\"middle\">2</text><line x1=\"227.0\" y1=\"234.0\" x2=\"227.0\" y2=\"26.0\" class=\"gg\"/><text x=\"227.0\" y=\"172.7\" class=\"gt\" text-anchor=\"middle\">3</text><line x1=\"260.5\" y1=\"234.0\" x2=\"260.5\" y2=\"26.0\" class=\"gg\"/><text x=\"260.5\" y=\"172.7\" class=\"gt\" text-anchor=\"middle\">4</text><line x1=\"294.0\" y1=\"234.0\" x2=\"294.0\" y2=\"26.0\" class=\"gg\"/><text x=\"294.0\" y=\"172.7\" class=\"gt\" text-anchor=\"middle\">5</text><line x1=\"26.0\" y1=\"234.0\" x2=\"294.0\" y2=\"234.0\" class=\"gg\"/><text x=\"121.5\" y=\"237.5\" class=\"gt\" text-anchor=\"end\">−5</text><line x1=\"26.0\" y1=\"219.1\" x2=\"294.0\" y2=\"219.1\" class=\"gg\"/><text x=\"121.5\" y=\"222.6\" class=\"gt\" text-anchor=\"end\">−4</text><line x1=\"26.0\" y1=\"204.3\" x2=\"294.0\" y2=\"204.3\" class=\"gg\"/><text x=\"121.5\" y=\"207.8\" class=\"gt\" text-anchor=\"end\">−3</text><line x1=\"26.0\" y1=\"189.4\" x2=\"294.0\" y2=\"189.4\" class=\"gg\"/><text x=\"121.5\" y=\"192.9\" uality (x − p)(x − q) < 0 with p < q: the solution is p < x < q.", "Linear programming: shade the unwanted region, find the corners of the feasible region, and test the objective function at each corner."], "plain": "An inequality says one side is bigger or smaller than the other, so the answer is a RANGE of values, not a single number. One rule to remember: multiplying or dividing by a negative number turns the sign round.", "examples": [{"q": "Solve 4 − 3x ≥ −5 and show the answer on a number line.", "steps": ["Step 1. Take 4 from both sides: −3x ≥ −9.", "Step 2. Divide by −3 AND turn the sign round: x ≤ 3.", "Step 3. On the number line, shade everything up to 3, with a filled circle at 3 because 3 is included."], "fig": "<svg viewBox=\"0 0 320 70\" class=\"dia\" role=\"img\" aria-label=\"x is less than or equal to 3\" style=\"width:min(100%,368px)\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5.5\" markerHeight=\"5.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dah\"/></marker></defs><line x1=\"24\" y1=\"36\" x2=\"296\" y2=\"36\" class=\"dline\" marker-end=\"url(#ah)\"/><line x1=\"24.0\" y1=\"31\" x2=\"24.0\" y2=\"41\" class=\"dline\"/><text x=\"24.0\" y=\"56.0\" class=\"dmut\" text-anchor=\"middle\">−2</text><line x1=\"58.0\" y1=\"31\" x2=\"58.0\" y2=\"41\" class=\"dline\"/><text x=\"58.0\" y=\"56.0\" class=\"dmut\" text-anchor=\"middle\">−1</text><line x1=\"92.0\" y1=\"31\" x2=\"92.0\" y2=\"41\" class=\"dline\"/><text x=\"92.0\" y=\"56.0\" class=\"dmut\" text-anchor=\"middle\">0</text><line x1=\"126.0\" y1=\"31\" x2=\"126.0\" y2=\"41\" class=\"dline\"/><text x=\"126.0\" y=\"56.0\" class=\"dmut\" text-anchor=\"middle\">1</text><line x1=\"160.0\" y1=\"31\" x2=\"160.0\" y2=\"41\" class=\"dline\"/><text x=\"160.0\" y=\"56.0\" class=\"dmut\" text-anchor=\"middle\">2</text><line x1=\"194.0\" y1=\"31\" x2=\"194.0\" y2=\"41\" class=\"dline\"/><text x=\"194.0\" y=\"56.0\" class=\"dmut\" text-anchor=\"middle\">3</text><line x1=\"228.0\" y1=\"31\" x2=\"228.0\" y2=\"41\" class=\"dline\"/><text x=\"228.0\" y=\"56.0\" class=\"dmut\" text-anchor=\"middle\">4</text><line x1=\"262.0\" y1=\"31\" x2=\"262.0\" y2=\"41\" class=\"dline\"/><text x=\"262.0\" y=\"56.0\" class=\"dmut\" text-anchor=\"middle\">5</text><line x1=\"296.0\" y1=\"31\" x2=\"296.0\" y2=\"41\" class=\"dline\"/><text x=\"296.0\" y=\"56.0\" class=\"dmut\" text-anchor=\"middle\">6</text><line x1=\"24.0\" y1=\"36\" x2=\"194.0\" y2=\"36\" class=\"dacc\" stroke-width=\"4\"/><circle cx=\"194.0\" cy=\"36\" r=\"5\" class=\"dsolidpt\"/></svg>"}, {"q": "Find the integers that satisfy 2 < 3x − 1 ≤ 11.", "steps": ["Step 1. Add 1 throughout: 3 < 3x ≤ 12.", "Step 2. Divide throughout by 3: 1 < x ≤ 4.", "Step 3. The integers greater than 1 and up to 4 are <b>2, 3 and 4</b>."], "fig": null}]}, {"id": "afunc", "name": "Algebraic fractions & functions", "section": "Algebraic Processes", "notes": ["Factorise fully before cancelling — cancel factors, never terms.", "An algebraic fraction is undefined when its denominator equals zero.", "Composite: f(g(x)) — apply g first, then f.", "Inverse: write y = f(x), swap x and y, then make y the subject."], "plain": "A function is a machine: you put a number in, and it gives one number out. f(3) simply means 'put 3 into the machine'. The inverse machine undoes what the first one did.", "examples": [{"q": "If f(x) = 4x − 5, find (a) f(3) (b) f<sup>−1</sup>(x) (c) f<sup>−1</sup>(7).", "steps": ["(a) Put 3 in place of x: f(3) = 4(3) − 5 = <b>7</b>.", "(b) Write y = 4x − 5, swap the letters: x = 4y − 5.", "Make y the subject: 4y = x + 5 ⇒ f<sup>−1</sup>(x) = <span class=\"fr\"><span>x + 5</span><span>4</span></span>.", "(c) f<sup>−1</sup>(7) = <span class=\"fr\"><span>7 + 5</span><span>4</span></span> = <b>3</b> — it takes us back to where we started in (a)."], "fig": null}, {"q": "Simplify <span class=\"fr\"><span>1</span><span>x − 2</span></span> + <span class=\"fr\"><span>3</span><span>x + 1</span></span>.", "steps": ["Step 1. The common denominator is (x − 2)(x + 1).", "Step 2. <span class=\"fr\"><span>1(x + 1) + 3(x − 2)</span><span>(x − 2)(x + 1)</span></span>", "Step 3. Top: x + 1 + 3x − 6 = 4x − 5.", "Answer: <b><span class=\"fr\"><span>4x − 5</span><span>(x − 2)(x + 1)</span></span></b>"], "fig": null}]}, {"id": "area", "name": "Lengths, perimeters & areas", "section": "Mensuration", "notes": ["Arc length = (θ/360) × 2πr;  sector area = (θ/360) × πr<sup>2</sup>", "Triangle: ½ab sin C, or Heron's formula √[s(s − a)(s − b)(s − c)]", "Trapezium = ½(a + b)h;  parallelogram = base × height", "Segment = sector − triangle.", "Perimeter of a sector = arc + 2r."], "plain": "Perimeter is the distance round the edge; area is the space inside. For a sector (a slice of a circle), first find what fraction of the whole circle you have, then take that fraction of the circle.", "examples": [{"q": "Find the area and the perimeter of a sector of radius 7 cm with angle 90°. [π = <span class=\"fr\"><span>22</span><span>7</span></span>]", "steps": ["Step 1. The fraction of the circle is <span class=\"fr\"><span>90</span><span>360</span></span> = <span class=\"fr\"><span>1</span><span>4</span></span>.", "Step 2. Area = <span class=\"fr\"><span>1</span><span>4</span></span> × <span class=\"fr\"><span>22</span><span>7</span></span> × 7 × 7 = <span class=\"fr\"><span>1</span><span>4</span></span> × 154 = <b>38.5 cm²</b>.", "Step 3. Arc = <span class=\"fr\"><span>1</span><span>4</span></span> × 2 × <span class=\"fr\"><span>22</span><span>7</span></span> × 7 = <span class=\"fr\"><span>1</span><span>4</span></span> × 44 = 11 cm.", "Step 4. Perimeter = arc + the two radii = 11 + 7 + 7 = <b>25 cm</b>."], "fig": "<svg viewBox=\"0 0 280 210\" class=\"dia\" role=\"img\" aria-label=\"Quarter circle of radius 7 cm\" style=\"width:min(100%,322px)\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5.5\" markerHeight=\"5.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dah\"/></marker></defs><path d=\"M110,130 L196,130 A86,86 0 0 0 110.0,44.0 Z\" class=\"dfill\"/><path d=\"M140,130 A30,30 0 0 0 110.0,100.0\" class=\"dline\"/><text x=\"156.0\" y=\"118.0\" class=\"dtxt\" text-anchor=\"middle\">90°</text><text x=\"153.0\" y=\"146.0\" class=\"dmut\" text-anchor=\"middle\">7 cm</text><text x=\"180.0\" y=\"56.0\" class=\"dmut\" text-anchor=\"middle\">arc</text></svg>"}, {"q": "A room is 6 m by 4.5 m. Find the cost of tiling it at GH₵ 85 per square metre.", "steps": ["Step 1. Area = length × breadth = 6 × 4.5 = 27 m².", "Step 2. Cost = 27 × 85.", "Step 3. = <b>GH₵ 2,295</b>."], "fig": null}]}, {"id": "vol", "name": "Volumes & surface areas", "section": "Mensuration", "notes": ["Cylinder: V = πr<sup>2h</sup>;  curved surface area = 2πrh;  total = 2πr(r + h)", "Cone: V = ⅓πr<sup>2h</sup>;  curved surface area = πrl, where l<sup>2</sup> = r<sup>2</sup> + h<sup>2</sup>", "Sphere: V = 4/3 πr<sup>3</sup>;  surface area = 4πr<sup>2</sup> (a hemisphere's curved surface is 2πr<sup>2</sup>)", "Prism: V = cross-section area × length;  pyramid: V = ⅓ × base area × height", "1 m³ = 1000 litres;  1 litre = 1000 cm³"], "plain": "Volume is the space inside a solid — how much it can hold. Surface area is the skin: how much material would be needed to cover it.", "examples": [{"q": "A cylindrical tank has radius 7 cm and height 20 cm. Find its volume. [π = <span class=\"fr\"><span>22</span><span>7</span></span>]", "steps": ["Step 1. Volume of a cylinder = πr²h.", "Step 2. = <span class=\"fr\"><span>22</span><span>7</span></span> × 7 × 7 × 20.", "Step 3. <span class=\"fr\"><span>22</span><span>7</span></span> × 49 = 154, and 154 × 20 = <b>3,080 cm³</b>."], "fig": "<svg viewBox=\"0 0 280 200\" class=\"dia\" role=\"img\" aria-label=\"Cylinder, radius 7 cm, height 20 cm\" style=\"width:min(100%,322px)\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5.5\" markerHeight=\"5.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dah\"/></marker></defs><ellipse cx=\"110\" cy=\"42\" rx=\"56\" ry=\"18\" class=\"dfill\"/><path d=\"M54,42 L54,150 A56,18 0 0 0 166,150 L166,42\" class=\"dfill\"/><ellipse cx=\"110\" cy=\"42\" rx=\"56\" ry=\"18\" class=\"dacc\"/><line x1=\"110\" y1=\"42\" x2=\"166\" y2=\"42\" class=\"ddash\"/><text x=\"140.0\" y=\"20.0\" class=\"dmut\" text-anchor=\"middle\">7 cm</text><line x1=\"186\" y1=\"42\" x2=\"186\" y2=\"150\" class=\"dline\"/><text x=\"200.0\" y=\"100.0\" class=\"dmut\" text-anchor=\"middle\">20 cm</text></svg>"}, {"q": "A cone has base radius 6 cm and height 8 cm. Find its slant height and curved surface area, in terms of π.", "steps": ["Step 1. The radius, height and slant height form a right-angled triangle.", "Step 2. l = √(6² + 8²) = √100 = <b>10 cm</b>.", "Step 3. Curved surface area = πrl = π × 6 × 10 = <b>60π cm²</b>."], "fig": "<svg viewBox=\"0 0 280 200\" class=\"dia\" role=\"img\" aria-label=\"Cone, radius 6 cm, height 8 cm\" style=\"width:min(100%,322px)\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5.5\" markerHeight=\"5.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dah\"/></marker></defs><path d=\"M110,26 L54,138 A56,18 0 0 0 166,138 Z\" class=\"dfill\"/><ellipse cx=\"110\" cy=\"138\" rx=\"56\" ry=\"18\" class=\"dacc\"/><line x1=\"110\" y1=\"26\" x2=\"110\" y2=\"138\" class=\"ddash\"/><line x1=\"110\" y1=\"138\" x2=\"166\" y2=\"138\" class=\"ddash\"/><text x=\"100.0\" y=\"92.0\" class=\"dmut\" text-anchor=\"middle\">8 cm</text><text x=\"140.0\" y=\"132.0\" class=\"dmut\" text-anchor=\"middle\">6 cm</text><text x=\"150.0\" y=\"80.0\" class=\"dmut\" text-anchor=\"middle\">l = 10</text></svg>"}]}, {"id": "simil", "name": "Similar shapes, congruence & scale", "section": "Mensuration", "notes": ["Similar shapes have the same shape but different size: equal angles, and sides in the same ratio.", "Congruent shapes are exactly the same shape AND size (SSS, SAS, ASA, RHS).", "If lengths are in the ratio k, areas are in the ratio k<sup>2</sup> and volumes in the ratio k<sup>3</sup>.", "Map scale 1 : n means 1 cm on the map stands for n cm on the ground.", "On a map of scale 1 : 50 000, 1 cm represents 0.5 km, and 1 cm<sup>2</sup> represents 0.25 km<sup>2</sup>."], "plain": "Similar means same shape, different size — every length is multiplied by the same number (the scale factor). Remember: lengths × k, areas × k², volumes × k³. A map is just a very large enlargement in reverse.", "examples": [{"q": "A model of a water tank is made to a scale of 1 : 20. The model holds 2 litres. How much does the real tank hold?", "steps": ["Step 1. Lengths are in the ratio 1 : 20.", "Step 2. Volumes are in the ratio 1<sup>3</sup> : 20<sup>3</sup> = 1 : 8000.", "Step 3. Real tank = 2 × 8000 = <b>16 000 litres</b> (16 m³)."], "fig": null}, {"q": "A tree casts a shadow 6 m long at the same time that a 1.5 m pole casts a shadow 0.9 m long. Find the height of the tree.", "steps": ["Step 1. The sun's rays make the two triangles similar.", "Step 2. <span class=\"fr\"><span>tree</span><span>its shadow</span></span> = <span class=\"fr\"><span>pole</span><span>its shadow</span></span> ⇒ <span class=\"fr\"><span>h</span><span>6</span></span> = <span class=\"fr\"><span>1.5</span><span>0.9</span></span>", "Step 3. h = 6 × 1.5 ÷ 0.9 = <b>10 m</b>."], "fig": "<svg viewBox=\"0 0 300 190\" class=\"dia\" role=\"img\" aria-label=\"Tree and its shadow\" style=\"width:min(100%,345px)\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5.5\" markerHeight=\"5.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dah\"/></marker></defs><polygon points=\"40,150 250,150 170,40\" class=\"dfill\" fill-opacity=\"0.25\"/><polyline points=\"40,150 250,150 170,40 40,150\" class=\"dacc\"/><polyline points=\"232,150 232,132 250,132\" class=\"dline\"/><text x=\"30.0\" y=\"162.0\" class=\"dtxt\" text-anchor=\"middle\">A</text><text x=\"258.0\" y=\"162.0\" class=\"dtxt\" text-anchor=\"middle\">B</text><text x=\"172.0\" y=\"32.0\" class=\"dtxt\" text-anchor=\"middle\">C</text><text x=\"145.0\" y=\"166.0\" class=\"dmut\" text-anchor=\"middle\">6 m shadow</text><text x=\"220.0\" y=\"90.0\" class=\"dmut\" text-anchor=\"middle\">h = ?</text><text x=\"92.0\" y=\"88.0\" class=\"dmut\" text-anchor=\"middle\"></text></svg>"}]}, {"id": "earth", "name": "Longitude, latitude & distances on the earth", "section": "Mensuration", "notes": ["Latitude lines run east–west (the equator is 0°); longitude lines (meridians) run north–south (Greenwich is 0°).", "Radius of the earth R ≈ 6400 km. Take π = 22/7 unless told otherwise.", "Along a meridian (same longitude): distance = (θ/360) × 2πR, where θ is the difference in latitude.", "Along a parallel of latitude: distance = (θ/360) × 2πR cos α, where α is the latitude and θ the difference in longitude.", "Along the equator, cos 0° = 1, so the parallel formula becomes the full circle formula.", "1 hour of time = 15° of longitude; places east of Greenwich are ahead in time."], "plain": "The earth is treated as a sphere of radius about 6400 km. Going north or south you travel along a meridian (a full-size circle). Going east or west you travel along a parallel of latitude, which is a smaller circle — that is why the cos of the latitude appears in the formula.", "examples": [{"q": "Find the distance between X(30°N, 10°W) and Y(30°N, 50°E), along their parallel of latitude. [R = 6400 km, π = 22/7, cos 30° = 0.866]", "steps": ["Step 1. Same latitude, so use distance = (θ/360) × 2πR cos α.", "Step 2. θ = 10 + 50 = 60° (one is west and one is east, so ADD).", "Step 3. = (60/360) × 40 228.57 × 0.866 = 0.1667 × 40 228.57 × 0.866.", "Step 4. ≈ <b>5806 km</b>."], "fig": null}, {"q": "A plane leaves Accra (0°, 0°) and flies due north to 45°N. How far does it fly? [R = 6400 km, π = 22/7]", "steps": ["Step 1. Due north means along a meridian, so no cosine is needed.", "Step 2. Distance = (45/360) × 2 × (22/7) × 6400.", "Step 3. = 0.125 × 40 228.57 = <b>5028.6 km</b>."], "fig": null}]}, {"id": "geo", "name": "Angles, triangles & polygons", "section": "Plane Geometry", "notes": ["Sum of interior angles of an n-sided polygon = (n − 2) × 180°", "Exterior angles of any polygon add up to 360°; for a regular polygon, each = 360°/n", "Alternate angles are equal; corresponding angles are equal; co-interior angles add up to 180°", "Similar triangles: the ratio of areas = (ratio of sides)<sup>2</sup>", "Pythagoras: c<sup>2</sup> = a<sup>2</sup> + b<sup>2</sup> (right-angled triangles only)"], "plain": "Plane geometry is about shapes drawn flat on paper: their angles and their sides. Most questions come back to two facts — angles in a triangle add up to 180°, and angles on a straight line add up to 180°.", "examples": [{"q": "A ladder leans against a wall. Its foot is 9 m from the wall and it reaches 12 m up the wall. How long is the ladder?", "steps": ["Step 1. The wall, the ground and the ladder form a right-angled triangle.", "Step 2. Pythagoras: ladder² = 9² + 12² = 81 + 144 = 225.", "Step 3. Ladder = √225 = <b>15 m</b>."], "fig": "<svg viewBox=\"0 0 300 190\" class=\"dia\" role=\"img\" aria-label=\"Right-angled triangle 9, 12, 15\" style=\"width:min(100%,345px)\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5.5\" markerHeight=\"5.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dah\"/></marker></defs><polygon points=\"40,150 250,150 170,40\" class=\"dfill\" fill-opacity=\"0.25\"/><polyline points=\"40,150 250,150 170,40 40,150\" class=\"dacc\"/><polyline points=\"232,150 232,132 250,132\" class=\"dline\"/><text x=\"30.0\" y=\"162.0\" class=\"dtxt\" text-anchor=\"middle\">A</text><text x=\"258.0\" y=\"162.0\" class=\"dtxt\" text-anchor=\"middle\">B</text><text x=\"172.0\" y=\"32.0\" class=\"dtxt\" text-anchor=\"middle\">C</text><text x=\"145.0\" y=\"166.0\" class=\"dmut\" text-anchor=\"middle\">9 m</text><text x=\"220.0\" y=\"90.0\" class=\"dmut\" text-anchor=\"middle\">12 m</text><text x=\"92.0\" y=\"88.0\" class=\"dmut\" text-anchor=\"middle\">15 m</text></svg>"}, {"q": "Find the number of sides of a regular polygon whose interior angle is 156°.", "steps": ["Step 1. Interior + exterior = 180°, so the exterior angle = 180 − 156 = 24°.", "Step 2. All the exterior angles add up to 360°.", "Step 3. Number of sides = 360 ÷ 24 = <b>15</b>."], "fig": null}]}, {"id": "circle", "name": "Circle theorems", "section": "Plane Geometry", "notes": ["The angle at the centre is twice the angle at the circumference standing on the same arc.", "Angles in the same segment are equal; the angle in a semicircle is 90°.", "Opposite angles of a cyclic quadrilateral add up to 180°.", "A tangent is perpendicular to the radius at the point of contact; tangents from an external point are equal.", "Alternate segment theorem: the angle between a tangent and a chord equals the angle in the alternate segment.", "Intersecting chords: AX × XB = CX × XD"], "plain": "Circle theorems are a small set of facts about angles inside a circle. The one examiners use most: the angle at the centre is twice the angle at the circumference standing on the same arc.", "examples": [{"q": "O is the centre of a circle. Angle AOB = 130°. Find angle ACB, where C is on the major arc.", "steps": ["Step 1. AOB is at the centre; ACB is at the circumference, on the same arc AB.", "Step 2. Angle at the centre = 2 × angle at the circumference.", "Step 3. 130 = 2 × ACB ⇒ ACB = <b>65°</b>."], "fig": "<svg viewBox=\"0 0 300 240\" class=\"dia\" role=\"img\" aria-label=\"Angle at centre is twice angle at circumference\" style=\"width:min(100%,345px)\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5.5\" markerHeight=\"5.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dah\"/></marker></defs><circle cx=\"150\" cy=\"118\" r=\"88\" class=\"dacc\"/><line x1=\"74\" y1=\"162\" x2=\"150\" y2=\"118\" class=\"dline\"/><line x1=\"226\" y1=\"162\" x2=\"150\" y2=\"118\" class=\"dline\"/><line x1=\"74\" y1=\"162\" x2=\"165\" y2=\"31\" class=\"dline\"/><line x1=\"226\" y1=\"162\" x2=\"165\" y2=\"31\" class=\"dline\"/><circle cx=\"150\" cy=\"118\" r=\"3\" class=\"dsolidpt\"/><text x=\"150.0\" y=\"108.0\" class=\"dmut\" text-anchor=\"middle\">O</text><text x=\"61.8\" y=\"168.0\" class=\"dtxt\" text-anchor=\"middle\">A</text><text x=\"238.2\" y=\"168.0\" class=\"dtxt\" text-anchor=\"middle\">B</text><text x=\"165.3\" y=\"23.3\" class=\"dtxt\" text-anchor=\"middle\">C</text><text x=\"150.0\" y=\"144.0\" class=\"dtxt\" text-anchor=\"middle\">130°</text><text x=\"165.3\" y=\"57.3\" class=\"dtxt\" text-anchor=\"middle\">65°</text></svg>"}, {"q": "In a cyclic quadrilateral ABCD, angle A = 72°. Find angle C.", "steps": ["Step 1. A and C are opposite angles of a cyclic quadrilateral.", "Step 2. Opposite angles add up to 180°.", "Step 3. Angle C = 180 − 72 = <b>108°</b>."], "fig": "<svg viewBox=\"0 0 300 240\" class=\"dia\" role=\"img\" aria-label=\"Opposite angles of a cyclic quadrilateral\" style=\"width:min(100%,345px)\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5.5\" markerHeight=\"5.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dah\"/></marker></defs><circle cx=\"150\" cy=\"118\" r=\"88\" class=\"dacc\"/><polyline points=\"74,74 217,61 217,175 78,168 74,74\" class=\"dline\"/><text x=\"73.8\" y=\"66.0\" class=\"dtxt\" text-anchor=\"middle\">A</text><text x=\"217.4\" y=\"53.4\" class=\"dtxt\" text-anchor=\"middle\">B</text><text x=\"217.4\" y=\"190.6\" class=\"dtxt\" text-anchor=\"middle\">C</text><text x=\"77.9\" y=\"184.5\" class=\"dtxt\" text-anchor=\"middle\">D</text><text x=\"89.8\" y=\"94.0\" class=\"dtxt\" text-anchor=\"middle\">72°</text><text x=\"201.4\" y=\"158.6\" class=\"dtxt\" text-anchor=\"middle\">108°</text></svg>"}]}, {"id": "loci", "name": "Constructions & loci", "section": "Plane Geometry", "notes": ["Points equidistant from two points lie on the perpendicular bisector of the line joining them.", "Points equidistant from two intersecting lines lie on the bisectors of the angles between them.", "Points at a fixed distance from a point form a circle; points at a fixed distance from a line form a pair of parallel lines.", "With a ruler and compasses, construct 60° (equilateral arc), then bisect to get 30° and 15°; 90° bisects to 45°. Combine these: 75° = 60° + 15°, 105° = 90° + 15°."], "plain": "A locus is the path traced by a point that obeys a rule — for example, 'always 3 m from this post'. In construction questions, show all your arcs: the examiner gives marks for them.", "examples": [{"q": "Construct an angle of 30° at a point A on a line.", "steps": ["Step 1. With centre A and any radius, draw an arc cutting the line at P.", "Step 2. With the SAME radius and centre P, cut the arc at Q. Join AQ — angle QAP is 60°.", "Step 3. Bisect angle QAP: draw arcs of equal radius from P and from Q so that they cross at R.", "Step 4. Join AR. Angle RAP = <b>30°</b>."], "fig": null}, {"q": "A goat is tied to a post with a 4 m rope in an open field. Describe and find the area it can graze.", "steps": ["Step 1. The furthest points form a circle of radius 4 m about the post — that is the locus.", "Step 2. Area = πr² = <span class=\"fr\"><span>22</span><span>7</span></span> × 4 × 4.", "Step 3. = <b>50.29 m²</b> (2 d.p.)"], "fig": null}]}, {"id": "coord", "name": "Straight lines", "section": "Coordinate Geometry", "notes": ["Gradient m = (y_2 − y_1)/(x_2 − x_1);  distance = √[(x_2 − x_1)<sup>2</sup> + (y_2 − y_1)<sup>2</sup>]", "Midpoint = ((x_1 + x_2)/2, (y_1 + y_2)/2)", "Line: y − y_1 = m(x − x_1), or y = mx + c", "Parallel lines: m_1 = m_2.  Perpendicular lines: m_1 × m_2 = −1"], "plain": "Coordinate geometry puts shapes on a grid so that you can work with numbers instead of drawings. Gradient means steepness: how far up divided by how far across.", "examples": [{"q": "Find the gradient of the line through A(1, 2) and B(5, 10), and its equation.", "steps": ["Step 1. Gradient m = <span class=\"fr\"><span>y_2 − y_1</span><span>x_2 − x_1</span></span> = <span class=\"fr\"><span>10 − 2</span><span>5 − 1</span></span> = <span class=\"fr\"><span>8</span><span>4</span></span> = 2.", "Step 2. Use y − y₁ = m(x − x₁) with A(1, 2): y − 2 = 2(x − 1).", "Step 3. y − 2 = 2x − 2 ⇒ <b>y = 2x</b>."], "fig": "<svg viewBox=\"0 0 320 260\" class=\"graph\" role=\"img\" aria-label=\"Graph\"><line x1=\"26.0\" y1=\"234.0\" x2=\"26.0\" y2=\"26.0\" class=\"gg\"/><line x1=\"70.7\" y1=\"234.0\" x2=\"70.7\" y2=\"26.0\" class=\"gg\"/><text x=\"70.7\" y=\"247.0\" class=\"gt\" text-anchor=\"middle\">1</text><line x1=\"115.3\" y1=\"234.0\" x2=\"115.3\" y2=\"26.0\" class=\"gg\"/><text x=\"115.3\" y=\"247.0\" class=\"gt\" text-anchor=\"middle\">2</text><line x1=\"160.0\" y1=\"234.0\" x2=\"160.0\" y2=\"26.0\" class=\"gg\"/><text x=\"160.0\" y=\"247.0\" class=\"gt\" text-anchor=\"middle\">3</text><line x1=\"204.7\" y1=\"234.0\" x2=\"204.7\" y2=\"26.0\" class=\"gg\"/><text x=\"204.7\" y=\"247.0\" class=\"gt\" text-anchor=\"middle\">4</text><line x1=\"249.3\" y1=\"234.0\" x2=\"249.3\" y2=\"26.0\" class=\"gg\"/><text x=\"249.3\" y=\"247.0\" class=\"gt\" text-anchor=\"middle\">5</text><line x1=\"294.0\" y1=\"234.0\" x2=\"294.0\" y2=\"26.0\" class=\"gg\"/><text x=\"294.0\" y=\"247.0\" class=\"gt\" text-anchor=\"middle\">6</text><line x1=\"26.0\" y1=\"234.0\" x2=\"294.0\" y2=\"234.0\" class=\"gg\"/><line x1=\"26.0\" y1=\"216.7\" x2=\"294.0\" y2=\"216.7\" class=\"gg\"/><text x=\"21.0\" y=\"220.2\" class=\"gt\" text-anchor=\"end\">1</text><line x1=\"26.0\" y1=\"199.3\" x2=\"294.0\" y2=\"199.3\" class=\"gg\"/><text x=\"21.0\" y=\"202.8\" class=\"gt\" text-anchor=\"end\">2</text><line x1=\"26.0\" y1=\"182.0\" x2=\"294.0\" y2=\"182.0\" class=\"gg\"/><text x=\"21.0\" y=\"185.5\" class=\"gt\" text- "examples": [{"q": "A tree casts a shadow 15 m long. The angle of elevation of the top of the tree from the end of the shadow is 40°. Find the height of the tree.", "steps": ["Step 1. Draw it: the height is OPPOSITE the angle, the shadow is ADJACENT — so use tan.", "Step 2. tan 40° = <span class=\"fr\"><span>height</span><span>15</span></span> ⇒ height = 15 × tan 40°.", "Step 3. tan 40° = 0.8391, so height = 15 × 0.8391 = <b>12.59 m</b> (2 d.p.)."], "fig": "<svg viewBox=\"0 0 300 190\" class=\"dia\" role=\"img\" aria-label=\"Angle of elevation 40 degrees\" style=\"width:min(100%,345px)\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5.5\" markerHeight=\"5.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dah\"/></marker></defs><polygon points=\"40,150 250,150 170,40\" class=\"dfill\" fill-opacity=\"0.25\"/><polyline points=\"40,150 250,150 170,40 40,150\" class=\"dacc\"/><polyline points=\"232,150 232,132 250,132\" class=\"dline\"/><text x=\"30.0\" y=\"162.0\" class=\"dtxt\" text-anchor=\"middle\">40°</text><text x=\"258.0\" y=\"162.0\" class=\"dtxt\" text-anchor=\"middle\">B</text><text x=\"172.0\" y=\"32.0\" class=\"dtxt\" text-anchor=\"middle\">C</text><text x=\"145.0\" y=\"166.0\" class=\"dmut\" text-anchor=\"middle\">15 m (shadow)</text><text x=\"220.0\" y=\"90.0\" class=\"dmut\" text-anchor=\"middle\">height</text><text x=\"92.0\" y=\"88.0\" class=\"dmut\" text-anchor=\"middle\"></text></svg>"}, {"q": "If cos θ = <span class=\"fr\"><span>8</span><span>17</span></span> and θ is acute, find sin θ and tan θ.", "steps": ["Step 1. cos = adjacent ÷ hypotenuse, so adjacent = 8 and hypotenuse = 17.", "Step 2. Opposite = √(17² − 8²) = √(289 − 64) = √225 = 15.", "Step 3. sin θ = <span class=\"fr\"><span>15</span><span>17</span></span> and tan θ = <span class=\"fr\"><span>15</span><span>8</span></span>."], "fig": null}]}, {"id": "bear", "name": "Bearings, sine & cosine rules", "section": "Trigonometry", "notes": ["Bearings are measured clockwise from north and always written with three figures (e.g. 075°).", "Back bearing = bearing ± 180°.", "Sine rule: a/sin A = b/sin B = c/sin C", "Cosine rule: a<sup>2</sup> = b<sup>2</sup> + c<sup>2</sup> − 2bc cos A", "Area of a triangle = ½ab sin C"], "plain": "A bearing tells direction. You always start facing North and turn clockwise, and you always write three figures — 060°, not 60°.", "examples": [{"q": "A town Q is 8 km from P on a bearing of 060°. R is 6 km from Q on a bearing of 150°. Find |PR| and the bearing of R from P.", "steps": ["Step 1. The back bearing of P from Q is 060 + 180 = 240°, and the bearing of R is 150°, so angle PQR = 240 − 150 = 90°.", "Step 2. Pythagoras: PR = √(8² + 6²) = √100 = <b>10 km</b>.", "Step 3. tan(angle QPR) = 6 ÷ 8 = 0.75 ⇒ angle QPR = 36.87°.", "Step 4. Bearing of R from P = 060 + 36.87 ≈ <b>097°</b>."], "fig": "<svg viewBox=\"0 0 300 260\" class=\"dia\" role=\"img\" aria-label=\"Bearings 060 and 150\" style=\"width:min(100%,345px)\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5.5\" markerHeight=\"5.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dah\"/></marker></defs><line x1=\"140\" y1=\"140\" x2=\"140\" y2=\"30\" class=\"dline\" marker-end=\"url(#ah)\"/><text x=\"140.0\" y=\"22.0\" class=\"dtxt\" text-anchor=\"middle\">N</text><circle cx=\"140\" cy=\"140\" r=\"3\" class=\"dsolidpt\"/><line x1=\"140\" y1=\"140\" x2=\"217.9\" y2=\"95.0\" class=\"dacc\"/><text x=\"229.9\" y=\"99.0\" class=\"dtxt\" text-anchor=\"middle\">Q</text><path d=\"M140,106 A34,34 0 0 1 169.4,123.0\" class=\"dline\"/><text x=\"164.0\" y=\"102.4\" class=\"dmut\" text-anchor=\"middle\">060°</text><line x1=\"140\" y1=\"140\" x2=\"177.5\" y2=\"205.0\" class=\"dacc\"/><text x=\"189.5\" y=\"209.0\" class=\"dtxt\" text-anchor=\"middle\">R</text><path d=\"M140,106 A34,34 0 0 1 157.0,169.4\" class=\"dline\"/><text x=\"186.4\" y=\"131.6\" class=\"dmut\" text-anchor=\"middle\">150°</text></svg>"}, {"q": "The bearing of X from Y is 205°. Find the bearing of Y from X.", "steps": ["Step 1. Back bearing = bearing ± 180°.", "Step 2. 205 is more than 180, so subtract: 205 − 180 = 25.", "Step 3. Write it in three figures: <b>025°</b>."], "fig": null}]}, {"id": "calc", "name": "Differentiation & integration", "section": "Introductory Calculus", "notes": ["If y = ax<sup>n</sup>, then dy/dx = anx<sup>n−1</sup>; the derivative of a constant is 0.", "The gradient of a curve at a point is the value of dy/dx there.", "Turning points: solve dy/dx = 0. If d²y/dx² > 0 it is a minimum; if < 0 it is a maximum.", "∫ax<sup>n</sup> dx = ax<sup>n+1</sup>/(n + 1) + c (n ≠ −1); remember + c for indefinite integrals.", "Area under a curve between x = a and x = b is the definite integral."], "plain": "Calculus measures change. Differentiation gives the gradient — how steep a curve is at a point. Integration is the opposite: it adds up, and gives the area under a curve.", "examples": [{"q": "Find the gradient of y = x² − 4x + 5 at the point where x = 3, and the equation of the tangent there.", "steps": ["Step 1. Differentiate term by term: dy/dx = 2x − 4.", "Step 2. At x = 3: gradient = 2(3) − 4 = <b>2</b>.", "Step 3. y at x = 3 is 9 − 12 + 5 = 2, so the point is (3, 2).", "Step 4. Tangent: y − 2 = 2(x − 3) ⇒ <b>y = 2x − 4</b>."], "fig": "<svg viewBox=\"0 0 320 260\" class=\"graph\" role=\"img\" aria-label=\"Graph\"><line x1=\"26.0\" y1=\"234.0\" x2=\"26.0\" y2=\"26.0\" class=\"gg\"/><line x1=\"79.6\" y1=\"234.0\" x2=\"79.6\" y2=\"26.0\" class=\"gg\"/><text x=\"79.6\" y=\"247.0\" class=\"gt\" text-anchor=\"middle\">1</text><line x1=\"133.2\" y1=\"234.0\" x2=\"133.2\" y2=\"26.0\" class=\"gg\"/><text x=\"133.2\" y=\"247.0\" class=\"gt\" text-anchor=\"middle\">2</text><line x1=\"186.8\" y1=\"234.0\" x2=\"186.8\" y2=\"26.0\" class=\"gg\"/><text x=\"186.8\" y=\"247.0\" class=\"gt\" text-anchor=\"middle\">3</text><line x1=\"240.4\" y1=\"234.0\" x2=\"240.4\" y2=\"2
