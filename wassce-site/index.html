t=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"192.0\" y=\"56.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Coagulation</text><line x1=\"117.0\" y1=\"53.0\" x2=\"136.0\" y2=\"53.0\" class=\"dline\" marker-end=\"url(#ah)\"/><rect x=\"270\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"322.0\" y=\"56.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Filtration</text><line x1=\"247.0\" y1=\"53.0\" x2=\"266.0\" y2=\"53.0\" class=\"dline\" marker-end=\"url(#ah)\"/><rect x=\"400\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"452.0\" y=\"56.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Chlorination</text><line x1=\"377.0\" y1=\"53.0\" x2=\"396.0\" y2=\"53.0\" class=\"dline\" marker-end=\"url(#ah)\"/></svg>"}]}, {"id": "soil", "name": "Soil, rocks & conservation", "section": "Diversity of Matter", "notes": ["Soil is formed by the weathering of rocks (physical, chemical and biological) plus the decay of organic matter.", "Soil components: mineral particles, water, air, organic matter (humus) and living organisms.", "Loam is the best agricultural soil: it holds water well and drains well, and is rich in humus.", "Sandy soil drains fast and is poor in nutrients; clay holds too much water and is badly aerated.", "Erosion is controlled by contour ploughing, terracing, cover cropping, mulching, strip cropping, afforestation and avoiding bush burning."], "plain": "Soil is the thin top layer that plants grow in: broken rock, humus, water, air and living things. Loam is the farmer's favourite because it holds enough water but still drains.", "examples": [{"q": "A farmer's land is sandy and crops dry up quickly. Suggest what he can do.", "steps": ["Step 1. Sandy soil has big particles, so water drains away fast and nutrients are washed out.", "Step 2. Add organic manure or compost — humus holds water and nutrients.", "Step 3. Mulch the surface with dry grass to cut down evaporation, and plant cover crops to protect the soil."], "fig": null}, {"q": "Why does farming on a steep slope need special care?", "steps": ["Step 1. Rain water runs fast down a slope and carries the topsoil away — erosion.", "Step 2. Plough along the contour (across the slope), not up and down.", "Step 3. Make terraces or strips, and plant grass barriers to slow the water."], "fig": null}]}, {"id": "rocks", "name": "Rocks & mineral exploitation", "section": "Diversity of Matter", "notes": ["Three rock types: igneous (cooled magma — granite, basalt), sedimentary (layers of deposits — limestone, sandstone, shale) and metamorphic (changed by heat and pressure — marble, slate, quartzite).", "Rocks break down by weathering — physical (heating and cooling, water), chemical (acids, oxygen) and biological (roots, lichens) — to form soil.", "Ghana's main minerals: gold, bauxite, manganese, diamond, limestone, salt, crude oil and natural gas.", "Mining may be surface (open pit, alluvial) or underground (shaft).", "Benefits: foreign exchange, employment, raw materials, infrastructure. Problems: land degradation, water pollution, pits left open, displacement of farmers and mining accidents."], "plain": "Rocks are the solid material the earth is made of; minerals are the useful substances inside them. Igneous rocks cooled from magma, sedimentary rocks settled in layers, and metamorphic rocks were changed by heat and pressure.", "examples": [{"q": "How can you tell a sedimentary rock from an igneous one in the field?", "steps": ["Step 1. Look for layers (strata) — sedimentary rocks are usually layered; igneous rocks are not.", "Step 2. Look for fossils — only sedimentary rocks contain them.", "Step 3. Feel the grain — many igneous rocks have interlocking crystals and feel hard and even."], "fig": null}, {"q": "Explain how a gold mining company can reduce the damage it causes.", "steps": ["Step 1. Keep out of forest reserves and river buffers, and treat waste water before releasing it.", "Step 2. Store the topsoil, then replace it and replant trees after mining — land reclamation.", "Step 3. Fill or fence the pits, provide protective gear, and resettle or compensate affected farmers fairly."], "fig": "<svg viewBox=\"0 0 514 96\" class=\"dia\" role=\"img\" aria-label=\"Reclaiming mined land\" style=\"width:min(100%,520px)\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5.5\" markerHeight=\"5.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dah\"/></marker></defs><text x=\"257.0\" y=\"15.0\" class=\"dmut\" text-anchor=\"middle\" style=\"font-size:12px\">Mining with land reclamation</text><rect x=\"10\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"62.0\" y=\"49.0\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Clear & store</text><text x=\"62.0\" y=\"64.0\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">topsoil</text><rect x=\"140\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"192.0\" y=\"56.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Mine the ore</text><line x1=\"117.0\" y1=\"53.0\" x2=\"136.0\" y2=\"53.0\" class=\"dline\" marker-end=\"url(#ah)\"/><rect x=\"270\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"322.0\" y=\"56.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Refill the pit</text><line x1=\"247.0\" y1=\"53.0\" x2=\"266.0\" y2=\"53.0\" class=\"dline\" marker-end=\"url(#ah)\"/><rect x=\"400\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"452.0\" y=\"49.0\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Replace soil &</text><text x=\"452.0\" y=\"64.0\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">replant</text><line x1=\"377.0\" y1=\"53.0\" x2=\"396.0\" y2=\"53.0\" class=\"dline\" marker-end=\"url(#ah)\"/></svg>"}]}, {"id": "organic", "name": "Organic compounds & petrochemicals", "section": "Diversity of Matter", "notes": ["Organic compounds contain carbon; hydrocarbons contain carbon and hydrogen only.", "Alkanes (C_nH<sub>2n+2</sub>): methane, ethane, propane, butane — saturated, single bonds.", "Alkenes (C_nH<sub>2n</sub>) have a double bond and are unsaturated; they decolourise bromine water.", "Crude oil is separated by fractional distillation: petroleum gas, petrol, kerosene, diesel, lubricating oil, bitumen (top to bottom).", "Plastics are polymers made from small molecules (monomers); most are non-biodegradable."], "plain": "Organic compounds are built around carbon. Crude oil is a mixture of them; heating it separates the parts by their different boiling points, which is why one well gives petrol, kerosene and diesel.", "examples": [{"q": "Why does petrol come out near the top of the fractionating column and bitumen at the bottom?", "steps": ["Step 1. The crude oil is heated and the vapours rise up the column, which is hottest at the bottom.", "Step 2. Fractions with LOW boiling points rise high before they cool and condense — petrol and petroleum gas.", "Step 3. Fractions with HIGH boiling points condense early, near the bottom — lubricating oil and bitumen."], "fig": null}, {"q": "How do you show that ethene is unsaturated?", "steps": ["Step 1. Unsaturated means it has a double bond.", "Step 2. Add a few drops of bromine water and shake.", "Step 3. The red-brown colour disappears (it is decolourised) — ethene is <b>unsaturated</b>. Ethane, which is saturated, leaves the colour unchanged."], "fig": null}], "fig": "<svg viewBox=\"0 0 644 96\" class=\"dia\" role=\"img\" aria-label=\"Fractions of crude oil\" style=\"width:min(100%,520px)\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5.5\" markerHeight=\"5.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dah\"/></marker></defs><text x=\"322.0\" y=\"15.0\" class=\"dmut\" text-anchor=\"middle\" style=\"font-size:12px\">Fractions from the top of the column to the bottom</text><rect x=\"10\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"62.0\" y=\"56.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Petroleum gas</text><rect x=\"140\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"192.0\" y=\"56.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Petrol</text><line x1=\"117.0\" y1=\"53.0\" x2=\"136.0\" y2=\"53.0\" class=\"dline\" marker-end=\"url(#ah)\"/><rect x=\"270\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"322.0\" y=\"56.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Kerosene</text><line x1=\"247.0\" y1=\"53.0\" x2=\"266.0\" y2=\"53.0\" class=\"dline\" marker-end=\"url(#ah)\"/><rect x=\"400\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"452.0\" y=\"56.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Diesel</text><line x1=\"377.0\" y1=\"53.0\" x2=\"396.0\" y2=\"53.0\" class=\"dline\" marker-end=\"url(#ah)\"/><rect x=\"530\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"582.0\" y=\"56.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Bitumen</text><line x1=\"507.0\" y1=\"53.0\" x2=\"526.0\" y2=\"53.0\" class=\"dline\" marker-end=\"url(#ah)\"/></svg>"}, {"id": "air", "name": "Air, weather & the nitrogen cycle", "section": "Cycles", "notes": ["Air by volume: nitrogen ≈ 78%, oxygen ≈ 21%, carbon dioxide ≈ 0.03%, noble gases ≈ 0.97%, plus water vapour and dust.", "Oxygen supports burning and respiration; carbon dioxide turns lime water milky and puts out flames.", "Nitrogen cycle: nitrogen fixation (lightning, <i>Rhizobium</i> in legume root nodules) → nitrification → absorption by plants → decay/ammonification → denitrification.", "Weather elements: temperature, rainfall, humidity, wind, sunshine, cloud cover, air pressure.", "Instruments: thermometer, rain gauge, hygrometer, anemometer (wind speed), wind vane (direction), barometer (pressure)."], "plain": "Air is a mixture, not a compound: mostly nitrogen, about a fifth oxygen, and a little carbon dioxide and noble gases. Nitrogen keeps cycling between the air, the soil and living things.", "examples": [{"q": "Describe the composition of air and how you would show that oxygen is about one-fifth of it.", "steps": ["Step 1. Nitrogen ≈ 78%, oxygen ≈ 21%, noble gases ≈ 0.97%, carbon dioxide ≈ 0.03%.", "Step 2. Float a candle on water, light it and cover it with a gas jar.", "Step 3. The candle burns until the oxygen is used up, and water rises to take its place.", "Step 4. The water rises about one-fifth of the way up the jar — so oxygen is about 20% of air."], "fig": "<svg viewBox=\"0 0 320 220\" class=\"dia\" role=\"img\" aria-label=\"Composition of air\" style=\"width:min(100%,368px)\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5.5\" markerHeight=\"5.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dah\"/></marker></defs><path d=\"M110,108 L110.0,24.0 A84,84 0 1 1 27.5,92.3 Z\" class=\"dfill\" fill-opacity=\"0.25\"/><text x=\"173.7\" y=\"188.1\" class=\"dmut\" text-anchor=\"middle\">281°</text><rect x=\"216\" y=\"26\" width=\"11\" height=\"11\" class=\"dfill\" fill-opacity=\"0.25\"/><text x=\"233.0\" y=\"36.0\" class=\"dmut\" text-anchor=\"start\">Nitrogen</text><path d=\"M110,108 L27.5,92.3 A84,84 0 0 1 104.7,24.2 Z\" class=\"dfill\" fill-opacity=\"0.55\"/><text x=\"43.9\" y=\"36.0\" class=\"dmut\" text-anchor=\"middle\">76°</text><rect x=\"216\" y=\"48\" width=\"11\" height=\"11\" class=\"dfill\" fill-opacity=\"0.55\"/><text x=\"233.0\" y=\"58.0\" class=\"dmut\" text-anchor=\"start\">Oxygen</text><path d=\"M110,108 L104.7,24.2 A84,84 0 0 1 110.0,24.0 Z\" class=\"dfill\" fill-opacity=\"0.85\"/><text x=\"106.9\" y=\"11.0\" class=\"dmut\" text-anchor=\"middle\">4°</text><rect x=\"216\" y=\"70\" width=\"11\" height=\"11\" class=\"dfill\" fill-opacity=\"0.85\"/><text x=\"233.0\" y=\"80.0\" class=\"dmut\" text-anchor=\"start\">Others</text></svg>"}, {"q": "How does nitrogen from the air get into a maize plant?", "steps": ["Step 1. Plants cannot use nitrogen gas directly.", "Step 2. Lightning and nitrogen-fixing bacteria (such as <i>Rhizobium</i> in legume nodules) change it into compounds — nitrogen fixation.", "Step 3. Soil bacteria change these into nitrates (nitrification), and the roots absorb the nitrates."], "fig": "<svg viewBox=\"0 0 260 260\" class=\"dia\" role=\"img\" aria-label=\"The nitrogen cycle\" style=\"width:min(100%,299px)\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5.5\" markerHeight=\"5.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dah\"/></marker></defs><circle cx=\"130.0\" cy=\"130.0\" r=\"82\" class=\"ddash\"/><text x=\"130.0\" y=\"133.5\" class=\"dmut\" text-anchor=\"middle\">Nitrogen cycle</text><rect x=\"84.0\" y=\"31.0\" width=\"92\" height=\"34\" rx=\"7\" class=\"dfill\"/><text x=\"130.0\" y=\"45.0\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">Nitrogen in</text><text x=\"130.0\" y=\"58.0\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">air</text><path d=\"M172.4,35.0 A104,104 0 0 1 207.2,60.3\" class=\"dline\" marker-end=\"url(#ah)\"/><rect x=\"162.0\" y=\"87.7\" width=\"92\" height=\"34\" rx=\"7\" class=\"dfill\"/><text x=\"208.0\" y=\"108.2\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">Fixation</text><path d=\"M233.4,141.0 A104,104 0 0 1 220.1,181.9\" class=\"dline\" marker-end=\"url(#ah)\"/><rect x=\"132.2\" y=\"179.3\" width=\"92\" height=\"34\" rx=\"7\" class=\"dfill\"/><text x=\"178.2\" y=\"193.3\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">Nitrates in</text><text x=\"178.2\" y=\"206.3\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">soil</text><path d=\"M151.5,231.8 A104,104 0 0 1 108.5,231.8\" class=\"dline\" marker-end=\"url(#ah)\"/><rect x=\"35.8\" y=\"179.3\" width=\"92\" height=\"34\" rx=\"7\" class=\"dfill\"/><text x=\"81.8\" y=\"193.3\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">Taken by</text><text x=\"81.8\" y=\"206.3\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">plants</text><path d=\"M39.9,181.9 A104,104 0 0 1 26.6,141.0\" class=\"dline\" marker-end=\"url(#ah)\"/><rect x=\"6.0\" y=\"87.7\" width=\"92\" height=\"34\" rx=\"7\" class=\"dfill\"/><text x=\"52.0\" y=\"108.2\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">Decay</text><path d=\"M52.8,60.3 A104,104 0 0 1 87.6,35.0\" class=\"dline\" marker-end=\"url(#ah)\"/></svg>"}]}, {"id": "hydro", "name": "The water cycle & pollution of water", "section": "Cycles", "notes": ["Water cycle: evaporation and transpiration → condensation → precipitation → run-off and infiltration.", "Sources of water: rain, rivers, streams, springs, wells, boreholes, lakes and the sea.", "Water-borne diseases: cholera, typhoid, dysentery, guinea worm, bilharzia (schistosomiasis).", "Domestic treatment: boiling, filtering, adding chlorine tablets or bleach, and the Sodis (solar) method.", "Water pollutants: sewage, refuse, industrial waste, mining mercury and mud (galamsey), farm chemicals and oil spills."], "plain": "The water cycle is nature recycling its water: the sun lifts it as vapour, clouds form, rain falls, and it runs back to the sea. No new water is ever made.", "examples": [{"q": "Explain why it rains more near the coast and the forest than in the far north.", "steps": ["Step 1. Evaporation is greatest over the sea and where there is thick vegetation (transpiration).", "Step 2. Moist air rising over these areas cools and condenses into clouds.", "Step 3. More moisture in the air means more rain; drier inland air gives less."], "fig": "<svg viewBox=\"0 0 260 260\" class=\"dia\" role=\"img\" aria-label=\"The water cycle\" style=\"width:min(100%,299px)\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5.5\" markerHeight=\"5.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dah\"/></marker></defs><circle cx=\"130.0\" cy=\"130.0\" r=\"82\" class=\"ddash\"/><text x=\"130.0\" y=\"133.5\" class=\"dmut\" text-anchor=\"middle\">Water cycle</text><rect x=\"84.0\" y=\"31.0\" width=\"92\" height=\"34\" rx=\"7\" class=\"dfill\"/><text x=\"130.0\" y=\"51.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">Evaporation</text><path d=\"M172.4,35.0 A104,104 0 0 1 225.0,87.6\" class=\"dline\" marker-end=\"url(#ah)\"/><rect x=\"166.0\" y=\"113.0\" width=\"92\" height=\"34\" rx=\"7\" class=\"dfill\"/><text x=\"212.0\" y=\"133.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">Condensation</text><path d=\"M225.0,172.4 A104,104 0 0 1 172.4,225.0\" class=\"dline\" marker-end=\"url(#ah)\"/><rect x=\"84.0\" y=\"195.0\" width=\"92\" height=\"34\" rx=\"7\" class=\"dfill\"/><text x=\"130.0\" y=\"215.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">Precipitation</text><path d=\"M87.6,225.0 A104,104 0 0 1 35.0,172.4\" class=\"dline\" marker-end=\"url(#ah)\"/><rect x=\"2.0\" y=\"113.0\" width=\"92\" height=\"34\" rx=\"7\" class=\"dfill\"/><text x=\"48.0\" y=\"133.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">Run-off</text><path d=\"M35.0,87.6 A104,104 0 0 1 87.6,35.0\" class=\"dline\" marker-end=\"url(#ah)\"/></svg>"}, {"q": "Water from a stream looks clear. Why is it still unsafe to drink?", "steps": ["Step 1. Clearness only means there are few solid particles.", "Step 2. Germs such as <i>Vibrio cholerae</i> and typhoid bacteria are far too small to see.", "Step 3. Boil the water for a few minutes, or filter and add the recommended chlorine tablets, before drinking."], "fig": null}]}, {"id": "pests", "name": "Pests, parasites & their life cycles", "section": "Cycles", "notes": ["Complete metamorphosis (egg → larva → pupa → adult): mosquito, housefly, butterfly, beetle.", "Incomplete metamorphosis (egg → nymph → adult): cockroach, grasshopper, termite.", "<i>Anopheles</i> mosquito transmits malaria; <i>Aedes</i> transmits yellow fever and dengue; <i>Culex</i> transmits filariasis.", "Housefly carries cholera, typhoid and dysentery on its body and in its vomit and faeces.", "Control: clear stagnant water, use treated nets and insecticides, keep food covered, dispose of refuse properly, treat infected people."], "plain": "A pest damages crops or property; a parasite lives on or inside another organism and harms it. Knowing the life cycle shows you where to break it — usually at the egg or larva stage.", "examples": [{"q": "Explain how clearing stagnant water reduces malaria in a town.", "steps": ["Step 1. The mosquito lays its eggs on still water; the larva and pupa also live there.", "Step 2. No still water means no breeding place, so the cycle is broken early.", "Step 3. Fewer adult mosquitoes emerge, so fewer bites and less malaria."], "fig": "<svg viewBox=\"0 0 260 260\" class=\"dia\" role=\"img\" aria-label=\"Life cycle of the mosquito\" style=\"width:min(100%,299px)\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5.5\" markerHeight=\"5.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dah\"/></marker></defs><circle cx=\"130.0\" cy=\"130.0\" r=\"82\" class=\"ddash\"/><text x=\"130.0\" y=\"133.5\" class=\"dmut\" text-anchor=\"middle\">Mosquito</text><rect x=\"84.0\" y=\"31.0\" width=\"92\" height=\"34\" rx=\"7\" class=\"dfill\"/><text x=\"130.0\" y=\"51.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">Egg</text><path d=\"M172.4,35.0 A104,104 0 0 1 225.0,87.6\" class=\"dline\" marker-end=\"url(#ah)\"/><rect x=\"166.0\" y=\"113.0\" width=\"92\" height=\"34\" rx=\"7\" class=\"dfill\"/><text x=\"212.0\" y=\"133.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">Larva</text><path d=\"M225.0,172.4 A104,104 0 0 1 172.4,225.0\" class=\"dline\" marker-end=\"url(#ah)\"/><rect x=\"84.0\" y=\"195.0\" width=\"92\" height=\"34\" rx=\"7\" class=\"dfill\"/><text x=\"130.0\" y=\"215.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">Pupa</text><path d=\"M87.6,225.0 A104,104 0 0 1 35.0,172.4\" class=\"dline\" marker-end=\"url(#ah)\"/><rect x=\"2.0\" y=\"113.0\" width=\"92\" height=\"34\" rx=\"7\" class=\"dfill\"/><text x=\"48.0\" y=\"133.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">Adult</text><path d=\"M35.0,87.6 A104,104 0 0 1 87.6,35.0\" class=\"dline\" marker-end=\"url(#ah)\"/></svg>"}, {"q": "State two ways the housefly spreads disease and two ways to control it.", "steps": ["Step 1. It carries germs on its hairy legs from faeces and refuse to food.", "Step 2. It vomits and passes faeces on food while feeding.", "Step 3. Control: cover food and dispose of refuse properly (no breeding place); use screens, traps or approved insecticide."], "fig": null}]}, {"id": "crop", "name": "Crop production", "section": "Cycles", "notes": ["Land preparation: clearing → stumping → ploughing → harrowing → ridging.", "Propagation: by seed (maize, rice, cowpea) or vegetatively (cassava stem cuttings, yam setts, plantain suckers, sugar cane setts).", "NPK: nitrogen for leaves and green growth, phosphorus for roots, potassium for fruits, flowers and disease resistance.", "Nitrogen deficiency shows as yellowing of older leaves (chlorosis) and stunted growth.", "Good practices: crop rotation, mulching, correct spacing, timely weeding, pest control and proper storage."], "plain": "Crop production is growing plants for food and money. The main ideas: prepare the land well, plant at the right spacing and time, feed the soil, and control weeds and pests early.", "examples": [{"q": "A farmer's maize leaves are turning yellow from the bottom of the plant upwards. What is wrong?", "steps": ["Step 1. Yellowing of the OLDER leaves first points to nitrogen deficiency.", "Step 2. Nitrogen moves inside the plant to the young leaves, leaving the old ones pale.", "Step 3. Apply a nitrogen fertiliser such as sulphate of ammonia or urea, or well-rotted manure."], "fig": null}, {"q": "Why does a farmer rotate maize, cowpea and cassava instead of planting maize every year?", "steps": ["Step 1. Different crops take different nutrients and feed at different soil depths.", "Step 2. The cowpea is a legume — its root nodules add nitrogen to the soil.", "Step 3. Rotation also breaks the life cycles of pests and diseases that attack one crop, and helps control weeds."], "fig": null}]}, {"id": "farmtools", "name": "Farm tools, machinery & safety", "section": "Cycles", "notes": ["Simple tools: cutlass (clearing), hoe (weeding and ridging), mattock (digging), rake, watering can, secateurs (pruning), knapsack sprayer (chemicals), head pan.", "Machinery: tractor and its implements — plough (turns the soil), harrow (breaks clods), ridger (makes ridges), planter, combine harvester, maize sheller, irrigation pump.", "Care of tools: clean after use, sharpen cutting edges, oil metal parts, replace loose handles, store in a dry shed.", "Safety: wear protective clothing, boots and gloves; never spray against the wind; wash after using chemicals; keep children away from machines; service machines before the season.", "Advantages of machinery: speed, large areas, less drudgery. Disadvantages: high cost, fuel and spare parts, trained operators needed, and soil compaction."], "plain": "Tools and machines decide how much one farmer can do in a day. Simple tools are cheap and need no fuel; machines cover large areas fast but cost a lot and need skill and servicing.", "examples": [{"q": "Put these in the right order for preparing land with a tractor: ridging, harrowing, ploughing, clearing.", "steps": ["Step 1. <b>Clearing</b> — remove the vegetation and stumps.", "Step 2. <b>Ploughing</b> — turn the soil over to bury trash and loosen it.", "Step 3. <b>Harrowing</b> — break the clods into a fine tilth.", "Step 4. <b>Ridging</b> — make ridges or beds, then plant."], "fig": "<svg viewBox=\"0 0 514 96\" class=\"dia\" role=\"img\" aria-label=\"Land preparation order\" style=\"width:min(100%,520px)\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5.5\" markerHeight=\"5.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dah\"/></marker></defs><text x=\"257.0\" y=\"15.0\" class=\"dmut\" text-anchor=\"middle\" style=\"font-size:12px\">Preparing land with a tractor</text><rect x=\"10\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"62.0\" y=\"56.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Clearing</text><rect x=\"140\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"192.0\" y=\"56.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Ploughing</text><line x1=\"117.0\" y1=\"53.0\" x2=\"136.0\" y2=\"53.0\" class=\"dline\" marker-end=\"url(#ah)\"/><rect x=\"270\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"322.0\" y=\"56.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Harrowing</text><line x1=\"247.0\" y1=\"53.0\" x2=\"266.0\" y2=\"53.0\" class=\"dline\" marker-end=\"url(#ah)\"/><rect x=\"400\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"452.0\" y=\"56.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Ridging</text><line x1=\"377.0\" y1=\"53.0\" x2=\"396.0\" y2=\"53.0\" class=\"dline\" marker-end=\"url(#ah)\"/></svg>"}, {"q": "A farmer's knapsack sprayer leaks onto his back while spraying. What should he do?", "steps": ["Step 1. Stop at once and move away from the spray area.", "Step 2. Remove the contaminated clothing and wash the skin with plenty of soap and water.", "Step 3. Repair or replace the faulty sprayer before using it again, and report to a clinic if he feels unwell, taking the chemical label with him."], "fig": null}]}, {"id": "animal", "name": "Animal production", "section": "Cycles", "notes": ["Farm animals: cattle, sheep, goats, pigs, poultry, rabbits, grasscutters and fish.", "Poultry systems: extensive (free range), semi-intensive and intensive (deep litter, battery cage).", "Chick → grower → layer/broiler. A balanced ration contains carbohydrate, protein, fat, minerals, vitamins and water.", "Ruminants (cattle, sheep, goats) have a four-chambered stomach: rumen, reticulum, omasum, abomasum.", "Common diseases: Newcastle disease and fowl pox in poultry; anthrax and rinderpest in cattle. Prevent by vaccination and good sanitation."], "plain": "Animal production is keeping livestock for meat, eggs, milk and money. Good housing, a balanced ration, clean water and vaccination are what keep animals productive.", "examples": [{"q": "A poultry farmer's layers are producing eggs with thin shells. What is the likely cause and the remedy?", "steps": ["Step 1. Egg shell is made mainly of calcium carbonate.", "Step 2. Thin shells suggest too little calcium in the feed.", "Step 3. Add a calcium source — oyster shell, limestone powder or a layers' mash — to the ration."], "fig": null}, {"q": "State four ways of preventing disease outbreaks on a poultry farm.", "steps": ["Step 1. Follow the vaccination programme (for example against Newcastle disease).", "Step 2. Keep the house clean and dry, and disinfect equipment.", "Step 3. Use a foot bath and limit visitors; isolate sick birds at once.", "Step 4. Avoid overcrowding and give clean water and a balanced ration."], "fig": null}]}, {"id": "nutrition", "name": "Food, nutrition & digestion", "section": "Systems", "notes": ["Food classes: carbohydrates, proteins, fats and oils, vitamins, mineral salts, water and roughage.", "Tests: starch + iodine → blue-black;  reducing sugar + Benedict's, heated → brick red;  protein + Biuret → purple;  fat → translucent spot on paper.", "Enzymes: amylase (starch → maltose), pepsin (protein → peptides), lipase (fats → fatty acids + glycerol).", "Bile from the liver emulsifies fats; it is not an enzyme.", "Deficiency diseases: kwashiorkor and marasmus (protein/energy), rickets (vitamin D), scurvy (vitamin C), anaemia (iron), goitre (iodine), night blindness (vitamin A)."], "plain": "Food gives energy, materials for growth and protection from disease. Digestion breaks big food molecules into small ones that can pass into the blood.", "examples": [{"q": "How do you test a food sample for starch and for protein?", "steps": ["Step 1. <b>Starch:</b> add two drops of iodine solution — a blue-black colour shows starch.", "Step 2. <b>Protein:</b> add sodium hydroxide, then a few drops of copper(II) sulphate (the Biuret test) — a purple colour shows protein.", "Step 3. Always compare with a control, such as plain water."], "fig": null}, {"q": "A child eats mainly kenkey and gari and develops a swollen body and pale hair. Explain.", "steps": ["Step 1. These foods are almost all carbohydrate — plenty of energy, very little protein.", "Step 2. Without protein the body cannot make new tissue or plasma proteins, so fluid collects in the tissues.", "Step 3. The condition is <b>kwashiorkor</b>. Add beans, fish, eggs, groundnut or milk to the diet."], "fig": "<svg viewBox=\"0 0 644 96\" class=\"dia\" role=\"img\" aria-label=\"The digestive path\" style=\"width:min(100%,520px)\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5.5\" markerHeight=\"5.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dah\"/></marker></defs><text x=\"322.0\" y=\"15.0\" class=\"dmut\" text-anchor=\"middle\" style=\"font-size:12px\">Path of food through the gut</text><rect x=\"10\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"62.0\" y=\"56.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Mouth</text><rect x=\"140\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"192.0\" y=\"56.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Oesophagus</text><line x1=\"117.0\" y1=\"53.0\" x2=\"136.0\" y2=\"53.0\" class=\"dline\" marker-end=\"url(#ah)\"/><rect x=\"270\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"322.0\" y=\"56.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Stomach</text><line x1=\"247.0\" y1=\"53.0\" x2=\"266.0\" y2=\"53.0\" class=\"dline\" marker-end=\"url(#ah)\"/><rect x=\"400\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"452.0\" y=\"49.0\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Small</text><text x=\"452.0\" y=\"64.0\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">intestine</text><line x1=\"377.0\" y1=\"53.0\" x2=\"396.0\" y2=\"53.0\" class=\"dline\" marker-end=\"url(#ah)\"/><rect x=\"530\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"582.0\" y=\"49.0\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Large</text><text x=\"582.0\" y=\"64.0\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">intestine</text><line x1=\"507.0\" y1=\"53.0\" x2=\"526.0\" y2=\"53.0\" class=\"dline\" marker-end=\"url(#ah)\"/></svg>"}]}, {"id": "teeth", "name": "Teeth & dentition", "section": "Systems", "notes": ["Types of teeth: incisors (cutting), canines (tearing), premolars and molars (chewing and grinding).", "An adult human has 32 teeth; the dental formula is I 2/2, C 1/1, PM 2/2, M 3/3 — for one half of each jaw.", "Milk (deciduous) teeth number 20 and are replaced by permanent teeth.", "Structure of a tooth: enamel (hard outer layer), dentine, pulp cavity (nerves and blood vessels), cement and root.", "Dental caries (tooth decay) is caused by bacteria acting on sugar to form acid, which dissolves the enamel.", "Care: brush twice daily, reduce sugary foods, rinse after meals, visit a dentist, and avoid using teeth as tools."], "plain": "Teeth are the body's first food processor. Each shape does a different job, and all of them depend on one thin layer — enamel — which the body cannot replace once acid has eaten through it.", "examples": [{"q": "Why do dentists say the damage is done by HOW OFTEN you eat sugar, not just how much?", "steps": ["Step 1. Every time sugar reaches the mouth, bacteria produce acid within minutes.", "Step 2. Saliva needs about half an hour to wash the acid away and restore the mouth.", "Step 3. Sweets eaten one at a time all afternoon keep the mouth acidic for hours, while the same sweets eaten at one sitting give the saliva time to recover."], "fig": null}, {"q": "Compare the dentition of a goat with that of a dog.", "steps": ["Step 1. A goat is a herbivore: it has broad molars for grinding grass, a horny pad instead of upper incisors, and a gap (diastema) where the tongue moves the food.", "Step 2. A dog is a carnivore: it has long canines for tearing and carnassial teeth for shearing meat.", "Step 3. The teeth match the diet — that is the point the examiner is testing."], "fig": null}]}, {"id": "respcirc", "name": "Respiration & circulation", "section": "Systems", "notes": ["Aerobic respiration: glucose + oxygen → carbon dioxide + water + energy (about 2900 kJ per mole of glucose).", "Anaerobic respiration in muscle gives lactic acid; in yeast it gives ethanol and carbon dioxide.", "Breathing in: ribs move up and out, diaphragm flattens, chest volume increases, pressure falls, air rushes in.", "Blood: red cells (haemoglobin carries oxygen), white cells (defence), platelets (clotting), plasma (transport).", "Heart: right side handles deoxygenated blood, left side oxygenated. Arteries carry blood away from the heart; veins have valves."], "plain": "Respiration is releasing energy from food inside every cell — it is not the same as breathing. The blood is the delivery system: it carries oxygen and food in, and waste out.", "examples": [{"q": "Why do you breathe faster and deeper when running?", "steps": ["Step 1. Running muscles need much more energy, so they respire faster.", "Step 2. Faster respiration needs more oxygen and produces more carbon dioxide.", "Step 3. Breathing rate and depth increase to supply the oxygen and remove the carbon dioxide quickly."], "fig": null}, {"q": "Trace a drop of blood from the right side of the heart until it returns there.", "steps": ["Step 1. Right atrium → right ventricle → pulmonary artery → lungs (it picks up oxygen here).", "Step 2. Lungs → pulmonary vein → left atrium → left ventricle.", "Step 3. Left ventricle → aorta → body organs → vena cava → back to the right atrium."], "fig": "<svg viewBox=\"0 0 644 96\" class=\"dia\" role=\"img\" aria-label=\"Path of blood\" style=\"width:min(100%,520px)\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5.5\" markerHeight=\"5.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dah\"/></marker></defs><text x=\"322.0\" y=\"15.0\" class=\"dmut\" text-anchor=\"middle\" style=\"font-size:12px\">Double circulation</text><rect x=\"10\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"62.0\" y=\"56.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Right heart</text><rect x=\"140\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"192.0\" y=\"56.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Lungs</text><line x1=\"117.0\" y1=\"53.0\" x2=\"136.0\" y2=\"53.0\" class=\"dline\" marker-end=\"url(#ah)\"/><rect x=\"270\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"322.0\" y=\"56.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Left heart</text><line x1=\"247.0\" y1=\"53.0\" x2=\"266.0\" y2=\"53.0\" class=\"dline\" marker-end=\"url(#ah)\"/><rect x=\"400\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"452.0\" y=\"56.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Body</text><line x1=\"377.0\" y1=\"53.0\" x2=\"396.0\" y2=\"53.0\" class=\"dline\" marker-end=\"url(#ah)\"/><rect x=\"530\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"582.0\" y=\"56.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Back to heart</text><line x1=\"507.0\" y1=\"53.0\" x2=\"526.0\" y2=\"53.0\" class=\"dline\" marker-end=\"url(#ah)\"/></svg>"}]}, {"id": "excskel", "name": "Excretion, skeleton & the nervous system", "section": "Systems", "notes": ["Excretory organs: kidneys (urea, water, salts), lungs (carbon dioxide, water vapour), skin (sweat), liver (bile pigments).", "The nephron is the functional unit of the kidney: ultrafiltration in the glomerulus, then selective reabsorption.", "Skeleton functions: support, protection, movement, blood-cell formation and mineral storage.", "Joints: hinge (elbow, knee), ball-and-socket (hip, shoulder), pivot (neck), gliding, immovable (skull).", "Nervous system: brain and spinal cord (central) plus nerves. A reflex arc is receptor → sensory neurone → relay → motor neurone → effector."], "plain": "Excretion removes the poisonous waste your body itself makes (urea, carbon dioxide). The skeleton supports and protects, and the nervous system carries messages.", "examples": [{"q": "Distinguish between excretion and egestion, with an example of each.", "steps": ["Step 1. <b>Excretion</b> removes waste made BY the body's own chemistry — urea in urine, carbon dioxide from the lungs.", "Step 2. <b>Egestion</b> removes undigested food, which never became part of the body's chemistry — faeces.", "Step 3. So the kidney excretes; the anus egests."], "fig": null}, {"q": "Why do you pull your hand away from a hot coal before you feel the pain?", "steps": ["Step 1. Heat receptors in the skin send an impulse along a sensory neurone to the spinal cord.", "Step 2. A relay neurone passes it straight to a motor neurone, which makes the arm muscle contract.", "Step 3. This short path is a <b>reflex arc</b>; the message reaches the brain afterwards, which is why the pain comes later."], "fig": "<svg viewBox=\"0 0 644 96\" class=\"dia\" role=\"img\" aria-label=\"Reflex arc\" style=\"width:min(100%,520px)\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5.5\" markerHeight=\"5.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dah\"/></marker></defs><text x=\"322.0\" y=\"15.0\" class=\"dmut\" text-anchor=\"middle\" style=\"font-size:12px\">The reflex arc</text><rect x=\"10\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"62.0\" y=\"49.0\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Receptor in</text><text x=\"62.0\" y=\"64.0\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">skin</text><rect x=\"140\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"192.0\" y=\"49.0\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Sensory</text><text x=\"192.0\" y=\"64.0\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">neurone</text><line x1=\"117.0\" y1=\"53.0\" x2=\"136.0\" y2=\"53.0\" class=\"dline\" marker-end=\"url(#ah)\"/><rect x=\"270\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"322.0\" y=\"56.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Spinal cord</text><line x1=\"247.0\" y1=\"53.0\" x2=\"266.0\" y2=\"53.0\" class=\"dline\" marker-end=\"url(#ah)\"/><rect x=\"400\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"452.0\" y=\"56.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Motor neurone</text><line x1=\"377.0\" y1=\"53.0\" x2=\"396.0\" y2=\"53.0\" class=\"dline\" marker-end=\"url(#ah)\"/><rect x=\"530\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"582.0\" y=\"56.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Muscle</text><line x1=\"507.0\" y1=\"53.0\" x2=\"526.0\" y2=\"53.0\" class=\"dline\" marker-end=\"url(#ah)\"/></svg>"}]}, {"id": "hormone", "name": "Hormones & the endocrine system", "section": "Systems", "notes": ["Hormones are chemical messengers made by endocrine (ductless) glands and carried in the blood.", "Pituitary — the 'master gland': growth hormone and hormones that control other glands.", "Thyroid — thyroxine, controls the rate of metabolism; it needs iodine, and a shortage causes goitre.", "Pancreas — insulin lowers blood sugar; too little insulin leads to diabetes mellitus.", "Adrenal glands — adrenaline, the 'fight or flight' hormone: faster heartbeat and breathing.", "Testes — testosterone; ovaries — oestrogen and progesterone: these control the changes of puberty.", "Nervous messages are fast and short-lived; hormonal messages are slower but last longer."], "plain": "Hormones are the body's slow messengers. The nervous system sends a quick telegram; the hormone system posts a letter that keeps working for hours or years — such as the hormones of puberty.", "examples": [{"q": "A student is suddenly frightened by a snake. Describe what adrenaline does.", "steps": ["Step 1. The adrenal glands release adrenaline into the blood.", "Step 2. The heart beats faster and breathing deepens, so more oxygen and glucose reach the muscles.", "Step 3. Stored glycogen is changed to glucose for energy, the pupils widen and blood is directed to the muscles — the body is ready to run or to fight."], "fig": null}, {"q": "Why is iodised salt sold in Ghana?", "steps": ["Step 1. Soils in some areas contain little iodine, so local foods supply little.", "Step 2. Without iodine the thyroid cannot make thyroxine and swells, causing goitre; in children it also slows growth and mental development.", "Step 3. Adding iodine to common salt reaches everybody cheaply, so the deficiency is prevented."], "fig": null}]}, {"id": "repro", "name": "Reproduction in humans & plants", "section": "Systems", "notes": ["A flower: sepals, petals, stamens (anther + filament, male) and carpel/pistil (stigma, style, ovary, female).", "Pollination is the transfer of pollen from anther to stigma; fertilisation is the fusion of male and female gametes.", "Wind-pollinated flowers are small, dull and scentless with feathery stigmas; insect-pollinated flowers are large, coloured, scented and have nectar.", "After fertilisation: ovule → seed, ovary → fruit.", "In humans, fertilisation occurs in the fallopian tube (oviduct); the embryo develops in the uterus, and the placenta exchanges food, oxygen and waste."], "plain": "Reproduction makes new individuals. In flowering plants, pollination moves pollen to the stigma and fertilisation joins the gametes; the ovule then becomes the seed and the ovary becomes the fruit.", "examples": [{"q": "A flower is small, green, has no scent and hangs outside the leaves with feathery stigmas. How is it pollinated, and why?", "steps": ["Step 1. Insects are attracted by colour, scent and nectar — this flower has none.", "Step 2. The exposed anthers and feathery stigmas are made for catching moving air.", "Step 3. It is <b>wind-pollinated</b>, like maize and grasses."], "fig": null}, {"q": "What happens after pollen lands on the stigma?", "steps": ["Step 1. The pollen grain germinates and grows a pollen tube down the style.", "Step 2. The male gamete travels down the tube and fuses with the egg cell — fertilisation.", "Step 3. The ovule becomes the <b>seed</b>, the ovary becomes the <b>fruit</b>, and the petals wither."], "fig": null}]}, {"id": "photo", "name": "Photosynthesis & plant growth", "section": "Systems", "notes": ["Photosynthesis: carbon dioxide + water --(light, chlorophyll)--> glucose + oxygen.", "It needs light, chlorophyll, carbon dioxide and water; the products are glucose (stored as starch) and oxygen.", "Destarch a plant by keeping it in the dark for 24–48 hours before a starch test.", "Starch test on a leaf: boil in water → boil in alcohol to remove chlorophyll → wash → add iodine.", "Germination needs water, oxygen and a suitable temperature; light is not needed for germination.", "Transpiration is measured with a potometer; it is faster in hot, dry, windy conditions."], "plain": "Photosynthesis is how green plants make their own food using sunlight. It is the start of nearly every food chain and the source of the oxygen we breathe.", "examples": [{"q": "Describe how you would show that chlorophyll is necessary for photosynthesis.", "steps": ["Step 1. Use a plant with variegated (green and white) leaves, and destarch it in the dark for 48 hours.", "Step 2. Leave it in sunlight for some hours, then take a leaf and draw the pattern of green and white parts.", "Step 3. Boil in water, then in alcohol to remove the chlorophyll, wash, and add iodine.", "Step 4. <b>Only the parts that were green turn blue-black</b> — so chlorophyll is necessary."], "fig": null}, {"q": "Why is a seed able to germinate in the dark but not able to keep growing there?", "steps": ["Step 1. Germination uses the food stored in the seed, so light is not needed at first.", "Step 2. Once the store is used up, the seedling must make its own food.", "Step 3. Without light there is no photosynthesis, so the seedling turns pale and dies."], "fig": null}]}, {"id": "preserve", "name": "Food preservation & processing", "section": "Systems", "notes": ["Food spoils because of micro-organisms (bacteria, moulds), enzymes in the food, insects, rodents and moisture.", "Preservation works by removing water, excluding air, lowering temperature, or adding substances that micro-organisms cannot live in.", "Methods: sun drying, smoking, salting, sugaring, canning and bottling, refrigeration and freezing, pasteurisation, frying in oil, and chemical preservatives.", "Local examples: smoked fish, dried pepper and okra, gari from cassava, salted fish (koobi), shea butter.", "Good storage: dry the produce well, store in clean airtight containers or silos, raise sacks off the floor, and protect against rodents and weevils."], "plain": "Food goes bad because tiny organisms feed on it. Every preservation method simply takes away something they need — water, air, warmth — or adds something they cannot survive, like salt.", "examples": [{"q": "Why does smoked fish keep longer than fresh fish?", "steps": ["Step 1. The heat of the fire dries the fish, removing the water micro-organisms need.", "Step 2. The heat also kills many of the organisms already on it.", "Step 3. Chemicals in the smoke itself slow the growth of bacteria and moulds, and the dry surface keeps new ones out."], "fig": null}, {"q": "A farmer harvests 20 bags of maize and loses 5 bags to weevils. Work out his loss and suggest two remedies.", "steps": ["Step 1. Loss = <span class=\"fr\"><span>5</span><span>20</span></span> × 100 = <b>25%</b> of the harvest.", "Step 2. Remedy 1: dry the grain to the right moisture level before storing.", "Step 3. Remedy 2: store in airtight (hermetic) bags or a treated silo, raised off the floor, and keep the store clean and rodent-proof."], "fig": null}]}, {"id": "energy", "name": "Energy, its forms & transformations", "section": "Energy", "notes": ["Forms of energy: mechanical (kinetic and potential), heat, light, sound, chemical, electrical, nuclear and solar.", "Energy is neither created nor destroyed; it only changes from one form to another (conservation of energy).", "Examples: torch — chemical → electrical → light + heat;  microphone — sound → electrical;  generator — mechanical → electrical.", "Renewable sources: solar, wind, hydro, biomass, tidal. Non-renewable: coal, crude oil, natural gas, nuclear fuel.", "Nuclear energy comes from fission (splitting heavy nuclei) or fusion (joining light nuclei, as in the sun)."], "plain": "Energy is the ability to do work. It is never created or destroyed — it only changes form, for example chemical energy in a battery becoming light in a bulb.", "examples": [{"q": "State the energy changes when a boy uses a torch, and when a hydro dam lights a town.", "steps": ["Step 1. Torch: chemical (cell) → electrical → light + heat.", "Step 2. Dam: potential energy of stored water → kinetic energy of falling water → mechanical energy of the turbine → electrical energy → light and heat in homes.", "Step 3. Some energy is always lost as heat — that is why no machine is 100% efficient."], "fig": null}, {"q": "Give two advantages and two disadvantages of solar energy for a village in the north.", "steps": ["Advantages: sunshine is free and abundant there; it causes no pollution and needs no fuel deliveries.", "Disadvantages: the panels and batteries cost a lot at first; there is no sun at night and less during the harmattan, so storage is needed."], "fig": null}]}, {"id": "heat", "name": "Heat energy", "section": "Energy", "notes": ["Heat travels by conduction (solids), convection (fluids) and radiation (no medium needed).", "Quantity of heat: Q = mcΔθ, where c is specific heat capacity (water: 4200 J/kg K).", "Latent heat is absorbed during a change of state with no change in temperature.", "Expansion: solids < liquids < gases. Used in the bimetallic strip, thermostats and the thermometer.", "A vacuum flask reduces all three: vacuum (conduction and convection), silvered surfaces (radiation), stopper (evaporation)."], "plain": "Heat moves in three ways: conduction through solids, convection in liquids and gases, and radiation which needs no material at all — that is how the sun's heat reaches us.", "examples": [{"q": "Calculate the heat needed to raise the temperature of 3 kg of water by 20 °C. [c = 4200 J/kg K]", "steps": ["Step 1. Formula: Q = mcΔθ.", "Step 2. Q = 3 × 4200 × 20.", "Step 3. = <b>252 000 J</b> (252 kJ)."], "fig": null}, {"q": "Explain why a cooking pot is metal but its handle is wooden.", "steps": ["Step 1. Metals are good conductors, so heat passes quickly into the food.", "Step 2. Wood is a poor conductor (an insulator).", "Step 3. The handle therefore stays cool enough to hold, and the cook is not burnt."], "fig": null}]}, {"id": "light", "name": "Light", "section": "Energy", "notes": ["Light travels in straight lines; this explains shadows and eclipses.", "Laws of reflection: angle of incidence = angle of reflection, and the incident ray, reflected ray and normal lie in the same plane.", "A plane mirror gives an image that is virtual, erect, laterally inverted, the same size, and as far behind the mirror as the object is in front.", "Refraction is the bending of light as it passes from one medium to another; it makes a stick in water look bent.", "Convex (converging) lens corrects long sight; concave (diverging) lens corrects short sight. White light splits into seven colours by dispersion."], "plain": "Light travels in straight lines. When it hits a mirror it bounces back at the same angle (reflection); when it passes into water or glass it bends (refraction).", "examples": [{"q": "A ray hits a plane mirror at 30° to the mirror surface. Find the angle of reflection.", "steps": ["Step 1. Angles are always measured from the NORMAL, not from the mirror.", "Step 2. Angle of incidence = 90 − 30 = 60°.", "Step 3. Angle of reflection = angle of incidence = <b>60°</b>."], "fig": "<svg viewBox=\"0 0 320 200\" class=\"dia\" role=\"img\" aria-label=\"Reflection at a plane mirror\" style=\"width:min(100%,368px)\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5.5\" markerHeight=\"5.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dah\"/></marker></defs><line x1=\"30\" y1=\"150\" x2=\"290\" y2=\"150\" class=\"dacc\"/><line x1=\"160\" y1=\"150\" x2=\"160\" y2=\"40\" class=\"ddash\"/><text x=\"160.0\" y=\"32.0\" class=\"dmut\" text-anchor=\"middle\">normal</text><line x1=\"60\" y1=\"55\" x2=\"160\" y2=\"150\" class=\"dline\" marker-end=\"url(#ah)\"/><line x1=\"160\" y1=\"150\" x2=\"260\" y2=\"55\" class=\"dline\" marker-end=\"url(#ah)\"/><text x=\"84.0\" y=\"48.0\" class=\"dmut\" text-anchor=\"middle\">incident ray</text><text x=\"246.0\" y=\"48.0\" class=\"dmut\" text-anchor=\"middle\">reflected ray</text><text x=\"140.0\" y=\"116.0\" class=\"dtxt\" text-anchor=\"middle\">i</text><text x=\"182.0\" y=\"116.0\" class=\"dtxt\" text-anchor=\"middle\">r</text><text x=\"160.0\" y=\"176.0\" class=\"dmut\" text-anchor=\"middle\">i = r  (plane mirror)</text></svg>"}, {"q": "Why does a coin at the bottom of a bucket of water look nearer the surface than it really is?", "steps": ["Step 1. Light from the coin passes from water into air.", "Step 2. At the surface it bends away from the normal — refraction.", "Step 3. Your eye traces the bent rays back in straight lines, so the coin appears raised."], "fig": "<svg viewBox=\"0 0 320 200\" class=\"dia\" role=\"img\" aria-label=\"Refraction at a water surface\" style=\"width:min(100%,368px)\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5.5\" markerHeight=\"5.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dah\"/></marker></defs><rect x=\"30\" y=\"100\" width=\"260\" height=\"76\" rx=\"4\" class=\"dfill\" fill-opacity=\"0.35\"/><line x1=\"30\" y1=\"100\" x2=\"290\" y2=\"100\" class=\"dacc\"/><line x1=\"160\" y1=\"30\" x2=\"160\" y2=\"170\" class=\"ddash\"/><line x1=\"70\" y1=\"34\" x2=\"160\" y2=\"100\" class=\"dline\" marker-end=\"url(#ah)\"/><line x1=\"160\" y1=\"100\" x2=\"205\" y2=\"172\" class=\"dline\" marker-end=\"url(#ah)\"/><text x=\"92.0\" y=\"28.0\" class=\"dmut\" text-anchor=\"middle\">ray in air</text><text x=\"240.0\" y=\"140.0\" class=\"dmut\" text-anchor=\"middle\">bends towards</text><text x=\"240.0\" y=\"156.0\" class=\"dmut\" text-anchor=\"middle\">the normal</text><text x=\"62.0\" y=\"120.0\" class=\"dmut\" text-anchor=\"start\">water / glass</text></svg>"}]}, {"id": "sound", "name": "Sound & waves", "section": "Energy", "notes": ["Sound is produced by vibrating bodies and needs a material medium — it cannot travel through a vacuum.", "Speed of sound in air ≈ 330–340 m/s; it is faster in liquids and fastest in solids.", "v = fλ  (speed = frequency × wavelength).", "Echo: the reflection of sound. Distance to the reflector = (v × t) ÷ 2.", "Pitch depends on frequency; loudness depends on amplitude; quality (timbre) distinguishes two instruments playing the same note."], "plain": "Sound is made by something vibrating, and it needs a material to travel through — there is no sound in a vacuum. It travels much more slowly than light.", "examples": [{"q": "A girl shouts towards a cliff and hears the echo 3 seconds later. If sound travels at 340 m/s, how far is the cliff?", "steps": ["Step 1. The sound goes to the cliff AND comes back, so it covers twice the distance.", "Step 2. Total distance = 340 × 3 = 1020 m.", "Step 3. Distance to the cliff = 1020 ÷ 2 = <b>510 m</b>."], "fig": null}, {"q": "Why do you see lightning before you hear thunder?", "steps": ["Step 1. Both happen at the same moment.", "Step 2. Light travels at about 300 000 000 m/s; sound travels at about 340 m/s.", "Step 3. Light reaches you almost at once, while the sound takes about 3 seconds for every kilometre."], "fig": null}]}, {"id": "elec", "name": "Electricity & magnetism", "section": "Energy", "notes": ["Ohm's law: V = IR. Resistors in series: R = R₁ + R₂. In parallel: 1/R = 1/R₁ + 1/R₂.", "Electrical power P = VI = I²R;  energy in kWh = power in kW × time in hours.", "In domestic wiring the fuse and switch go in the LIVE wire; earthing protects the user from shock.", "A magnet's like poles repel and unlike poles attract; repulsion is the only sure test for a magnet.", "A current in a coil makes an electromagnet; moving a magnet in a coil induces a current (the dynamo effect)."], "plain": "Current is the flow of charge round a circuit; voltage is the push that drives it; resistance slows it down. Ohm's law ties the three together: V = IR.", "examples": [{"q": "A lamp of resistance 20 Ω is connected to a 12 V battery. Find the current and the power.", "steps": ["Step 1. V = IR, so I = V ÷ R = 12 ÷ 20 = <b>0.6 A</b>.", "Step 2. Power P = VI = 12 × 0.6.", "Step 3. = <b>7.2 W</b>."], "fig": "<svg viewBox=\"0 0 300 180\" class=\"dia\" role=\"img\" aria-label=\"Simple series circuit\" style=\"width:min(100%,345px)\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5.5\" markerHeight=\"5.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dah\"/></marker></defs><rect x=\"40\" y=\"40\" width=\"220\" height=\"100\" rx=\"4\" class=\"dline\"/><line x1=\"130\" y1=\"40\" x2=\"130\" y2=\"26\" class=\"dline\"/><line x1=\"118\" y1=\"34\" x2=\"142\" y2=\"34\" class=\"dline\" stroke-width=\"3\"/><line x1=\"124\" y1=\"46\" x2=\"136\" y2=\"46\" class=\"dline\"/><text x=\"150.0\" y=\"22.0\" class=\"dmut\" text-anchor=\"start\">cell (V)</text><rect x=\"236\" y=\"70\" width=\"48\" height=\"26\" rx=\"3\" class=\"dfill\" transform=\"rotate(90 260 83)\"/><text x=\"274.0\" y=\"88.0\" class=\"dtxt\" text-anchor=\"start\">R</text><circle cx=\"150\" cy=\"140\" r=\"14\" class=\"dbox\"/><text x=\"150.0\" y=\"144.0\" class=\"dtxt\" text-anchor=\"middle\">A</text><text x=\"150.0\" y=\"168.0\" class=\"dmut\" text-anchor=\"middle\">current I flows round the loop</text></svg>"}, {"q": "A household uses a 1.5 kW heater for 4 hours a day for 30 days. Find the cost at GH₵ 1.20 per kWh.", "steps": ["Step 1. Energy per day = 1.5 kW × 4 h = 6 kWh.", "Step 2. In 30 days: 6 × 30 = 180 kWh.", "Step 3. Cost = 180 × 1.20 = <b>GH₵ 216</b>."], "fig": null}]}, {"id": "magnet", "name": "Magnetism", "section": "Interactions of Matter", "notes": ["Magnetic materials: iron, steel, cobalt, nickel. Non-magnetic: wood, plastic, copper, aluminium, glass.", "Like poles repel; unlike poles attract. REPULSION is the only sure test for a magnet.", "A freely suspended magnet comes to rest pointing north–south — the basis of the compass.", "Magnets can be made by stroking with another magnet, by induction, or electrically with a d.c. current in a coil.", "A magnet loses its magnetism when heated strongly, hammered, dropped repeatedly or stored carelessly.", "Keep bar magnets in pairs with unlike poles together and keepers across the ends.", "An electromagnet is a soft-iron core inside a coil; its magnetism can be switched on and off."], "plain": "A magnet pulls on iron and steel and always has two poles. The one test you can trust is repulsion — a magnet attracts plenty of things, but only another magnet pushes back.", "examples": [{"q": "You are given two identical steel bars; one is a magnet. How do you tell which?", "steps": ["Step 1. Bring one end of bar A near the MIDDLE of bar B.", "Step 2. If there is attraction, A could still be either — a magnet attracts unmagnetised steel too.", "Step 3. The sure test: bring the ends together both ways round. If you ever feel a push (repulsion), <b>both are magnets</b>. If one end always attracts and never repels anywhere, that one is the plain steel."], "fig": null}, {"q": "How would you increase the strength of an electromagnet?", "steps": ["Step 1. Increase the current flowing through the coil.", "Step 2. Increase the number of turns of wire on the coil.", "Step 3. Use a soft-iron core rather than an air core, and bring the poles closer to the load."], "fig": null}]}, {"id": "electron", "name": "Electronics & ICT", "section": "Energy", "notes": ["Conductors (copper) conduct freely; insulators (rubber, glass) do not; semiconductors (silicon, germanium) are in between.", "Doping adds impurities: n-type (extra electrons) and p-type (holes).", "A diode allows current in one direction only, so it is used to rectify a.c. to d.c.", "A transistor can amplify a signal or work as a switch.", "Computer parts: input (keyboard, mouse, scanner), processing (CPU), storage (hard disk, flash drive), output (monitor, printer)."], "plain": "Electronics uses materials that are between conductors and insulators — semiconductors. A diode lets current pass one way only; a transistor works as a switch or an amplifier.", "examples": [{"q": "Why is a diode used in a phone charger?", "steps": ["Step 1. The mains supplies alternating current (a.c.), which keeps changing direction.", "Step 2. A phone battery can only be charged by direct current (d.c.).", "Step 3. The diode allows current in one direction only, so it changes a.c. to d.c. — rectification."], "fig": null}, {"q": "Name the four units of a computer and give one example of each.", "steps": ["Step 1. <b>Input</b> — keyboard, mouse, scanner.", "Step 2. <b>Processing</b> — the CPU, which carries out the instructions.", "Step 3. <b>Storage</b> — hard disk, flash drive.", "Step 4. <b>Output</b> — monitor, printer, speaker."], "fig": null}]}, {"id": "eco", "name": "Ecosystems & food chains", "section": "Interactions of Matter", "notes": ["Ecosystem = the living community plus its non-living environment.", "Food chain: producer → primary consumer → secondary consumer → tertiary consumer, with decomposers acting at every level.", "Only about 10% of the energy at one trophic level passes to the next, which is why chains are short.", "Symbiosis (mutualism) benefits both; parasitism benefits one and harms the other; commensalism benefits one without harming the other.", "Terms: habitat (where an organism lives), population, community, niche, biome."], "plain": "An ecosystem is living things plus their surroundings, working together. Energy enters as sunlight, passes along a food chain, and most of it is lost as heat at every step.", "examples": [{"q": "Construct a food chain from a Ghanaian farm and name each feeding level.", "steps": ["Step 1. Start with a green plant, the producer: maize.", "Step 2. maize → grasshopper (primary consumer) → toad (secondary consumer) → snake (tertiary consumer).", "Step 3. Decomposers — bacteria and fungi — break down all of them and return nutrients to the soil."], "fig": "<svg viewBox=\"0 0 300 216\" class=\"dia\" role=\"img\" aria-label=\"Pyramid of feeding levels\" style=\"width:min(100%,345px)\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5.5\" markerHeight=\"5.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dah\"/></marker></defs><polygon points=\"108,60 192,60 180,20 120,20\" class=\"dfill\" fill-opacity=\"0.20\"/><text x=\"150.0\" y=\"45.0\" class=\"dtxt\" text-anchor=\"middle\">Snake</text><polygon points=\"83,104 217,104 204,64 96,64\" class=\"dfill\" fill-opacity=\"0.38\"/><text x=\"150.0\" y=\"89.0\" class=\"dtxt\" text-anchor=\"middle\">Toad</text><polygon points=\"58,148 242,148 230,108 70,108\" class=\"dfill\" fill-opacity=\"0.56\"/><text x=\"150.0\" y=\"133.0\" class=\"dtxt\" text-anchor=\"middle\">Grasshopper</text><polygon points=\"33,192 267,192 254,152 46,152\" class=\"dfill\" fill-opacity=\"0.74\"/><text x=\"150.0\" y=\"177.0\" class=\"dtxt\" text-anchor=\"middle\">Maize</text></svg>"}, {"q": "Why are there always fewer snakes than grasshoppers?", "steps": ["Step 1. Only about 10% of the energy at one level passes to the next.", "Step 2. The rest is lost as heat, in respiration and in undigested material.", "Step 3. So each level supports a smaller population than the one below it."], "fig": null}]}, {"id": "force", "name": "Force, motion & pressure", "section": "Interactions of Matter", "notes": ["Newton's first law: a body stays at rest or in uniform motion unless a force acts on it (inertia).", "F = ma;  weight W = mg (g ≈ 10 m/s²). Mass is in kilograms; weight is a force in newtons.", "a = (v − u)/t;  v = u + at;  s = ut + ½at².", "Pressure P = F/A (pascals). In a liquid, P = ρgh — it depends on depth and density, not on the shape of the vessel.", "Atmospheric pressure is measured with a barometer; it decreases with height."], "plain": "A force is a push or a pull. It can start, stop or change motion. Pressure is force spread over an area — a sharp knife cuts because the same force acts on a very small area.", "examples": [{"q": "A truck of mass 2000 kg accelerates from rest to 15 m/s in 10 s. Find the acceleration and the force.", "steps": ["Step 1. a = (v − u) ÷ t = (15 − 0) ÷ 10 = <b>1.5 m/s²</b>.", "Step 2. F = ma = 2000 × 1.5.", "Step 3. = <b>3000 N</b>."], "fig": null}, {"q": "Why do tractors have wide tyres while a nail has a sharp point?", "steps": ["Step 1. Pressure = force ÷ area.", "Step 2. Wide tyres spread the tractor's weight over a LARGE area, so the pressure is small and it does not sink into soft soil.", "Step 3. A nail's point puts the force on a VERY small area, so the pressure is huge and it goes into the wood."], "fig": null}]}, {"id": "machines", "name": "Work, power & simple machines", "section": "Interactions of Matter", "notes": ["Work = force × distance moved in the direction of the force (joules). Power = work ÷ time (watts).", "Mechanical advantage MA = load ÷ effort.  Velocity ratio VR = distance moved by effort ÷ distance moved by load.", "Efficiency = (MA ÷ VR) × 100% = (work output ÷ work input) × 100%. It is always less than 100% because of friction and the weight of moving parts.", "Levers: first class (see-saw, scissors), second class (wheelbarrow, bottle opener), third class (tongs, fishing rod, human forearm).", "For an inclined plane, VR = length ÷ height; for a pulley system, VR = number of rope sections supporting the load."], "plain": "A machine makes work easier — it lets a small effort move a big load. It never gives you more energy than you put in, which is why efficiency is always below 100%.", "examples": [{"q": "A man uses an effort of 250 N to lift a load of 1000 N with a pulley system. The effort moves 8 m while the load rises 1.6 m. Find the MA, the VR and the efficiency.", "steps": ["Step 1. MA = load ÷ effort = 1000 ÷ 250 = <b>4</b>.", "Step 2. VR = effort distance ÷ load distance = 8 ÷ 1.6 = <b>5</b>.", "Step 3. Efficiency = (MA ÷ VR) × 100 = (4 ÷ 5) × 100 = <b>80%</b>.", "Step 4. The missing 20% is used against friction and in lifting the moving parts."], "fig": null}, {"q": "Why is a wheelbarrow easier to use than carrying the load on your head?", "steps": ["Step 1. The wheelbarrow is a second-class lever: the load sits between the wheel (fulcrum) and your hands.", "Step 2. The effort arm is longer than the load arm, so a small effort balances a big load.", "Step 3. The wheel also reduces friction, so the load moves easily."], "fig": "<svg viewBox=\"0 0 300 166\" class=\"dia\" role=\"img\" aria-label=\"Wheelbarrow: a second-class lever\" style=\"width:min(100%,345px)\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5.5\" markerHeight=\"5.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dah\"/></marker></defs><rect x=\"30\" y=\"70\" width=\"240\" height=\"10\" rx=\"3\" class=\"dfill\"/><polygon points=\"36,108 64,108 50,82\" class=\"dfill\"/><text x=\"50.0\" y=\"126.0\" class=\"dmut\" text-anchor=\"middle\">fulcrum</text><line x1=\"230\" y1=\"66\" x2=\"230\" y2=\"26\" class=\"dline\" marker-end=\"url(#ah)\"/><text x=\"230.0\" y=\"20.0\" class=\"dmut\" text-anchor=\"middle\">load</text><line x1=\"130\" y1=\"82\" x2=\"130\" y2=\"124\" class=\"dline\" marker-end=\"url(#ah)\"/><text x=\"130.0\" y=\"140.0\" class=\"dmut\" text-anchor=\"middle\">effort</text><text x=\"150.0\" y=\"156.0\" class=\"dmut\" text-anchor=\"middle\">2nd class — wheelbarrow, bottle opener</text></svg>"}]}, {"id": "health", "name": "Diseases, immunisation & first aid", "section": "Interactions of Matter", "notes": ["Pathogens: bacteria (cholera, tuberculosis), viruses (measles, HIV, COVID-19), protozoa (malaria), fungi (ringworm), worms (bilharzia).", "Transmission: air (droplets), water and food, vectors (mosquito, housefly), contact, and body fluids.", "Immunisation gives the body antibodies or makes it produce them; EPI vaccines include BCG, OPV, DPT, measles and yellow fever.", "First aid for a burn: cool with clean running water for at least ten minutes; never apply oil or toothpaste.", "Drug abuse: taking a drug without prescription or in the wrong amount; it damages the liver, brain and lungs and can cause addiction."], "plain": "Diseases are caused by germs (bacteria, viruses, protozoa, fungi and worms) and spread by air, water, food, insects or contact. Most can be prevented by sanitation, vaccination and simple care.", "examples": [{"q": "A whole family has diarrhoea and vomiting after a funeral. Explain what may have happened and what to do.", "steps": ["Step 1. Sudden diarrhoea and vomiting in several people points to food or water contaminated with germs such as cholera or typhoid bacteria.", "Step 2. Give oral rehydration salts (ORS) at once to replace the lost water and salts, and go to a clinic.", "Step 3. Prevent it: boil or treat drinking water, wash hands with soap, cover food and dispose of waste properly."], "fig": null}, {"q": "Explain how a vaccine protects a child.", "steps": ["Step 1. The vaccine contains a weakened or killed germ, or part of it, so the child does not fall ill.", "Step 2. The body's white blood cells make antibodies against it, and keep memory cells.", "Step 3. If the real germ enters later, antibodies are made quickly and in large numbers, so the disease is prevented."], "fig": null}]}, {"id": "genes", "name": "Variation, inheritance & biotechnology", "section": "Interactions of Matter", "notes": ["Variation may be continuous (height, weight) or discontinuous (blood group, sex, tongue rolling).", "Genes are carried on chromosomes; humans have 23 pairs, of which one pair determines sex (XX female, XY male).", "A dominant allele shows in the offspring even when only one copy is present; a recessive one shows only in the homozygous state.", "Monohybrid cross of two heterozygotes (Tt × Tt) gives a 3 : 1 ratio.", "Biotechnology uses living things in industry: brewing, baking, yoghurt, antibiotics, biogas and genetic engineering."], "plain": "Children resemble their parents because characteristics are passed on in genes, carried on chromosomes. A dominant gene shows even when only one copy is present.", "examples": [{"q": "A tall pea plant (TT) is crossed with a short one (tt). Show the F1 and the F2 generations.", "steps": ["Step 1. Parents TT × tt. Gametes: all T from one, all t from the other.", "Step 2. F1: every plant is Tt — all <b>tall</b>, because T is dominant over t.", "Step 3. F1 × F1 (Tt × Tt) gives TT, Tt, Tt, tt.", "Step 4. F2 ratio = <b>3 tall : 1 short</b>."], "fig": null}, {"q": "Why is the father, not the mother, said to determine the sex of a baby?", "steps": ["Step 1. The mother's egg always carries an X chromosome.", "Step 2. The father's sperm may carry X or Y.", "Step 3. X + X gives a girl; X + Y gives a boy — so it depends on which sperm fertilises the egg."], "fig": null}]}, {"id": "env", "name": "Environment, pollution & climate change", "section": "Interactions of Matter", "notes": ["Pollution types: air (smoke, exhaust fumes), water (sewage, mining waste), land (refuse, plastics), noise.", "Greenhouse gases (carbon dioxide, methane) trap heat and cause global warming; CFCs damage the ozone layer.", "Effects of deforestation: erosion, loss of soil fertility, drought, loss of wildlife, increased carbon dioxide.", "The three Rs: reduce, reuse, recycle. Waste may be separated, composted, incinerated or land-filled.", "Conservation: afforestation, forest reserves, laws against galamsey and bad fishing methods, environmental education."], "plain": "The environment is everything around us. Human activity — mining, farming, burning and dumping — can damage it faster than nature repairs it, and we all pay the cost in health and money.", "examples": [{"q": "Explain how galamsey affects a farming community downstream.", "steps": ["Step 1. Pits and heaps destroy farmland, and the topsoil is lost.", "Step 2. Silt and mercury enter the river, so the water is unsafe for drinking, cooking and irrigation, and fish die or become poisonous.", "Step 3. Treating the water costs more, health suffers, and farmers who sold their land are left with neither land nor income."], "fig": null}, {"q": "Suggest four practical things a school can do to protect the environment.", "steps": ["Step 1. Plant and care for trees on the compound.", "Step 2. Separate waste and sell or recycle plastics, bottles and paper.", "Step 3. Stop burning refuse in the open; compost the organic part for the school garden.", "Step 4. Teach the community through clubs, drama and durbars, and keep gutters clear."], "fig": null}]}], "questions": [{"type": "obj", "q": "A block of mass 240 g has a volume of 30 cm³. Calculate its density.", "opts": ["270 g/cm³", "0.125 g/cm³", "7200 g/cm³", "8.0 g/cm³"], "ans": 3, "sol": ["Density = mass ÷ volume", "= 240 ÷ 30 = 8.0 g/cm³"], "tip": null, "fig": null, "id": "measure-1", "topic": "measure"}, {"type": "obj", "q": "Which instrument is most suitable for measuring the diameter of a thin wire?", "opts": ["Metre rule", "Beam balance", "Measuring cylinder", "Micrometer screw gauge"], "ans": 3, "sol": ["A micrometer screw gauge reads to 0.01 mm, which a metre rule cannot do."], "tip": null, "fig": null, "id": "measure-2", "topic": "measure"}, {"type": "obj", "q": "A stone is lowered into a measuring cylinder containing 40 cm³ of water. The level rises to 65 cm³. What is the volume of the stone?", "opts": ["40 cm³", "25 cm³", "65 cm³", "105 cm³"], "ans": 1, "sol": ["The stone displaces its own volume of water.", "Volume = 65 − 40 = 25 cm³"], "tip": null, "fig": null, "id": "measure-3", "topic": "measure"}, {"type": "obj", "q": "Which of the following is NOT an SI base unit?", "opts": ["ampere", "kilogram", "second", "newton"], "ans": 3, "sol": ["The newton is a derived unit (1 N = 1 kg m s⁻²).", "The others are base units."], "tip": null, "fig": null, "id": "measure-4", "topic": "measure"}, {"type": "obj", "q": "The mass of an empty beaker is 50 g. When filled with 20 cm³ of a liquid, the total mass is 66 g. What is the density of the liquid?", "opts": ["16 g/cm³", "1.25 g/cm³", "3.3 g/cm³", "0.8 g/cm³"], "ans": 3, "sol": ["Mass of liquid = 66 − 50 = 16 g", "Density = 16 ÷ 20 = 0.8 g/cm³"], "tip": null, "fig": null, "id": "measure-5", "topic": "measure"}, {"type": "thy", "q": "(a) State the scientific method in the correct order.<br>(b) A piece of metal has a mass of 89 g and a volume of 10 cm³. (i) Calculate its density in g/cm³ and in kg/m³. (ii) Suggest what the metal is likely to be.<br>(c) Describe how you would find the density of an irregular stone in the laboratory.", "sol": ["(a) Observation → statement of the problem → hypothesis → experiment (with a control) → collection of results → analysis → conclusion.", "(b)(i) Density = 89 ÷ 10 = <b>8.9 g/cm³</b> = 8.9 × 1000 = <b>8900 kg/m³</b>", "(ii) A density of 8.9 g/cm³ suggests <b>copper</b>.", "(c) Find the mass of the dry stone on a beam balance.", "Pour water into a measuring cylinder and record the volume V₁.", "Tie the stone with a thread, lower it gently into the water and record the new volume V₂.", "Volume of the stone = V₂ − V₁; density = mass ÷ (V₂ − V₁)."], "marks": 10, "tip": null, "fig": null, "id": "measure-6", "topic": "measure"}, {"type": "obj", "q": "Which of the following is NOT a characteristic of living things?", "opts": ["Rusting", "Excretion", "Irritability", "Reproduction"], "ans": 0, "sol": ["Rusting is a chemical change in iron, not a life process."], "tip": null, "fig": null, "id": "living-1", "topic": "living"}, {"type": "obj", "q": "A car moves, uses fuel and gives off exhaust gases, yet it is not living. This is because a car cannot ___", "opts": ["move", "use energy", "reproduce and grow", "give off waste"], "ans": 2, "sol": ["A living thing must show ALL the life processes; a car cannot reproduce itself or grow."], "tip": null, "fig": null, "id": "living-2", "topic": "living"}, {"type": "obj", "q": "The ability of a plant shoot to grow towards light is an example of ___", "opts": ["sensitivity", "nutrition", "excretion", "reproduction"], "ans": 0, "sol": ["Responding to a stimulus (light) is sensitivity, or irritability; this particular response is called phototropism."], "tip": null, "fig": null, "id": "living-3", "topic": "living"}, {"type": "obj", "q": "Which process removes metabolic waste from the body of an organism?", "opts": ["Excretion", "Egestion", "Digestion", "Secretion"], "ans": 0, "sol": ["Excretion removes waste made BY the body (urea, carbon dioxide).", "Egestion removes undigested food, which was never part of the body's chemistry."], "tip": null, "fig": null, "id": "living-4", "topic": "living"}, {"type": "obj", "q": "Green plants differ from animals in that plants ___", "opts": ["grow", "respire", "respond to stimuli", "make their own food"], "ans": 3, "sol": ["Plants are autotrophic — they make food by photosynthesis. The other three are shown by both."], "tip": null, "fig": null, "id": "living-5", "topic": "living"}, {"type": "thy", "q": "(a) State five characteristics of living things.<br>(b) Give two differences between plants and animals.<br>(c) Explain why a growing crystal is not considered a living thing.", "sol": ["(a) Movement, respiration, sensitivity (irritability), growth, reproduction, excretion and nutrition — any five.", "(b) 1. Plants make their own food by photosynthesis; animals feed on ready-made food.", "2. Most plants are fixed in one place, while animals move from place to place. (Others: plants grow throughout life at growing points; animals have a limited growth period. Plant cells have cellulose walls and chloroplasts.)", "(c) A crystal only enlarges by adding more of the same substance from outside. It does not feed, respire, excrete, respond or reproduce, and its 'growth' is not from within, so it shows only one apparent life process."], "marks": 10, "tip": null, "fig": null, "id": "living-6", "topic": "living"}, {"type": "obj", "q": "The correct order of classification from the largest group to the smallest is ___", "opts": ["phylum, kingdom, class, family, order, genus, species", "kingdom, class, phylum, family, order, genus, species", "species, genus, family, order, class, phylum, kingdom", "kingdom, phylum, class, order, family, genus, species"], "ans": 3, "sol": ["Kingdom is the largest group and species the smallest."], "tip": null, "fig": null, "id": "classify-1", "topic": "classify"}, {"type": "obj", "q": "An animal with three body parts and three pairs of legs belongs to the class ___", "opts": ["Insecta", "Arachnida", "Crustacea", "Myriapoda"], "ans": 0, "sol": ["Insects have head, thorax and abdomen with six legs.", "Arachnids (spiders) have two body parts and eight legs."], "tip": null, "fig": null, "id": "classify-2", "topic": "classify"}, {"type": "obj", "q": "Which group of vertebrates has a constant body temperature and a body covered with hair?", "opts": ["Reptiles", "Amphibians", "Mammals", "Fish"], "ans": 2, "sol": ["Mammals are warm-blooded (homoiothermic), have hair and feed their young on milk."], "tip": null, "fig": null, "id": "classify-3", "topic": "classify"}, {"type": "obj", "q": "In the name <i>Zea mays</i>, the word <i>Zea</i> refers to the ___", "opts": ["species", "family", "genus", "class"], "ans": 2, "sol": ["In a binomial name the first word (with a capital letter) is the genus and the second is the species."], "tip": null, "fig": null, "id": "classify-4", "topic": "classify"}, {"type": "obj", "q": "Which kingdom contains organisms that have no true nucleus?", "opts": ["Monera", "Plantae", "Fungi", "Protista"], "ans": 0, "sol": ["Monera (bacteria and blue-green algae) are prokaryotes — their genetic material is not enclosed in a nuclear membrane."], "tip": null, "fig": null, "id": "classify-5", "topic": "classify"}, {"type": "thy", "q": "(a) State two reasons why living things are classified.<br>(b) Name the five kingdoms of livi
