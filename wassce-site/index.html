": "health"}, {"type": "obj", "q": "Which of these diseases is caused by a virus?", "opts": ["Cholera", "Measles", "Ringworm", "Tuberculosis"], "ans": 1, "sol": ["Measles is viral; cholera and tuberculosis are bacterial and ringworm is fungal."], "tip": null, "fig": null, "id": "health-2", "topic": "health"}, {"type": "obj", "q": "The BCG vaccine given to a newborn baby protects against ___", "opts": ["polio", "tuberculosis", "measles", "tetanus"], "ans": 1, "sol": ["BCG (Bacille Calmette–Guérin) protects against tuberculosis."], "tip": null, "fig": null, "id": "health-3", "topic": "health"}, {"type": "obj", "q": "The best immediate first aid for a minor burn is to ___", "opts": ["cool it with clean running water", "cover it with ash", "apply engine oil", "rub it with toothpaste"], "ans": 0, "sol": ["Cooling with clean water for about ten minutes reduces the damage and the pain.", "Oil, toothpaste and ash trap heat and introduce infection."], "tip": null, "fig": null, "id": "health-4", "topic": "health"}, {"type": "obj", "q": "Which of the following is a social effect of drug abuse?", "opts": ["Loss of appetite", "Damage to the liver", "Shortness of breath", "Increase in crime and broken homes"], "ans": 3, "sol": ["Liver damage, loss of appetite and breathlessness are effects on the body; crime and family breakdown are social effects."], "tip": null, "fig": null, "id": "health-5", "topic": "health"}, {"type": "thy", "q": "(a) Name two diseases spread by each of the following: (i) air; (ii) water; (iii) vectors.<br>(b) Explain how immunisation protects a child against disease.<br>(c) Describe the first aid you would give to someone who has fainted.<br>(d) State four effects of drug abuse on a student.", "sol": ["(a)(i) Air/droplets: tuberculosis, measles, influenza, COVID-19, meningitis.", "(ii) Water: cholera, typhoid, dysentery, guinea worm, bilharzia.", "(iii) Vectors: malaria and yellow fever (mosquito), sleeping sickness (tsetse fly), cholera and typhoid carried by houseflies.", "(b) A vaccine contains a weakened, killed or partial form of the pathogen (or its antigen). It causes the body's white blood cells to produce antibodies and memory cells without the child becoming ill, so if the real pathogen enters later, antibodies are produced quickly and in large amounts and the disease is prevented.", "(c) Lay the person flat on the back in a cool, airy place and loosen tight clothing at the neck and waist. Raise the legs slightly above the level of the head to help blood reach the brain. Keep onlookers away so that air can circulate, and do not give anything by mouth while the person is unconscious. Turn the head to one side, and when the person recovers, give sips of water and seek medical help if recovery is slow.", "(d) Poor concentration and falling grades; absenteeism and dropping out; damage to health (liver, lungs, brain) and addiction; involvement in crime and violence; loss of friends and family support; mental illness."], "marks": 15, "tip": null, "fig": null, "id": "health-6", "topic": "health"}, {"type": "obj", "q": "Which of these is an example of discontinuous variation?", "opts": ["Blood group", "Skin colour", "Height", "Weight"], "ans": 0, "sol": ["Blood group falls into distinct classes (A, B, AB, O) with nothing in between; height and weight vary continuously."], "tip": null, "fig": null, "id": "genes-1", "topic": "genes"}, {"type": "obj", "q": "A human body cell contains ___ pairs of chromosomes.", "opts": ["46", "22", "12", "23"], "ans": 3, "sol": ["A human body cell has 46 chromosomes, that is 23 pairs; a gamete has 23 single chromosomes."], "tip": null, "fig": null, "id": "genes-2", "topic": "genes"}, {"type": "obj", "q": "The sex of a child is determined by the ___", "opts": ["sperm from the father", "diet of the mother", "size of the placenta", "egg from the mother"], "ans": 0, "sol": ["The mother's egg always carries X. The sperm may carry X (girl) or Y (boy), so the father's sperm decides the sex."], "tip": null, "fig": null, "id": "genes-3", "topic": "genes"}, {"type": "obj", "q": "When two heterozygous tall plants (Tt) are crossed, what is the expected ratio of tall to short offspring?", "opts": ["1 : 3", "1 : 1", "2 : 1", "3 : 1"], "ans": 3, "sol": ["The cross gives TT, Tt, Tt and tt — three tall to one short."], "tip": null, "fig": null, "id": "genes-4", "topic": "genes"}, {"type": "obj", "q": "Which of these processes uses micro-organisms to make a food product?", "opts": ["Galvanising of iron", "Distillation of crude oil", "Production of yoghurt", "Filtration of water"], "ans": 2, "sol": ["Lactic acid bacteria ferment milk sugar to make yoghurt — an everyday use of biotechnology."], "tip": null, "fig": null, "id": "genes-5", "topic": "genes"}, {"type": "thy", "q": "(a) State two differences between continuous and discontinuous variation, with one example of each.<br>(b) Using a genetic diagram, show the cross between a homozygous tall pea plant (TT) and a homozygous short one (tt), and state the appearance of the F1 generation.<br>(c) If the F1 plants are crossed among themselves, what ratio would you expect in the F2?<br>(d) State three uses of biotechnology.", "sol": ["(a) Continuous variation shows a complete range of values between two extremes and is usually controlled by many genes and affected by the environment (height, weight). Discontinuous variation falls into clear-cut groups with no intermediates and is controlled by one or a few genes (blood group, sex, ability to roll the tongue).", "(b) Parents: TT × tt. Gametes: all T from one parent, all t from the other.", "F1: all <b>Tt</b> — every plant is <b>tall</b>, because T (tall) is dominant over t (short).", "(c) Tt × Tt gives TT, Tt, Tt, tt ⇒ <b>3 tall : 1 short</b>.", "(d) Brewing and baking with yeast; making yoghurt and cheese; producing antibiotics such as penicillin from fungi; producing biogas from waste; making insulin and vaccines by genetic engineering; producing improved, disease-resistant crop varieties."], "marks": 15, "tip": null, "fig": null, "id": "genes-6", "topic": "genes"}, {"type": "obj", "q": "Which gas contributes most to global warming?", "opts": ["Carbon dioxide", "Nitrogen", "Helium", "Oxygen"], "ans": 0, "sol": ["Carbon dioxide from burning fossil fuels and forests is the main greenhouse gas by quantity."], "tip": null, "fig": null, "id": "env-1", "topic": "env"}, {"type": "obj", "q": "The gases that destroy the ozone layer are ___", "opts": ["chlorofluorocarbons", "noble gases", "hydrocarbons", "oxides of iron"], "ans": 0, "sol": ["CFCs, once used in refrigerators and aerosol sprays, break down ozone in the stratosphere."], "tip": null, "fig": null, "id": "env-2", "topic": "env"}, {"type": "obj", "q": "Which of these is a consequence of deforestation?", "opts": ["Richer topsoil", "Increased rainfall", "Cooler temperatures", "Increased soil erosion"], "ans": 3, "sol": ["Without tree cover and roots, rain washes the topsoil away, and the loss of trees also reduces rainfall and raises temperatures."], "tip": null, "fig": null, "id": "env-3", "topic": "env"}, {"type": "obj", "q": "The best way to deal with plastic and metal waste in a community is to ___", "opts": ["bury it in a river bed", "burn it in the open", "dump it in the gutter", "separate and recycle it"], "ans": 3, "sol": ["Recycling saves raw materials and energy.", "Open burning of plastic releases toxic fumes, and dumping blocks drains and causes floods."], "tip": null, "fig": null, "id": "env-4", "topic": "env"}, {"type": "obj", "q": "Which human activity is most responsible for the pollution of rivers in south-western Ghana?", "opts": ["Planting of cocoa", "Fishing with nets", "Small-scale mining", "Cattle rearing"], "ans": 2, "sol": ["Galamsey operations wash mud and mercury into the rivers, making the water unusable."], "tip": null, "fig": null, "id": "env-5", "topic": "env"}, {"type": "thy", "q": "(a) Name four types of pollution and give one source and one effect of each.<br>(b) Explain the greenhouse effect and state two of its consequences.<br>(c) State four ways of managing solid waste in a community.<br>(d) Suggest three ways students can help protect the environment.", "sol": ["(a) <b>Air</b> — vehicle exhaust and factory smoke; causes respiratory disease and acid rain. <b>Water</b> — sewage and mining waste; causes cholera and kills aquatic life. <b>Land</b> — refuse and plastics; breeds pests and makes land unusable. <b>Noise</b> — loudspeakers, generators and heavy traffic; causes deafness, stress and loss of concentration.", "(b) Short-wave radiation from the sun passes through the atmosphere and warms the earth. The earth re-radiates the heat as long-wave radiation, which greenhouse gases such as carbon dioxide and methane absorb and send back, so the atmosphere warms up. Consequences: rising global temperatures; melting of ice and rising sea levels that flood coastal towns; unpredictable rainfall, drought and failed harvests.", "(c) Separate waste at source into organic and inorganic; compost the organic part for manure; recycle plastics, metals, glass and paper; use properly engineered sanitary landfills; incinerate hazardous medical waste; educate the public and enforce sanitation by-laws.", "(d) Join or form a school environmental club and plant trees; keep the school and community clean and stop dumping in gutters; reduce, reuse and recycle materials such as sachets and bottles; switch off lights and fans when not needed; teach others in the community about the dangers of bush burning and galamsey."], "marks": 15, "tip": null, "fig": null, "id": "env-6", "topic": "env"}, {"type": "obj", "q": "Granite is formed when molten magma cools and solidifies. It is therefore ___ rock.", "opts": ["a metamorphic", "a sedimentary", "an organic", "an igneous"], "ans": 3, "sol": ["Igneous rocks form from cooled magma or lava.", "Sedimentary rocks form from deposited layers."], "tip": null, "fig": null, "id": "rocks-1", "topic": "rocks"}, {"type": "obj", "q": "Which rock type is formed in layers from deposited materials and may contain fossils?", "opts": ["Igneous", "Sedimentary", "Volcanic", "Metamorphic"], "ans": 1, "sol": ["Sediments settle in layers over long periods, trapping the remains of organisms as fossils."], "tip": null, "fig": null, "id": "rocks-2", "topic": "rocks"}, {"type": "obj", "q": "Marble is formed from limestone by heat and pressure. Marble is therefore ___", "opts": ["a sedimentary rock", "a mineral ore", "an igneous rock", "a metamorphic rock"], "ans": 3, "sol": ["Metamorphic rocks are existing rocks changed by heat and pressure — limestone → marble, clay → slate."], "tip": null, "fig": null, "id": "rocks-3", "topic": "rocks"}, {"type": "obj", "q": "Which mineral is mined at Awaso in Ghana?", "opts": ["Manganese", "Bauxite", "Diamond", "Gold"], "ans": 1, "sol": ["Awaso is a bauxite mining area; Nsuta is known for manganese, Obuasi and Tarkwa for gold, and Akwatia for diamonds."], "tip": null, "fig": null, "id": "rocks-4", "topic": "rocks"}, {"type": "obj", "q": "Which of these is NOT a problem caused by mining?", "opts": ["Increase in soil fertility", "Destruction of farmland", "Pollution of rivers", "Open pits left behind"], "ans": 0, "sol": ["Mining removes the topsoil and lowers fertility; it never increases it."], "tip": null, "fig": null, "id": "rocks-5", "topic": "rocks"}, {"type": "thy", "q": "(a) Name the three main types of rock and give one example and one use of each.<br>(b) Describe two ways in which rocks are broken down to form soil.<br>(c) State three benefits and three problems of mineral exploitation in Ghana.", "sol": ["(a) <b>Igneous</b> — granite; used for building stone and road chippings. <b>Sedimentary</b> — limestone; used for cement and for liming acidic soils. <b>Metamorphic</b> — marble; used for floor tiles and decoration.", "(b) <b>Physical weathering:</b> heating in the day and cooling at night makes rocks expand and contract until they crack and break into smaller pieces.", "<b>Chemical weathering:</b> rain water containing dissolved carbon dioxide forms a weak acid that dissolves minerals such as limestone. (Biological: roots and lichens widen cracks.)", "(c) <b>Benefits:</b> foreign exchange from exports; employment for mine workers and suppliers; raw materials for industry; roads, schools and clinics built by mining companies; royalties and taxes.", "<b>Problems:</b> farmland and forests destroyed; rivers polluted with silt and mercury; pits left open, causing drownings; farmers displaced; mine accidents and dust-related diseases."], "marks": 15, "tip": null, "fig": null, "id": "rocks-6", "topic": "rocks"}, {"type": "obj", "q": "Which tool is most suitable for making ridges on a small farm?", "opts": ["Secateurs", "Rake", "Hoe", "Watering can"], "ans": 2, "sol": ["The hoe is used for weeding, making mounds and ridging on small holdings.", "Secateurs prune, and a rake gathers trash."], "tip": null, "fig": null, "id": "farmtools-1", "topic": "farmtools"}, {"type": "obj", "q": "Which tractor implement is used to break up clods after ploughing?", "opts": ["Trailer", "Plough", "Planter", "Harrow"], "ans": 3, "sol": ["The plough turns the soil over; the harrow then breaks the big clods into a fine tilth for planting."], "tip": null, "fig": null, "id": "farmtools-2", "topic": "farmtools"}, {"type": "obj", "q": "Why should a cutlass be cleaned and oiled after use?", "opts": ["To make it heavier", "To change its shape", "To prevent rusting and make it last longer", "To make it a better conductor"], "ans": 2, "sol": ["Soil and sap hold moisture against the blade; cleaning and a light oiling keep oxygen and water away, so rusting is prevented."], "tip": null, "fig": null, "id": "farmtools-3", "topic": "farmtools"}, {"type": "obj", "q": "A farmer spraying a chemical should stand ___", "opts": ["with the wind behind him", "downwind of the sprayer", "facing the wind", "under a tree in the farm"], "ans": 0, "sol": ["Spraying with the wind behind you carries the chemical away from your face and body."], "tip": null, "fig": null, "id": "farmtools-4", "topic": "farmtools"}, {"type": "obj", "q": "Which is a disadvantage of using heavy machinery on a farm?", "opts": ["It compacts the soil", "It saves time", "It reduces drudgery", "It covers large areas"], "ans": 0, "sol": ["Repeated passes of heavy machines press the soil down, reducing air spaces and root growth. The other three are advantages."], "tip": null, "fig": null, "id": "farmtools-5", "topic": "farmtools"}, {"type": "thy", "q": "(a) Name four farm tools and state one use of each.<br>(b) State four ways of maintaining farm tools.<br>(c) State four safety precautions a farmer should observe when using agrochemicals.", "sol": ["(a) <b>Cutlass</b> — clearing bush and harvesting; <b>hoe</b> — weeding, making mounds and ridges; <b>mattock/pick-axe</b> — digging hard ground and stumping; <b>watering can</b> — watering seedlings; <b>secateurs</b> — pruning; <b>knapsack sprayer</b> — applying chemicals.", "(b) Clean off soil and sap after every use; sharpen cutting edges regularly; oil or grease metal parts; tighten or replace loose handles; store in a dry, locked shed off the ground.", "(c) Read the label and use the stated dose; wear protective clothing, boots, gloves and a nose mask; spray with the wind behind you, not against it; do not eat, drink or smoke while spraying; wash hands, body and clothes afterwards; keep chemicals and empty containers away from children, food and water sources, and observe the pre-harvest interval."], "marks": 12, "tip": null, "fig": null, "id": "farmtools-6", "topic": "farmtools"}, {"type": "obj", "q": "Which type of tooth is best suited for tearing flesh?", "opts": ["Incisor", "Molar", "Premolar", "Canine"], "ans": 3, "sol": ["Canines are long and pointed, so they grip and tear.", "Incisors are chisel-shaped for cutting."], "tip": null, "fig": null, "id": "teeth-1", "topic": "teeth"}, {"type": "obj", "q": "How many teeth does a normal adult human have?", "opts": ["28", "20", "32", "36"], "ans": 2, "sol": ["An adult has 32 permanent teeth; a young child has 20 milk teeth."], "tip": null, "fig": null, "id": "teeth-2", "topic": "teeth"}, {"type": "obj", "q": "The hardest substance covering the crown of a tooth is the ___", "opts": ["dentine", "enamel", "pulp", "cement"], "ans": 1, "sol": ["Enamel is the hardest substance in the body; beneath it lies dentine, and the pulp holds nerves and blood vessels."], "tip": null, "fig": null, "id": "teeth-3", "topic": "teeth"}, {"type": "obj", "q": "Dental caries is caused mainly by ___", "opts": ["eating too much protein", "acid produced by bacteria acting on sugar", "brushing the teeth", "drinking cold water"], "ans": 1, "sol": ["Bacteria in plaque turn sugar into acid, and the acid dissolves the enamel — so sugary food and poor brushing are the real causes."], "tip": null, "fig": null, "id": "teeth-4", "topic": "teeth"}, {"type": "obj", "q": "Which of these would best protect a child's teeth?", "opts": ["Chewing bottle tops", "Brushing twice daily and cutting down on sweets", "Using the teeth to open tins", "Rinsing with hot water only"], "ans": 1, "sol": ["Cleaning removes the plaque and less sugar means less acid; using teeth as tools cracks them."], "tip": null, "fig": null, "id": "teeth-5", "topic": "teeth"}, {"type": "thy", "q": "(a) Name the four types of human teeth and state the function of each.<br>(b) Draw and label a longitudinal section of a tooth (five labels).<br>(c) Explain how tooth decay happens and state four ways of preventing it.", "sol": ["(a) <b>Incisors</b> — chisel-shaped, for cutting and biting. <b>Canines</b> — pointed, for tearing. <b>Premolars</b> — broad with cusps, for crushing. <b>Molars</b> — largest and broadest, for grinding.", "(b) Labels: enamel, dentine, pulp cavity (with nerves and blood vessels), cement, root, gum, crown.", "(c) Food, especially sugar, sticks to the teeth and forms plaque with bacteria. The bacteria break down the sugar to acid; the acid dissolves the enamel, then the dentine, until the pulp is reached and the tooth aches.", "Prevention: brush at least twice a day with fluoride toothpaste; reduce sugary foods and drinks; rinse the mouth after eating; eat foods rich in calcium and vitamin D; visit the dentist regularly; do not use the teeth to crack hard objects."], "marks": 15, "tip": null, "fig": null, "id": "teeth-6", "topic": "teeth"}, {"type": "obj", "q": "Hormones are transported round the body in the ___", "opts": ["air passages", "lymph vessels only", "blood", "nerves"], "ans": 2, "sol": ["Endocrine glands have no ducts; they release their hormones straight into the bloodstream."], "tip": null, "fig": null, "id": "hormone-1", "topic": "hormone"}, {"type": "obj", "q": "Which gland produces insulin?", "opts": ["Pancreas", "Pituitary", "Thyroid", "Adrenal"], "ans": 0, "sol": ["The islets of Langerhans in the pancreas produce insulin, which lowers blood sugar."], "tip": null, "fig": null, "id": "hormone-2", "topic": "hormone"}, {"type": "obj", "q": "A shortage of iodine in the diet leads to ___", "opts": ["scurvy", "anaemia", "goitre", "rickets"], "ans": 2, "sol": ["Iodine is needed to make thyroxine; without it the thyroid swells, which is goitre.", "Iodised salt prevents it."], "tip": null, "fig": null, "id": "hormone-3", "topic": "hormone"}, {"type": "obj", "q": "Which hormone prepares the body for 'fight or flight'?", "opts": ["Adrenaline", "Insulin", "Thyroxine", "Oestrogen"], "ans": 0, "sol": ["Adrenaline from the adrenal glands raises the heartbeat, breathing rate and blood sugar in an emergency."], "tip": null, "fig": null, "id": "hormone-4", "topic": "hormone"}, {"type": "obj", "q": "Which statement about nervous and hormonal control is correct?", "opts": ["Nervous messages are faster but shorter-lasting than hormonal ones", "Nervous control is slower than hormonal control", "Hormonal messages travel along nerves", "Hormones act only on the gland that made them"], "ans": 0, "sol": ["Impulses travel in a fraction of a second and their effect ends quickly; hormones travel in the blood and their effects last much longer."], "tip": null, "fig": null, "id": "hormone-5", "topic": "hormone"}, {"type": "thy", "q": "(a) What are hormones?<br>(b) Name four endocrine glands, the hormone each produces and its effect.<br>(c) State two differences between nervous and hormonal coordination.<br>(d) Explain what happens in the body of a person whose pancreas produces too little insulin.", "sol": ["(a) Hormones are chemical substances produced in small quantities by endocrine (ductless) glands and carried by the blood to target organs, where they control or regulate activities.", "(b) <b>Pituitary</b> — growth hormone — controls growth and other glands. <b>Thyroid</b> — thyroxine — controls the rate of metabolism. <b>Pancreas</b> — insulin — lowers blood sugar. <b>Adrenal</b> — adrenaline — prepares the body for emergency. (Also testes — testosterone; ovaries — oestrogen.)", "(c) Nervous messages are electrical impulses along nerves, very fast, with short-lived effects on particular muscles or glands; hormonal messages are chemicals in the blood, slower to act, and their effects are widespread and longer lasting.", "(d) Blood sugar is not taken into the cells properly, so it rises. The person passes much urine, feels thirsty and tired, loses weight, and wounds heal slowly — the condition is diabetes mellitus. It is managed with diet, exercise and, where prescribed, insulin."], "marks": 15, "tip": null, "fig": null, "id": "hormone-6", "topic": "hormone"}, {"type": "obj", "q": "The main reason for drying fish in the sun is to ___", "opts": ["add salt to the fish", "remove water that micro-organisms need", "increase its protein content", "make the fish heavier"], "ans": 1, "sol": ["Bacteria and moulds need moisture; removing the water stops them from growing."], "tip": null, "fig": null, "id": "preserve-1", "topic": "preserve"}, {"type": "obj", "q": "Which method of preservation works by killing micro-organisms with heat and then sealing out air?", "opts": ["Smoking", "Salting", "Freezing", "Canning"], "ans": 3, "sol": ["In canning the food is heated to destroy micro-organisms and sealed in an airtight tin."], "tip": null, "fig": null, "id": "preserve-2", "topic": "preserve"}, {"type": "obj", "q": "Refrigeration preserves food because low temperature ___", "opts": ["removes all the water", "kills all micro-organisms", "adds preservatives to the food", "slows the growth of micro-organisms"], "ans": 3, "sol": ["Cold slows down the organisms and the enzymes; it does not kill them, which is why thawed food spoils quickly."], "tip": null, "fig": null, "id": "preserve-3", "topic": "preserve"}, {"type": "obj", "q": "Gari is made from ___", "opts": ["maize", "millet", "yam", "cassava"], "ans": 3, "sol": ["Cassava is grated, pressed to remove the liquid, fermented and roasted to give gari, which keeps for months."], "tip": null, "fig": null, "id": "preserve-4", "topic": "preserve"}, {"type": "obj", "q": "Which of these would best protect stored maize from weevils?", "opts": ["Storing while still moist", "Leaving the store open at night", "Drying well and storing in airtight bags", "Keeping the sacks directly on a damp floor"], "ans": 2, "sol": ["Weevils and moulds need moisture and air; dry grain in hermetic (airtight) bags denies them both."], "tip": null, "fig": null, "id": "preserve-5", "topic": "preserve"}, {"type": "thy", "q": "(a) State four causes of food spoilage.<br>(b) Describe four methods of food preservation, giving a local example of each.<br>(c) State three advantages of food preservation to a farming community.", "sol": ["(a) Micro-organisms (bacteria, moulds, yeasts); enzymes within the food itself; insects, rodents and birds; moisture and warmth; rough handling that bruises the produce.", "(b) <b>Sun drying</b> — pepper, okra and maize are spread in the sun to remove moisture. <b>Smoking</b> — fish is smoked over a fire; the heat dries it and the smoke contains preserving chemicals. <b>Salting</b> — koobi and other fish are packed in salt, which draws out water. <b>Refrigeration/freezing</b> — meat and fish are kept cold so that organisms cannot multiply. (Also canning, frying, and processing cassava into gari.)", "(c) Food is available in the lean season, so prices and hunger are reduced; farmers avoid selling everything cheaply at harvest and can wait for better prices; post-harvest losses are cut; processed products such as gari and shea butter add value and create jobs."], "marks": 15, "tip": null, "fig": null, "id": "preserve-6", "topic": "preserve"}, {"type": "obj", "q": "Which material is attracted by a magnet?", "opts": ["Steel", "Plastic", "Copper", "Aluminium"], "ans": 0, "sol": ["Iron, steel, cobalt and nickel are magnetic materials; copper and aluminium are not."], "tip": null, "fig": null, "id": "magnet-1", "topic": "magnet"}, {"type": "obj", "q": "The only sure test for a magnet is ___", "opts": ["repulsion", "attraction of iron filings", "pointing north when hung", "attraction of a nail"], "ans": 0, "sol": ["A magnet attracts any magnetic material, but only another magnet is REPELLED by a like pole."], "tip": null, "fig": null, "id": "magnet-2", "topic": "magnet"}, {"type": "obj", "q": "A soft-iron core is used in an electromagnet because it ___", "opts": ["is cheaper than every other metal", "is easily magnetised and demagnetised", "does not conduct electricity", "keeps its magnetism for ever"], "ans": 1, "sol": ["Soft iron gains strong magnetism when the current flows and loses it at once when the current stops, which is what a switchable magnet needs. Steel is used for permanent magnets."], "tip": null, "fig": null, "id": "magnet-3", "topic": "magnet"}, {"type": "obj", "q": "Which of these would make a magnet lose its magnetism?", "opts": ["Keeping it with a keeper", "Heating it strongly", "Keeping it away from heat", "Storing it in pairs"], "ans": 1, "sol": ["Strong heating, hammering and repeated dropping disturb the arrangement inside the magnet and weaken it."], "tip": null, "fig": null, "id": "magnet-4", "topic": "magnet"}, {"type": "obj", "q": "A magnet is cut into two equal halves. Each piece will ___", "opts": ["have only a north pole", "have only a south pole", "have both a north and a south pole", "lose its magnetism completely"], "ans": 2, "sol": ["However small the piece, it is still a magnet with two poles — you cannot get a single pole by cutting."], "tip": null, "fig": null, "id": "magnet-5", "topic": "magnet"}, {"type": "thy", "q": "(a) State three properties of magnets.<br>(b) Describe how you would make a steel bar into a magnet by the stroking method.<br>(c) State two differences between an electromagnet and a permanent magnet, and give two uses of an electromagnet.", "sol": ["(a) Like poles repel and unlike poles attract; a freely suspended magnet points north–south; the magnetic force is strongest at the poles; a magnet attracts magnetic materials and can induce magnetism in them.", "(b) Place the steel bar on the bench. Stroke it from one end to the other with ONE pole of a bar magnet, always in the same direction, lifting the magnet high at the end of each stroke. Repeat about thirty times. The end where the stroking finishes becomes a pole opposite to the stroking pole. Test it with another magnet.", "(c) <b>Differences:</b> an electromagnet works only while current flows and its strength can be varied, while a permanent magnet keeps its magnetism all the time; an electromagnet uses a soft-iron core, a permanent magnet is made of steel.", "<b>Uses of an electromagnet:</b> lifting scrap iron in a crane; electric bells; relays and circuit breakers; loudspeakers, electric motors and generators."], "marks": 12, "tip": null, "fig": null, "id": "magnet-6", "topic": "magnet"}], "syllabus": [{"section": "A. Diversity of Matter", "items": [{"t": "Introduction to science, measurement and the scientific method", "topic": "measure"}, {"t": "Living and non-living things", "topic": "living"}, {"t": "Classification of living things", "topic": "classify"}, {"t": "Cells and their structures; osmosis and diffusion", "topic": "cells"}, {"t": "Structure of matter: elements, compounds, mixtures and separation", "topic": "matter"}, {"t": "Acids, bases and salts", "topic": "acids"}, {"t": "Metals, non-metals and rusting", "topic": "metals"}, {"t": "Water, solutions and water treatment", "topic": "water"}, {"t": "Soil and soil conservation", "topic": "soil"}, {"t": "Rocks, minerals and mineral exploitation", "topic": "rocks"}, {"t": "Organic compounds, petrochemicals and plastics", "topic": "organic"}]}, {"section": "B. Cycles", "items": [{"t": "Air, air masses, weather and the nitrogen cycle", "topic": "air"}, {"t": "The hydrological cycle and water contamination", "topic": "hydro"}, {"t": "Life cycles of pests and parasites", "topic": "pests"}, {"t": "Crop production and soil fertility", "topic": "crop"}, {"t": "Farm tools, machinery and safety", "topic": "farmtools"}, {"t": "Animal production and animal health", "topic": "animal"}]}, {"section": "C. Systems", "items": [{"t": "Food and nutrition; the digestive system", "topic": "nutrition"}, {"t": "Teeth and dentition", "topic": "teeth"}, {"t": "Respiratory and circulatory systems", "topic": "respcirc"}, {"t": "Excretory, skeletal and nervous systems", "topic": "excskel"}, {"t": "Hormones and the endocrine system", "topic": "hormone"}, {"t": "Reproduction in humans and in flowering plants", "topic": "repro"}, {"t": "Photosynthesis, growth and transpiration", "topic": "photo"}, {"t": "Food preservation, processing and storage", "topic": "preserve"}]}, {"section": "D. Energy", "items": [{"t": "Forms of energy, transformations, solar and nuclear energy", "topic": "energy"}, {"t": "Heat energy: conduction, convection, radiation and heat capacity", "topic": "heat"}, {"t": "Light: reflection, refraction, lenses and the eye", "topic": "light"}, {"t": "Sound and waves", "topic": "sound"}, {"t": "Electrical energy: Ohm's law, circuits and domestic wiring", "topic": "elec"}, {"t": "Magnetism and electromagnets", "topic": "magnet"}, {"t": "Electronics and ICT", "topic": "electron"}]}, {"section": "E. Interactions of Matter", "items": [{"t": "Ecosystems, food chains and energy flow", "topic": "eco"}, {"t": "Forces, motion and pressure", "topic": "force"}, {"t": "Work, energy, power and simple machines", "topic": "machines"}, {"t": "Infectious diseases, immunisation, first aid and drug abuse", "topic": "health"}, {"t": "Variation, inheritance and biotechnology", "topic": "genes"}, {"t": "The atmosphere, pollution, waste and climate change", "topic": "env"}]}]}, {"id": "social", "name": "Social Studies", "dot": "#C08028", "sub": "210 original practice questions with answer guides — WASSCE Social Studies syllabus. Not official past papers.", "cfg": {"objSolLabel": "Explanation", "objSolBtn": "explanation", "thySolLabel": "Answer guide", "thySolBtn": "answer guide", "mockTab": "Mock Paper 1", "mockN": 50, "mockMins": 50, "quickN": 20, "quickMins": 20, "mockBlurb": "50 objective questions in 50 minutes — the shape of WAEC Paper 1. Questions are drawn at random from all three sections of the syllabus, and the paper is marked as soon as you submit.", "paperNote": "Paper 1 carries 50 marks; Paper 2 carries 100 (five essays at 20 marks each).", "theoryNote": "Plan four or five points, then write each as a paragraph: state the point, explain it, and give a Ghanaian example. That is how essay marks are earned.", "about": "<b>About these questions.</b> They are original practice questions written to the WASSCE Social Studies syllabus and to the format of Paper 1 (50 objectives) and Paper 2 (three sections — The Environment; Governance, Politics and Stability; Social and Economic Development — from which five essays are answered, at least one and at most two per section). Confirm the exact timing on your examination timetable. They are <b>not</b> reproductions of past WASSCE papers — for those, use WAEC's own e-learning portal and the past-question booklets sold by WAEC Ghana."}, "topics": [{"id": "envcomp", "name": "The environment & its components", "section": "The Environment", "notes": ["The environment has two parts: the physical (land, water, air, plants, animals, climate) and the social (people, institutions, customs, beliefs).", "People depend on the environment for food, water, shelter, fuel and raw materials.", "Human activities change the environment; the environment in turn shapes how people live and work.", "Ghana's vegetation belts run from coastal savanna and mangroves through forest to Guinea and Sudan savanna in the north.", "Conservation means using resources wisely so that they last for future generations."], "plain": "Your environment is everything around you. The PHYSICAL part is what nature provides — land, water, air, plants and animals. The SOCIAL part is people and what people have made — family, school, chieftaincy, laws and customs.", "examples": [{"q": "Write one full essay paragraph on how people depend on the physical environment.", "steps": ["Step 1 (point). People depend on the physical environment for food.", "Step 2 (explain). The soil supports crops, the rivers and the sea supply fish, and grassland feeds livestock, so almost everything we eat comes from the natural surroundings.", "Step 3 (example). In Ghana, cocoa from the forest belt and fish from the coast feed families and earn income.", "That is the pattern every essay point should follow: state, explain, example."], "fig": "<svg viewBox=\"0 0 514 96\" class=\"dia\" role=\"img\" aria-label=\"Point, explain, example\" style=\"width:min(100%,520px)\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5.5\" markerHeight=\"5.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dah\"/></marker></defs><text x=\"257.0\" y=\"15.0\" class=\"dmut\" text-anchor=\"middle\" style=\"font-size:12px\">How one essay paragraph should be built</text><rect x=\"10\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"62.0\" y=\"49.0\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">State the</text><text x=\"62.0\" y=\"64.0\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">point</text><rect x=\"140\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"192.0\" y=\"56.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Explain it</text><line x1=\"117.0\" y1=\"53.0\" x2=\"136.0\" y2=\"53.0\" class=\"dline\" marker-end=\"url(#ah)\"/><rect x=\"270\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"322.0\" y=\"49.0\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Give an</text><text x=\"322.0\" y=\"64.0\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">example</text><line x1=\"247.0\" y1=\"53.0\" x2=\"266.0\" y2=\"53.0\" class=\"dline\" marker-end=\"url(#ah)\"/><rect x=\"400\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"452.0\" y=\"49.0\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Link to the</text><text x=\"452.0\" y=\"64.0\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">question</text><line x1=\"377.0\" y1=\"53.0\" x2=\"396.0\" y2=\"53.0\" class=\"dline\" marker-end=\"url(#ah)\"/></svg>"}, {"q": "Classify these as physical or social environment: river, chieftaincy, harmattan, school, forest, marriage.", "steps": ["Physical (made by nature): <b>river, harmattan, forest</b>.", "Social (made by people): <b>chieftaincy, school, marriage</b>.", "Quick test: ask 'would it still be there if no people lived here?'"], "fig": null}]}, {"id": "degrad", "name": "Environmental degradation & control", "section": "The Environment", "notes": ["Degradation is the lowering of the quality of the environment — deforestation, erosion, desertification, pollution and loss of soil fertility.", "Main causes in Ghana: bush burning, illegal mining (galamsey), over-farming, sand winning, poor waste disposal and over-population in cities.", "Effects: loss of farmland, polluted rivers, flooding, loss of wildlife, climate change and poor health.", "Control: afforestation and reafforestation, enforcement of laws, land reclamation after mining, public education and alternative livelihoods.", "Bodies involved: the Environmental Protection Authority (EPA), the Forestry Commission, the Minerals Commission and the district assemblies."], "plain": "Degradation means the environment becoming poorer — soil washed away, forests cleared, rivers muddied. Most of it is caused by people, so most of it can be stopped by people.", "examples": [{"q": "A community's river has turned brown and the fish have died. Trace the cause and suggest solutions.", "steps": ["Step 1. Brown water means silt, usually from mining pits or farming right up to the bank.", "Step 2. Effects: unsafe drinking water, higher treatment costs, loss of fishing income, sick people.", "Step 3. Solutions: stop mining in and near the river, restore the pits, plant trees along the banks, and enforce the law through the district assembly and the EPA."], "fig": null}, {"q": "Explain the difference between afforestation and reafforestation.", "steps": ["<b>Afforestation</b> — planting trees on land that has never carried forest, such as bare savanna land.", "<b>Reafforestation</b> — replanting where forest has been cut down, such as a logged forest reserve.", "Both increase tree cover; only the starting point is different."], "fig": null}]}, {"id": "popn", "name": "Population growth & development", "section": "The Environment", "notes": ["Population data in Ghana comes mainly from the Population and Housing Census, held about every ten years.", "Population change depends on births (fertility), deaths (mortality) and migration.", "Population density = number of people ÷ land area. A dependency ratio compares dependants (under 15 and over 64) with the working population.", "Effects of rapid growth: pressure on schools, hospitals, housing, land and jobs; slums; unemployment.", "Rural–urban migration is caused by push factors (poor amenities, low incomes) and pull factors (jobs, schools, entertainment)."], "plain": "Population study is about how many people there are, where they live, and how fast the number is changing. Numbers grow through births and immigration, and fall through deaths and emigration.", "examples": [{"q": "A district has 90,000 people living in 450 km². Find the population density and say what it means.", "steps": ["Step 1. Density = population ÷ land area.", "Step 2. = 90,000 ÷ 450 = <b>200 persons per km²</b>.", "Step 3. It tells us how crowded the district is, which helps in planning schools, clinics and water supply."], "fig": null}, {"q": "Write one essay point on the effect of rapid population growth on social amenities.", "steps": ["Point: Rapid population growth puts heavy pressure on social amenities.", "Explain: Schools, clinics, water and housing are built for a certain number of people; when the population grows faster than the facilities, each one serves far more people than it was meant to.", "Example: In Accra, classrooms meant for 40 pupils now take 70, and pipes built for a smaller city cannot reach every home daily."], "fig": "<svg viewBox=\"0 0 320 200\" class=\"dia\" role=\"img\" aria-label=\"Ghana's recorded population in millions at successive censuses\" style=\"width:min(100%,368px)\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5.5\" markerHeight=\"5.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dah\"/></marker></defs><line x1=\"34\" y1=\"16\" x2=\"34\" y2=\"166\" class=\"dline\"/><line x1=\"34\" y1=\"166\" x2=\"312\" y2=\"166\" class=\"dline\"/><text x=\"8.0\" y=\"20.0\" class=\"dmut\" text-anchor=\"start\">millions</text><rect x=\"46.2\" y=\"107.9\" width=\"43.5\" height=\"58.1\" class=\"dfill\"/><text x=\"68.0\" y=\"102.9\" class=\"dmut\" text-anchor=\"middle\">12</text><text x=\"68.0\" y=\"180.0\" class=\"dmut\" text-anchor=\"middle\">1984</text><rect x=\"114.2\" y=\"74.1\" width=\"43.5\" height=\"91.9\" class=\"dfill\"/><text x=\"136.0\" y=\"69.1\" class=\"dmut\" text-anchor=\"middle\">19</text><text x=\"136.0\" y=\"180.0\" class=\"dmut\" text-anchor=\"middle\">2000</text><rect x=\"182.2\" y=\"49.9\" width=\"43.5\" height=\"116.1\" class=\"dfill\"/><text x=\"204.0\" y=\"44.9\" class=\"dmut\" text-anchor=\"middle\">24</text><text x=\"204.0\" y=\"180.0\" class=\"dmut\" text-anchor=\"middle\">2010</text><rect x=\"250.2\" y=\"16.0\" width=\"43.5\" height=\"150.0\" class=\"dfill\"/><text x=\"272.0\" y=\"11.0\" class=\"dmut\" text-anchor=\"middle\">31</text><text x=\"272.0\" y=\"180.0\" class=\"dmut\" text-anchor=\"middle\">2021</text></svg>"}]}, {"id": "sanit", "name": "Water, sanitation & environmental health", "section": "The Environment", "notes": ["Safe water sources: treated pipe-borne water, boreholes and protected wells. Unsafe: streams, dugouts and unprotected wells.", "Poor sanitation causes cholera, typhoid, dysentery, diarrhoea and malaria.", "Proper waste management: separation, collection, composting of organic waste, recycling, and sanitary landfills.", "Open defecation is checked by building household toilets and educating communities.", "Responsibility is shared: the assemblies provide services, but households must keep their surroundings clean."], "plain": "Sanitation means keeping our surroundings clean — safe water, proper toilets and proper rubbish disposal. Where sanitation fails, disease follows within days.", "examples": [{"q": "Cholera breaks out in a town every rainy season. Explain why, and what should be done.", "steps": ["Step 1. Refuse blocks the gutters, so rain water floods and mixes with sewage.", "Step 2. The dirty water reaches wells, food and hands, and cholera bacteria spread quickly.", "Step 3. Remedies: regular refuse collection and household bins; desilt gutters before the rains; build and use toilets; treat drinking water; educate and enforce sanitation by-laws."], "fig": null}, {"q": "State four ways a student can help keep the school environment clean.", "steps": ["1. Use the bins and never drop sachets or paper on the compound.", "2. Take part in weekly clean-up and keep the toilets and urinals clean.", "3. Keep gutters around the school clear so that they do not breed mosquitoes.", "4. Join the environment club and teach others by example."], "fig": null}]}, {"id": "disaster", "name": "Natural disasters & disaster management", "section": "The Environment", "notes": ["Natural disasters include floods, droughts, earthquakes, landslides, storms, bushfires and epidemics.", "Man-made disasters include fire outbreaks, road accidents, building collapse and chemical spills.", "Ghana's disaster body is the National Disaster Management Organisation (NADMO).", "Flooding in cities is worsened by building on waterways, choked drains and poor town planning.", "Preparedness: early warning systems, education, evacuation drills, enforcement of building regulations and relief supplies."], "plain": "A disaster is a sudden event that causes great damage. Some are natural (floods, earthquakes); many are man-made (fires, road crashes). Preparing before it happens saves the most lives.", "examples": [{"q": "Flooding destroys homes in the same neighbourhood every year. Explain the causes and the solutions.", "steps": ["Step 1. Causes: houses built on waterways, choked drains, poor town planning, and heavy rain on ground that cannot absorb water.", "Step 2. Short-term: early warning from the Meteorological Agency and NADMO, and evacuation plans.", "Step 3. Long-term: demolish structures on waterways, enlarge and desilt drains, enforce building permits and stop dumping refuse in gutters."], "fig": null}, {"q": "Distinguish between natural and man-made disasters, with two examples of each.", "steps": ["<b>Natural:</b> caused by nature — floods, earthquakes, droughts, rainstorms.", "<b>Man-made:</b> caused by human action or carelessness — market fires, road accidents, building collapse, chemical spills.", "Note that human action often makes a natural disaster worse, as when refuse in drains worsens a flood."], "fig": null}]}, {"id": "culture", "name": "Culture & cultural heritage", "section": "The Environment", "notes": ["Culture is the total way of life of a people — language, dress, food, music, beliefs, values, norms and technology.", "Material culture is what can be seen and touched (kente, drums, buildings); non-material culture is beliefs, values and norms.", "Culture is learnt, shared, dynamic (it changes) and transmitted from one generation to the next.", "Positive practices: respect for elders, communal labour, naming and puberty rites, festivals. Negative practices: trokosi, female genital mutilation, widowhood rites that harm women, witchcraft accusations.", "Cultural heritage is preserved through museums, festivals, archives, monuments and teaching in schools."], "plain": "Culture is the whole way of life of a people: language, food, dress, music, beliefs, customs and the things they make. You cannot inherit culture in your blood — you learn it.", "examples": [{"q": "Explain, with examples, why we say culture is dynamic.", "steps": ["Step 1 (point). Culture is dynamic — it changes with time.", "Step 2 (explain). Contact with other peoples, education, religion and technology bring in new ways, while some old practices fall away.", "Step 3 (example). Kente is now sewn into modern styles and worn at graduations, and funerals are announced on social media instead of by drum. The culture is alive, but it has changed."], "fig": null}, {"q": "Name two positive and two harmful cultural practices in Ghana.", "steps": ["<b>Positive:</b> respect for elders; communal labour; naming ceremonies and festivals that unite the community and raise funds for development.", "<b>Harmful:</b> female genital mutilation; trokosi; widowhood rites that humiliate women; accusing old women of witchcraft.", "In an essay, always say WHY a practice is harmful — the health, education or rights it damages."], "fig": null}]}, {"id": "social", "name": "Socialisation & the individual", "section": "The Environment", "notes": ["Socialisation is the process by which a person learns the norms, values and skills of society.", "Agents: the family (first and most important), the school, peer group, religious bodies, the mass media and the community.", "It makes a person a useful member of society and keeps the culture alive.", "Peer pressure can be positive (study groups) or negative (truancy, drug use).", "Poor socialisation contributes to indiscipline, crime and deviant behaviour."], "plain": "Socialisation is how a person learns the ways of their society: what is right, what is rude, how to speak and behave. It starts in the family and continues all through life.", "examples": [{"q": "Explain how the school socialises a student, in essay form.", "steps": ["Point: The school is a major agent of socialisation.", "Explain: Beyond books, it teaches punctuality, obedience to rules, co-operation, respect for other ethnic groups and the habit of working with others.", "Example: A day starts with assembly and the national pledge, students of many backgrounds share a dormitory and a class, and prefects learn leadership."], "fig": "<svg viewBox=\"0 0 364 152\" class=\"dia\" role=\"img\" aria-label=\"Agents of socialisation\" style=\"width:min(100%,418px)\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5.5\" markerHeight=\"5.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dah\"/></marker></defs><rect x=\"112.0\" y=\"10\" width=\"140\" height=\"42\" rx=\"7\" class=\"dfill\"/><text x=\"182.0\" y=\"27.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Agents of</text><text x=\"182.0\" y=\"41.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">socialisation</text><rect x=\"10.0\" y=\"92\" width=\"104\" height=\"50\" rx=\"7\" class=\"dbox\"/><text x=\"62.0\" y=\"113.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">Family — first</text><text x=\"62.0\" y=\"127.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">values</text><path d=\"M182.0,52 L182.0,72 L62.0,72 L62.0,92\" class=\"dline\"/><rect x=\"130.0\" y=\"92\" width=\"104\" height=\"50\" rx=\"7\" class=\"dbox\"/><text x=\"182.0\" y=\"113.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">School — rules</text><text x=\"182.0\" y=\"127.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">and skills</text><path d=\"M182.0,52 L182.0,72 L182.0,72 L182.0,92\" class=\"dline\"/><rect x=\"250.0\" y=\"92\" width=\"104\" height=\"50\" rx=\"7\" class=\"dbox\"/><text x=\"302.0\" y=\"113.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">Peers & media —</text><text x=\"302.0\" y=\"127.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">habits</text><path d=\"M182.0,52 L182.0,72 L302.0,72 L302.0,92\" class=\"dline\"/></svg>"}, {"q": "Give two positive and two negative effects of the peer group.", "steps": ["<b>Positive:</b> study groups that improve grades; sports and clubs that build confidence and discipline.", "<b>Negative:</b> pressure into truancy, drugs or crime; wasting time and money to 'belong'.", "The peer group is neither good nor bad in itself — it depends on the company chosen."], "fig": null}]}, {"id": "identity", "name": "Self-identity & personal development", "section": "The Environment", "notes": ["Self-identity is knowing who you are: your name, family, ethnic group, nationality, abilities, values and goals.", "Self-concept is how you see yourself; self-esteem is how much you value yourself.", "What shapes identity: family, culture and language, religion, school, peers, the media and personal experience.", "Self-esteem is built by achievement, honest praise, good role models and keeping promises to yourself.", "Life skills that build the person: goal setting, time management, self-discipline, assertiveness and the ability to say no."], "plain": "Your identity is the answer to 'who am I?' — family, culture, beliefs, abilities and goals. Self-esteem is how much you value that person. Both are built, not born.", "examples": [{"q": "A student is teased for speaking his local language at school and starts to feel ashamed of it. Advise him.", "steps": ["Step 1. Language is part of identity, not a weakness — being fluent in two or more languages is an asset.", "Step 2. Explain that confident people are respected; shame comes from accepting other people's judgement.", "Step 3. Encourage him to speak both languages well, and to join clubs where his culture is valued.", "Step 4. Advise the school to discourage teasing, since it damages self-esteem and learning."], "fig": null}, {"q": "Write one essay point on how self-discipline helps a student.", "steps": ["Point: Self-discipline turns good intentions into results.", "Explain: Every student wants to pass, but only the one who keeps to a timetable, sleeps and wakes early and resists distractions actually covers the syllabus.", "Example: A student who studies two hours daily from the first week needs no all-night cramming before WASSCE, and sits the paper rested."], "fig": null}]}, {"id": "adol", "name": "Adolescent development & responsible living", "section": "The Environment", "notes": ["Adolescence is the stage between childhood and adulthood, marked by rapid physical, emotional and social change.", "Adolescent chastity means refraining from sexual activity, which protects health, education and future plans.", "Consequences of teenage pregnancy: dropping out of school, health risks to mother and baby, loss of opportunities and family stress.", "HIV and other sexually transmitted infections are avoided by abstinence and by avoiding contact with infected blood and sharp instruments.", "Good decision-making: know the facts, weigh the consequences, consider your values, seek advice from a trusted adult, and act."], "plain": "Adolescence is the bridge between childhood and adulthood. The body changes fast, feelings swing, and friends matter more — which is why good decision-making matters most at this stage.", "examples": [{"q": "A Form Two student is being pressured by friends to attend a night party. Apply the steps of responsible decision-making.", "steps": ["Step 1. State the problem clearly: go to the party, or stay and prepare for tomorrow's test.", "Step 2. Get the facts: the party ends at 2 a.m., the test is at 8 a.m., and the route home is unsafe.", "Step 3. Weigh the consequences, short and long term: a few hours of fun against a poor grade, punishment, and possible danger.", "Step 4. Check it against your goals and values, seek advice from a parent or teacher, then decide and accept responsibility for the decision."], "fig": "<svg viewBox=\"0 0 514 96\" class=\"dia\" role=\"img\" aria-label=\"Decision-making steps\" style=\"width:min(100%,520px)\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5.5\" markerHeight=\"5.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dah\"/></marker></defs><text x=\"257.0\" y=\"15.0\" class=\"dmut\" text-anchor=\"middle\" style=\"font-size:12px\">Responsible decision-making</text><rect x=\"10\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"62.0\" y=\"49.0\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Name the</text><text x=\"62.0\" y=\"64.0\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">problem</text><rect x=\"140\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"192.0\" y=\"56.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Get the facts</text><line x1=\"117.0\" y1=\"53.0\" x2=\"136.0\" y2=\"53.0\" class=\"dline\" marker-end=\"url(#ah)\"/><rect x=\"270\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"322.0\" y=\"49.0\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Weigh</text><text x=\"322.0\" y=\"64.0\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">consequences</text><line x1=\"247.0\" y1=\"53.0\" x2=\"266.0\" y2=\"53.0\" class=\"dline\" marker-end=\"url(#ah)\"/><rect x=\"400\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"452.0\" y=\"56.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Decide and act</text><line x1=\"377.0\" y1=\"53.0\" x2=\"396.0\" y2=\"53.0\" class=\"dline\" marker-end=\"url(#ah)\"/></svg>"}, {"q": "Write one essay point on the benefits of adolescent chastity.", "steps": ["Point: Chastity protects a young person's education.", "Explain: Abstaining removes the risk of teenage pregnancy, which is the commonest reason girls drop out of school, and it removes the risk of sexually transmitted infection.", "Example: A student who stays focused completes SHS and enters training or work, while a classmate who becomes pregnant may lose two or more years of schooling."], "fig": null}]}, {"id": "family", "name": "Marriage & family life", "section": "The Environment", "notes": ["Types of marriage in Ghana: customary, ordinance (monogamous, under the Marriage Ordinance) and Islamic (under the Marriage of Mohammedans Ordinance).", "Functions of the family: reproduction, socialisation, economic support, emotional security and social identity.", "Nuclear family = parents and children; extended family adds grandparents, uncles, aunts and cousins.", "Responsible parenthood means having only the number of children one can cater for, and meeting their needs for food, health, education and love.", "Causes of marital instability: infidelity, financial problems, interference from relatives, childlessness, poor communication and abuse."], "plain": "The family is the smallest unit of society and the first school of every child. It produces and raises children, provides for them, and gives them identity and a sense of belonging.", "examples": [{"q": "Distinguish between the nuclear and the extended family, and state one advantage of each.", "steps": ["<b>Nuclear:</b> father, mother and their children. Advantage: fewer people to cater for, so resources go further and decisions are quick.", "<b>Extended:</b> adds grandparents, uncles, aunts and cousins. Advantage: help in times of need — school fees, funerals, child care and advice."], "fig": "<svg viewBox=\"0 0 260 152\" class=\"dia\" role=\"img\" aria-label=\"Types of family\" style=\"width:min(100%,299px)\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5.5\" markerHeight=\"5.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dah\"/></marker></defs><rect x=\"60.0\" y=\"10\" width=\"140\" height=\"42\" rx=\"7\" class=\"dfill\"/><text x=\"130.0\" y=\"34.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Family</text><rect x=\"18.0\" y=\"92\" width=\"104\" height=\"50\" rx=\"7\" class=\"dbox\"/><text x=\"70.0\" y=\"106.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">Nuclear:</text><text x=\"70.0\" y=\"120.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">parents +</text><text x=\"70.0\" y=\"134.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">children</text><path d=\"M130.0,52 L130.0,72 L70.0,72 L70.0,92\" class=\"dline\"/><rect x=\"138.0\" y=\"92\" width=\"104\" height=\"50\" rx=\"7\" class=\"dbox\"/><text x=\"190.0\" y=\"113.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">Extended: adds</text><text x=\"190.0\" y=\"127.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">relatives</text><path d=\"M130.0,52 L130.0,72 L190.0,72 L190.0,92\" class=\"dline\"/></svg>"}, {"q": "A couple keep quarrelling over money. Suggest practical ways to make the marriage stable.", "steps": ["Step 1. Agree a joint budget and discuss income and spending openly.", "Step 2. Plan the size of the family, so the children can be catered for.", "Step 3. Keep relatives from interfering in decisions that belong to the couple.", "Step 4. Where it is beyond them, seek counselling from a respected person, religious body or counsellor."], "fig": null}]}, {"id": "gender", "name": "Gender roles & equality", "section": "The Environment", "notes": ["Sex is biological (male or female); gender is the roles society gives to men and women, which can change.", "Traditional roles: men as providers and heads; women as home-keepers — but both now work, earn and lead.", "Gender equality means equal rights, opportunities and treatment, not that men and women are the same.", "Barriers for girls: early marriage, teenage pregnancy, household chores that cut study time, and the belief that some careers are 'for boys'.", "Ghana supports equality through free and compulsory basic education, scholarships for girls in science, laws against early and forced marriage, and affirmative action in appointments."], "plain": "Sex is what you are born with; gender is what society expects of you because of it. Gender roles change with time — which is why women today are doctors, soldiers and district chief executives.", "examples": [{"q": "Sort these into SEX or GENDER: bearing children, cooking, breastfeeding, driving a tractor, growing a beard, heading a household.", "steps": ["<b>Sex (biological):</b> bearing children, breastfeeding, growing a beard.", "<b>Gender (social):</b> cooking, driving a tractor, heading a household.", "Test: if it can change with society or training, it is gender."], "fig": null}, {"q": "Write one essay point on the benefits of educating girls.", "steps": ["Point: Educating girls lifts the whole community, not just the girl.", "Explain: An educated woman earns more, marries later, has fewer and healthier children, and is far more likely to send all of them to school.", "Example: Communities where girls complete SHS record lower infant deaths and higher household incomes within a generation."], "fig": null}]}, {"id": "educ", "name": "Education & national development", "section": "The Environment", "notes": ["Formal education is organised in schools with a syllabus and certificates; informal education is learnt at home and in the community; non-formal is organised outside the school system (adult literacy).", "Ghana's system: kindergarten, primary, junior high, senior high/technical, and tertiary.", "Benefits: skilled manpower, higher incomes, better health practices, informed citizens and national unity.", "Problems: inadequate infrastructure and teaching materials, teacher shortages in rural areas, poverty and teenage pregnancy, and a mismatch between training and job needs.", "Technical and vocational education (TVET) provides practical skills for self-employment."], "plain": "Education is the passing on of knowledge, skills and values. Formal education happens in school with a syllabus; informal education happens at home and in the community, all through life.", "examples": [{"q": "Write one essay point on how education promotes national development.", "steps": ["Point: Education supplies the skilled manpower a country needs.", "Explain: Doctors, teachers, engineers, technicians and entrepreneurs all come through the school system, and their skills raise productivity in every sector.", "Example: Training more TVET graduates means more welders, electricians and tailors who employ themselves and others rather than waiting for office jobs."], "fig": null}, {"q": "State two problems of education in rural Ghana and a solution to each.", "steps": ["Problem 1: Shortage of trained teachers, because postings to remote areas are unattractive. Solution: provide accommodation and rural allowances.", "Problem 2: Children walk long distances and drop out. Solution: build more community schools and support with feeding and scholarships."], "fig": null}]}, {"id": "nation", "name": "Nationhood & nation building", "section": "Governance, Politics & Stability", "notes": ["A nation is a group of people with a common history, territory and sense of belonging; a state has territory, population, government and sovereignty.", "Ghana became independent on 6 March 1957 and a republic on 1 July 1960; the Fourth Republic began on 7 January 1993.", "National symbols: the flag, coat of arms, national anthem and pledge, the mace, the Black Star and the presidential seat.", "The colours of the flag: red for the blood of those who died for independence, gold for mineral wealth, green for forests and farmlands, and the black star for African freedom.", "Nation building needs patriotism, tolerance, national service, payment of taxes and respect for the law."], "plain": "A nation is a people who feel they belong together; a state is a country with land, people, a government and sovereignty. Nation building is the work of making citizens feel and act as one.", "examples": [{"q": "Explain the colours of the national flag and what they should mean to a student.", "steps": ["Step 1. <b>Red</b> — the blood of those who died in the struggle for independence.", "Step 2. <b>Gold</b> — the mineral wealth of the country.", "Step 3. <b>Green</b> — the forests and farmlands.", "Step 4. <b>Black star</b> — African freedom and Ghana's lead in it.", "For a student, the flag is a reminder to protect what was won and to use the country's wealth honestly."], "fig": null}, {"q": "Write one essay point on how the youth can contribute to nation building.", "steps": ["Point: The youth build the nation by acquiring employable skills.", "Explain: A skilled young person creates goods and services, employs others, and pays taxes, instead of depending on the state.", "Example: A graduate who starts a small poultry farm feeds the community, employs two workers and reduces imports of chicken."], "fig": null}]}, {"id": "constit", "name": "The Constitution & the rule of law", "section": "Governance, Politics & Stability", "notes": ["A constitution is the body of rules by which a country is governed. It may be written or unwritten, rigid or flexible.", "Ghana's 1992 Constitution came into force on 7 January 1993, starting the Fourth Republic.", "The rule of law means everyone, including leaders, is subject to the law; no one is punished except for breaking a known law, proved in court.", "Separation of powers divides government into the Executive, the Legislature and the Judiciary, each checking the others.", "Fundamental human rights are entrenched in Chapter Five of the 1992 Constitution."], "plain": "A constitution is the rule book of a country. It says how power is shared, what leaders may and may not do, and what rights every citizen has. Ghana's present one began the Fourth Republic in 1993.", "examples": [{"q": "Explain the rule of law to someone who has never heard the term.", "steps": ["Step 1. It means the law is above everybody — the President, ministers, chiefs and ordinary citizens alike.", "Step 2. No one may be punished except for breaking a law that already exists, and only after a fair hearing in court.", "Step 3. Example: a minister who takes public money is tried in the same courts as any other citizen. Where that happens, we say the rule of law is working."], "fig": null}, {"q": "Why does a constitution divide power between three arms of government?", "steps": ["Step 1. If one person or body made the laws, enforced them and judged disputes, power would be abused.", "Step 2. Separation of powers gives each arm its own work and lets each check the others.", "Step 3. Example: Parliament approves the budget and vets ministers, while the courts can declare an act of government unconstitutional."], "fig": null}]}, {"id": "citizen", "name": "Citizenship: rights & responsibilities", "section": "Governance, Politics & Stability", "notes": ["Citizenship may be acquired by birth, by descent (parentage), by registration (marriage) or by naturalisation.", "Rights: life, personal liberty, dignity, fair trial, education, property, speech, assembly, religion and to vote.", "Duties: obey the law, pay taxes, defend the country, protect public property, vote, serve on juries and respect others' rights.", "Rights are not absolute — they may be limited by law in the interest of public safety, health and the rights of others.", "The National Commission for Civic Education (NCCE) educates citizens on their rights and duties."], "plain": "A citizen is a full member of a country, with rights that the state must protect and duties that the citizen owes the state. Rights and duties always go together.", "examples": [{"q": "Match each right with the duty that makes it possible.", "steps": ["Right to education ⇄ duty to pay taxes that build and staff the schools.", "Right to security ⇄ duty to report crime, serve on juries and obey the law.", "Right to a clean environment ⇄ duty to dispose of waste properly.", "Right to vote ⇄ duty to register, vote peacefully and accept the result."], "fig": null}, {"q": "A citizen is arrested and held for a week without being charged. What has been breached, and what can be done?", "steps": ["Step 1. The Constitution guarantees personal liberty and requires that an arrested person be brought before a court within 48 hours.", "Step 2. Holding him for a week without charge breaches that right.", "Step 3. He (or a relative or lawyer) may apply to the courts, and may also complain to CHRAJ."], "fig": null}]}, {"id": "rights", "name": "Human rights & the vulnerable", "section": "Governance, Politics & Stability", "notes": ["Human rights belong to every person simply because they are human; they are set out in Chapter Five of the 1992 Constitution.", "Rights of the child: a name and nationality, education, health care, protection from abuse and hazardous labour, and a say in matters affecting them.", "Vulnerable groups: children, women, persons with disability, the aged, the very poor and refugees.", "The Persons with Disability Act requires access to public buildings, transport, education and employment.", "Protective bodies: CHRAJ, the Domestic Violence and Victim Support Unit (DOVVSU) of the police, the Department of Social Welfare, and the courts.", "Rights carry responsibilities, and may be limited by law in the interest of public safety and the rights of others."], "plain": "Human rights are the things every person is entitled to simply for being human — life, dignity, education, a fair hearing. The test of a society is how it treats those least able to defend themselves: children, the aged and persons with disability.", "examples": [{"q": "A 13-year-old is working full time in a quarry instead of attending school. List the rights denied and say who should act.", "steps": ["Step 1. Rights denied: education; protection from hazardous child labour; health and development; rest and play.", "Step 2. Who acts: the parents first; then the Department of Social Welfare and the district assembly's child protection committee; DOVVSU where there is abuse; the employer can be prosecuted.", "Step 3. The lasting remedy is support for the family's income, so that the child's labour is not needed to eat."], "fig": null}, {"q": "Match each right with the duty it carries.", "steps": ["Right to free expression ⇄ duty not to insult, defame or incite others.", "Right to a clean environment ⇄ duty to dispose of your own waste properly.", "Right to education ⇄ duty to attend, learn and respect school rules.", "Right to vote ⇄ duty to register, vote peacefully and accept the result."], "fig": "<svg viewBox=\"0 0 514 96\" class=\"dia\" role=\"img\" aria-label=\"Rights carry duties\" style=\"width:min(100%,520px)\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5.5\" markerHeight=\"5.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dah\"/></marker></defs><text x=\"257.0\" y=\"15.0\" class=\"dmut\" text-anchor=\"middle\" style=\"font-size:12px\">Rights and duties go together</text><rect x=\"10\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"62.0\" y=\"56.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">A right</text><rect x=\"140\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"192.0\" y=\"56.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">carries</text><line x1=\"117.0\" y1=\"53.0\" x2=\"136.0\" y2=\"53.0\" class=\"dline\" marker-end=\"url(#ah)\"/><rect x=\"270\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"322.0\" y=\"56.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">a duty</text><line x1=\"247.0\" y1=\"53.0\" x2=\"266.0\" y2=\"53.0\" class=\"dline\" marker-end=\"url(#ah)\"/><rect x=\"400\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"452.0\" y=\"56.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">for everyone</text><line x1=\"377.0\" y1=\"53.0\" x2=\"396.0\" y2=\"53.0\" class=\"dline\" marker-end=\"url(#ah)\"/></svg>"}]}, {"id": "democracy", "name": "Democracy & the arms of government", "section": "Governance, Politics & Stability", "notes": ["Democracy is government of the people, by the people and for the people, through elected representatives.", "Executive: the President, Vice-President and ministers — carries out policies and laws.", "Legislature (Parliament): makes, amends and repeals laws, approves the budget and checks the Executive.", "Judiciary: interprets the laws and settles disputes; headed by the Chief Justice, with the Supreme Court as the highest court.", "Features of democracy: free and fair elections, rule of law, respect for human rights, a free press, an independent judiciary and an active opposition."], "plain": "Democracy means the people rule, through leaders they choose and can remove. Government is divided into three arms so that no one person holds all the power.", "examples": [{"q": "Name the three arms of government and state the main work of each.", "steps": ["<b>Executive</b> — the President, ministers and civil service; carries out laws and policies.", "<b>Legislature</b> — Parliament; makes laws, approves taxes and spending, and checks the Executive.", "<b>Judiciary</b> — the courts, headed by the Chief Justice; interprets the laws and settles disputes."], "fig": "<svg viewBox=\"0 0 364 170\" class=\"dia\" role=\"img\" aria-label=\"Three arms of government\" style=\"width:min(100%,418px)\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5.5\" markerHeight=\"5.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dah\"/></marker></defs><rect x=\"112.0\" y=\"10\" width=\"140\" height=\"42\" rx=\"7\" class=\"dfill\"/><text x=\"182.0\" y=\"34.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Government</text><rect x=\"10.0\" y=\"92\" width=\"104\" height=\"50\" rx=\"7\" class=\"dbox\"/><text x=\"62.0\" y=\"120.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">Executive</text><path d=\"M182.0,52 L182.0,72 L62.0,72 L62.0,92\" class=\"dline\"/><text x=\"62.0\" y=\"158.0\" class=\"dmut\" text-anchor=\"middle\">carries out laws</text><rect x=\"130.0\" y=\"92\" width=\"104\" height=\"50\" rx=\"7\" class=\"dbox\"/><text x=\"182.0\" y=\"120.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">Legislature</text><path d=\"M182.0,52 L182.0,72 L182.0,72 L182.0,92\" class=\"dline\"/><text x=\"182.0\" y=\"158.0\" class=\"dmut\" text-anchor=\"middle\">makes laws</text><rect x=\"250.0\" y=\"92\" width=\"104\" height=\"50\" rx=\"7\" class=\"dbox\"/><text x=\"302.0\" y=\"120.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">Judiciary</text><path d=\"M182.0,52 L182.0,72 L302.0,72 L302.0,92\" class=\"dline\"/><text x=\"302.0\" y=\"158.0\" class=\"dmut\" text-anchor=\"middle\">interprets laws</text></svg>"}, {"q": "How does Parliament check the Executive? Give four ways.", "steps": ["1. It approves or rejects the national budget and any new tax.", "2. It vets and approves the President's ministerial nominees.", "3. Its committees summon ministers and examine the Auditor-General's reports.", "4. It must approve loans and international agreements before they take effect."], "fig": null}]}, {"id": "elect", "name": "Elections & political participation", "section": "Governance, Politics & Stability", "notes": ["The Electoral Commission (EC) registers voters, compiles the register, conducts and supervises all public elections and referenda.", "Universal adult suffrage: every sane citizen of 18 years and above, of sound mind, has one vote.", "Presidential and parliamentary elections in Ghana are held every four years; a president may serve a maximum of two terms.", "A winning presidential candidate must obtain more than 50% of the valid votes cast, or a run-off is held.", "Electoral malpractices — multiple voting, vote buying, impersonation, intimidation and ballot stuffing — undermine democracy."], "plain": "An election is how citizens choose their leaders. Every citizen of 18 and above has one vote, and the Electoral Commission organises and supervises the whole process.", "examples": [{"q": "In a presidential election, candidate A gets 48% of valid votes, B gets 45% and C gets 7%. What happens next?", "steps": ["Step 1. To win outright, a candidate needs MORE than 50% of the valid votes cast.", "Step 2. A has only 48%, so no one has won.", "Step 3. A second election (a run-off) is held between the two leading candidates, A and B."], "fig": null}, {"q": "Write one essay point on the effects of electoral malpractice.", "steps": ["Point: Electoral malpractice destroys trust in the result.", "Explain: When votes are bought or ballots stuffed, the leader who emerges does not represent the people's real choice, and losers and their supporters feel cheated.", "Example: Disputed results have led to tension, court cases and even violence in parts of the sub-region, scaring away investors and costing the state money."], "fig": null}]}, {"id": "local", "name": "Decentralisation & local government", "section": "Governance, Politics & Stability", "notes": ["Decentralisation is the transfer of power, functions and resources from central government to local authorities.", "Ghana's local government units are the Metropolitan, Municipal and District Assemblies (MMDAs), with zonal, urban and unit committees below them.", "The assembly is the highest political and administrative authority in the district; it makes by-laws and plans development.", "The District Chief Executive is nominated by the President and approved by at least two-thirds of the assembly members present and voting.", "The District Assembly Common Fund is a share of national revenue (not less than 5%) paid to the assemblies for development."], "plain": "Decentralisation brings government nearer to the people. Instead of everything being decided in Accra, the district assembly plans and provides for its own area.", "examples": [{"q": "A community wants a clinic. Trace the steps through the local government system.", "steps": ["Step 1. Raise it at the unit committee or town/area council meeting.", "Step 2. The assembly member takes it to the district assembly for inclusion in the development plan.", "Step 3. The assembly budgets for it, often using the District Assembly Common Fund, and awards the contract.", "Step 4. Citizens monitor the work, and the assembly member reports back to the community."], "fig": "<svg viewBox=\"0 0 364 170\" class=\"dia\" role=\"img\" aria-label=\"Local government structure\" style=\"width:min(100%,418px)\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5.5\" markerHeight=\"5.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dah\"/></marker></defs><rect x=\"112.0\" y=\"10\" width=\"140\" height=\"42\" rx=\"7\" class=\"dfill\"/><text x=\"182.0\" y=\"34.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">District Assembly</text><rect x=\"10.0\" y=\"92\" width=\"104\" height=\"50\" rx=\"7\" class=\"dbox\"/><text x=\"62.0\" y=\"113.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">Town / Area</text><text x=\"62.0\" y=\"127.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">Council</text><path d=\"M182.0,52 L182.0,72 L62.0,72 L62.0,92\" class=\"dline\"/><text x=\"62.0\" y=\"158.0\" class=\"dmut\" text-anchor=\"middle\">group of communities</text><rect x=\"130.0\" y=\"92\" width=\"104\" height=\"50\" rx=\"7\" class=\"dbox\"/><text x=\"182.0\" y=\"120.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">Unit Committee</text><path d=\"M182.0,52 L182.0,72 L182.0,72 L182.0,92\" class=\"dline\"/><text x=\"182.0\" y=\"158.0\" class=\"dmut\" text-anchor=\"middle\">closest to the people</text><rect x=\"250.0\" y=\"92\" width=\"104\" height=\"50\" rx=\"7\" class=\"dbox\"/><text x=\"302.0\" y=\"113.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">Assembly</text><text x=\"302.0\" y=\"127.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">members</text><path d=\"M182.0,52 L182.0,72 L302.0,72 L302.0,92\" class=\"dline\"/><text x=\"302.0\" y=\"158.0\" class=\"dmut\" text-anchor=\"middle\">elected by the people</text></svg>"}, {"q": "State two advantages and two problems of decentralisation.", "steps": ["<b>Advantages:</b> local people decide their own priorities; services are delivered faster and projects are easier to monitor.", "<b>Problems:</b> inadequate and late funds; shortage of qualified staff
