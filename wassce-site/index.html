AB = <span class=\"fr\"><span>60</span><span>360</span></span> × 2 × 3.142 × 10 = 10.473 cm", "Perimeter = 10.473 + 10 = <b>20.47 cm</b>"], "marks": 10, "tip": null, "fig": null, "id": "area-7", "topic": "area"}, {"type": "thy", "q": "A rectangular lawn measures 20 m by 15 m. A path 2 m wide runs round the outside of the lawn.<br>(a) Find the area of the path.<br>(b) Find the cost of paving the path at GH₵ 45 per square metre.<br>(c) A circular pond of diameter 7 m is dug in the lawn. Find the area of lawn that remains. [π = <span class=\"fr\"><span>22</span><span>7</span></span>]", "sol": ["(a) Outer rectangle = (20 + 4) × (15 + 4) = 24 × 19 = 456 m²", "Path = 456 − 300 = <b>156 m²</b>", "(b) Cost = 156 × 45 = <b>GH₵ 7,020</b>", "(c) Pond = <span class=\"fr\"><span>22</span><span>7</span></span> × 3.5<sup>2</sup> = 38.5 m²", "Remaining lawn = 300 − 38.5 = <b>261.5 m²</b>"], "marks": 10, "tip": null, "fig": null, "id": "area-8", "topic": "area"}, {"type": "obj", "q": "Find the volume of a cylinder of radius 7 cm and height 10 cm. [π = <span class=\"fr\"><span>22</span><span>7</span></span>]", "opts": ["1540 cm³", "3080 cm³", "4620 cm³", "440 cm³"], "ans": 0, "sol": ["V = <span class=\"fr\"><span>22</span><span>7</span></span> × 49 × 10 = 1540 cm³"], "tip": null, "fig": null, "id": "vol-1", "topic": "vol"}, {"type": "obj", "q": "Find the volume of a cone of base radius 3 cm and height 7 cm. [π = <span class=\"fr\"><span>22</span><span>7</span></span>]", "opts": ["198 cm³", "66 cm³", "22 cm³", "132 cm³"], "ans": 1, "sol": ["V = <span class=\"fr\"><span>1</span><span>3</span></span> × <span class=\"fr\"><span>22</span><span>7</span></span> × 9 × 7 = 66 cm³"], "tip": null, "fig": null, "id": "vol-2", "topic": "vol"}, {"type": "obj", "q": "Find the total surface area of a closed cylinder of radius 7 cm and height 5 cm. [π = <span class=\"fr\"><span>22</span><span>7</span></span>]", "opts": ["528 cm²", "220 cm²", "308 cm²", "374 cm²"], "ans": 0, "sol": ["Total surface area = 2πr(r + h) = 2 × <span class=\"fr\"><span>22</span><span>7</span></span> × 7 × 12 = 528 cm²"], "tip": null, "fig": null, "id": "vol-3", "topic": "vol"}, {"type": "obj", "q": "Find the volume of a sphere of radius 3 cm, in terms of π.", "opts": ["12π cm³", "108π cm³", "36π cm³", "27π cm³"], "ans": 2, "sol": ["V = <span class=\"fr\"><span>4</span><span>3</span></span>π(3)<sup>3</sup> = <span class=\"fr\"><span>4</span><span>3</span></span> × 27π = 36π cm³"], "tip": null, "fig": null, "id": "vol-4", "topic": "vol"}, {"type": "obj", "q": "A cube has a total surface area of 150 cm². Find its volume.", "opts": ["216 cm³", "150 cm³", "25 cm³", "125 cm³"], "ans": 3, "sol": ["6s<sup>2</sup> = 150 ⇒ s<sup>2</sup> = 25 ⇒ s = 5 cm", "V = 5<sup>3</sup> = 125 cm³"], "tip": null, "fig": null, "id": "vol-5", "topic": "vol"}, {"type": "obj", "q": "Find the curved surface area of a cone with base radius 6 cm and slant height 10 cm, in terms of π.", "opts": ["60π cm²", "36π cm²", "96π cm²", "120π cm²"], "ans": 0, "sol": ["Curved surface area = πrl = π × 6 × 10 = 60π cm²"], "tip": "96π is the TOTAL surface area (it adds the base, 36π). Read the question carefully.", "fig": null, "id": "vol-6", "topic": "vol"}, {"type": "thy", "q": "A solid is made of a cone of height 8 cm standing on a cylinder of height 10 cm. Both have a radius of 6 cm. [π = 3.142]<br>(a) Find the slant height of the cone.<br>(b) Find the total surface area of the solid.<br>(c) Find the volume of the solid.", "sol": ["(a) l = √(6<sup>2</sup> + 8<sup>2</sup>) = √100 = <b>10 cm</b>", "(b) Surface = cone curved + cylinder curved + base = π(6)(10) + 2π(6)(10) + π(6)<sup>2</sup>", "= 60π + 120π + 36π = 216π = 216 × 3.142 = <b>678.67 cm²</b>", "(c) V = <span class=\"fr\"><span>1</span><span>3</span></span>π(36)(8) + π(36)(10) = 96π + 360π = 456π", "= 456 × 3.142 = <b>1432.75 cm³</b>"], "marks": 12, "tip": null, "fig": null, "id": "vol-7", "topic": "vol"}, {"type": "thy", "q": "An open rectangular tank measures 2 m by 1.5 m by 1.2 m.<br>(a) Find its capacity in litres.<br>(b) The full tank is emptied into cylindrical drums of radius 0.35 m and height 0.9 m. How many drums can be filled completely, and how many litres are left over? [π = <span class=\"fr\"><span>22</span><span>7</span></span>]<br>(c) Find the area of metal sheet used to make the tank.", "sol": ["(a) V = 2 × 1.5 × 1.2 = 3.6 m³ = <b>3600 litres</b>", "(b) Drum = <span class=\"fr\"><span>22</span><span>7</span></span> × 0.35<sup>2</sup> × 0.9 = 0.3465 m³ = 346.5 litres", "<span class=\"fr\"><span>3600</span><span>346.5</span></span> = 10.39… ⇒ <b>10 full drums</b>", "Left over = 3600 − 10 × 346.5 = <b>135 litres</b>", "(c) Base = 2 × 1.5 = 3 m²; sides = 2(2 × 1.2) + 2(1.5 × 1.2) = 4.8 + 3.6 = 8.4 m²", "Total (open top) = <b>11.4 m²</b>"], "marks": 12, "tip": null, "fig": null, "id": "vol-8", "topic": "vol"}, {"type": "obj", "q": "Find the size of each interior angle of a regular hexagon.", "opts": ["135°", "108°", "120°", "60°"], "ans": 2, "sol": ["Sum = (6 − 2) × 180° = 720°", "Each = 720° ÷ 6 = 120°"], "tip": null, "fig": null, "id": "geo-1", "topic": "geo"}, {"type": "obj", "q": "Find the sum of the interior angles of a nonagon (9 sides).", "opts": ["1440°", "1260°", "1080°", "1620°"], "ans": 1, "sol": ["(9 − 2) × 180° = 1260°"], "tip": null, "fig": null, "id": "geo-2", "topic": "geo"}, {"type": "obj", "q": "Each exterior angle of a regular polygon is 24°. How many sides does it have?", "opts": ["12", "18", "15", "24"], "ans": 2, "sol": ["n = 360° ÷ 24° = 15"], "tip": null, "fig": null, "id": "geo-3", "topic": "geo"}, {"type": "obj", "q": "The angles of triangle PQR are P = 2x°, Q = (3x + 10)° and R = (x + 20)°. Find x.", "opts": ["30", "35", "20", "25"], "ans": 3, "sol": ["2x + 3x + 10 + x + 20 = 180", "6x + 30 = 180 ⇒ x = 25"], "tip": null, "fig": null, "id": "geo-4", "topic": "geo"}, {"type": "obj", "q": "A transversal cuts two parallel lines. A pair of alternate angles are (3y − 15)° and (2y + 20)°. Find y.", "opts": ["39", "25", "35", "5"], "ans": 2, "sol": ["Alternate angles are equal: 3y − 15 = 2y + 20", "y = 35"], "tip": null, "fig": null, "id": "geo-5", "topic": "geo"}, {"type": "obj", "q": "The vertical angle of an isosceles triangle is 40°. Find each base angle.", "opts": ["70°", "140°", "40°", "50°"], "ans": 0, "sol": ["Base angles are equal: 2b + 40 = 180", "b = 70°"], "tip": null, "fig": null, "id": "geo-6", "topic": "geo"}, {"type": "thy", "q": "(a) The interior angles of a pentagon are x°, 2x°, (x + 30)°, 110° and 130°. Find x and the size of the largest angle.<br>(b) Each interior angle of a regular polygon is four times its exterior angle. Find the number of sides.<br>(c) A 13 m ladder leans against a vertical wall with its foot 5 m from the wall. How high up the wall does it reach?", "sol": ["(a) Sum of the angles of a pentagon = 540°", "x + 2x + x + 30 + 110 + 130 = 540 ⇒ 4x = 270 ⇒ <b>x = 67.5</b>", "The angles are 67.5°, 135°, 97.5°, 110° and 130° ⇒ the largest is <b>135°</b>", "(b) Interior + exterior = 180° ⇒ 4e + e = 180 ⇒ e = 36°", "n = 360 ÷ 36 = <b>10 sides</b> (a decagon)", "(c) h = √(13<sup>2</sup> − 5<sup>2</sup>) = √144 = <b>12 m</b>"], "marks": 10, "tip": null, "fig": null, "id": "geo-7", "topic": "geo"}, {"type": "thy", "q": "In triangle ABC, D is on AB and E is on AC such that DE ∥ BC. AD = 4 cm, DB = 6 cm and DE = 5 cm.<br>(a) Find BC.<br>(b) If AE = 3 cm, find EC.<br>(c) Find the ratio of the area of triangle ADE to the area of triangle ABC.", "sol": ["(a) Triangles ADE and ABC are similar (DE ∥ BC). AB = 10 cm", "<span class=\"fr\"><span>AD</span><span>AB</span></span> = <span class=\"fr\"><span>DE</span><span>BC</span></span> ⇒ <span class=\"fr\"><span>4</span><span>10</span></span> = <span class=\"fr\"><span>5</span><span>BC</span></span> ⇒ <b>BC = 12.5 cm</b>", "(b) <span class=\"fr\"><span>AD</span><span>DB</span></span> = <span class=\"fr\"><span>AE</span><span>EC</span></span> ⇒ <span class=\"fr\"><span>4</span><span>6</span></span> = <span class=\"fr\"><span>3</span><span>EC</span></span> ⇒ <b>EC = 4.5 cm</b>", "(c) Area ratio = (<span class=\"fr\"><span>4</span><span>10</span></span>)<sup>2</sup> = <b>4 : 25</b>"], "marks": 9, "tip": null, "fig": null, "id": "geo-8", "topic": "geo"}, {"type": "obj", "q": "An arc subtends an angle of 130° at the centre of a circle. What angle does it subtend at a point on the remaining part of the circumference?", "opts": ["260°", "50°", "130°", "65°"], "ans": 3, "sol": ["The angle at the circumference is half the angle at the centre: 130° ÷ 2 = 65°"], "tip": null, "fig": null, "id": "circle-1", "topic": "circle"}, {"type": "obj", "q": "One angle of a cyclic quadrilateral is 72°. Find the angle opposite to it.", "opts": ["288°", "72°", "18°", "108°"], "ans": 3, "sol": ["Opposite angles add up to 180°: 180° − 72° = 108°"], "tip": null, "fig": null, "id": "circle-2", "topic": "circle"}, {"type": "obj", "q": "AB is a diameter of a circle and C is a point on the circle. If ∠CAB = 35°, find ∠ABC.", "opts": ["145°", "45°", "35°", "55°"], "ans": 3, "sol": ["∠ACB = 90° (angle in a semicircle)", "∠ABC = 180° − 90° − 35° = 55°"], "tip": null, "fig": null, "id": "circle-3", "topic": "circle"}, {"type": "obj", "q": "PT is a tangent from P to a circle with centre O, touching it at T. If OP = 13 cm and the radius is 5 cm, find PT.", "opts": ["√194 cm", "18 cm", "8 cm", "12 cm"], "ans": 3, "sol": ["OT ⊥ PT (radius ⊥ tangent)", "PT = √(13<sup>2</sup> − 5<sup>2</sup>) = √144 = 12 cm"], "tip": null, "fig": null, "id": "circle-4", "topic": "circle"}, {"type": "obj", "q": "The tangent to a circle at A makes an angle of 58° with the chord AB. Find the angle ACB, where C is a point on the circle in the alternate segment.", "opts": ["116°", "32°", "122°", "58°"], "ans": 3, "sol": ["By the alternate segment theorem, ∠ACB = 58°"], "tip": null, "fig": null, "id": "circle-5", "topic": "circle"}, {"type": "obj", "q": "Chords AB and CD of a circle intersect at X inside the circle. AX = 4 cm, XB = 6 cm and CX = 3 cm. Find XD.", "opts": ["4.5 cm", "8 cm", "7 cm", "2 cm"], "ans": 1, "sol": ["AX × XB = CX × XD", "4 × 6 = 3 × XD ⇒ XD = 8 cm"], "tip": null, "fig": null, "id": "circle-6", "topic": "circle"}, {"type": "thy", "q": "ABCD is a cyclic quadrilateral with ∠BAD = 3x° and ∠BCD = (2x + 30)°.<br>(a) Find x.<br>(b) What does your answer tell you about BD?<br>(c) If ∠ABD = 35°, find ∠ACD and ∠ADB.", "sol": ["(a) Opposite angles are supplementary: 3x + 2x + 30 = 180 ⇒ 5x = 150 ⇒ <b>x = 30</b>", "(b) ∠BAD = 90°, so BD subtends a right angle at A ⇒ <b>BD is a diameter</b>", "(c) ∠ACD and ∠ABD stand on the same arc AD ⇒ <b>∠ACD = 35°</b>", "In triangle ABD: ∠ADB = 180° − 90° − 35° = <b>55°</b>"], "marks": 10, "tip": null, "fig": null, "id": "circle-7", "topic": "circle"}, {"type": "thy", "q": "TA and TB are tangents from T to a circle with centre O, touching it at A and B. ∠ATB = 50°. C is a point on the major arc AB.<br>(a) Find ∠AOB.<br>(b) Find ∠ACB.<br>(c) Find ∠TAB.<br>(d) If OA = 6 cm, find TA correct to two decimal places.", "sol": ["(a) ∠OAT = ∠OBT = 90° (radius ⊥ tangent). In quadrilateral OATB: ∠AOB = 360 − 90 − 90 − 50 = <b>130°</b>", "(b) ∠ACB = ½ ∠AOB = <b>65°</b>", "(c) TA = TB, so triangle TAB is isosceles: ∠TAB = (180 − 50) ÷ 2 = <b>65°</b>", "(d) OT bisects ∠ATB, so ∠ATO = 25°. In right-angled triangle OAT: tan 25° = OA/TA", "TA = <span class=\"fr\"><span>6</span><span>tan 25°</span></span> = <span class=\"fr\"><span>6</span><span>0.4663</span></span> = <b>12.87 cm</b>"], "marks": 12, "tip": "Part (c) also follows from the alternate segment theorem: ∠TAB = ∠ACB = 65°.", "fig": null, "id": "circle-8", "topic": "circle"}, {"type": "obj", "q": "What is the locus of points equidistant from two fixed points A and B?", "opts": ["The perpendicular bisector of AB", "A line parallel to AB", "The line AB", "A circle with diameter AB"], "ans": 0, "sol": ["Every point on the perpendicular bisector of AB is the same distance from A and from B."], "tip": null, "fig": null, "id": "loci-1", "topic": "loci"}, {"type": "obj", "q": "What is the locus of a point P that moves so that it is always 3 cm from a fixed point O?", "opts": ["Two parallel lines 3 cm apart", "A straight line 3 cm from O", "A circle with centre O and radius 3 cm", "A circle with diameter 3 cm"], "ans": 2, "sol": ["All points a fixed distance from O form a circle with centre O and that radius."], "tip": null, "fig": null, "id": "loci-2", "topic": "loci"}, {"type": "obj", "q": "What is the locus of points equidistant from two intersecting straight lines?", "opts": ["The perpendicular bisector of one line", "A circle through the point of intersection", "A line parallel to both lines", "The bisectors of the angles between the lines"], "ans": 3, "sol": ["Points on an angle bisector are the same distance from both arms of the angle."], "tip": null, "fig": null, "id": "loci-3", "topic": "loci"}, {"type": "obj", "q": "Which of these angles CANNOT be constructed using only a ruler and a pair of compasses by the usual methods?", "opts": ["22.5°", "50°", "75°", "105°"], "ans": 1, "sol": ["75° = 60° + 15°; 105° = 90° + 15°; 22.5° = ½ of 45°", "50° cannot be built from 60° and 90° by bisecting and adding."], "tip": null, "fig": null, "id": "loci-4", "topic": "loci"}, {"type": "obj", "q": "In constructing an angle of 60° with a ruler and compasses, which figure is effectively being drawn?", "opts": ["An equilateral triangle", "A right-angled triangle", "A square", "A regular hexagon's diagonal"], "ans": 0, "sol": ["Arcs of equal radius from each end produce three equal sides, so every angle is 60°."], "tip": null, "fig": null, "id": "loci-5", "topic": "loci"}, {"type": "thy", "q": "(a) Using a ruler and a pair of compasses only, construct triangle PQR with PQ = 7 cm, ∠PQR = 60° and QR = 5 cm. Measure PR.<br>(b) Construct the locus of points equidistant from P and Q, and the locus of points equidistant from Q and R. Label their intersection O and measure OP.", "sol": ["(a) Draw PQ = 7 cm. At Q, construct 60°: with centre Q draw an arc cutting QP, and with the same radius, centre at that point, cut the arc again. Join Q through this point.", "Mark R on this arm with QR = 5 cm, and join PR.", "Check by the cosine rule: PR<sup>2</sup> = 49 + 25 − 2(7)(5)cos 60° = 39 ⇒ <b>PR ≈ 6.2 cm</b>", "(b) Construct the perpendicular bisectors of PQ and QR; they meet at O (the circumcentre).", "OP = circumradius = <span class=\"fr\"><span>PR</span><span>2 sin Q</span></span> = <span class=\"fr\"><span>6.245</span><span>1.732</span></span> ⇒ <b>OP ≈ 3.6 cm</b>", "O is equidistant from P, Q and R, so a circle with centre O through P also passes through Q and R."], "marks": 12, "tip": "Always leave your construction arcs visible — examiners award marks for them.", "fig": null, "id": "loci-6", "topic": "loci"}, {"type": "thy", "q": "A goat is tied by a 5 m rope to a post at one corner of a rectangular field measuring 12 m by 8 m.<br>(a) Describe the locus of the furthest points the goat can reach.<br>(b) Find the area of the field the goat can graze. [π = <span class=\"fr\"><span>22</span><span>7</span></span>]<br>(c) Find the area of the field it cannot reach.", "sol": ["(a) An arc of a circle with centre at the post and radius 5 m — a quarter circle, because the corner angle is 90°.", "(b) Area = <span class=\"fr\"><span>1</span><span>4</span></span> × <span class=\"fr\"><span>22</span><span>7</span></span> × 5<sup>2</sup> = <span class=\"fr\"><span>550</span><span>28</span></span> = <b>19.64 m²</b>", "(c) Field = 12 × 8 = 96 m²; unreachable = 96 − 19.64 = <b>76.36 m²</b>"], "marks": 8, "tip": null, "fig": null, "id": "loci-7", "topic": "loci"}, {"type": "obj", "q": "Find the gradient of the line joining (2, −3) and (6, 5).", "opts": ["2", "<span class=\"fr\"><span>1</span><span>2</span></span>", "4", "−2"], "ans": 0, "sol": ["m = <span class=\"fr\"><span>5 − (−3)</span><span>6 − 2</span></span> = <span class=\"fr\"><span>8</span><span>4</span></span> = 2"], "tip": null, "fig": null, "id": "coord-1", "topic": "coord"}, {"type": "obj", "q": "Find the distance between the points (−1, 2) and (5, 10).", "opts": ["8 units", "10 units", "√28 units", "14 units"], "ans": 1, "sol": ["d = √(6<sup>2</sup> + 8<sup>2</sup>) = √100 = 10"], "tip": null, "fig": null, "id": "coord-2", "topic": "coord"}, {"type": "obj", "q": "Find the midpoint of the line joining (4, −2) and (−6, 8).", "opts": ["(−1, 5)", "(1, 3)", "(−1, 3)", "(−5, 5)"], "ans": 2, "sol": ["(<span class=\"fr\"><span>4 + (−6)</span><span>2</span></span>, <span class=\"fr\"><span>−2 + 8</span><span>2</span></span>) = (−1, 3)"], "tip": null, "fig": null, "id": "coord-3", "topic": "coord"}, {"type": "obj", "q": "Find the equation of the line with gradient 3 passing through (1, 4).", "opts": ["y = 3x + 4", "y = 3x − 1", "y = 3x + 1", "y = x + 3"], "ans": 2, "sol": ["y − 4 = 3(x − 1)", "y = 3x + 1"], "tip": null, "fig": null, "id": "coord-4", "topic": "coord"}, {"type": "obj", "q": "The lines 2y = 3x + 5 and ky + 2x = 7 are perpendicular. Find k.", "opts": ["3", "−3", "<span class=\"fr\"><span>4</span><span>3</span></span>", "−<span class=\"fr\"><span>4</span><span>3</span></span>"], "ans": 0, "sol": ["The gradients are <span class=\"fr\"><span>3</span><span>2</span></span> and −<span class=\"fr\"><span>2</span><span>k</span></span>", "<span class=\"fr\"><span>3</span><span>2</span></span> × (−<span class=\"fr\"><span>2</span><span>k</span></span>) = −1 ⇒ <span class=\"fr\"><span>3</span><span>k</span></span> = 1 ⇒ k = 3"], "tip": null, "fig": null, "id": "coord-5", "topic": "coord"}, {"type": "obj", "q": "Find the x-intercept of the line 3x − 4y = 12.", "opts": ["12", "3", "4", "−3"], "ans": 2, "sol": ["At the x-axis, y = 0: 3x = 12 ⇒ x = 4"], "tip": null, "fig": null, "id": "coord-6", "topic": "coord"}, {"type": "thy", "q": "The points A(−2, 1), B(4, 5) and C(6, 2) are the vertices of a triangle.<br>(a) Find the gradient of AB.<br>(b) Find the equation of the line through C parallel to AB.<br>(c) Show that triangle ABC is right-angled, and state where the right angle is.<br>(d) Find the area of the triangle.", "sol": ["(a) m<sub>AB</sub> = <span class=\"fr\"><span>5 − 1</span><span>4 − (−2)</span></span> = <b><span class=\"fr\"><span>2</span><span>3</span></span></b>", "(b) y − 2 = <span class=\"fr\"><span>2</span><span>3</span></span>(x − 6) ⇒ 3y − 6 = 2x − 12 ⇒ <b>2x − 3y − 6 = 0</b>", "(c) m<sub>BC</sub> = <span class=\"fr\"><span>2 − 5</span><span>6 − 4</span></span> = −<span class=\"fr\"><span>3</span><span>2</span></span>; m<sub>AB</sub> × m<sub>BC</sub> = <span class=\"fr\"><span>2</span><span>3</span></span> × (−<span class=\"fr\"><span>3</span><span>2</span></span>) = −1", "So AB ⊥ BC ⇒ <b>right angle at B</b>. (Check: AB<sup>2</sup> + BC<sup>2</sup> = 52 + 13 = 65 = AC<sup>2</sup>.)", "(d) Area = ½ × AB × BC = ½ × √52 × √13 = ½ × √676 = <b>13 square units</b>"], "marks": 12, "tip": null, "fig": null, "id": "coord-7", "topic": "coord"}, {"type": "thy", "q": "P(1, 3) and Q(5, −1) are two points.<br>(a) Find the equation of the perpendicular bisector of PQ.<br>(b) Find where it crosses the y-axis.<br>(c) Show that R(7, 5) lies on this line, and verify that RP = RQ.", "sol": ["(a) Midpoint = (3, 1); m<sub>PQ</sub> = <span class=\"fr\"><span>−1 − 3</span><span>5 − 1</span></span> = −1 ⇒ the perpendicular gradient is 1", "y − 1 = 1(x − 3) ⇒ <b>y = x − 2</b>", "(b) At x = 0, y = −2 ⇒ <b>(0, −2)</b>", "(c) 7 − 2 = 5 ✓ so R lies on the line.", "RP = √[(7 − 1)<sup>2</sup> + (5 − 3)<sup>2</sup>] = √40;  RQ = √[(7 − 5)<sup>2</sup> + (5 + 1)<sup>2</sup>] = √40 ⇒ <b>RP = RQ</b> ✓"], "marks": 10, "tip": null, "fig": null, "id": "coord-8", "topic": "coord"}, {"type": "obj", "q": "If sin θ = <span class=\"fr\"><span>3</span><span>5</span></span> and θ is acute, find tan θ.", "opts": ["<span class=\"fr\"><span>4</span><span>3</span></span>", "<span class=\"fr\"><span>3</span><span>4</span></span>", "<span class=\"fr\"><span>5</span><span>3</span></span>", "<span class=\"fr\"><span>4</span><span>5</span></span>"], "ans": 1, "sol": ["Opposite = 3, hypotenuse = 5, so adjacent = √(25 − 9) = 4", "tan θ = <span class=\"fr\"><span>3</span><span>4</span></span>"], "tip": null, "fig": null, "id": "trig-1", "topic": "trig"}, {"type": "obj", "q": "Evaluate sin 30° + cos 60°.", "opts": ["1", "<span class=\"fr\"><span>√3</span><span>2</span></span>", "√3", "<span class=\"fr\"><span>1</span><span>2</span></span>"], "ans": 0, "sol": ["sin 30° = <span class=\"fr\"><span>1</span><span>2</span></span> and cos 60° = <span class=\"fr\"><span>1</span><span>2</span></span>", "<span class=\"fr\"><span>1</span><span>2</span></span> + <span class=\"fr\"><span>1</span><span>2</span></span> = 1"], "tip": null, "fig": null, "id": "trig-2", "topic": "trig"}, {"type": "obj", "q": "From the top of a tower 30 m high, the angle of depression of a car on level ground is 30°. How far is the car from the foot of the tower?", "opts": ["15 m", "30√3 m", "60 m", "10√3 m"], "ans": 1, "sol": ["tan 30° = <span class=\"fr\"><span>30</span><span>d</span></span>", "d = <span class=\"fr\"><span>30</span><span>tan 30°</span></span> = 30√3 m ≈ 51.96 m"], "tip": null, "fig": null, "id": "trig-3", "topic": "trig"}, {"type": "obj", "q": "A ladder 8 m long leans against a wall making an angle of 60° with the horizontal ground. How far up the wall does it reach?", "opts": ["8√3 m", "6 m", "4√3 m", "4 m"], "ans": 2, "sol": ["Height = 8 sin 60° = 8 × (√3/2) = 4√3 m ≈ 6.93 m"], "tip": null, "fig": null, "id": "trig-4", "topic": "trig"}, {"type": "obj", "q": "If cos x = sin 40° and x is acute, find x.", "opts": ["40°", "50°", "60°", "140°"], "ans": 1, "sol": ["cos x = sin(90° − x)", "90° − x = 40° ⇒ x = 50°"], "tip": null, "fig": null, "id": "trig-5", "topic": "trig"}, {"type": "obj", "q": "Solve 2 sin θ − 1 = 0 for 0° ≤ θ ≤ 180°.", "opts": ["θ = 60° or 120°", "θ = 45° or 135°", "θ = 30° or 150°", "θ = 30° only"], "ans": 2, "sol": ["sin θ = <span class=\"fr\"><span>1</span><span>2</span></span>", "In the given range, θ = 30° or θ = 180° − 30° = 150°"], "tip": null, "fig": null, "id": "trig-6", "topic": "trig"}, {"type": "thy", "q": "A man 1.8 m tall stands 20 m away from the foot of a building on level ground. The angle of elevation of the top of the building from his eyes is 52°.<br>(a) Find the height of the building, correct to two decimal places.<br>(b) He walks 8 m towards the building. Find the new angle of elevation, correct to one decimal place.", "sol": ["(a) Let h be the height above eye level: tan 52° = h/20", "h = 20 × 1.27994 = 25.599 m", "Height of building = 25.599 + 1.8 = <b>27.40 m</b>", "(b) New horizontal distance = 20 − 8 = 12 m", "tan θ = <span class=\"fr\"><span>25.599</span><span>12</span></span> = 2.1332", "θ = <b>64.9°</b>"], "marks": 10, "tip": null, "fig": null, "id": "trig-7", "topic": "trig"}, {"type": "thy", "q": "(a) Without using tables or a calculator, evaluate sin 60° cos 30° − cos 60° sin 30°.<br>(b) Given that tan x = −5/12 and 90° < x < 180°, find sin x − cos x.<br>(c) Copy and complete the table for y = 2 sin x, then state the maximum value of y.<br><table class=\"mt\"><tr><th>x</th><td>0°</td><td>30°</td><td>60°</td><td>90°</td><td>120°</td><td>150°</td><td>180°</td></tr><tr><th>y</th><td>0</td><td></td><td>1.73</td><td></td><td></td><td>1</td><td></td></tr></table>", "sol": ["(a) = (<span class=\"fr\"><span>√3</span><span>2</span></span>)(<span class=\"fr\"><span>√3</span><span>2</span></span>) − (<span class=\"fr\"><span>1</span><span>2</span></span>)(<span class=\"fr\"><span>1</span><span>2</span></span>) = <span class=\"fr\"><span>3</span><span>4</span></span> − <span class=\"fr\"><span>1</span><span>4</span></span> = <b><span class=\"fr\"><span>1</span><span>2</span></span></b>", "(b) In the second quadrant sine is positive and cosine is negative.", "With opposite 5 and adjacent 12, the hypotenuse is 13 ⇒ sin x = <span class=\"fr\"><span>5</span><span>13</span></span>, cos x = −<span class=\"fr\"><span>12</span><span>13</span></span>", "sin x − cos x = <span class=\"fr\"><span>5</span><span>13</span></span> + <span class=\"fr\"><span>12</span><span>13</span></span> = <b><span class=\"fr\"><span>17</span><span>13</span></span></b> (≈ 1.31)", "(c) 2 sin 30° = 1;  2 sin 90° = 2;  2 sin 120° = 1.73;  2 sin 180° = 0", "<table class=\"mt\"><tr><th>x</th><td>0°</td><td>30°</td><td>60°</td><td>90°</td><td>120°</td><td>150°</td><td>180°</td></tr><tr><th>y</th><td>0</td><td>1</td><td>1.73</td><td>2</td><td>1.73</td><td>1</td><td>0</td></tr></table>", "Maximum value of y = <b>2</b> (at x = 90°)"], "marks": 12, "tip": null, "fig": null, "id": "trig-8", "topic": "trig"}, {"type": "obj", "q": "The bearing of A from B is 065°. What is the bearing of B from A?", "opts": ["025°", "245°", "115°", "295°"], "ans": 1, "sol": ["Back bearing = 065° + 180° = 245°"], "tip": null, "fig": null, "id": "bear-1", "topic": "bear"}, {"type": "obj", "q": "A ship sails 8 km due north, then 6 km due east. How far is it from its starting point?", "opts": ["14 km", "2 km", "√28 km", "10 km"], "ans": 3, "sol": ["The path forms a right angle.", "d = √(8<sup>2</sup> + 6<sup>2</sup>) = √100 = 10 km"], "tip": null, "fig": null, "id": "bear-2", "topic": "bear"}, {"type": "obj", "q": "Express the bearing S 40° W as a three-figure bearing.", "opts": ["320°", "140°", "040°", "220°"], "ans": 3, "sol": ["Start from north and turn clockwise: south is 180°, then 40° further towards west gives 220°."], "tip": null, "fig": null, "id": "bear-3", "topic": "bear"}, {"type": "obj", "q": "In triangle ABC, a = 10 cm, ∠A = 30° and ∠B = 45°. Find b.", "opts": ["20 cm", "5√2 cm", "10√3 cm", "10√2 cm"], "ans": 3, "sol": ["<span class=\"fr\"><span>a</span><span>sin A</span></span> = <span class=\"fr\"><span>b</span><span>sin B</span></span> ⇒ b = <span class=\"fr\"><span>10 sin 45°</span><span>sin 30°</span></span>", "= <span class=\"fr\"><span>10 × 0.7071</span><span>0.5</span></span> = 10√2 ≈ 14.14 cm"], "tip": null, "fig": null, "id": "bear-4", "topic": "bear"}, {"type": "obj", "q": "In triangle ABC, b = 5 cm, c = 7 cm and ∠A = 60°. Find a.", "opts": ["√109 cm", "39 cm", "√74 cm", "√39 cm"], "ans": 3, "sol": ["a<sup>2</sup> = 25 + 49 − 2(5)(7)cos 60°", "= 74 − 70(0.5) = 39 ⇒ a = √39 ≈ 6.24 cm"], "tip": null, "fig": null, "id": "bear-5", "topic": "bear"}, {"type": "obj", "q": "Find the area of a triangle with sides 6 cm and 8 cm and an included angle of 150°.", "opts": ["20.78 cm²", "12 cm²", "48 cm²", "24 cm²"], "ans": 1, "sol": ["Area = ½ab sin C = ½ × 6 × 8 × sin 150°", "sin 150° = 0.5 ⇒ Area = 24 × 0.5 = 12 cm²"], "tip": null, "fig": null, "id": "bear-6", "topic": "bear"}, {"type": "thy", "q": "A boat leaves port P and sails 12 km on a bearing of 060° to Q. It then sails 9 km on a bearing of 150° to R.<br>(a) Show that ∠PQR = 90°.<br>(b) Find the distance PR.<br>(c) Find the bearing of R from P, correct to the nearest degree.", "sol": ["(a) The bearing of P from Q is 060° + 180° = 240°. The bearing of R from Q is 150°.", "∠PQR = 240° − 150° = <b>90°</b>", "(b) By Pythagoras, PR = √(12<sup>2</sup> + 9<sup>2</sup>) = √225 = <b>15 km</b>", "(c) In right-angled triangle PQR, tan ∠QPR = <span class=\"fr\"><span>9</span><span>12</span></span> = 0.75 ⇒ ∠QPR = 36.87°", "Bearing of R from P = 060° + 36.87° ≈ <b>097°</b>"], "marks": 12, "tip": null, "fig": null, "id": "bear-7", "topic": "bear"}, {"type": "thy", "q": "Town Y is 50 km from town X on a bearing of 040°. Town Z is 70 km from X on a bearing of 110°.<br>(a) Find ∠YXZ.<br>(b) Find the distance YZ, correct to two decimal places.<br>(c) Find the area of triangle XYZ, correct to one decimal place.", "sol": ["(a) ∠YXZ = 110° − 040° = <b>70°</b>", "(b) By the cosine rule: YZ<sup>2</sup> = 50<sup>2</sup> + 70<sup>2</sup> − 2(50)(70)cos 70°", "= 2500 + 4900 − 7000(0.34202) = 7400 − 2394.14 = 5005.86", "YZ = <b>70.75 km</b>", "(c) Area = ½(50)(70) sin 70° = 1750 × 0.93969 = <b>1644.5 km²</b>"], "marks": 12, "tip": null, "fig": null, "id": "bear-8", "topic": "bear"}, {"type": "obj", "q": "Differentiate 3x<sup>4</sup> − 2x<sup>2</sup> + 5 with respect to x.", "opts": ["12x<sup>3</sup> − 4x + 5", "3x<sup>3</sup> − 4x", "12x<sup>3</sup> − 2x", "12x<sup>3</sup> − 4x"], "ans": 3, "sol": ["d/dx(3x<sup>4</sup>) = 12x<sup>3</sup>;  d/dx(−2x<sup>2</sup>) = −4x;  d/dx(5) = 0"], "tip": null, "fig": null, "id": "calc-1", "topic": "calc"}, {"type": "obj", "q": "Find the gradient of the curve y = x<sup>2</sup> − 4x + 1 at the point where x = 3.", "opts": ["6", "−2", "2", "−1"], "ans": 2, "sol": ["<span class=\"fr\"><span>dy</span><span>dx</span></span> = 2x − 4", "At x = 3: 2(3) − 4 = 2"], "tip": null, "fig": null, "id": "calc-2", "topic": "calc"}, {"type": "obj", "q": "Evaluate ∫(6x<sup>2</sup> + 2x) dx.", "opts": ["6x<sup>3</sup> + x<sup>2</sup> + c", "12x + 2 + c", "2x<sup>3</sup> + x<sup>2</sup> + c", "2x<sup>3</sup> + 2x<sup>2</sup> + c"], "ans": 2, "sol": ["∫6x<sup>2</sup> dx = <span class=\"fr\"><span>6x<sup>3</sup></span><span>3</span></span> = 2x<sup>3</sup>;  ∫2x dx = x<sup>2</sup>", "Answer: 2x<sup>3</sup> + x<sup>2</sup> + c"], "tip": null, "fig": null, "id": "calc-3", "topic": "calc"}, {"type": "obj", "q": "Evaluate the definite integral of (3x<sup>2</sup> − 1) from x = 0 to x = 2.", "opts": ["8", "10", "4", "6"], "ans": 3, "sol": ["∫(3x<sup>2</sup> − 1)dx = x<sup>3</sup> − x", "[x<sup>3</sup> − x] from 0 to 2 = (8 − 2) − 0 = 6"], "tip": null, "fig": null, "id": "calc-4", "topic": "calc"}, {"type": "obj", "q": "Find the coordinates of the turning point of y = x<sup>2</sup> − 6x + 5.", "opts": ["(3, 4)", "(6, 5)", "(−3, 32)", "(3, −4)"], "ans": 3, "sol": ["<span class=\"fr\"><span>dy</span><span>dx</span></span> = 2x − 6 = 0 ⇒ x = 3", "y = 9 − 18 + 5 = −4 ⇒ (3, −4)"], "tip": null, "fig": null, "id": "calc-5", "topic": "calc"}, {"type": "obj", "q": "The distance s metres moved by a body in t seconds is s = t<sup>3</sup> − 3t<sup>2</sup> + 4. Find its velocity when t = 2 s.", "opts": ["0 m/s", "4 m/s", "−2 m/s", "6 m/s"], "ans": 0, "sol": ["v = <span class=\"fr\"><span>ds</span><span>dt</span></span> = 3t<sup>2</sup> − 6t", "At t = 2: 12 − 12 = 0 m/s"], "tip": null, "fig": null, "id": "calc-6", "topic": "calc"}, {"type": "thy", "q": "A curve is given by y = x<sup>3</sup> − 3x<sup>2</sup> − 9x + 5.<br>(a) Find dy/dx.<br>(b) Find the coordinates of the turning points.<br>(c) Determine the nature of each turning point.", "sol": ["(a) <b>dy/dx = 3x<sup>2</sup> − 6x − 9</b>", "(b) 3x<sup>2</sup> − 6x − 9 = 0 ⇒ 3(x<sup>2</sup> − 2x − 3) = 0 ⇒ (x − 3)(x + 1) = 0 ⇒ x = 3 or x = −1", "y(3) = 27 − 27 − 27 + 5 = −22;  y(−1) = −1 − 3 + 9 + 5 = 10", "Turning points: <b>(3, −22) and (−1, 10)</b>", "(c) d²y/dx² = 6x − 6.  At x = 3: 12 > 0 ⇒ <b>minimum</b>.  At x = −1: −12 < 0 ⇒ <b>maximum</b>"], "marks": 12, "tip": null, "fig": null, "id": "calc-7", "topic": "calc"}, {"type": "thy", "q": "(a) Find the equation of the tangent to the curve y = 2x<sup>2</sup> − 3x + 1 at the point where x = 2.<br>(b) Find the area bounded by the curve y = 4 − x<sup>2</sup> and the x-axis.", "sol": ["(a) When x = 2: y = 8 − 6 + 1 = 3, so the point is (2, 3)", "dy/dx = 4x − 3 ⇒ gradient at x = 2 is 5", "y − 3 = 5(x − 2) ⇒ <b>y = 5x − 7</b>", "(b) The curve cuts the x-axis where 4 − x<sup>2</sup> = 0 ⇒ x = −2 and x = 2", "Area = ∫(4 − x<sup>2</sup>)dx from −2 to 2 = [4x − <span class=\"fr\"><span>x<sup>3</sup></span><span>3</span></span>]", "= (8 − <span class=\"fr\"><span>8</span><span>3</span></span>) − (−8 + <span class=\"fr\"><span>8</span><span>3</span></span>) = 16 − <span class=\"fr\"><span>16</span><span>3</span></span> = <b><span class=\"fr\"><span>32</span><span>3</span></span></b> square units (≈ 10.67)"], "marks": 10, "tip": null, "fig": null, "id": "calc-8", "topic": "calc"}, {"type": "obj", "q": "Find the mean of 4, 7, 9, 10 and 15.", "opts": ["9", "8", "10", "45"], "ans": 0, "sol": ["Mean = <span class=\"fr\"><span>4 + 7 + 9 + 10 + 15</span><span>5</span></span> = <span class=\"fr\"><span>45</span><span>5</span></span> = 9"], "tip": null, "fig": null, "id": "stat-1", "topic": "stat"}, {"type": "obj", "q": "Find the median of 12, 5, 8, 20, 15, 9.", "opts": ["10", "12", "11.5", "10.5"], "ans": 3, "sol": ["Arrange in order: 5, 8, 9, 12, 15, 20", "Median = <span class=\"fr\"><span>9 + 12</span><span>2</span></span> = 10.5"], "tip": null, "fig": null, "id": "stat-2", "topic": "stat"}, {"type": "obj", "q": "The scores 1, 2, 3, 4, 5 have frequencies 3, 7, 5, 7, 2 respectively. What is the mode?", "opts": ["7", "2 and 4", "4", "3"], "ans": 1, "sol": ["The highest frequency is 7, and it occurs for both 2 and 4.", "The distribution is bimodal: the modes are 2 and 4."], "tip": null, "fig": null, "id": "stat-3", "topic": "stat"}, {"type": "obj", "q": "In a pie chart, 45 out of 120 students chose Science. Find the angle of that sector.", "opts": ["45°", "135°", "120°", "90°"], "ans": 1, "sol": ["Angle = <span class=\"fr\"><span>45</span><span>120</span></span> × 360° = 135°"], "tip": null, "fig": null, "id": "stat-4", "topic": "stat"}, {"type": "obj", "q": "Find the standard deviation of 2, 4, 6, 8, 10, correct to two decimal places.", "opts": ["2.00", "2.83", "3.16", "8.00"], "ans": 1, "sol": ["Mean = 6", "Σ(x − x̄)<sup>2</sup> = 16 + 4 + 0 + 4 + 16 = 40", "Variance = <span class=\"fr\"><span>40</span><span>5</span></span> = 8 ⇒ SD = √8 = 2.83"], "tip": null, "fig": null, "id": "stat-5", "topic": "stat"}, {"type": "obj", "q": "The mean of x, x + 2, x + 4 and x + 6 is 10. Find x.", "opts": ["7", "10", "8", "6"], "ans": 0, "sol": ["Sum = 4x + 12 = 4 × 10 = 40", "4x = 28 ⇒ x = 7"], "tip": null, "fig": null, "id": "stat-6", "topic": "stat"}, {"type": "obj", "q": "The mean of five numbers is 12. When one number is removed, the mean of the rest is 10. Find the number removed.", "opts": ["14", "2", "22", "20"], "ans": 3, "sol": ["Total of the five = 60", "Total of the remaining four = 40", "Removed = 60 − 40 = 20"], "tip": null, "fig": null, "id": "stat-7", "topic": "stat"}, {"type": "thy", "q": "The table shows the marks of 40 students in a test.<br><table class=\"mt\"><tr><th>Marks</th><td>1–10</td><td>11–20</td><td>21–30</td><td>31–40</td><td>41–50</td><td>51–60</td></tr><tr><th>Frequency</th><td>3</td><td>5</td><td>8</td><td>12</td><td>7</td><td>5</td></tr></table>(a) Calculate the mean mark.<br>(b) State the modal class.<br>(c) Calculate the median mark.<br>(d) What is the probability that a student chosen at random scored more than 40 marks?", "sol": ["(a) Midpoints: 5.5, 15.5, 25.5, 35.5, 45.5, 55.5", "Σfx = 16.5 + 77.5 + 204 + 426 + 318.5 + 277.5 = 1320", "Mean = <span class=\"fr\"><span>1320</span><span>40</span></span> = <b>33 marks</b>", "(b) The highest frequency is 12 ⇒ modal class is <b>31–40</b>", "(c) Cumulative frequencies: 3, 8, 16, 28, 35, 40. The 20th value lies in the class 31–40.", "Median = 30.5 + (<span class=\"fr\"><span>20 − 16</span><span>12</span></span>) × 10 = 30.5 + 3.33 = <b>33.83 marks</b>", "(d) Students scoring above 40 = 7 + 5 = 12 ⇒ P = <span class=\"fr\"><span>12</span><span>40</span></span> = <b><span class=\"fr\"><span>3</span><span>10</span></span></b> (0.3)"], "marks": 12, "tip": null, "fig": null, "id": "stat-8", "topic": "stat"}, {"type": "thy", "q": "The table shows the number of children in 35 families.<br><table class=\"mt\"><tr><th>Children</th><td>0</td><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td></tr><tr><th>Families</th><td>4</td><td>6</td><td>10</td><td>8</td><td>5</td><td>2</td></tr></table>(a) Find the mean number of children, correct to two decimal places.<br>(b) Find the median and the mode.<br>(c) Find the standard deviation, correct to two decimal places.<br>(d) Find the angle that would represent families with 2 children on a pie chart.", "sol": ["(a) Σfx = 0 + 6 + 20 + 24 + 20 + 10 = 80", "Mean = <span class=\"fr\"><span>80</span><span>35</span></span> = <b>2.29 children</b>", "(b) The 18th value: cumulative frequencies are 4, 10, 20, … so the median is <b>2</b>. The highest frequency (10) also gives mode = <b>2</b>", "(c) Σfx² = 0 + 6 + 40 + 72 + 80 + 50 = 248", "Variance = <span class=\"fr\"><span>248</span><span>35</span></span> − (2.2857)<sup>2</sup> = 7.0857 − 5.2245 = 1.8612", "SD = √1.8612 = <b>1.36</b>", "(d) Angle = <span class=\"fr\"><span>10</span><span>35</span></span> × 360° = <b>102.86°</b>"], "marks": 12, "tip": null, "fig": null, "id": "stat-9", "topic": "stat"}, {"type": "obj", "q": "A fair die is thrown once. Find the probability of obtaining a number greater than 4.", "opts": ["<span class=\"fr\"><span>1</span><span>6</span></span>", "<span class=\"fr\"><span>1</span><span>2</span></span>", "<span class=\"fr\"><span>1</span><span>3</span></span>", "<span class=\"fr\"><span>2</span><span>3</span></span>"], "ans": 2, "sol": ["Favourable outcomes: 5 and 6", "P = <span class=\"fr\"><span>2</span><span>6</span></span> = <span class=\"fr\"><span>1</span><span>3</span></span>"], "tip": null, "fig": null, "id": "prob-1", "topic": "prob"}, {"type": "obj", "q": "A bag contains 5 red, 3 blue and 2 green balls. One ball is picked at random. Find the probability that it is not red.", "opts": ["<span class=\"fr\"><span>2</span><span>5</span></span>", "<span class=\"fr\"><span>1</span><span>2</span></span>", "<span class=\"fr\"><span>3</span><span>10</span></span>", "<span class=\"fr\"><span>1</span><span>5</span></span>"], "ans": 1, "sol": ["P(red) = <span class=\"fr\"><span>5</span><span>10</span></span> = <span class=\"fr\"><span>1</span><span>2</span></span>", "P(not red) = 1 − <span class=\"fr\"><span>1</span><span>2</span></span> = <span class=\"fr\"><span>1</span><span>2</span></span>"], "tip": null, "fig": null, "id": "prob-2", "topic": "prob"}, {"type": "obj", "q": "Two fair coins are tossed together. Find the probability of getting at least one head.", "opts": ["<span class=\"fr\"><span>3</span><span>4</span></span>", "<span class=\"fr\"><span>1</span><span>4</span></span>", "<span class=\"fr\"><span>2</span><span>3</span></span>", "<span class=\"fr\"><span>1</span><span>2</span></span>"], "ans": 0, "sol": ["Sample space: HH, HT, TH, TT", "At least one head: 3 outcomes ⇒ P = <span class=\"fr\"><span>3</span><span>4</span></span>"], "tip": null, "fig": null, "id": "prob-3", "topic": "prob"}, {"type": "obj", "q": "Two fair dice are thrown together. Find the probability that the sum of the scores is 7.", "opts": ["<span class=\"fr\"><span>7</span><span>36</span></span>", "<span class=\"fr\"><span>1</span><span>12</span></span>", "<span class=\"fr\"><span>5</span><span>36</span></span>", "<span class=\"fr\"><span>1</span><span>6</span></span>"], "ans": 3, "sol": ["Favourable: (1,6), (2,5), (3,4), (4,3), (5,2), (6,1) — 6 outcomes out of 36", "P = <span class=\"fr\"><span>6</span><span>36</span></span> = <span class=\"fr\"><span>1</span><span>6</span></span>"], "tip": null, "fig": null, "id": "prob-4", "topic": "prob"}, {"type": "obj", "q": "If P(A) = 0.4 and P(B) = 0.5 and A and B are independent, find P(A and B).", "opts": ["0.2", "0.9", "0.1", "0.45"], "ans": 0, "sol": ["P(A ∩ B) = 0.4 × 0.5 = 0.2"], "tip": null, "fig": null, "id": "prob-5", "topic": "prob"}, {"type": "obj", "q": "A bag has 4 red and 6 white balls. Two balls are drawn at random without replacement. Find the probability that both are red.", "opts": ["<span class=\"fr\"><span>4</span><span>25</span></span>", "<span class=\"fr\"><span>1</span><span>5</span></span>", "<span class=\"fr\"><span>2</span><span>5</span></span>", "<span class=\"fr\"><span>2</span><span>15</span></span>"], "ans": 3, "sol": ["P(first red) = <span class=\"fr\"><span>4</span><span>10</span></span>;  P(second red) = <span class=\"fr\"><span>3</span><span>9</span></span>", "P(both) = <span class=\"fr\"><span>4</span><span>10</span></span> × <span class=\"fr\"><span>3</span><span>9</span></span> = <span class=\"fr\"><span>12</span><span>90</span></span> = <span class=\"fr\"><span>2</span><span>15</span></span>"], "tip": null, "fig": null, "id": "prob-6", "topic": "prob"}, {"type": "thy", "q": "A box contains 5 red, 4 blue and 3 white balls. Two balls are drawn one after the other without replacement.<br>(a) Find the probability that both are blue.<br>(b) Find the probability that both are of the same colour.<br>(c) Find the probability that at least one is white.", "sol": ["(a) P = <span class=\"fr\"><span>4</span><span>12</span></span> × <span class=\"fr\"><span>3</span><span>11</span></span> = <span class=\"fr\"><span>12</span><span>132</span></span> = <b><span class=\"fr\"><span>1</span><span>11</span></span></b>", "(b) P(both red) = <span class=\"fr\"><span>5</span><span>12</span></span> × <span class=\"fr\"><span>4</span><span>11</span></span> = <span class=\"fr\"><span>20</span><span>132</span></span>; P(both blue) = <span class=\"fr\"><span>12</span><span>132</span></span>; P(both white) = <span class=\"fr\"><span>3</span><span>12</span></span> × <span class=\"fr\"><span>2</span><span>11</span></span> = <span class=\"fr\"><span>6</span><span>132</span></span>", "Total = <span class=\"fr\"><span>20 + 12 + 6</span><span>132</span></span> = <span class=\"fr\"><span>38</span><span>132</span></span> = <b><span class=\"fr\"><span>19</span><span>66</span></span></b>", "(c) P(no white) = <span class=\"fr\"><span>9</span><span>12</span></span> × <span class=\"fr\"><span>8</span><span>11</span></span> = <span class=\"fr\"><span>72</span><span>132</span></span>", "P(at least one white) = 1 − <span class=\"fr\"><span>72</span><span>132</span></span> = <span class=\"fr\"><span>60</span><span>132</span></span> = <b><span class=\"fr\"><span>5</span><span>11</span></span></b>"], "marks": 12, "tip": null, "fig": null, "id": "prob-7", "topic": "prob"}, {"type": "thy", "q": "The probability that Kwame passes an examination is <span class=\"fr\"><span>2</span><span>3</span></span> and the probability that Esi passes it is <span class=\"fr\"><span>3</span><span>5</span></span>. The two events are independent.<br>(a) Find the probability that both pass.<br>(b) Find the probability that exactly one of them passes.<br>(c) Find the probability that at least one passes.<br>(d) Two fair dice are thrown. Find the probability that the product of the scores is even.", "sol": ["(a) P = <span class=\"fr\"><span>2</span><span>3</span></span> × <span class=\"fr\"><span>3</span><span>5</span></span> = <span class=\"fr\"><span>6</span><span>15</span></span> = <b><span class=\"fr\"><span>2</span><span>5</span></span></b>", "(b) Kwame only: <span class=\"fr\"><span>2</span><span>3</span></span> × <span class=\"fr\"><span>2</span><span>5</span></span> = <span class=\"fr\"><span>4</span><span>15</span></span>;  Esi only: <span class=\"fr\"><span>1</span><span>3</span></span> × <span class=\"fr\"><span>3</span><span>5</span></span> = <span class=\"fr\"><span>3</span><span>15</span></span>", "Total = <span class=\"fr\"><span>7</span><span>15</span></span> ⇒ <b><span class=\"fr\"><span>7</span><span>15</span></span></b>", "(c) P(neither) = <span class=\"fr\"><span>1</span><span>3</span></span> × <span class=\"fr\"><span>2</span><span>5</span></span> = <span class=\"fr\"><span>2</span><span>15</span></span> ⇒ P(at least one) = 1 − <span class=\"fr\"><span>2</span><span>15</span></span> = <b><span class=\"fr\"><span>13</span><span>15</span></span></b>", "(d) The product is odd only when both scores are odd: <span class=\"fr\"><span>3</span><span>6</span></span> × <span class=\"fr\"><span>3</span><span>6</span></span> = <span class=\"fr\"><span>1</span><span>4</span></span>", "P(even product) = 1 − <span class=\"fr\"><span>1</span><span>4</span></span> = <b><span class=\"fr\"><span>3</span><span>4</span></span></b>"], "marks": 12, "tip": null, "fig": null, "id": "prob-8", "topic": "prob"}, {"type": "obj", "q": "If a = <span class=\"mx\"><span class=\"mr\"><span>3</span></span><span class=\"mr\"><span>−2</span></span></span> and b = <span class=\"mx\"><span class=\"mr\"><span>−1</span></span><span class=\"mr\"><span>4</span></span></span>, find 2a + b.", "opts": ["<span class=\"mx\"><span class=\"mr\"><span>2</span></span><span class=\"mr\"><span>2</span></span></span>", "<span class=\"mx\"><span class=\"mr\"><span>5</span></span><span class=\"mr\"><span>8</span></span></span>", "<span class=\"mx\"><span class=\"mr\"><span>4</span></span><span class=\"mr\"><span>2</span></span></span>", "<span class=\"mx\"><span class=\"mr\"><span>5</span></span><span class=\"mr\"><span>0</span></span></span>"], "ans": 3, "sol": ["2a = <span class=\"mx\"><span class=\"mr\"><span>6</span></span><span class=\"mr\"><span>−4</span></span></span>", "2a + b = <span class=\"mx\"><span class=\"mr\"><span>6 − 1</span></span><span class=\"mr\"><span>−4 + 4</span></span></span> = <span class=\"mx\"><span class=\"mr\"><span>5</span></span><span class=\"mr\"><span>0</span></span></span>"], "tip": null, "fig": null, "id": "vec-1", "topic": "vec"}, {"type": "obj", "q": "Find the magnitude of the vector <span class=\"mx\"><span class=\"mr\"><span>5</span></span><span class=\"mr\"><span>−12</span></span></span>.", "opts": ["7", "√17", "13", "17"], "ans": 2, "sol": ["|v| = √(5<sup>2</sup> + (−12)<sup>2</sup>) = √169 = 13"], "tip": null, "fig": null, "id": "vec-2", "topic": "vec"}, {"type": "obj", "q": "Find the image of the point (3, −5) after a reflection in the x-axis.", "opts": ["(3, 5)", "(−5, 3)", "(−3, 5)", "(−3, −5)"], "ans": 0, "sol": ["Reflection in the x-axis: (x, y) → (x, −y)", "(3, −5) → (3, 5)"], "tip": null, "fig": null, "id": "vec-3", "topic": "vec"}, {"type": "obj", "q": "Find the image of (2, 3) after a rotation of 90° anticlockwise about the origin.", "opts": ["(−3, 2)", "(3, 2)", "(3, −2)", "(−2, −3)"], "ans": 0, "sol": ["90° anticlockwise: (x, y) → (−y, x)", "(2, 3) → (−3, 2)"], "tip": null, "fig": null, "id": "vec-4", "topic": "vec"}, {"type": "obj", "q": "The translation vector <span class=\"mx\"><span class=\"mr\"><span>4</span></span><span class=\"mr\"><span>−1</span></span></span> maps P(−2, 5) onto P′. Find P′.", "opts": ["(6, 4)", "(−6, 6)", "(2, 4)", "(2, 6)"], "ans": 2, "sol": ["Add the components: (−2 + 4, 5 − 1)", "P′ = (2, 4)"], "tip": null, "fig": null, "id": "vec-5", "topic": "vec"}, {"type": "obj", "q": "Find the image of (−1, 2) under an enlargement with scale factor 3 and centre the origin.", "opts": ["(−3, −6)", "(−3, 6)", "(3, 6)", "(2, 5)"], "ans": 1, "sol": ["Multiply both coordinates by 3: (−1 × 3, 2 × 3) = (−3, 6)"], "tip": null, "fig": null, "id": "vec-6", "topic": "vec"}, {"type": "thy", "q": "O is the origin, OA = <span class=\"mx\"><span class=\"mr\"><span>2</span></span><span class=\"mr\"><span>3</span></span></span> and OB = <span class=\"mx\"><span class=\"mr\"><span>6</span></span><span class=\"mr\"><span>−1</span></span></span>.<br>(a) Find AB.<br>(b) Find |AB|, correct to two decimal places.<br>(c) M is the midpoint of AB. Find OM.<br>(d) Find OC, where OC = 2OA − ½OB.", "sol": ["(a) AB = OB − OA = <span class=\"mx\"><span class=\"mr\"><span>6 − 2</span></span><span class=\"mr\"><span>−1 − 3</span></span></span> = <b><span class=\"mx\"><span class=\"mr\"><span>4</span></span><span class=\"mr\"><span>−4</span></span></span></b>", "(b) |AB| = √(4<sup>2</sup> + (−4)<sup>2</sup>) = √32 = 4√2 = <b>5.66</b>", "(c) OM = OA + ½AB = <span class=\"mx\"><span class=\"mr\"><span>2</span></span><span class=\"mr\"><span>3</span></span></span> + <span class=\"mx\"><span class=\"mr\"><span>2</span></span><span class=\"mr\"><span>−2</span></span></span> = <b><span class=\"mx\"><span class=\"mr\"><span>4</span></span><span class=\"mr\"><span>1</span></span></span></b>", "(d) 2OA = <span class=\"mx\"><span class=\"mr\"><span>4</span></span><span class=\"mr\"><span>6</span></span></span>;  ½OB = <span class=\"mx\"><span class=\"mr\"><span>3</span></span><span class=\"mr\"><span>−0.5</span></span></span>", "OC = <span class=\"mx\"><span class=\"mr\"><span>4 − 3</span></span><span class=\"mr\"><span>6 + 0.5</span></span></span> = <b><span class=\"mx\"><span class=\"mr\"><span>1</span></span><span class=\"mr\"><span>6.5</span></span></span></b>"], "marks": 10, "tip": null, "fig": null, "id": "vec-7", "topic": "vec"}, {"type": "thy", "q": "Triangle PQR has vertices P(1, 1), Q(4, 1) and R(1, 3).<br>(a) Find the images of the vertices after a reflection in the line y = x.<br>(b) Find the images after a rotation of 180° about the origin.<br>(c) Find the images after an enlargement with scale factor −2, centre the origin, and state the ratio of the area of the image to the area of triangle PQR.", "sol": ["(a) Reflection in y = x swaps the coordinates: <b>P′(1, 1), Q′(1, 4), R′(3, 1)</b>", "(b) 180° about O: (x, y) → (−x, −y) ⇒ <b>P″(−1, −1), Q″(−4, −1), R″(−1, −3)</b>", "(c) Multiply by −2: <b>(−2, −2), (−8, −2), (−2, −6)</b>", "Area of PQR = ½ × 3 × 2 = 3 square units; areas scale by k² = (−2)² = 4", "Image area = 12 square units ⇒ ratio <b>4 : 1</b>"], "marks": 12, "tip": null, "fig": null, "id": "vec-8", "topic": "vec"}, {"type": "obj", "q": "Find the HCF of 24, 36 and 60.", "opts": ["6", "4", "12", "180"], "ans": 2, "sol": ["24 = 2<sup>3</sup> × 3;  36 = 2<sup>2</sup> × 3<sup>2</sup>;  60 = 2<sup>2</sup> × 3 × 5", "Common primes: 2 and 3. Take the lowest power of each: 2<sup>2</sup> × 3.", "HCF = 4 × 3 = 12"], "tip": null, "fig": null, "id": "intfac-1", "topic": "intfac"}, {"type": "obj", "q": "Find the LCM of 24, 36 and 60.", "opts": ["120", "360", "720", "180"], "ans": 1, "sol": ["24 = 2<sup>3</sup> × 3;  36 = 2<sup>2</sup> × 3<sup>2</sup>;  60 = 2<sup>2</sup> × 3 × 5", "Take the highest power of every prime: 2<sup>3</sup> × 3<sup>2</sup> × 5.", "LCM = 8 × 9 × 5 = 360"], "tip": null, "fig": null, "id": "intfac-2", "topic": "intfac"}, {"type": "obj", "q": "Evaluate −8 − (−5) + (−3).", "opts": ["0", "−16", "−10", "−6"], "ans": 3, "sol": ["−8 − (−5) = −8 + 5 = −3", "−3 + (−3) = −6"], "tip": null, "fig": null, "id": "intfac-3", "topic": "intfac"}, {"type": "obj", "q": "Which of the following is a prime number?", "opts": ["29", "1", "27", "21"], "ans": 0, "sol": ["A prime has exactly two factors, 1 and itself.", "27 = 3 × 9, 21 = 3 × 7, and 1 has only one factor.", "29 has no factor besides 1 and 29."], "tip": null, "fig": null, "id": "intfac-4", "topic": "intfac"}, {"type": "obj", "q": "Three bells ring at intervals of 6, 9 and 15 minutes. If they ring together at 8:00 a.m., when will they next ring together?", "opts": ["8:45 a.m.", "10:00 a.m.", "9:30 a.m.", "9:00 a.m."], "ans": 2, "sol": ["They ring together again after the LCM of the intervals.", "6 = 2 × 3;  9 = 3<sup>2</sup>;  15 = 3 × 5 ⇒ LCM = 2 × 3<sup>2</sup> × 5 = 90 minutes.", "90 minutes after 8:00 a.m. is 9:30 a.m."], "tip": null, "fig": null, "id": "intfac-5", "topic": "intfac"}, {"type": "thy", "q": "(a) Express 180 and 504 as products of their prime factors, and hence find their HCF and LCM.<br>(b) Evaluate (−12) ÷ (−4) + (−3) × 2.<br>(c) Find the smallest number which when divided by 12, 15 and 18 leaves a remainder of 5 in each case.", "sol": ["(a) 180 = 2<sup>2</sup> × 3<sup>2</sup> × 5;  504 = 2<sup>3</sup> × 3<sup>2</sup> × 7", "HCF = common primes to the lowest power = 2<sup>2</sup> × 3<sup>2</sup> = <b>36</b>", "LCM = all primes to the highest power = 2<sup>3</sup> × 3<sup>2</sup> × 5 × 7 = <b>2520</b>", "(b) (−12) ÷ (−4) = 3;  (−3) × 2 = −6;  3 + (−6) = <b>−3</b>", "(c) The number is LCM + 5. LCM of 12, 15 and 18 = 180.", "Smallest number = 180 + 5 = <b>185</b>"], "marks": 10, "tip": null, "fig": null, "id": "intfac-6", "topic": "intfac"}, {"type": "obj", "q": "Two similar triangles have corresponding sides 6 cm and 9 cm. The area of the smaller is 24 cm². Find the area of the larger.", "opts": ["54 cm²", "16 cm²", "36 cm²", "81 cm²"], "ans": 0, "sol": ["Ratio of sides = 6 : 9 = 2 : 3.", "Ratio of areas = 2<sup>2</sup> : 3<sup>2</sup> = 4 : 9.", "Area = 24 × 9/4 = 54 cm²"], "tip": null, "fig": null, "id": "simil-1", "topic": "simil"}, {"type": "obj", "q": "Two cones are similar. Their heights are 4 cm and 8 cm. The volume of the small one is 20 cm³. Find the volume of the large one.", "opts": ["40 cm³", "160 cm³", "80 cm³", "320 cm³"], "ans": 1, "sol": ["Ratio of lengths = 1 : 2.", "Ratio of volumes = 1<sup>3</sup> : 2<sup>3</sup> = 1 : 8.", "Volume = 20 × 8 = 160 cm³"], "tip": null, "fig": null, "id": "simil-2", "topic": "simil"}, {"type": "obj", "q": "On a map of scale 1 : 50 000, two towns are 4 cm apart. Find the actual distance in kilometres.", "opts": ["0.2 km", "20 km", "2 km", "200 km"], "ans": 2, "sol": ["4 cm on the map = 4 × 50 000 = 200 000 cm on the ground.", "200 000 cm = 2000 m = 2 km"], "tip": null, "fig": null, "id": "simil-3", "topic": "simil"}, {"type": "obj", "q": "Which condition does NOT prove two triangles congruent?", "opts": ["RHS", "SSS", "SAS", "AAA"], "ans": 3, "sol": ["AAA only makes the triangles SIMILAR — the same shape but possibly different sizes.", "SSS, SAS, ASA and RHS all fix the size as well as the shape."], "tip": null, "fig": null, "id": "simil-4", "topic": "simil"}, {"type": "obj", "q": "A photograph 8 cm by 6 cm is enlarged so that the longer side becomes 20 cm. Find the new shorter side.", "opts": ["12 cm", "18 cm", "14 cm", "15 cm"], "ans": 3, "sol": ["Scale factor = 20 ÷ 8 = 2.5", "New shorter side = 6 × 2.5 = 15 cm"], "tip": null, "fig": null, "id": "simil-5", "topic": "simil"}, {"type": "thy", "q": "(a) In triangle ABC, PQ is parallel to BC, with P on AB and Q on AC. AP = 3 cm, PB = 5 cm and PQ = 4.5 cm. Find BC.<br>(b) The areas of two similar rectangles are 50 cm² and 162 cm². If the shorter side of the smaller is 5 cm, find the shorter side of the larger.<br>(c) A map has a scale of 1 : 25 000. Find (i) the actual length, in km, of a road 12 cm long on the map; (ii) the area on the map, in cm², of a farm of 1 km².", "sol": ["(a) Triangles APQ and ABC are similar. AB = 3 + 5 = 8 cm.", "<span class=\"fr\"><span>AP</span><span>AB</span></span> = <span class=\"fr\"><span>PQ</span><span>BC</span></span> ⇒ <span class=\"fr\"><span>3</span><span>8</span></span> = <span class=\"fr\"><span>4.5</span><span>BC</span></span> ⇒ BC = <span class=\"fr\"><span>4.5 × 8</span><span>3</span></span> = <b>12 cm</b>", "(b) Ratio of areas = 50 : 162 = 25 : 81, so the ratio of sides = 5 : 9.", "Shorter side of the larger = 5 × <span class=\"fr\"><span>9</span><span>5</span></span> = <b>9 cm</b>", "(c)(i) 12 cm × 25 000 = 300 000 cm = 3000 m = <b>3 km</b>", "(ii) 1 cm on the map = 0.25 km, so 1 cm² = 0.0625 km².", "Area on the map = <span class=\"fr\"><span>1</span><span>0.0625</span></span> = <b>16 cm²</b>"], "marks": 12, "tip": null, "fig": null, "id": "simil-6", "topic": "simil"}, {"type": "obj", "q": "Two towns on the equator differ in longitude by 30°. Find the distance between them. [R = 6400 km, π = 22/7]", "opts": ["6704.8 km", "2513.0 km", "3352.4 km", "1676.2 km"], "ans": 2, "sol": ["Distance = <span class=\"fr\"><span>30</span><span>360</span></span> × 2 × <span class=\"fr\"><span>22</span><span>7</span></span> × 6400", "2 × 22/7 × 6400 = 40 228.57 km (the circumference)", "Distance = 40 228.57 ÷ 12 = 3352.4 km"], "tip": null, "fig": null, "id": "earth-1", "topic": "earth"}, {"type": "obj", "q": "Find the distance along a meridian between P(20°N, 15°E) and Q(50°N, 15°E). [R = 6400 km, π = 22/7]", "opts": ["1676.2 km", "3352.4 km", "2234.9 km", "5587.3 km"], "ans": 1, "sol": ["Same longitude, so use the meridian formula with θ = 50 − 20 = 30°.", "Distance = <span class=\"fr\"><span>30</span><span>360</span></span> × 2 × <span class=\"fr\"><span>22</span><span>7</span></span> × 6400 = 3352.4 km"], "tip": null, "fig": null, "id": "earth-2", "topic": "earth"}, {"type": "obj", "q": "Find the radius of the parallel of latitude 60°N. [R = 6400 km]", "opts": ["1600 km", "3200 km", "5542 km", "6400 km"], "ans": 1, "sol": ["Radius of a parallel = R cos α = 6400 × cos 60°.", "cos 60° = 0.5, so r = 3200 km"], "tip": null, "fig": null, "id": "earth-3", "topic": "earth"}, {"type": "obj", "q": "The longitude difference between two places is 45°. What is the difference in their local times?", "opts": ["3 hours", "1 hour 30 minutes", "4 hours", "45 minutes"], "ans": 0, "sol": ["The earth turns 360° in 24 hours, so 15° takes 1 hour.", "45 ÷ 15 = 3 hours"], "tip": null, "fig": null, "id": "earth-4", "topic": "earth"}, {"type": "obj", "q": "Which of these points lies on the equator?", "opts": ["(25°N, 0°)", "(25°S, 25°E)", "(90°N, 0°)", "(0°, 25°W)"], "ans": 3, "sol": ["The equator is the parallel of latitude 0°, so the LATITUDE must be 0°.", "In (0°, 25°W) the latitude is 0°, so it is on the equator."], "tip": null, "fig": null, "id": "earth-5", "topic": "earth"}, {"type": "thy", "q": "[Take R = 6400 km and π = 22/7]<br>(a) Find the distance along a parallel of latitude between A(60°N, 20°E) and B(60°N, 65°E).<br>(b) Find the distance along the meridian between B(60°N, 65°E) and C(15°N, 65°E).<br>(c) If the local time at a place on longitude 15°E is 2:00 p.m., what is the local time at 45°W?", "sol": ["(a) Same latitude ⇒ use distance = (θ/360) × 2πR cos α, with θ = 65 − 20 = 45° and α = 60°.", "= <span class=\"fr\"><span>45</span><span>360</span></span> × 2 × <span class=\"fr\"><span>22</span><span>7</span></span> × 6400 × cos 60°", "= 0.125 × 40 228.57 × 0.5 = <b>2514.3 km</b>", "(b) Same longitude ⇒ meridian formula, θ = 60 − 15 = 45°.", "= <span class=\"fr\"><span>45</span><span>360</span></span> × 2 × <span class=\"fr\"><span>22</span><span>7</span></span> × 6400 = <b>5028.6 km</b>", "(c) Longitude difference = 15 + 45 = 60° ⇒ time difference = 60 ÷ 15 = 4 hours.", "45°W is WEST of 15°E, so it is behind: 2:00 p.m. − 4 h = <b>10:00 a.m.</b>"], "marks": 12, "tip": null, "fig": null, "id": "earth-6", "topic": "earth"}, {"type": "obj", "q": "The frequencies of six classes are 3, 5, 8, 12, 7 and 5. What is the cumulative frequency of the fourth class?", "opts": ["40", "12", "28", "16"], "ans": 2, "sol": ["Add the frequencies up to and including the fourth class.", "3 + 5 + 8 + 12 = 28"], "tip": null, "fig": null, "id": "cumfreq-1", "topic": "cumfreq"}, {"type": "obj", "q": "For 40 values, at what position is the median read on an ogive?", "opts": ["20th", "30th", "40th", "10th"], "ans": 0, "sol": ["The median is at N/2.", "40 ÷ 2 = 20th value."], "tip": null, "fig": null, "id": "cumfreq-2", "topic": "cumfreq"}, {"type": "obj", "q": "For a distribution of 40 values, at what position is the lower quartile Q₁?", "opts": ["30th", "20th", "4th", "10th"], "ans": 3, "sol": ["Q₁ is at N/4.", "40 ÷ 4 = 10th value."], "tip": null, "fig": null, "id": "cumfreq-3", "topic": "cumfreq"}, {"type": "obj", "q": "If Q₁ = 23 and Q₃ = 43, find the semi-interquartile range.", "opts": ["66", "20", "10", "33"], "ans": 2, "sol": ["Interquartile range = Q₃ − Q₁ = 43 − 23 = 20.", "Semi-interquartile range = 20 ÷ 2 = 10"], "tip": null, "fig": null, "id": "cumfreq-4", "topic": "cumfreq"}, {"type": "obj", "q": "On an ogive, cumulative frequency is plotted against ___", "opts": ["the frequency", "the class midpoint", "the lower class boundary", "the upper class boundary"], "ans": 3, "sol": ["Every value in the class is less than or equal to the upper boundary, so the running total belongs there."], "tip": null, "fig": null, "id": "cumfreq-5", "topic": "cumfreq"}, {"type": "thy", "q": "The table shows the marks of 40 candidates.<br><table class=\"mt\"><tr><th>Marks</th><td>1–10</td><td>11–20</td><td>21–30</td><td>31–40</td><td>41–50</td><td>51–60</td></tr><tr><th>Frequency</th><td>3</td><td>5</td><td>8</td><td>12</td><td>7</td><td>5</td></tr></table>(a) Prepare a cumulative frequency table.<br>(b) Draw the ogive.<br>(c) Use it to estimate the median, Q₁, Q₃ and the semi-interquartile range.<br>(d) If the pass mark is 35, estimate how many candidates passed.", "sol": ["(a) Upper boundaries 10.5, 20.5, 30.5, 40.5, 50.5, 60.5 with cumulative frequencies <b>3, 8, 16, 28, 35, 40</b>.", "(b) Plot cumulative frequency against the upper class boundary and join with a smooth curve.", "(c) <b>Median</b> at N/2 = 20th value: it lies in 31–40.", "Median = 30.5 + (<span class=\"fr\"><span>20 − 16</span><span>12</span></span>) × 10 = 30.5 + 3.33 = <b>33.8</b>", "<b>Q₁</b> at 10th value, in 21–30: 20.5 + (<span class=\"fr\"><span>10 − 8</span><span>8</span></span>) × 10 = 20.5 + 2.5 = <b>23.0</b>", "<b>Q₃</b> at 30th value, in 41–50: 40.5 + (<span class=\"fr\"><span>30 − 28</span><span>7</span></span>) × 10 = 40.5 + 2.86 = <b>43.4</b>", "Semi-interquartile range = (43.4 − 23.0) ÷ 2 = <b>10.2</b>", "(d) Read the cumulative frequency at 35: about 20.5, so about 40 − 20.5 = <b>20 candidates</b> passed."], "marks": 15, "tip": "Always use CLASS BOUNDARIES (20.5, 30.5 …), not the class limits, when you plot or use the formula.", "fig": "<svg viewBox=\"0 0 320 200\" class=\"dia\" role=\"img\" aria-label=\"Cumulative frequency at each upper class boundary\" style=\"width:min(100%,368px)\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5.5\" markerHeight=\"5.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dah\"/></marker></defs><line x1=\"34\" y1=\"16\" x2=\"34\" y2=\"166\" class=\"dline\"/><line x1=\"34\" y1=\"166\" x2=\"312\" y2=\"166\" class=\"dline\"/><text x=\"8.0\" y=\"20.0\" class=\"dmut\" text-anchor=\"start\">cum. freq.</text><rect x=\"42.2\" y=\"154.8\" width=\"29.0\" height=\"11.2\" class=\"dfill\"/><text x=\"56.7\" y=\"149.8\" class=\"dmut\" text-anchor=\"middle\">3</text><text x=\"56.7\" y=\"180.0\" class=\"dmut\" text-anchor=\"middle\">10.5</text><rect x=\"87.5\" y=\"136.0\" width=\"29.0\" height=\"30.0\" class=\"dfill\"/><text x=\"102.0\" y=\"131.0\" class=\"dmut\" text-anchor=\"middle\">8</text><text x=\"102.0\" y=\"180.0\" class=\"dmut\" text-anchor=\"middle\">20.5</text><rect x=\"132.8\" y=\"106.0\" width=\"29.0\" height=\"60.0\" class=\"dfill\"/><text x=\"147.3\" y=\"101.0\" class=\"dmut\" text-anchor=\"middle\">16</text><text x=\"147.3\" y=\"180.0\" class=\"dmut\" text-anchor=\"middle\">30.5</text><rect x=\"178.2\" y=\"61.0\" width=\"29.0\" height=\"105.0\" class=\"dfill\"/><text x=\"192.7\" y=\"56.0\" class=\"dmut\" text-anchor=\"middle\">28</text><text x=\"192.7\" y=\"180.0\" class=\"dmut\" text-anchor=\"middle\">40.5</text><rect x=\"223.5\" y=\"34.8\" width=\"29.0\" height=\"131.2\" class=\"dfill\"/><text x=\"238.0\" y=\"29.8\" class=\"dmut\" text-anchor=\"middle\">35</text><text x=\"238.0\" y=\"180.0\" class=\"dmut\" text-anchor=\"middle\">50.5</text><rect x=\"268.8\" y=\"16.0\" width=\"29.0\" height=\"150.0\" class=\"dfill\"/><text x=\"283.3\" y=\"11.0\" class=\"dmut\" text-anchor=\"middle\">40</text><text x=\"283.3\" y=\"180.0\" class=\"dmut\" text-anchor=\"middle\">60.5</text></svg>", "id": "cumfreq-6", "topic": "cumfreq"}], "syllabus": [{"section": "A. Number and Numeration", "items": [{"t": "Number bases: conversion, operations in other bases", "topic": "bases"}, {"t": "Modular arithmetic: addition, multiplication tables, applications", "topic": "mod"}, {"t": "Fractions, decimals, approximations and standard form", "topic": "approx"}, {"t": "Positive and negative integers, factors, multiples, LCM and HCF", "topic": "intfac"}, {"t": "Indices and the laws of indices", "topic": "indices"}, {"t": "Logarithms, laws of logarithms, logarithmic equations", "topic": "logs"}, {"t": "Surds and rationalising the denominator", "topic": "surds"}, {"t": "Sequences and series: AP and GP", "topic": "seq"}, {"t": "Sets: Venn diagrams and set operations", "topic": "sets"}, {"t": "Logical reasoning: statements, implication, validity", "topic": "logic"}, {"t": "Matrices and determinants (2 × 2)", "topic": "matrix"}, {"t": "Ratio, proportion, rates and percentages", "topic": "fin"}, {"t": "Financial arithmetic: interest, discount, profit and loss, hire purchase, taxes", "topic": "fin"}, {"t": "Variation: direct, inverse, joint and partial", "topic": "var"}]}, {"section": "B. Algebraic Processes", "items": [{"t": "Algebraic expressions: expansion, factorisation, substitution", "topic": "alg"}, {"t": "Linear equations and simultaneous equations", "topic": "alg"}, {"t": "Change of subject of a formula", "topic": "alg"}, {"t": "Quadratic equations: factorisation, formula, completing the square", "topic": "quad"}, {"t": "Graphs of linear and quadratic functions", "topic": "quad"}, {"t": "Linear inequalities and linear programming", "topic": "ineq"}, {"t": "Algebraic fractions", "topic": "afunc"}, {"t": "Functions and relations, including inverse and composite", "topic": "afunc"}]}, {"section": "C. Mensuration", "items": [{"t": "Lengths, perimeters, arcs and chords", "topic": "area"}, {"t": "Areas of plane figures, sectors and segments", "topic": "area"}, {"t": "Volumes and surface areas of solids", "topic": "vol"}, {"t": "Similar and congruent figures; scales and map scales", "topic": "simil"}, {"t": "The earth as a sphere: longitude, latitude and distances", "topic": "earth"}]}, {"section": "D. Plane Geometry", "items": [{"t": "Angles, parallel lines and the transversal", "topic": "geo"}, {"t": "Triangles, polygons and Pythagoras' theorem", "topic": "geo"}, {"t": "Circles: chords, tangents and circle theorems", "topic": "circle"}, {"t": "Geometrical construction with ruler and compasses", "topic": "loci"}, {"t": "Loci in two dimensions", "topic": "loci"}]}, {"section": "E. Coordinate Geometry", "items": [{"t": "Gradient, distance, midpoint and the equation of a straight line", "topic": "coord"}, {"t": "Parallel and perpendicular lines", "topic": "coord"}]}, {"section": "F. Trigonometry", "items": [{"t": "Sine, cosine and tangent of acute angles; special angles", "topic": "trig"}, {"t": "Angles of elevation and depression", "topic": "trig"}, {"t": "Trigonometric ratios of angles up to 360° and simple graphs", "topic": "trig"}, {"t": "Bearings and distances", "topic": "bear"}, {"t": "Sine rule, cosine rule and the area of a triangle", "topic": "bear"}]}, {"section": "G. Introductory Calculus", "items": [{"t": "Differentiation of algebraic functions; gradients and turning points", "topic": "calc"}, {"t": "Integration of simple algebraic functions; area under a curve", "topic": "calc"}]}, {"section": "H. Statistics and Probability", "items": [{"t": "Collection, tabulation and presentation of data", "topic": "stat"}, {"t": "Mean, median and mode, for grouped and ungrouped data", "topic": "stat"}, {"t": "Bar charts, pie charts and histograms; measures of dispersion", "topic": "stat"}, {"t": "Cumulative frequency curves, quartiles and percentiles", "topic": "cumfreq"}, {"t": "Probability: single and combined events", "topic": "prob"}]}, {"section": "I. Vectors and Transformation", "items": [{"t": "Vectors in a plane: addition, magnitude and position vectors", "topic": "vec"}, {"t": "Transformations: reflection, rotation, translation and enlargement", "topic": "vec"}]}]}, {"id": "english", "name": "English", "dot": "#5A67D8", "sub": "204 original practice questions with model answers — WAEC English Language syllabus. Not official past papers.", "cfg": {"objSolLabel": "Explanation", "objSolBtn": "explanation", "thySolLabel": "Model answer", "thySolBtn": "model answer", "mockTab": "Mock Paper 1", "mockN": 80, "mockMins": 60, "quickN": 20, "quickMins": 15, "mockBlurb": "80 objective questions in 1 hour — the shape of WAEC Paper 1 (lexis and structure). Questions are drawn at random from every topic, and the paper is marked as soon as you submit.", "paperNote": "Paper 1 carries 40 of the 170 marks for English Language.", "theoryNote": "Write your answer out in full before you look at the model. Paper 2 rewards complete sentences in your own words.", "about": "<b>About these questions.</b> They are original practice questions written to the WAEC English Language syllabus and to the format of Paper 1 (80 objectives on lexis and structure, 1 h), Paper 2 (essay, comprehension and summary, 2 h) and Paper 3 (test of orals, 45 min). The passages were written for this app. They are <b>not</b> reproductions of past WASSCE papers — for those, use WAEC's own e-learning portal and the past-question booklets sold by WAEC Ghana."}, "topics": [{"id": "syn", "name": "Synonyms & word choice", "section": "Lexis (Vocabulary)", "notes": ["In Paper 1, choose the word that is nearest in meaning IN THE CONTEXT of the sentence, not just in a dictionary.", "Read the whole sentence first; the same word can be positive in one context and negative in another.", "Watch the part of speech — the replacement must fit the sentence grammatically.", "Learn words in families: <i>meticulous, thorough, painstaking, scrupulous</i>."], "plain": "A synonym is a word that means nearly the same as another word. In the exam you must pick the one that fits THE SENTENCE — not just any word with a similar dictionary meaning.", "examples": [{"q": "Choose the word nearest in meaning to the underlined word: The old bridge is in a <u>precarious</u> state.", "steps": ["Step 1. Read the whole sentence. A bridge in a bad state is unsafe and could fall.", "Step 2. <i>Precarious</i> = not safe, likely to fall or fail.", "Step 3. Pick the word with that meaning: <b>dangerous / unstable</b>. A word like 'old' is in the sentence already and is not the meaning of the underlined word."], "fig": null}, {"q": "Choose the word nearest in meaning: The nurse spoke to the patient in a <u>soothing</u> voice.", "steps": ["Step 1. Ask what effect the voice has — it calms the patient.", "Step 2. <i>Soothing</i> = calming, comforting.", "Step 3. Answer: <b>calming</b>. (<i>Quiet</i> is about volume, which is not the same thing.)"], "fig": null}]}, {"id": "ant", "name": "Antonyms & opposites", "section": "Lexis (Vocabulary)", "notes": ["The opposite must match the part of speech and the context of the sentence.", "Many opposites are formed with prefixes: <i>un-, in-, im-, il-, ir-, dis-, mis-, non-</i>.", "<i>im-</i> before b, m, p (impossible); <i>ir-</i> before r (irregular); <i>il-</i> before l (illegal).", "Beware of near-opposites — choose the word that is most directly opposed."], "plain": "An antonym is a word with the opposite meaning. Check the part of speech first: the opposite of a verb must be a verb, the opposite of an adjective must be an adjective.", "examples": [{"q": "Choose the OPPOSITE of the underlined word: The chief gave a <u>brief</u> speech.", "steps": ["Step 1. <i>Brief</i> here describes the speech — it means short.", "Step 2. The opposite of short (in time) is long or lengthy.", "Step 3. Answer: <b>lengthy</b>. (<i>Boring</i> is a judgement, not an opposite.)"], "fig": null}, {"q": "Give the opposite of: (a) generous (b) ancient (c) accept (d) success.", "steps": ["(a) <b>stingy / mean</b>  (b) <b>modern / recent</b>  (c) <b>reject / refuse</b>  (d) <b>failure</b>", "Notice that (c) is a verb and (d) is a noun — the opposite must match the word class."], "fig": null}]}, {"id": "idiom", "name": "Idioms & collocations", "section": "Lexis (Vocabulary)", "notes": ["An idiom's meaning cannot be worked out from the separate words — it must be learnt whole.", "Collocations are words that regularly go together: <i>make a decision, do homework, heavy rain, strong tea</i>.", "In the exam, replace the idiom with the option that keeps the sentence's meaning.", "Do not change an idiom's wording: it is 'a stitch in time saves nine', not 'saves ten'."], "plain": "An idiom is a group of words whose meaning you cannot work out from the separate words. 'To kick the bucket' has nothing to do with buckets — it means to die. Idioms must simply be learnt.", "examples": [{"q": "What does the underlined expression mean? After the quarrel, the two friends <u>buried the hatchet</u>.", "steps": ["Step 1. Do NOT translate word by word — no one buried anything.", "Step 2. The situation is a quarrel that has ended.", "Step 3. <i>Bury the hatchet</i> = <b>make peace / end a quarrel</b>."], "fig": null}, {"q": "Use these idioms in sentences: (a) in black and white (b) a drop in the ocean.", "steps": ["(a) <i>in black and white</i> = in writing. <b>The headmaster asked for the complaint in black and white.</b>", "(b) <i>a drop in the ocean</i> = a very small amount compared with what is needed. <b>The GH₵ 200 donated was a drop in the ocean compared with the cost of the project.</b>"], "fig": null}]}, {"id": "reg", "name": "Registers & vocabulary of fields", "section": "Lexis (Vocabulary)", "notes": ["Paper 1 tests vocabulary from about sixteen fields: farming, medicine, law, banking, printing, motor vehicles, photography, building, sports, music, journalism, fishing, weaving, hairdressing, police work and commerce.", "Learn each field as a set of words: LAW — <i>plaintiff, defendant, adjourn, verdict, bail, brief, testify</i>.", "MEDICINE — <i>diagnosis, prescription, anaesthetic, theatre, ward, dosage, symptom</i>.", "MOTOR VEHICLE — <i>carburettor, clutch, gasket, ignition, chassis, gear</i>.", "BANKING — <i>teller, overdraft, ledger, deposit, withdrawal, interest, statement</i>."], "plain": "A register is the special vocabulary of a job or field. Doctors, lawyers, farmers and mechanics each have their own words. Learn them in groups — it is the quickest way to pick up marks in Paper 1.", "examples": [{"q": "The words <i>adjourn, bail, plaintiff, verdict</i> belong to which field?", "steps": ["Step 1. Ask where you would hear all four words together.", "Step 2. A case is adjourned, an accused person is granted bail, the plaintiff brings the case, the jury gives a verdict.", "Step 3. All four belong to <b>law (the law court)</b>."], "fig": null}, {"q": "Add two more words to each set: (a) carburettor, clutch … (b) teller, overdraft …", "steps": ["(a) These are motor vehicle words: add <b>gasket, ignition, chassis, gear</b>.", "(b) These are banking words: add <b>deposit, ledger, statement, interest</b>."], "fig": null}], "fig": "<svg viewBox=\"0 0 364 152\" class=\"dia\" role=\"img\" aria-label=\"Groups of register words\" style=\"width:min(100%,418px)\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5.5\" markerHeight=\"5.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dah\"/></marker></defs><rect x=\"112.0\" y=\"10\" width=\"140\" height=\"42\" rx=\"7\" class=\"dfill\"/><text x=\"182.0\" y=\"27.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Registers in</text><text x=\"182.0\" y=\"41.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Paper 1</text><rect x=\"10.0\" y=\"92\" width=\"104\" height=\"50\" rx=\"7\" class=\"dbox\"/><text x=\"62.0\" y=\"113.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">Law: verdict,</text><text x=\"62.0\" y=\"127.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">bail</text><path d=\"M182.0,52 L182.0,72 L62.0,72 L62.0,92\" class=\"dline\"/><rect x=\"130.0\" y=\"92\" width=\"104\" height=\"50\" rx=\"7\" class=\"dbox\"/><text x=\"182.0\" y=\"113.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">Medicine:</text><text x=\"182.0\" y=\"127.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">dosage, ward</text><path d=\"M182.0,52 L182.0,72 L182.0,72 L182.0,92\" class=\"dline\"/><rect x=\"250.0\" y=\"92\" width=\"104\" height=\"50\" rx=\"7\" class=\"dbox\"/><text x=\"302.0\" y=\"106.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">Banking:</text><text x=\"302.0\" y=\"120.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">teller,</text><text x=\"302.0\" y=\"134.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">overdraft</text><path d=\"M182.0,52 L182.0,72 L302.0,72 L302.0,92\" class=\"dline\"/></svg>"}, {"id": "form", "name": "Word formation & confusables", "section": "Lexis (Vocabulary)", "notes": ["Know the noun, verb, adjective and adverb forms of common words: <i>advise</i> (verb) / <i>advice</i> (noun); <i>practise</i> (verb) / <i>practice</i> (noun).", "Common confusables: <i>affect/effect, principal/principle, stationary/stationery, complement/compliment, its/it's</i>.", "Suffixes that make nouns: -ment, -tion, -ance, -ness, -ity. Adjectives: -ful, -less, -ous, -able, -ive.", "<i>-ish</i> and <i>-like</i> differ in tone: <i>childish</i> is negative, <i>childlike</i> is positive."], "plain": "Word formation is about building words from other words — and knowing which form fits the sentence. Many marks are lost by writing the verb where a noun is needed.", "examples": [{"q": "Fill the gap: The teacher's ___ (explain) was very clear.", "steps": ["Step 1. The gap comes after 'The teacher's' and before 'was', so a NOUN is needed.", "Step 2. The noun from <i>explain</i> is <i>explanation</i>.", "Step 3. <b>The teacher's explanation was very clear.</b>"], "fig": null}, {"q": "Choose correctly: We must (practise / practice) every evening.", "steps": ["Step 1. The word follows 'must', so a VERB is needed.", "Step 2. The verb is spelt with an <b>s</b>: practi<b>s</b>e. The noun is practi<b>c</b>e.", "Step 3. <b>We must practise every evening.</b> (Same rule: advise/advice, licence/license.)"], "fig": null}]}, {"id": "fig", "name": "Figures of speech & literary devices", "section": "Lexis (Vocabulary)", "notes": ["Simile compares with <i>like</i> or <i>as</i>; metaphor compares directly, without them.", "Personification gives human qualities to non-human things; apostrophe addresses an absent person or a thing.", "Hyperbole exaggerates; litotes (understatement) says less than is meant.", "Euphemism softens something unpleasant: 'passed away' for 'died'.", "Metonymy uses a related thing for the thing itself ('the Crown'); synecdoche uses a part for the whole ('all hands on deck')."], "plain": "Figures of speech are ways of saying something so that it paints a picture. A simile uses 'like' or 'as'; a metaphor says one thing IS another; personification gives human qualities to things.", "examples": [{"q": "Name the figure of speech: 'The classroom was a market.'", "steps": ["Step 1. Is 'like' or 'as' used? No.", "Step 2. The classroom is said to BE a market — a direct comparison of the noise and disorder.", "Step 3. It is a <b>metaphor</b>. (With 'like', 'The classroom was like a market', it would be a simile.)"], "fig": null}, {"q": "Name and explain the figure of speech: 'The hungry sea swallowed the canoe.'", "steps": ["Step 1. The sea is given human qualities — hunger and swallowing.", "Step 2. That is <b>personification</b>.", "Step 3. Its effect: it makes the sea sound alive and cruel, so the loss feels more frightening."], "fig": null}]}, {"id": "tense", "name": "Tenses & sequence of tenses", "section": "Structure (Grammar)", "notes": ["Present perfect (<i>has/have + past participle</i>) links the past to now: 'She has lived here since 2020.'", "Past perfect (<i>had + past participle</i>) shows the earlier of two past actions.", "<i>since</i> takes a point in time; <i>for</i> takes a length of time.", "After <i>By the time…</i> in the past, use the past perfect in the main clause.", "Do not mix tenses within one time frame without a reason."], "plain": "Tense shows WHEN something happened. The trick is to look for the time words in the sentence — <i>since, ago, by the time, already, yesterday, next week</i> — they tell you which tense to use.", "examples": [{"q": "Fill the gap: By the time the ambulance arrived, the man ___ (die).", "steps": ["Step 1. Two past actions: the man died FIRST, then the ambulance arrived.", "Step 2. The earlier past action takes the past perfect: had + past participle.", "Step 3. <b>By the time the ambulance arrived, the man had died.</b>"], "fig": null}, {"q": "Fill the gap: She ___ (teach) in this school for ten years.", "steps": ["Step 1. 'For ten years' up to now links the past with the present.", "Step 2. Use the present perfect: has/have + past participle (or the continuou
