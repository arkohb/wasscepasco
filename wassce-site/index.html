in the districts; political interference and low citizen participation."], "fig": null}]}, {"id": "chief", "name": "Chieftaincy & traditional authority", "section": "Governance, Politics & Stability", "notes": ["A chief is a person who hails from the appropriate family and lineage, has been validly nominated, elected or selected, and enstooled or enskinned in accordance with customary law.", "The institution of chieftaincy, with its traditional councils, is guaranteed by the 1992 Constitution.", "Structure: the National House of Chiefs, Regional Houses of Chiefs, traditional councils, paramount chiefs, divisional and sub-chiefs, with the queen mother and the kingmakers.", "Functions: custodian of the land and of custom, settling disputes, mobilising for development, preserving festivals and culture, and linking the people with central government.", "Chiefs may not take part in active party politics.", "Chieftaincy disputes are heard by the judicial committees of the Houses of Chiefs."], "plain": "Chieftaincy is Ghana's traditional system of leadership, recognised by the Constitution. A chief is not elected by ballot — he is chosen by the royal family and kingmakers and installed by custom.", "examples": [{"q": "A paramount chief is asked to campaign for a political party. What should he do, and why?", "steps": ["Step 1. He should decline.", "Step 2. The Constitution bars chiefs from active party politics.", "Step 3. The reason is practical as well as legal: a chief belongs to all his people, and taking sides would divide the town and weaken his authority to settle disputes."], "fig": "<svg viewBox=\"0 0 364 170\" class=\"dia\" role=\"img\" aria-label=\"Structure of chieftaincy\" style=\"width:min(100%,418px)\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5.5\" markerHeight=\"5.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dah\"/></marker></defs><rect x=\"112.0\" y=\"10\" width=\"140\" height=\"42\" rx=\"7\" class=\"dfill\"/><text x=\"182.0\" y=\"27.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Chieftaincy</text><text x=\"182.0\" y=\"41.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">structure</text><rect x=\"10.0\" y=\"92\" width=\"104\" height=\"50\" rx=\"7\" class=\"dbox\"/><text x=\"62.0\" y=\"113.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">National House</text><text x=\"62.0\" y=\"127.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">of Chiefs</text><path d=\"M182.0,52 L182.0,72 L62.0,72 L62.0,92\" class=\"dline\"/><text x=\"62.0\" y=\"158.0\" class=\"dmut\" text-anchor=\"middle\">national level</text><rect x=\"130.0\" y=\"92\" width=\"104\" height=\"50\" rx=\"7\" class=\"dbox\"/><text x=\"182.0\" y=\"120.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">Regional Houses</text><path d=\"M182.0,52 L182.0,72 L182.0,72 L182.0,92\" class=\"dline\"/><text x=\"182.0\" y=\"158.0\" class=\"dmut\" text-anchor=\"middle\">regional level</text><rect x=\"250.0\" y=\"92\" width=\"104\" height=\"50\" rx=\"7\" class=\"dbox\"/><text x=\"302.0\" y=\"113.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">Traditional</text><text x=\"302.0\" y=\"127.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">Councils</text><path d=\"M182.0,52 L182.0,72 L302.0,72 L302.0,92\" class=\"dline\"/><text x=\"302.0\" y=\"158.0\" class=\"dmut\" text-anchor=\"middle\">paramountcy level</text></svg>"}, {"q": "Write one essay point on the role of chiefs in development.", "steps": ["Point: Chiefs mobilise their communities for development.", "Explain: A chief can call the town together, organise communal labour and release stool land for projects far more quickly than any office can.", "Example: Many community schools, clinics and boreholes stand on land released by a chief, built partly with funds raised at the annual festival."], "fig": null}]}, {"id": "leader", "name": "Leadership, followership & accountability", "section": "Governance, Politics & Stability", "notes": ["Leadership is the ability to influence and guide others towards a goal; followership is the willingness to support and co-operate.", "Qualities of a good leader: honesty, vision, courage, tolerance, humility, fairness, good communication and accountability.", "Types of leadership: autocratic (leader decides alone), democratic (consults), laissez-faire (leaves members to act) and charismatic.", "Accountability means explaining and taking responsibility for the use of power and public funds.", "A good follower obeys rules, offers honest advice, criticises constructively and does not flatter leaders."], "plain": "Leadership is guiding others towards a goal; followership is supporting and co-operating while speaking the truth. A country needs both to be done well.", "examples": [{"q": "Describe four qualities you would look for in a school prefect, and why.", "steps": ["1. <b>Honesty</b> — students and teachers can trust his reports and his handling of money.", "2. <b>Fairness</b> — he treats all students alike, whatever their background or friendship.", "3. <b>Good communication</b> — he explains decisions and carries the views of students to the staff.", "4. <b>Discipline and example</b> — he keeps the rules he enforces."], "fig": null}, {"q": "Explain the difference between autocratic and democratic leadership with a school example.", "steps": ["<b>Autocratic:</b> the leader decides alone. A prefect who fixes the clean-up roster without asking anyone — quick, but members feel ignored.", "<b>Democratic:</b> the leader consults. He calls a short meeting, takes suggestions, then decides — slower, but members co-operate because the decision is partly theirs."], "fig": null}]}, {"id": "conflict", "name": "Conflicts & their resolution", "section": "Governance, Politics & Stability", "notes": ["Conflict is a disagreement between individuals or groups over interests, values or resources.", "Common causes in Ghana: chieftaincy succession disputes, land and boundary disputes, ethnic and religious intolerance, politics and unequal distribution of resources.", "Effects: loss of lives and property, displacement, destruction of schools and businesses, curfews and loss of investment.", "Resolution methods: dialogue and negotiation, mediation, arbitration, adjudication in the courts, and the work of the House of Chiefs.", "Prevention: tolerance, early warning, education, equitable development and enforcing the law without favour."], "plain": "Conflict is disagreement — over land, chieftaincy, politics or resources. It is normal; what matters is settling it early and peacefully, before it turns violent.", "examples": [{"q": "Two families claim the same farmland and the matter is heating up. Describe the peaceful options.", "steps": ["Step 1. <b>Dialogue</b> — the two families meet, with elders present, and state their claims.", "Step 2. <b>Mediation</b> — a neutral respected person or the Peace Council helps them reach their own agreement.", "Step 3. <b>Arbitration</b> — they agree in advance to accept the decision of a chosen panel.", "Step 4. <b>Adjudication</b> — if all else fails, the court or the judicial committee of the House of Chiefs decides, and the decision is binding."], "fig": "<svg viewBox=\"0 0 514 96\" class=\"dia\" role=\"img\" aria-label=\"Ways of resolving conflict\" style=\"width:min(100%,520px)\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5.5\" markerHeight=\"5.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dah\"/></marker></defs><text x=\"257.0\" y=\"15.0\" class=\"dmut\" text-anchor=\"middle\" style=\"font-size:12px\">From the cheapest option to the last resort</text><rect x=\"10\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"62.0\" y=\"56.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Dialogue</text><rect x=\"140\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"192.0\" y=\"56.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Mediation</text><line x1=\"117.0\" y1=\"53.0\" x2=\"136.0\" y2=\"53.0\" class=\"dline\" marker-end=\"url(#ah)\"/><rect x=\"270\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"322.0\" y=\"56.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Arbitration</text><line x1=\"247.0\" y1=\"53.0\" x2=\"266.0\" y2=\"53.0\" class=\"dline\" marker-end=\"url(#ah)\"/><rect x=\"400\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"452.0\" y=\"56.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Court</text><line x1=\"377.0\" y1=\"53.0\" x2=\"396.0\" y2=\"53.0\" class=\"dline\" marker-end=\"url(#ah)\"/></svg>"}, {"q": "Write one essay point on the effects of conflict on development.", "steps": ["Point: Conflict drives away investment.", "Explain: Investors and skilled workers avoid places where property and lives are not safe, so factories and jobs go elsewhere.", "Example: In towns that have suffered long chieftaincy disputes, banks and businesses close, schools lose teachers, and the area falls behind its neighbours."], "fig": null}]}, {"id": "corrupt", "name": "Corruption & accountability institutions", "section": "Governance, Politics & Stability", "notes": ["Corruption is the abuse of entrusted power for private gain: bribery, embezzlement, nepotism, extortion, kickbacks and vote buying.", "Causes: greed, low incomes, weak enforcement, delays in the courts, poor record keeping and lack of political will.", "Effects: loss of public funds, poor services, high cost of doing business, injustice and loss of investor confidence.", "Institutions: CHRAJ, the Office of the Special Prosecutor, EOCO, the Auditor-General, the police and the courts; also the media and civil society.", "Control: transparency in procurement, digital payment systems, protection for whistle-blowers, prompt prosecution and moral education."], "plain": "Corruption is using public office for private gain — taking bribes, stealing public funds, or favouring relatives. It is not a victimless act: the money lost is a clinic not built.", "examples": [{"q": "A road contract for GH₵ 2 million is inflated to GH₵ 3 million and shared. Trace who suffers.", "steps": ["Step 1. The state pays GH₵ 1 million more than the road is worth.", "Step 2. That million is money that could have built a CHPS compound or a six-unit classroom block.", "Step 3. The road is often poorly built too, because part of the money was taken out, so it fails early and must be repaired again.", "Step 4. Taxpayers pay twice, honest contractors lose work, and citizens lose trust in government."], "fig": null}, {"q": "Name four institutions that fight corruption in Ghana and what each does.", "steps": ["<b>CHRAJ</b> — investigates abuse of office and human rights complaints.", "<b>Office of the Special Prosecutor</b> — investigates and prosecutes corruption-related offences.", "<b>EOCO</b> — handles economic and organised crime, including fraud.", "<b>Auditor-General</b> — audits public accounts and reports to Parliament, exposing misuse of funds."], "fig": null}]}, {"id": "intl", "name": "Ghana's international relations", "section": "Governance, Politics & Stability", "notes": ["The United Nations was founded in 1945; Ghana joined in 1957, the year of independence. Its organs include the General Assembly, the Security Council and the International Court of Justice.", "The African Union replaced the Organisation of African Unity in 2002; its headquarters is in Addis Ababa, Ethiopia.", "ECOWAS was formed in 1975 by the Treaty of Lagos; its secretariat is in Abuja, and it promotes free movement, trade and regional peace.", "Ghana belongs also to the Commonwealth, the Non-Aligned Movement and the African Continental Free Trade Area, whose secretariat is in Accra.", "Ghana contributes troops to UN peacekeeping missions and gains trade, aid, technical assistance and scholarships from these bodies."], "plain": "No country stands alone. Ghana belongs to groups such as the UN, the AU and ECOWAS, which bring trade, aid, security and a voice in world affairs — and bring obligations too.", "examples": [{"q": "A Ghanaian trader wants to sell goods in Lomé and Abidjan. How does ECOWAS membership help?", "steps": ["Step 1. ECOWAS protocols allow free movement of people and goods within the sub-region.", "Step 2. She can travel without a visa for up to 90 days and face fewer customs barriers.", "Step 3. The larger regional market lets her buy and sell in greater quantity, which lowers her costs."], "fig": "<svg viewBox=\"0 0 364 152\" class=\"dia\" role=\"img\" aria-label=\"Organisations Ghana belongs to\" style=\"width:min(100%,418px)\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5.5\" markerHeight=\"5.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dah\"/></marker></defs><rect x=\"112.0\" y=\"10\" width=\"140\" height=\"42\" rx=\"7\" class=\"dfill\"/><text x=\"182.0\" y=\"27.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Ghana's</text><text x=\"182.0\" y=\"41.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">memberships</text><rect x=\"10.0\" y=\"92\" width=\"104\" height=\"50\" rx=\"7\" class=\"dbox\"/><text x=\"62.0\" y=\"120.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">UN — peace, aid</text><path d=\"M182.0,52 L182.0,72 L62.0,72 L62.0,92\" class=\"dline\"/><rect x=\"130.0\" y=\"92\" width=\"104\" height=\"50\" rx=\"7\" class=\"dbox\"/><text x=\"182.0\" y=\"113.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">AU — African</text><text x=\"182.0\" y=\"127.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">unity</text><path d=\"M182.0,52 L182.0,72 L182.0,72 L182.0,92\" class=\"dline\"/><rect x=\"250.0\" y=\"92\" width=\"104\" height=\"50\" rx=\"7\" class=\"dbox\"/><text x=\"302.0\" y=\"113.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">ECOWAS —</text><text x=\"302.0\" y=\"127.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">regional trade</text><path d=\"M182.0,52 L182.0,72 L302.0,72 L302.0,92\" class=\"dline\"/></svg>"}, {"q": "State four obligations Ghana owes an international organisation it joins.", "steps": ["1. Pay its dues and contributions on time.", "2. Honour the treaties, protocols and decisions it has signed.", "3. Contribute troops, police or experts when called upon, as in peacekeeping.", "4. Respect the sovereignty of other members and settle disputes peacefully."], "fig": null}]}, {"id": "economy", "name": "Our national economy", "section": "Social & Economic Development", "notes": ["Sectors: primary (farming, fishing, mining, forestry), secondary (manufacturing, construction, processing) and tertiary (services — banking, trade, transport, tourism, education).", "Ghana's main exports: gold, cocoa, crude oil, timber, bauxite, manganese and cashew. Main imports: machinery, vehicles, fuel, rice and pharmaceuticals.", "Gross Domestic Product (GDP) is the total value of goods and services produced in a country in a year.", "Inflation is a persistent rise in the general price level; it reduces the purchasing power of money.", "Over-dependence on the export of raw materials exposes the economy to falling world prices — value addition is the remedy."], "plain": "The economy is how a country produces, shares and uses goods and services. It has three parts: getting raw materials, turning them into goods, and providing services.", "examples": [{"q": "Place these in the right sector: cocoa farming, soap making, banking, gold mining, teaching.", "steps": ["<b>Primary</b> (from nature): cocoa farming, gold mining.", "<b>Secondary</b> (making things): soap making.", "<b>Tertiary</b> (services): banking, teaching."], "fig": "<svg viewBox=\"0 0 364 152\" class=\"dia\" role=\"img\" aria-label=\"Three sectors of the economy\" style=\"width:min(100%,418px)\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5.5\" markerHeight=\"5.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dah\"/></marker></defs><rect x=\"112.0\" y=\"10\" width=\"140\" height=\"42\" rx=\"7\" class=\"dfill\"/><text x=\"182.0\" y=\"34.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">The economy</text><rect x=\"10.0\" y=\"92\" width=\"104\" height=\"50\" rx=\"7\" class=\"dbox\"/><text x=\"62.0\" y=\"113.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">Primary —</text><text x=\"62.0\" y=\"127.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">farming, mining</text><path d=\"M182.0,52 L182.0,72 L62.0,72 L62.0,92\" class=\"dline\"/><rect x=\"130.0\" y=\"92\" width=\"104\" height=\"50\" rx=\"7\" class=\"dbox\"/><text x=\"182.0\" y=\"113.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">Secondary —</text><text x=\"182.0\" y=\"127.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">manufacturing</text><path d=\"M182.0,52 L182.0,72 L182.0,72 L182.0,92\" class=\"dline\"/><rect x=\"250.0\" y=\"92\" width=\"104\" height=\"50\" rx=\"7\" class=\"dbox\"/><text x=\"302.0\" y=\"113.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">Tertiary —</text><text x=\"302.0\" y=\"127.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">services</text><path d=\"M182.0,52 L182.0,72 L302.0,72 L302.0,92\" class=\"dline\"/></svg>"}, {"q": "Write one essay point on why exporting raw cocoa earns Ghana less than it should.", "steps": ["Point: Exporting raw materials earns far less than exporting finished goods.", "Explain: The value is added when cocoa becomes butter, powder and chocolate, and that value is taken by the country that processes it.", "Example: A tonne of beans sells for a fraction of what the chocolate made from it earns abroad, so local processing would raise the country's income and create jobs here."], "fig": null}]}, {"id": "money", "name": "Money, banking & personal finance", "section": "Social & Economic Development", "notes": ["Functions of money: medium of exchange, measure of value, store of value and standard for deferred payment.", "The Bank of Ghana is the central bank: it issues currency, keeps government accounts, supervises other banks and manages monetary policy.", "Commercial banks accept deposits, give loans, transfer money and offer safe custody.", "Saving methods: bank accounts, susu, treasury bills, shares, mobile money and co-operative credit unions.", "A personal budget lists expected income and planned expenditure; save first, then spend, and keep a record."], "plain": "Money is anything generally accepted in exchange for goods and services. Banking keeps it safe, moves it about, and lends it to people who can use it productively.", "examples": [{"q": "A student earns GH₵ 600 a month from a holiday job. Draw up a simple monthly budget.", "steps": ["Step 1. Write income at the top: GH₵ 600.", "Step 2. List planned spending: transport 120, food 180, phone 40, books 60 = GH₵ 400.", "Step 3. Savings first, not last: 600 − 400 = GH₵ 200 to the bank or susu.", "Step 4. Keep a record and check at month end whether you kept to the plan."], "fig": null}, {"q": "Why is saving in a bank better than keeping money at home?", "steps": ["Step 1. It is safe from theft, fire and the temptation to spend.", "Step 2. It earns interest, so the amount grows.", "Step 3. It builds a record that supports a future loan for a business or further study."], "fig": null}]}, {"id": "entre", "name": "Entrepreneurship & self-employment", "section": "Social & Economic Development", "notes": ["An entrepreneur organises land, labour and capital to produce goods or services, and bears the risk.", "Qualities: creativity, risk-taking, hard work, honesty, good record keeping, discipline and customer care.", "A business plan states the product, the market, the location, the capital needed and the expected profit.", "Sources of capital: personal savings, family, susu, bank loans, microfinance, co-operatives and government schemes.", "Problems of small businesses: lack of capital, poor record keeping, high cost of utilities, competition from imports and lack of skills."], "plain": "An entrepreneur spots a need, organises people and money to meet it, and carries the risk. Ghana needs more job creators, not only job seekers.", "examples": [{"q": "A student wants to start a small printing business after school. Outline the business plan.", "steps": ["Step 1. <b>The product:</b> printing, photocopying and binding for students and small offices.", "Step 2. <b>The market:</b> who will buy, how many, and who else is already doing it nearby.", "Step 3. <b>Capital:</b> cost of the machine, paper and rent; where the money comes from — savings, family, susu or a small loan.", "Step 4. <b>Running it:</b> location, price per page, records of sales and expenses, and expected profit."], "fig": "<svg viewBox=\"0 0 514 96\" class=\"dia\" role=\"img\" aria-label=\"Starting a small business\" style=\"width:min(100%,520px)\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5.5\" markerHeight=\"5.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dah\"/></marker></defs><text x=\"257.0\" y=\"15.0\" class=\"dmut\" text-anchor=\"middle\" style=\"font-size:12px\">From idea to business</text><rect x=\"10\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"62.0\" y=\"56.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Find a need</text><rect x=\"140\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"192.0\" y=\"49.0\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Plan and cost</text><text x=\"192.0\" y=\"64.0\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">it</text><line x1=\"117.0\" y1=\"53.0\" x2=\"136.0\" y2=\"53.0\" class=\"dline\" marker-end=\"url(#ah)\"/><rect x=\"270\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"322.0\" y=\"56.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Raise capital</text><line x1=\"247.0\" y1=\"53.0\" x2=\"266.0\" y2=\"53.0\" class=\"dline\" marker-end=\"url(#ah)\"/><rect x=\"400\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"452.0\" y=\"49.0\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Start and keep</text><text x=\"452.0\" y=\"64.0\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">records</text><line x1=\"377.0\" y1=\"53.0\" x2=\"396.0\" y2=\"53.0\" class=\"dline\" marker-end=\"url(#ah)\"/></svg>"}, {"q": "Why do many small businesses in Ghana fail within three years?", "steps": ["1. Too little capital, and business money is mixed with personal money.", "2. No records, so the owner cannot tell profit from turnover.", "3. Poor location or no market research; strong competition from imports.", "4. High costs — rent, electricity and transport — and no plan for slow seasons."], "fig": null}]}, {"id": "unemp", "name": "Unemployment & the world of work", "section": "Social & Economic Development", "notes": ["Unemployment is the situation where people who are able and willing to work cannot find jobs.", "Types: structural (skills do not match jobs), frictional (between jobs), seasonal (farming, tourism), cyclical (economic downturn), disguised (more workers than needed) and underemployment.", "Causes in Ghana: rapid population growth, a curriculum that stresses white-collar jobs, collapse of industries, lack of capital and rural–urban migration.", "Effects: poverty, crime, drug abuse, migration, brain drain and loss of national output.", "Solutions: skills training, support for agriculture and agro-processing, credit for small businesses, and a curriculum that promotes self-employment."], "plain": "Unemployment means people who can work and want to work cannot find jobs. It wastes the country's greatest resource — its people.", "examples": [{"q": "Identify the type of unemployment in each case.", "steps": ["(a) A tailor with no customers between January and March — <b>seasonal</b>.", "(b) A graduate typist replaced by a computer system — <b>structural</b> (his skill is no longer needed).", "(c) A man who left one job last week and starts another next month — <b>frictional</b>.", "(d) Five people doing work that two could do on a family farm — <b>disguised</b>."], "fig": null}, {"q": "Write one essay point on solving youth unemployment.", "steps": ["Point: Technical and vocational training reduces youth unemployment.", "Explain: It gives young people skills they can sell immediately — welding, tailoring, catering, electricals — so they can employ themselves rather than wait for an office job.", "Example: A young welder who completes training and receives a starter tool kit can earn from his first month and later employ apprentices."], "fig": null}]}, {"id": "sci", "name": "Science, technology & development", "section": "Social & Economic Development", "notes": ["Technology is the application of scientific knowledge to solve practical problems.", "Benefits: higher productivity in farming and industry, better health care, faster communication and transport, and improved education.", "Appropriate technology suits local conditions, materials and skills — for example solar dryers, improved cook stoves and small irrigation pumps.", "ICT supports mobile money, e-learning, e-government, online trading and weather information for farmers.", "Problems: cost of equipment, unreliable power, low investment in research, weak maintenance culture and the brain drain."], "plain": "Technology is science put to work. It raises what a farmer or a factory can produce, and it has changed how we learn, pay and communicate.", "examples": [{"q": "Explain how mobile money has changed daily life in Ghana.", "steps": ["Step 1. People far from any bank branch can now save, send and receive money on a simple phone.", "Step 2. Traders are paid instantly and carry less cash, which is safer.", "Step 3. Fees, school and utility bills are paid without travelling — saving time and transport money.", "Step 4. Risks remain: fraud and wrong transfers, so PINs must be kept private."], "fig": null}, {"q": "State two positive and two negative effects of technology on society.", "steps": ["<b>Positive:</b> faster communication and access to information; better health care through modern equipment and medicines.", "<b>Negative:</b> workers replaced by machines; misuse of social media for fraud, rumours and cyberbullying; pollution from electronic waste."], "fig": null}]}, {"id": "sustain", "name": "Sustainable development & resources", "section": "Social & Economic Development", "notes": ["Sustainable development meets the needs of the present without compromising the ability of future generations to meet their own needs.", "Renewable resources (forests, fish, water, solar) can be replaced; non-renewable ones (gold, oil, bauxite) cannot.", "Principles: wise use, recycling, pollution control, equity between generations and community participation.", "Human resource development — education, health and skills — is as important as natural resources.", "Ghana's resource wealth benefits the nation only when revenue is well managed and value is added locally."], "plain": "Sustainable development means using what we have today without spoiling it for the children coming after us. Take the fruit, but do not cut down the tree.", "examples": [{"q": "A timber firm wants to log a forest reserve. What conditions would make it sustainable?", "steps": ["Step 1. Take only mature trees, marked and counted (selective logging), not clear felling.", "Step 2. Replant at least as many trees as are taken, and care for the seedlings.", "Step 3. Protect the river banks and the wildlife corridors inside the reserve.", "Step 4. Employ and pay the local community, so that they also gain and protect the forest."], "fig": null}, {"q": "Why is human resource development as important as natural resources?", "steps": ["Step 1. Minerals and forests are useless until people know how to find, process and manage them.", "Step 2. Educated and healthy people produce more, innovate, and attract investment.", "Step 3. Example: countries with few natural resources but well-trained people are far richer than some resource-rich countries."], "fig": null}]}, {"id": "tour", "name": "Tourism & development", "section": "Social & Economic Development", "notes": ["Tourism is travel away from one's usual place of residence for leisure, business, culture, religion or education.", "Ghana's attractions: Cape Coast and Elmina Castles, Kakum National Park, Mole National Park, Lake Volta, Wli Falls, Paga crocodile pond, Manhyia Palace, festivals and beaches.", "Benefits: foreign exchange, employment, market for local crafts and food, infrastructure development and cultural exchange.", "Problems: poor roads to sites, weak promotion, inadequate accommodation, poor maintenance and sanitation, and high travel costs.", "Negative effects to manage: erosion of local culture, littering and pressure on natural sites."], "plain": "Tourism is people travelling for leisure, business or culture — and the services provided for them. It brings in foreign money and creates jobs in places with no factories.", "examples": [{"q": "A district has waterfalls but few visitors. Suggest a plan to develop tourism there.", "steps": ["Step 1. Improve the access road, water, toilets and signposts at the site.", "Step 2. Train local guides and provide simple, clean accommodation and food.", "Step 3. Advertise — social media, travel fairs, the diaspora and schools' excursion programmes.", "Step 4. Involve the community so that they earn from crafts, food and guiding, and therefore protect the site."], "fig": null}, {"q": "State three benefits and two problems of tourism.", "steps": ["<b>Benefits:</b> foreign exchange; jobs for guides, drivers, hotel and craft workers; roads and utilities built for tourists also serve residents.", "<b>Problems:</b> litter and damage at popular sites; unwanted influences on local culture and youth; seasonal, unreliable income."], "fig": null}]}, {"id": "trade", "name": "Production, trade & consumer awareness", "section": "Social & Economic Development", "notes": ["Factors of production: land, labour, capital and entrepreneurship; their rewards are rent, wages, interest and profit.", "Production is complete only when goods reach the final consumer, so distribution matters as much as making things.", "Trade may be home (retail and wholesale) or foreign (import and export). Balance of trade = visible exports − visible imports.", "Consumer rights: safety, information, choice and redress. Consumer duties: check quality, expiry dates and receipts, and complain properly.", "The Ghana Standards Authority and the Food and Drugs Authority protect consumers against unsafe goods."], "plain": "Production is not finished until the goods reach the person who uses them. Trade moves goods from producer to consumer — at home (retail and wholesale) and abroad (imports and exports).", "examples": [{"q": "In one year, a country's visible exports are GH₵ 60bn and visible imports GH₵ 75bn. Find the balance of trade and say what it means.", "steps": ["Step 1. Balance of trade = visible exports − visible imports.", "Step 2. = 60 − 75 = <b>−GH₵ 15bn</b>.", "Step 3. It is negative, so the country has an unfavourable balance of trade (a trade deficit): it bought more goods from abroad than it sold."], "fig": null}, {"q": "A consumer buys tinned milk and finds it expired. What are her rights and what should she do?", "steps": ["Step 1. She has a right to safety and to correct information, and a right to redress.", "Step 2. She should return it to the seller with the receipt and ask for a refund or replacement.", "Step 3. If refused, report to the Food and Drugs Authority or the Ghana Standards Authority.", "Step 4. Her duty: check expiry dates, seals and standards marks BEFORE buying, and keep receipts."], "fig": null}]}, {"id": "religion", "name": "Religion, morality & development", "section": "Social & Economic Development", "notes": ["The three main religions in Ghana are Christianity, Islam and African Traditional Religion.", "Morality is the set of standards by which a society judges right and wrong; religion is one of its main sources.", "Shared moral values: honesty, hard work, respect for life and property, truthfulness, kindness and justice.", "Religious bodies build schools, clinics and vocational centres, support the poor, and mediate in conflicts.", "Religious tolerance means respecting the beliefs and worship of others; Ghana's peace rests partly on it.", "Negative effects to avoid: religious extremism and intolerance, fraudulent 'men of God', and practices that discourage work, education or medical care."], "plain": "Religion teaches people what is right and wrong, and in Ghana it also builds schools and clinics. Because the country holds several faiths side by side, tolerance is what keeps the peace.", "examples": [{"q": "A school has Christian, Muslim and traditionalist students. Suggest how it can be fair to all.", "steps": ["Step 1. Allow time and a place for each group's worship, and respect fasting and prayer times.", "Step 2. Make no student take part in another faith's rites against conscience.", "Step 3. Mark the major festivals of all faiths in the school calendar, and teach about each of them.", "Step 4. Punish mockery of any faith, as you would punish any other form of bullying."], "fig": null}, {"q": "Write one essay point on religion and national development.", "steps": ["Point: Religious bodies supply social services the state alone cannot provide.", "Explain: Churches and Islamic organisations run schools, training centres and hospitals, often in rural areas where government presence is thin.", "Example: Many of Ghana's oldest senior high schools and mission hospitals were founded and are still partly run by religious bodies."], "fig": null}]}, {"id": "probs", "name": "Social problems & their solutions", "section": "Social & Economic Development", "notes": ["Common social problems: poverty, child labour, streetism, teenage pregnancy, drug and alcohol abuse, armed robbery, cybercrime and prostitution.", "Causes: unemployment, broken homes, poor parental care, peer influence, rural–urban migration and weak enforcement of laws.", "Child labour keeps children out of school and exposes them to injury; Ghana's laws set a minimum age for employment.", "Drug abuse damages health, causes mental illness and leads to crime; it is prevented by education, counselling and rehabilitation.", "Solutions call for the family, school, religious bodies, the assemblies and government working together."], "plain": "Social problems are the difficulties a society faces together — poverty, unemployment, child labour, streetism, drug abuse and crime. They are linked: solving one often eases another.", "examples": [{"q": "Children are fishing on the lake during school hours. Explain the problem and the solutions.", "steps": ["Step 1. This is child labour: work that keeps children out of school and exposes them to danger.", "Step 2. Cause: family poverty, and the belief that the child's labour is needed for the household to eat.", "Step 3. Solutions: enforce the law on the minimum working age; support the families with livelihood programmes; free and compulsory basic education with feeding; rescue, counsel and return the children to school."], "fig": null}, {"q": "Write one essay point on the effects of drug abuse on the youth.", "steps": ["Point: Drug abuse destroys a young person's education and future.", "Explain: Drugs damage memory and concentration, cause absenteeism, and lead to indiscipline and dismissal from school.", "Example: A student who takes tramadol to stay awake soon cannot study at all without it, fails his examinations and may end up in crime to fund the habit."], "fig": null}]}, {"id": "planning", "name": "National development planning & the citizen", "section": "Social & Economic Development", "notes": ["Development planning sets national goals and how resources will be used to reach them; the National Development Planning Commission advises on it.", "A national budget is the government's statement of expected revenue and planned expenditure for a year, presented to Parliament.", "Government revenue comes mainly from taxes (direct: income and corporate; indirect: VAT and duties), grants, loans and returns from state enterprises.", "The Ghana Revenue Authority collects taxes; the Auditor-General audits public accounts and reports to Parliament.", "Citizens support development by paying taxes, monitoring projects, taking part in communal labour and voting wisely."], "plain": "Development planning is deciding what the country will build and improve, and how it will pay for it. The national budget turns that plan into figures for one year.", "examples": [{"q": "Where does government get the money for schools and roads?", "steps": ["Step 1. <b>Taxes</b> — income tax and corporate tax (direct), VAT and import duties (indirect), collected by the Ghana Revenue Authority.", "Step 2. <b>Loans</b> — treasury bills and bonds at home, and loans from abroad, which must be repaid with interest.", "Step 3. <b>Grants</b> from development partners, and earnings from minerals, oil and state enterprises."], "fig": "<svg viewBox=\"0 0 320 220\" class=\"dia\" role=\"img\" aria-label=\"Where government revenue comes from (illustration only)\" style=\"width:min(100%,368px)\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5.5\" markerHeight=\"5.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dah\"/></marker></defs><path d=\"M110,108 L110.0,24.0 A84,84 0 1 1 60.6,176.0 Z\" class=\"dfill\" fill-opacity=\"0.25\"/><text x=\"205.1\" y=\"141.9\" class=\"dmut\" text-anchor=\"middle\">216°</text><rect x=\"216\" y=\"26\" width=\"11\" height=\"11\" class=\"dfill\" fill-opacity=\"0.25\"/><text x=\"233.0\" y=\"36.0\" class=\"dmut\" text-anchor=\"start\">Taxes</text><path d=\"M110,108 L60.6,176.0 A84,84 0 0 1 42.0,58.6 Z\" class=\"dfill\" fill-opacity=\"0.55\"/><text x=\"11.2\" y=\"126.6\" class=\"dmut\" text-anchor=\"middle\">90°</text><rect x=\"216\" y=\"48\" width=\"11\" height=\"11\" class=\"dfill\" fill-opacity=\"0.55\"/><text x=\"233.0\" y=\"58.0\" class=\"dmut\" text-anchor=\"start\">Loans</text><path d=\"M110,108 L42.0,58.6 A84,84 0 0 1 110.0,24.0 Z\" class=\"dfill\" fill-opacity=\"0.85\"/><text x=\"64.6\" y=\"21.9\" class=\"dmut\" text-anchor=\"middle\">54°</text><rect x=\"216\" y=\"70\" width=\"11\" height=\"11\" class=\"dfill\" fill-opacity=\"0.85\"/><text x=\"233.0\" y=\"80.0\" class=\"dmut\" text-anchor=\"start\">Grants & other</text></svg>"}, {"q": "Explain how an ordinary citizen helps or harms national development.", "steps": ["<b>Helps:</b> paying taxes honestly, working hard, protecting public property, voting wisely, and monitoring projects in the community.", "<b>Harms:</b> evading tax, stealing or damaging public property, demanding and paying bribes, and staying silent when funds are misused."], "fig": null}]}], "questions": [{"type": "obj", "q": "The physical environment consists of ___", "opts": ["land, water, air, plants and animals", "customs, beliefs and festivals", "laws, rules and regulations", "family, school and church"], "ans": 0, "sol": ["The physical environment is made up of the natural features around us.", "Family, customs and laws belong to the social environment."], "tip": null, "fig": null, "id": "envcomp-1", "topic": "envcomp"}, {"type": "obj", "q": "Which of the following is part of the social environment?", "opts": ["The chieftaincy institution", "The Kwahu scarp", "The River Volta", "The harmattan wind"], "ans": 0, "sol": ["Chieftaincy is a human institution, so it belongs to the social environment."], "tip": null, "fig": null, "id": "envcomp-2", "topic": "envcomp"}, {"type": "obj", "q": "The main reason people settle near rivers and lakes is that such places provide ___", "opts": ["free land for building", "protection from all diseases", "cool weather all year round", "water for domestic use, farming and fishing"], "ans": 3, "sol": ["Rivers supply water for drinking, irrigation and fishing, and also serve as routes for transport."], "tip": null, "fig": null, "id": "envcomp-3", "topic": "envcomp"}, {"type": "obj", "q": "Conservation of natural resources means ___", "opts": ["keeping resources unused for ever", "replacing all natural resources with artificial ones", "selling resources to other countries", "using resources wisely so that they last"], "ans": 3, "sol": ["Conservation is careful use and management, not total avoidance of use."], "tip": null, "fig": null, "id": "envcomp-4", "topic": "envcomp"}, {"type": "obj", "q": "The vegetation belt found in the northern part of Ghana is the ___", "opts": ["coastal scrub", "mangrove swamp", "tropical rain forest", "Guinea and Sudan savanna"], "ans": 3, "sol": ["The north is drier, so it carries savanna grassland with scattered drought-resistant trees such as the shea and baobab."], "tip": null, "fig": null, "id": "envcomp-5", "topic": "envcomp"}, {"type": "thy", "q": "(a) Distinguish between the physical environment and the social environment.<br>(b) Explain four ways in which people depend on the physical environment.<br>(c) State three ways in which human activities damage the environment.", "sol": ["(a) The <b>physical environment</b> is made up of the natural surroundings — land, water bodies, air, climate, plants and animals. The <b>social environment</b> is made up of the people around us and what they have created — the family, school, religious bodies, customs, beliefs, laws and institutions such as chieftaincy.", "(b) 1. <b>Food:</b> the soil, rivers and sea provide crops, livestock and fish.", "2. <b>Water:</b> rivers, lakes and underground water supply homes, farms and factories.", "3. <b>Shelter and fuel:</b> timber, clay, sand and stone are used for building, and wood and charcoal for cooking.", "4. <b>Employment and income:</b> farming, fishing, mining, lumbering and tourism all depend on the natural environment.", "(c) Cutting down forests for farming, timber and charcoal; mining that destroys land and pollutes rivers; dumping refuse and sewage into drains and water bodies; bush burning; and over-fishing with unapproved methods."], "marks": 20, "tip": null, "fig": null, "id": "envcomp-6", "topic": "envcomp"}, {"type": "obj", "q": "The practice of planting trees in an area that has never had forest cover is called ___", "opts": ["reafforestation", "afforestation", "deforestation", "irrigation"], "ans": 1, "sol": ["Afforestation is planting trees where there was no forest before; reafforestation is replanting where forest has been cleared."], "tip": null, "fig": null, "id": "degrad-1", "topic": "degrad"}, {"type": "obj", "q": "Which of these is a major cause of the pollution of rivers in south-western Ghana?", "opts": ["Planting of cocoa seedlings", "Fishing with hooks", "Illegal small-scale mining", "Building of schools"], "ans": 2, "sol": ["Galamsey operations wash silt and mercury into the rivers, raising the cost of treating water and destroying aquatic life."], "tip": null, "fig": null, "id": "degrad-2", "topic": "degrad"}, {"type": "obj", "q": "Desertification in northern Ghana is mainly the result of ___", "opts": ["heavy rainfall throughout the year", "planting of economic trees", "removal of vegetation and over-grazing", "building of dams"], "ans": 2, "sol": ["Once the plant cover is removed by burning, over-grazing and fuelwood cutting, the soil is exposed and the land gradually becomes desert-like."], "tip": null, "fig": null, "id": "degrad-3", "topic": "degrad"}, {"type": "obj", "q": "The government body responsible for protecting and improving the environment in Ghana is the ___", "opts": ["National Development Planning Commission", "Ghana Investment Promotion Centre", "Environmental Protection Authority", "Ghana Standards Authority"], "ans": 2, "sol": ["The EPA sets and enforces environmental standards and issues environmental permits.", "Note: it was the Environmental Protection <i>Agency</i> until the Environmental Protection Act, 2025 (Act 1124) re-established it as an <i>Authority</i>. Older textbooks still say Agency; both refer to the same body, the EPA."], "tip": null, "fig": null, "id": "degrad-4", "topic": "degrad"}, {"type": "obj", "q": "Which of these practices helps to control soil erosion on a slope?", "opts": ["Bush burning", "Ploughing up and down the slope", "Sand winning", "Contour ploughing"], "ans": 3, "sol": ["Ploughing along the contour makes ridges that slow the run-off, so less soil is carried away."], "tip": null, "fig": null, "id": "degrad-5", "topic": "degrad"}, {"type": "thy", "q": "(a) What is environmental degradation?<br>(b) Describe four causes of environmental degradation in Ghana.<br>(c) Suggest four measures for controlling environmental degradation.", "sol": ["(a) Environmental degradation is the reduction in the quality and productive capacity of the environment through the destruction of its resources — soil, water, air, forests and wildlife — mainly by human activities.", "(b) 1. <b>Illegal mining (galamsey):</b> pits are left open, farmlands are destroyed and rivers are choked with silt and mercury.", "2. <b>Deforestation:</b> trees are cut for timber, charcoal and farmland faster than they are replaced.", "3. <b>Poor farming practices:</b> shifting cultivation with short fallow periods, over-cropping and bush burning reduce soil fertility.", "4. <b>Poor waste management:</b> refuse, plastics and sewage are dumped into gutters, lagoons and the sea, causing flooding and disease.", "(c) 1. Afforestation and reafforestation programmes, with communities involved in caring for the seedlings.", "2. Strict enforcement of mining and forestry laws, and reclamation of mined land by the companies concerned.", "3. Public education through schools, radio and community durbars on the effects of bush burning and dumping.", "4. Providing alternative livelihoods and modern farming methods so that people are not forced to destroy the land to survive."], "marks": 20, "tip": null, "fig": null, "id": "degrad-6", "topic": "degrad"}, {"type": "obj", "q": "Population census in Ghana is normally conducted every ___ years.", "opts": ["ten", "twenty", "five", "two"], "ans": 0, "sol": ["A national Population and Housing Census is held about once every ten years."], "tip": null, "fig": null, "id": "popn-1", "topic": "popn"}, {"type": "obj", "q": "Population density is defined as the number of people ___", "opts": ["employed in a country", "born in a year", "per unit area of land", "who migrate in a year"], "ans": 2, "sol": ["Density = total population ÷ land area, usually given as persons per square kilometre."], "tip": null, "fig": null, "id": "popn-2", "topic": "popn"}, {"type": "obj", "q": "Which of the following is a pull factor in rural–urban migration?", "opts": ["Low prices for farm produce", "Availability of jobs in the city", "Lack of electricity in the village", "Poor roads in the village"], "ans": 1, "sol": ["Pull factors attract people to the destination; the other three are push factors that drive people away from the village."], "tip": null, "fig": null, "id": "popn-3", "topic": "popn"}, {"type": "obj", "q": "A high dependency ratio in a country means that ___", "opts": ["there are more workers than dependants", "everybody is employed", "a small working population supports many dependants", "the population is falling"], "ans": 2, "sol": ["Dependants are those under 15 and over 64. A high ratio means a heavy burden on each worker and on the state."], "tip": null, "fig": null, "id": "popn-4", "topic": "popn"}, {"type": "obj", "q": "Which of these is NOT an effect of rapid population growth in cities?", "opts": ["Increase in crime", "High unemployment", "Development of slums", "Reduced pressure on social amenities"], "ans": 3, "sol": ["Rapid growth INCREASES pressure on housing, schools, hospitals, water and transport."], "tip": null, "fig": null, "id": "popn-5", "topic": "popn"}, {"type": "thy", "q": "(a) State three sources of population data in Ghana.<br>(b) Explain four effects of rapid population growth on national development.<br>(c) Suggest three ways of reducing rural–urban migration.", "sol": ["(a) The Population and Housing Census; registration of births and deaths (Births and Deaths Registry); sample surveys such as the Ghana Living Standards Survey; records from hospitals, schools and immigration.", "(b) 1. <b>Pressure on social services:</b> schools, hospitals, water and housing become overstretched, lowering the quality of service.", "2. <b>Unemployment:</b> the number of job seekers grows faster than the jobs created, leading to idleness and crime.", "3. <b>Pressure on land and the environment:</b> forests and farmland are converted to housing, and land holdings become smaller.", "4. <b>Low savings and investment:</b> more income goes into feeding and caring for dependants, so little is saved for investment. (A larger population can also provide labour and a bigger market, if it is well educated and employed.)", "(c) Provide social amenities — electricity, water, good roads, schools and clinics — in the rural areas; site factories and agro-processing plants in rural districts to create jobs; improve prices and markets for farm produce and provide credit for young farmers; expand rural education and skills training."], "marks": 20, "tip": null, "fig": null, "id": "popn-6", "topic": "popn"}, {"type": "obj", "q": "Which of these is the safest source of water for a community?", "opts": ["Treated pipe-borne water", "A dugout", "A flowing stream", "An unprotected well"], "ans": 0, "sol": ["Treated water has been filtered and disinfected, so it is free from disease-causing organisms."], "tip": null, "fig": null, "id": "sanit-1", "topic": "sanit"}, {"type": "obj", "q": "Cholera outbreaks in our cities are caused mainly by ___", "opts": ["eating too much fruit", "too much rainfall", "poor sanitation and unsafe water", "overworking"], "ans": 2, "sol": ["Cholera spreads where human waste contaminates water and food."], "tip": null, "fig": null, "id": "sanit-2", "topic": "sanit"}, {"type": "obj", "q": "Which method of waste disposal is most environmentally friendly?", "opts": ["Dumping in gutters", "Open burning", "Sorting and recycling", "Burying plastics in a river bed"], "ans": 2, "sol": ["Recycling turns waste into new products, saves raw materials and reduces what goes to the dump."], "tip": null, "fig": null, "id": "sanit-3", "topic": "sanit"}, {"type": "obj", "q": "The main responsibility for refuse collection in a district lies with the ___", "opts": ["Forestry Commission", "Electoral Commission", "Ghana Health Service", "district assembly"], "ans": 3, "sol": ["Sanitation is one of the functions of the Metropolitan, Municipal and District Assemblies, often through contracted companies."], "tip": null, "fig": null, "id": "sanit-4", "topic": "sanit"}, {"type": "obj", "q": "Which of these practices helps to control malaria in a community?", "opts": ["Burning refuse in the open", "Keeping windows open at night", "Drinking untreated water", "Clearing choked gutters and stagnant water"], "ans": 3, "sol": ["Mosquitoes breed in stagnant water, so clearing gutters and containers destroys the breeding sites."], "tip": null, "fig": null, "id": "sanit-5", "topic": "sanit"}, {"type": "thy", "q": "(a) State four causes of poor sanitation in Ghanaian towns and cities.<br>(b) Explain four effects of poor sanitation on national development.<br>(c) Suggest four ways of improving sanitation in your community.", "sol": ["(a) Indiscriminate dumping of refuse and plastics; too few public toilets and waste containers; weak enforcement of sanitation by-laws; poor attitudes and lack of education; unplanned settlements where collection trucks cannot reach; inadequate funds and equipment at the assemblies.", "(b) 1. <b>Disease:</b> cholera, typhoid and malaria spread, causing deaths and absence from work and school.", "2. <b>Cost to the state:</b> money that could build roads and schools is spent on treating preventable diseases.", "3. <b>Flooding:</b> refuse blocks drains, so towns flood after rain, destroying property and lives.", "4. <b>Loss of tourism and investment:</b> dirty towns and beaches discourage visitors and investors.", "(c) Provide enough waste bins and regular collection; separate waste at home and compost or recycle what can be reused; build and maintain household toilets to stop open defecation; organise regular community clean-up exercises; educate people and enforce sanitation by-laws through the assembly's environmental health officers."], "marks": 20, "tip": null, "fig": null, "id": "sanit-6", "topic": "sanit"}, {"type": "obj", "q": "The organisation responsible for managing disasters in Ghana is ___", "opts": ["NPA", "NHIS", "NABCO", "NADMO"], "ans": 3, "sol": ["The National Disaster Management Organisation coordinates relief and prevention."], "tip": null, "fig": null, "id": "disaster-1", "topic": "disaster"}, {"type": "obj", "q": "Perennial flooding in Ghanaian cities is caused mainly by ___", "opts": ["building on waterways and choked drains", "the shape of the coastline", "lack of rainfall", "too many boreholes"], "ans": 0, "sol": ["When drains are blocked with refuse and buildings sit in the path of water, run-off has nowhere to go."], "tip": null, "fig": null, "id": "disaster-2", "topic": "disaster"}, {"type": "obj", "q": "Which of the following is a man-made disaster?", "opts": ["A tidal wave", "A market fire outbreak", "An earthquake", "A drought"], "ans": 1, "sol": ["Fire outbreaks usually result from human carelessness — illegal connections, naked flames or poor wiring."], "tip": null, "fig": null, "id": "disaster-3", "topic": "disaster"}, {"type": "obj", "q": "The best way to reduce loss of life during a disaster is ___", "opts": ["waiting for donations", "early warning and public education", "moving all people to the cities", "banning all construction"], "ans": 1, "sol": ["Warning people in good time and teaching them what to do saves the most lives."], "tip": null, "fig": null, "id": "disaster-4", "topic": "disaster"}, {"type": "obj", "q": "Which practice increases the risk of drought and bushfires in the savanna?", "opts": ["Indiscriminate bush burning", "Tree planting", "Contour ploughing", "Irrigation"], "ans": 0, "sol": ["Burning destroys the plant cover and soil organisms, leaving the land bare and dry."], "tip": null, "fig": null, "id": "disaster-5", "topic": "disaster"}, {"type": "thy", "q": "(a) Name four natural disasters and two man-made disasters.<br>(b) Explain four effects of flooding on a community.<br>(c) Suggest four measures for preventing or reducing the effects of flooding in your town.", "sol": ["(a) <b>Natural:</b> floods, drought, earthquakes, landslides, rainstorms, epidemics, tidal waves. <b>Man-made:</b> fire outbreaks, road accidents, building collapse, chemical or oil spills, conflicts.", "(b) 1. <b>Loss of life and injury</b>, especially of children and the aged.", "2. <b>Destruction of property</b> — houses, vehicles, shops, food stocks and documents.", "3. <b>Disease outbreaks</b> such as cholera and malaria, as flood water mixes with sewage and leaves stagnant pools.", "4. <b>Disruption of economic and social life</b> — roads and bridges are cut off, schools and markets close, and government spends heavily on relief instead of development.", "(c) Desilt and enlarge drains regularly and stop dumping refuse in them; demolish structures on waterways and enforce building permits; plant trees and maintain green areas so that water soaks into the ground; create early warning systems with the Meteorological Agency and NADMO; educate residents on proper waste disposal."], "marks": 20, "tip": null, "fig": null, "id": "disaster-6", "topic": "disaster"}, {"type": "obj", "q": "Culture can best be described as ___", "opts": ["the wealth of a country", "the total way of life of a people", "the laws of a country", "the religion of a people"], "ans": 1, "sol": ["Culture covers everything a people do, believe and make — language, dress, food, arts, beliefs, values and technology."], "tip": null, "fig": null, "id": "culture-1", "topic": "culture"}, {"type": "obj", "q": "Which of the following is an example of material culture?", "opts": ["Marriage norms", "Kente cloth", "Respect for elders", "Belief in the ancestors"], "ans": 1, "sol": ["Material culture can be seen and touched; the others are non-material."], "tip": null, "fig": null, "id": "culture-2", "topic": "culture"}, {"type": "obj", "q": "Which statement about culture is TRUE?", "opts": ["Culture never changes", "Culture is inherited through the blood", "Culture is learnt and changes over time", "Culture is the same in every society"], "ans": 2, "sol": ["Culture is learnt through socialisation, is shared, and is dynamic — it changes through contact, education and technology."], "tip": null, "fig": null, "id": "culture-3", "topic": "culture"}, {"type": "obj", "q": "Which of these is a harmful cultural practice?", "opts": ["Naming ceremony", "Festival of the first fruits", "Communal labour", "Female genital mutilation"], "ans": 3, "sol": ["FGM injures girls physically and psychologically and is prohibited by law in Ghana."], "tip": null, "fig": null, "id": "culture-4", "topic": "culture"}, {"type": "obj", "q": "Festivals in Ghana help national development mainly because they ___", "opts": ["promote unity and raise funds for development projects", "give people a chance to rest from work", "increase the population", "replace the work of the district assembly"], "ans": 0, "sol": ["Festivals bring citizens and people living abroad home, promote tourism, and are used to raise funds for schools and clinics."], "tip": null, "fig": null, "id": "culture-5", "topic": "culture"}, {"type": "thy", "q": "(a) What is culture?<br>(b) State and explain four characteristics of culture.<br>(c) Explain four ways in which the youth can help preserve Ghana's cultural heritage.", "sol": ["(a) Culture is the total way of life of a people: the language, food, dress, music, arts, beliefs, values, norms, institutions and technology that they share and pass on from one generation to the next.", "(b) 1. <b>Culture is learnt:</b> it is acquired through socialisation, not inherited biologically.", "2. <b>Culture is shared:</b> it belongs to a group, and members behave in ways that others recognise and expect.", "3. <b>Culture is dynamic:</b> it changes with time through education, migration, technology and contact with other peoples.", "4. <b>Culture is transmitted:</b> it is passed from generation to generation through language, teaching and imitation.", "(c) Learning and speaking their local languages and teaching them to younger ones; taking part in festivals, drumming, dancing and traditional games; wearing and promoting Ghanaian dress and eating local foods; studying and documenting oral history and proverbs, and using social media to showcase them; supporting museums, monuments and cultural centres while rejecting harmful practices."], "marks": 20, "tip": null, "fig": null, "id": "culture-6", "topic": "culture"}, {"type": "obj", "q": "The first and most important agent of socialisation is the ___", "opts": ["peer group", "school", "family", "mass media"], "ans": 2, "sol": ["A child first learns language, values and acceptable behaviour from the family."], "tip": null, "fig": null, "id": "social-1", "topic": "social"}, {"type": "obj", "q": "Socialisation is best defined as the process by which an individual ___", "opts": ["learns the norms and values of society", "acquires wealth", "grows physically", "becomes a citizen of another country"], "ans": 0, "sol": ["It is the learning of the ways of one's society, and it continues throughout life."], "tip": null, "fig": null, "id": "social-2", "topic": "social"}, {"type": "obj", "q": "Which of these shows a positive influence of the peer group?", "opts": ["Forming a group to study together", "Persuading a friend to skip classes", "Helping a friend to cheat in an examination", "Encouraging a friend to smoke"], "ans": 0, "sol": ["Peers can encourage good habits as well as bad ones; group study is a positive example."], "tip": null, "fig": null, "id": "social-3", "topic": "social"}, {"type": "obj", "q": "The mass media contributes to socialisation mainly by ___", "opts": ["spreading information, values and new ideas", "providing food for families", "collecting taxes", "employing all young people"], "ans": 0, "sol": ["Radio, television, newspapers and social media shape opinions, language and behaviour, for good or ill."], "tip": null, "fig": null, "id": "social-4", "topic": "social"}, {"type": "obj", "q": "A young person who has been poorly socialised is most likely to ___", "opts": ["show indiscipline and disrespect for rules", "perform well in every examination", "become a good leader", "respect the rights of others"], "ans": 0, "sol": ["Where norms and values have not been properly learnt, deviant behaviour is more likely."], "tip": null, "fig": null, "id": "social-5", "topic": "social"}, {"type": "thy", "q": "(a) What is socialisation?<br>(b) Explain four agents of socialisation and the role each plays.<br>(c) State four effects of negative peer influence on a student.", "sol": ["(a) Socialisation is the lifelong process through which an individual learns and internalises the language, norms, values, roles and skills of his or her society, so as to function as an accepted member of it.", "(b) 1. <b>The family:</b> teaches language, basic values, hygiene, respect and the roles of members; it is the first agent.", "2. <b>The school:</b> gives formal knowledge and skills, teaches punctuality, discipline, co-operation and national values.", "3. <b>The peer group:</b> teaches sharing, competition and independence; it strongly influences dress, speech and choices.", "4. <b>Religious bodies:</b> teach morals, honesty, tolerance and service to others. (The mass media and the community are also agents.)", "(c) Poor academic performance through truancy and lack of study; involvement in drug and alcohol abuse; indiscipline and clashes with school authority leading to suspension or dismissal; early sexual activity, with the risk of pregnancy and infection; involvement in crime and loss of the trust of parents and teachers."], "marks": 20, "tip": null, "fig": null, "id": "social-6", "topic": "social"}, {"type": "obj", "q": "Adolescence is the period of life between ___", "opts": ["birth and childhood", "childhood and adulthood", "middle age and old age", "infancy and toddlerhood"], "ans": 1, "sol": ["It is the transition stage, roughly from the onset of puberty to the start of adult responsibilities."], "tip": null, "fig": null, "id": "adol-1", "topic": "adol"}, {"type": "obj", "q": "Which of these is a common EMOTIONAL change during adolescence?", "opts": ["Growth of hair on the body", "Growth in height", "Change of voice", "Frequent changes of mood"], "ans": 3, "sol": ["Mood swings and a strong desire for independence are emotional changes; the other three are physical."], "tip": null, "fig": null, "id": "adol-2", "topic": "adol"}, {"type": "obj", "q": "The main advantage of adolescent chastity is that it ___", "opts": ["guarantees admission to a university", "protects health, education and future plans", "prevents all diseases", "makes one wealthy immediately"], "ans": 1, "sol": ["Abstaining removes the risk of teenage pregnancy and sexually transmitted infection, and keeps the young person's education on course."], "tip": null, "fig": null, "id": "adol-3", "topic": "adol"}, {"type": "obj", "q": "Which of the following is a likely consequence of teenage pregnancy?", "opts": ["Dropping out of school", "Better health for the mother", "Higher family income", "Improved academic performance"], "ans": 0, "sol": ["Most pregnant teenagers leave school, and young mothers face greater health risks in pregnancy and childbirth."], "tip": null, "fig": null, "id": "adol-4", "topic": "adol"}, {"type": "obj", "q": "A student under pressure from friends to take an unwise decision should FIRST ___", "opts": ["do what the friends say to keep them", "leave school", "think about the consequences and seek advice from a trusted adult", "keep the matter secret from everybody"], "ans": 2, "sol": ["Responsible decision-making means weighing the consequences and getting guidance from a parent, teacher or counsellor."], "tip": null, "fig": null, "id": "adol-5", "topic": "adol"}, {"type": "thy", "q": "(a) State four physical and two emotional changes that take place during adolescence.<br>(b) Explain four benefits of adolescent chastity.<br>(c) Outline the steps in responsible decision-making.", "sol": ["(a) <b>Physical:</b> rapid growth in height and weight; growth of hair in the armpits and pubic region; broadening of the hips in girls and of the shoulders in boys; deepening of the voice in boys; the beginning of menstruation in girls; appearance of pimples.", "<b>Emotional:</b> frequent changes of mood; a strong desire for independence and privacy; increased interest in the opposite sex; concern about appearance and about what peers think.", "(b) 1. It prevents teenage pregnancy, so education is not interrupted.", "2. It protects against sexually transmitted infections, including HIV.", "3. It preserves self-respect and the respect and trust of parents, teachers and the community.", "4. It allows the young person to concentrate on studies, skills and career plans, and to enter marriage later with confidence.", "(c) Identify the problem or the choice clearly; gather correct information about it; list the possible options; weigh the likely consequences of each, short term and long term; check them against your values and goals; seek advice from a parent, teacher or counsellor; take the decision and accept responsibility for it; review the outcome and learn from it."], "marks": 20, "tip": null, "fig": null, "id": "adol-6", "topic": "adol"}, {"type": "obj", "q": "A marriage contracted under the Marriage Ordinance in Ghana is ___", "opts": ["strictly monogamous", "not recognised by law", "always polygamous", "for foreigners only"], "ans": 0, "sol": ["An ordinance marriage is between one man and one woman, and the parties cannot marry another person while it lasts."], "tip": null, "fig": null, "id": "family-1", "topic": "family"}, {"type": "obj", "q": "A family made up of a father, a mother and their children is called a ___ family.", "opts": ["nuclear", "extended", "polygamous", "single-parent"], "ans": 0, "sol": ["The nuclear family is the small unit of parents and their own children."], "tip": null, "fig": null, "id": "family-2", "topic": "family"}, {"type": "obj", "q": "Which of these is a function of the family?", "opts": ["Socialisation of children", "Printing the currency", "Making national laws", "Conducting national elections"], "ans": 0, "sol": ["The family reproduces and socialises the young, supports them economically and gives them identity and emotional security."], "tip": null, "fig": null, "id": "family-3", "topic": "family"}, {"type": "obj", "q": "Responsible parenthood means ___", "opts": ["having as many children as possible", "having the number of children one can cater for", "leaving children with grandparents", "having only male children"], "ans": 1, "sol": ["It means planning the family and meeting the children's needs for food, health, education, guidance and love."], "tip": null, "fig": null, "id": "family-4", "topic": "family"}, {"type": "obj", "q": "Which of the following is a major cause of marital instability?", "opts": ["Poor communication between the couple", "Respect for each other's relatives", "Joint planning of the family budget", "Regular family devotion"], "ans": 0, "sol": ["The other three strengthen a marriage. Infidelity, money problems, interference by relatives and abuse also break marriages."], "tip": null, "fig": null, "id": "family-5", "topic": "family"}, {"type": "thy", "q": "(a) Name three types of marriage in Ghana and state one feature of each.<br>(b) Explain four functions of the family.<br>(c) State four factors that promote stability in marriage.", "sol": ["(a) <b>Customary marriage:</b> contracted according to the customs of the parties, with the payment of bride wealth and the involvement of both families; it may be polygamous. <b>Ordinance marriage:</b> celebrated before a licensed marriage officer or registrar under the Marriage Ordinance; it is strictly monogamous. <b>Islamic marriage:</b> contracted under Islamic law before a licensed Imam and registered; a man may marry more than one wife, subject to the conditions of the faith.", "(b) 1. <b>Reproduction:</b> the family produces children and continues the society.", "2. <b>Socialisation:</b> children learn language, values, norms and skills in the family.", "3. <b>Economic support:</b> the family provides food, clothing, shelter, health care and education.", "4. <b>Emotional and social security:</b> members receive love, care and identity, and are supported in times of difficulty.", "(c) Faithfulness and trust between the couple; good communication and consultation in taking decisions; adequate and honest management of family finances; respect for each other and for each other's relatives, while keeping relatives from interfering; shared values and tolerance; readiness to forgive and to seek counselling when problems arise."], "marks": 20, "tip": null, "fig": null, "id": "family-6", "topic": "family"}, {"type": "obj", "q": "Education that is acquired at home and in the community without a fixed syllabus is ___", "opts": ["distance education", "formal education", "informal education", "non-formal education"], "ans": 2, "sol": ["Informal education is lifelong learning from parents, elders and daily experience."], "tip": null, "fig": null, "id": "educ-1", "topic": "educ"}, {"type": "obj", "q": "Which of these is a benefit of education to national development?", "opts": ["It supplies the skilled manpower the country needs", "It replaces the work of the police", "It reduces the need for hospitals", "It increases the birth rate"], "ans": 0, "sol": ["Educated citizens supply the teachers, nurses, engineers and entrepreneurs a country needs."], "tip": null, "fig": null, "id": "educ-2", "topic": "educ"}, {"type": "obj", "q": "Technical and vocational education is important because it ___", "opts": ["equips people with practical skills for employment", "is cheaper than all other education", "takes the shortest time to complete", "is meant only for weak students"], "ans": 0, "sol": ["TVET trains people in trades such as welding, tailoring, catering and electricals, making self-employment possible."], "tip": null, "fig": null, "id": "educ-3", "topic": "educ"}, {"type": "obj", "q": "Which of these is a major problem facing education in rural Ghana?", "opts": ["Inadequate teachers and teaching materials", "Excessive numbers of teachers", "Too many well-equipped laboratories", "Too many libraries"], "ans": 0, "sol": ["Rural schools often lack trained teachers, books, furniture and science equipment."], "tip": null, "fig": null, "id": "educ-4", "topic": "educ"}, {"type": "obj", "q": "The best way to reduce the number of school drop-outs in a community is to ___", "opts": ["address the causes such as poverty, distance and teenage pregnancy", "close the schools concerned", "increase school fees", "punish parents only"], "ans": 0, "sol": ["Support such as scholarships, feeding programmes, nearby schools and counselling addresses the real reasons children leave."], "tip": null, "fig": null, "id": "educ-5", "topic": "educ"}, {"type": "thy", "q": "(a) Distinguish between formal, informal and non-formal education.<br>(b) Explain four ways in which education contributes to national development.<br>(c) State four problems facing education in Ghana and suggest one solution to each.", "sol": ["(a) <b>Formal</b> education is organised in schools and colleges, follows a syllabus, is taught by trained teachers and leads to certificates. <b>Informal</b> education is unplanned learning from the family, peers and everyday life, with no syllabus or certificate. <b>Non-formal</b> education is organised outside the school system for people who missed formal schooling, such as adult literacy and apprenticeship programmes.", "(b) 1. It produces the trained manpower — doctors, teachers, engineers, technicians — that every sector needs.", "2. It raises productivity and incomes, since educated workers use better methods and technology.", "3. It improves health and family life through knowledge of hygiene, nutrition and family planning.", "4. It produces informed citizens who know their rights and duties, vote wisely and hold leaders accountable, which supports democracy and unity.", "(c) <b>Inadequate infrastructure</b> — build and equip classrooms, libraries and laboratories through government and district assembly funds. <b>Shortage of teachers in rural areas</b> — give incentives such as accommodation and allowances for rural posting. <b>Poverty of parents</b> — expand scholarships, the capitation grant, free feeding and the free SHS support. <b>Mismatch between training and jobs</b> — strengthen TVET and involve industry in designing courses and offering attachments."], "marks": 20, "tip": null, "fig": null, "id": "educ-6", "topic": "educ"}, {"type": "obj", "q": "Ghana attained independence on ___", "opts": ["1st July, 1960", "6th March, 1957", "7th January, 1993", "4th June, 1979"], "ans": 1, "sol": ["Independence was declared on 6 March 1957; Ghana became a republic on 1 July 1960."], "tip": null, "fig": null, "id": "nation-1", "topic": "nation"}, {"type": "obj", "q": "In the national flag of Ghana, the gold colour stands for ___", "opts": ["the forests and farmlands", "the mineral wealth of the country", "the blood of those who died for independence", "African unity"], "ans": 1, "sol": ["Red represents the blood shed for independence, gold the mineral wealth, green the vegetation, and the black star African freedom."], "tip": null, "fig": null, "id": "nation-2", "topic": "nation"}, {"type": "obj", "q": "Which of the following is NOT a feature of a state?", "opts": ["A defined territory", "A sovereign government", "A population", "A common festival"], "ans": 3, "sol": ["The four features of a state are territory, population, government and sovereignty."], "tip": null, "fig": null, "id": "nation-3", "topic": "nation"}, {"type": "obj", "q": "Patriotism is best shown by a citizen who ___", "opts": ["avoids national service", "buys only foreign goods", "criticises every government policy", "obeys the laws and pays taxes willingly"], "ans": 3, "sol": ["Patriotism is love of country shown in action — obeying laws, paying taxes, protecting public property and defending the nation's good name."], "tip": null, "fig": null, "id": "nation-4", "topic": "nation"}, {"type": "obj", "q": "Which of these promotes national unity in Ghana?", "opts": ["Inter-ethnic marriages and the school system", "Discrimination in appointments", "Political violence", "Ethnocentrism"], "ans": 0, "sol": ["Common institutions such as schools, the national service scheme and inter-ethnic marriage bring people of different backgrounds together."], "tip": null, "fig": null, "id": "nation-5", "topic": "nation"}, {"type": "thy", "q": "(a) Distinguish between a nation and a state.<br>(b) Name four national symbols of Ghana and state what each represents.<br>(c) Explain four ways in which the youth can contribute to nation building.", "sol": ["(a) A <b>nation</b> is a group of people bound together by a common history, language, culture and a sense of belonging, whether or not they have their own government. A <b>state</b> is a political unit with four features: a defined territory, a permanent population, a government and sovereignty (supreme power within its borders).", "(b) <b>The national flag</b> — red for the blood of those who fought for independence, gold for mineral wealth, green for vegetation, the black star for African freedom. <b>The coat of arms</b> — represents the authority of the state and its main institutions. <b>The national anthem and pledge</b> — express loyalty and the commitment of citizens to the nation. <b>The mace</b> — the symbol of the authority of Parliament.", "(c) Working hard at school and acquiring employable skills; taking part in communal labour and voluntary service; obeying the laws, paying taxes and protecting public property such as street lights and school furniture; rejecting political violence, tribalism and vote buying, and registering to vote; using their talents and creativity to produce goods and services and to promote Ghana's good name abroad."], "marks": 20, "tip": null, "fig": null, "id": "nation-6", "topic": "nation"}, {"type": "obj", "q": "The Constitution of Ghana currently in force came into effect in ___", "opts": ["1957", "1993", "2000", "1979"], "ans": 1, "sol": ["The 1992 Constitution came into force on 7 January 1993, beginning the Fourth Republic."], "tip": null, "fig": null, "id": "constit-1", "topic": "constit"}, {"type": "obj", "q": "The rule of law means that ___", "opts": ["the police make the laws", "the president is above the law", "only citizens obey the law", "everybody, including those in authority, is subject to the law"], "ans": 3, "sol": ["Equality before the law and the supremacy of the law are its central ideas."], "tip": null, "fig": null, "id": "constit-2", "topic": "constit"}, {"type": "obj", "q": "The doctrine of separation of powers is intended to ___", "opts": ["make government work slowly", "give all power to Parliament", "remove the courts from government", "prevent the abuse of power by any one arm of government"], "ans": 3, "sol": ["Each arm checks the others, so no single arm becomes too powerful."], "tip": null, "fig": null, "id": "constit-3", "topic": "constit"}, {"type": "obj", "q": "Fundamental human rights of Ghanaians are guaranteed in ___ of the 1992 Constitution.", "opts": ["Chapter Twenty", "Chapter Five", "Chapter One", "Chapter Ten"], "ans": 1, "sol": ["Chapter Five sets out the Fundamental Human Rights and Freedoms."], "tip": null, "fig": null, "id": "constit-4", "topic": "constit"}, {"type": "obj", "q": "A constitution that can be amended only through a special and difficult procedure is said to be ___", "opts": ["unwritten", "rigid", "temporary", "flexible"], "ans": 1, "sol": ["Rigid constitutions require special majorities or a referendum; entrenched clauses of Ghana's Constitution need a referendum."], "tip": null, "fig": null, "id": "constit-5", "topic": "constit"}, {"type": "thy", "q": "(a) What is a constitution?<br>(b) State four importance of a constitution to a country.<br>(c) Explain four ways in which the rule of law is promoted in Ghana.", "sol": ["(a) A constitution is the body of fundamental rules, written or unwritten, that establishes the organs of government, defines their powers and limits, and sets out the rights and duties of citizens.", "(b) 1. It defines the powers and functions of the arms of government and prevents abuse of power.", "2. It guarantees the rights and freedoms of citizens and gives them a way of enforcing
