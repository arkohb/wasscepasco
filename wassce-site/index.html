 [{"q": "The marks of 5 students are 12, 15, 15, 18 and 20. Find the mean, median and mode.", "steps": ["Step 1. Mean = (12 + 15 + 15 + 18 + 20) ÷ 5 = 80 ÷ 5 = <b>16</b>.", "Step 2. Arrange in order — they already are. The middle (3rd) value is <b>15</b>, the median.", "Step 3. 15 appears twice, more than any other, so the mode is <b>15</b>."], "fig": "<svg viewBox=\"0 0 320 200\" class=\"dia\" role=\"img\" aria-label=\"Frequency of each mark\" style=\"width:min(100%,368px)\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5.5\" markerHeight=\"5.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dah\"/></marker></defs><line x1=\"34\" y1=\"16\" x2=\"34\" y2=\"166\" class=\"dline\"/><line x1=\"34\" y1=\"166\" x2=\"312\" y2=\"166\" class=\"dline\"/><text x=\"8.0\" y=\"20.0\" class=\"dmut\" text-anchor=\"start\">frequency</text><rect x=\"46.2\" y=\"91.0\" width=\"43.5\" height=\"75.0\" class=\"dfill\"/><text x=\"68.0\" y=\"86.0\" class=\"dmut\" text-anchor=\"middle\">1</text><text x=\"68.0\" y=\"180.0\" class=\"dmut\" text-anchor=\"middle\">12</text><rect x=\"114.2\" y=\"16.0\" width=\"43.5\" height=\"150.0\" class=\"dfill\"/><text x=\"136.0\" y=\"11.0\" class=\"dmut\" text-anchor=\"middle\">2</text><text x=\"136.0\" y=\"180.0\" class=\"dmut\" text-anchor=\"middle\">15</text><rect x=\"182.2\" y=\"91.0\" width=\"43.5\" height=\"75.0\" class=\"dfill\"/><text x=\"204.0\" y=\"86.0\" class=\"dmut\" text-anchor=\"middle\">1</text><text x=\"204.0\" y=\"180.0\" class=\"dmut\" text-anchor=\"middle\">18</text><rect x=\"250.2\" y=\"91.0\" width=\"43.5\" height=\"75.0\" class=\"dfill\"/><text x=\"272.0\" y=\"86.0\" class=\"dmut\" text-anchor=\"middle\">1</text><text x=\"272.0\" y=\"180.0\" class=\"dmut\" text-anchor=\"middle\">20</text></svg>"}, {"q": "In a class of 60, 25 chose Science, 20 Arts and 15 Business. Find the pie chart angles.", "steps": ["Step 1. Angle = <span class=\"fr\"><span>frequency</span><span>total</span></span> × 360°.", "Step 2. Science = <span class=\"fr\"><span>25</span><span>60</span></span> × 360 = <b>150°</b>;  Arts = <span class=\"fr\"><span>20</span><span>60</span></span> × 360 = <b>120°</b>.", "Step 3. Business = <span class=\"fr\"><span>15</span><span>60</span></span> × 360 = <b>90°</b>.  Check: 150 + 120 + 90 = 360 ✓"], "fig": "<svg viewBox=\"0 0 320 220\" class=\"dia\" role=\"img\" aria-label=\"Pie chart of subject choices\" style=\"width:min(100%,368px)\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5.5\" markerHeight=\"5.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dah\"/></marker></defs><path d=\"M110,108 L110.0,24.0 A84,84 0 0 1 152.0,180.7 Z\" class=\"dfill\" fill-opacity=\"0.25\"/><text x=\"206.6\" y=\"85.1\" class=\"dmut\" text-anchor=\"middle\">150°</text><rect x=\"216\" y=\"26\" width=\"11\" height=\"11\" class=\"dfill\" fill-opacity=\"0.25\"/><text x=\"233.0\" y=\"36.0\" class=\"dmut\" text-anchor=\"start\">Science</text><path d=\"M110,108 L152.0,180.7 A84,84 0 0 1 26.0,108.0 Z\" class=\"dfill\" fill-opacity=\"0.55\"/><text x=\"60.0\" y=\"197.6\" class=\"dmut\" text-anchor=\"middle\">120°</text><rect x=\"216\" y=\"48\" width=\"11\" height=\"11\" class=\"dfill\" fill-opacity=\"0.55\"/><text x=\"233.0\" y=\"58.0\" class=\"dmut\" text-anchor=\"start\">Arts</text><path d=\"M110,108 L26.0,108.0 A84,84 0 0 1 110.0,24.0 Z\" class=\"dfill\" fill-opacity=\"0.85\"/><text x=\"39.3\" y=\"40.3\" class=\"dmut\" text-anchor=\"middle\">90°</text><rect x=\"216\" y=\"70\" width=\"11\" height=\"11\" class=\"dfill\" fill-opacity=\"0.85\"/><text x=\"233.0\" y=\"80.0\" class=\"dmut\" text-anchor=\"start\">Business</text></svg>"}]}, {"id": "cumfreq", "name": "Cumulative frequency & quartiles", "section": "Statistics & Probability", "notes": ["Cumulative frequency is a running total of the frequencies.", "An ogive is the graph of cumulative frequency against the UPPER class boundary.", "Median = the value at N/2;  lower quartile Q₁ at N/4;  upper quartile Q₃ at 3N/4 — read them off the ogive.", "Interquartile range = Q₃ − Q₁;  semi-interquartile range = (Q₃ − Q₁)/2.", "By formula: value = L + [(position − cf before) ÷ f] × c, where L is the lower class boundary and c the class width.", "Class boundaries remove the gaps: the class 21–30 has boundaries 20.5 and 30.5."], "plain": "A cumulative frequency table answers 'how many scored LESS THAN this?' Its graph, the ogive, lets you read off the middle value (median) and the quartiles that split the data into four equal parts.", "examples": [{"q": "From an ogive of 60 values, the 15th value is 28 and the 45th value is 52. Find the interquartile range.", "steps": ["Step 1. Q₁ is at N/4 = 60 ÷ 4 = the 15th value ⇒ Q₁ = 28.", "Step 2. Q₃ is at 3N/4 = 45th value ⇒ Q₃ = 52.", "Step 3. Interquartile range = 52 − 28 = <b>24</b>; the semi-interquartile range is 12."], "fig": null}, {"q": "In a class of 50, the ogive shows 32 students scored less than 40 marks. How many scored 40 or more, and what percentage is that?", "steps": ["Step 1. Read the cumulative frequency at 40: 32 students.", "Step 2. Scored 40 or more = 50 − 32 = <b>18 students</b>.", "Step 3. Percentage = <span class=\"fr\"><span>18</span><span>50</span></span> × 100 = <b>36%</b>."], "fig": null}]}, {"id": "prob", "name": "Probability", "section": "Statistics & Probability", "notes": ["P(event) = favourable outcomes ÷ total outcomes;  0 ≤ P ≤ 1", "P(not A) = 1 − P(A)", "Independent events: P(A and B) = P(A) × P(B)", "Mutually exclusive events: P(A or B) = P(A) + P(B)", "Without replacement, the second denominator drops by 1."], "plain": "Probability measures how likely something is, on a scale from 0 (impossible) to 1 (certain). It is simply: the number of ways you can win, divided by the total number of ways.", "examples": [{"q": "A bag has 3 red, 5 green and 2 yellow balls. One ball is picked. Find P(green) and P(not green).", "steps": ["Step 1. Total = 3 + 5 + 2 = 10 balls.", "Step 2. P(green) = <span class=\"fr\"><span>5</span><span>10</span></span> = <b><span class=\"fr\"><span>1</span><span>2</span></span></b>.", "Step 3. P(not green) = 1 − <span class=\"fr\"><span>1</span><span>2</span></span> = <b><span class=\"fr\"><span>1</span><span>2</span></span></b>."], "fig": null}, {"q": "Two balls are picked from the bag above, one after the other, WITHOUT replacement. Find P(both red).", "steps": ["Step 1. First ball red: <span class=\"fr\"><span>3</span><span>10</span></span>.", "Step 2. Now only 2 red balls are left out of 9: <span class=\"fr\"><span>2</span><span>9</span></span>.", "Step 3. Multiply along the branch: <span class=\"fr\"><span>3</span><span>10</span></span> × <span class=\"fr\"><span>2</span><span>9</span></span> = <span class=\"fr\"><span>6</span><span>90</span></span> = <b><span class=\"fr\"><span>1</span><span>15</span></span></b>."], "fig": "<svg viewBox=\"0 0 364 170\" class=\"dia\" role=\"img\" aria-label=\"Probability tree for the first pick\" style=\"width:min(100%,418px)\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5.5\" markerHeight=\"5.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dah\"/></marker></defs><rect x=\"112.0\" y=\"10\" width=\"140\" height=\"42\" rx=\"7\" class=\"dfill\"/><text x=\"182.0\" y=\"27.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">First pick (10</text><text x=\"182.0\" y=\"41.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">balls)</text><rect x=\"10.0\" y=\"92\" width=\"104\" height=\"50\" rx=\"7\" class=\"dbox\"/><text x=\"62.0\" y=\"120.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">Red 3/10</text><path d=\"M182.0,52 L182.0,72 L62.0,72 L62.0,92\" class=\"dline\"/><text x=\"62.0\" y=\"158.0\" class=\"dmut\" text-anchor=\"middle\">then 2/9 red</text><rect x=\"130.0\" y=\"92\" width=\"104\" height=\"50\" rx=\"7\" class=\"dbox\"/><text x=\"182.0\" y=\"120.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">Green 5/10</text><path d=\"M182.0,52 L182.0,72 L182.0,72 L182.0,92\" class=\"dline\"/><rect x=\"250.0\" y=\"92\" width=\"104\" height=\"50\" rx=\"7\" class=\"dbox\"/><text x=\"302.0\" y=\"120.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">Yellow 2/10</text><path d=\"M182.0,52 L182.0,72 L302.0,72 L302.0,92\" class=\"dline\"/></svg>"}]}, {"id": "vec", "name": "Vectors & transformations", "section": "Vectors & Transformation", "notes": ["Add or subtract vectors component by component;  |(x, y)| = √(x² + y²)", "AB = OB − OA (position vectors).", "Reflection: in the x-axis (x, y) → (x, −y); in the y-axis (x, y) → (−x, y); in y = x, (x, y) → (y, x).", "Rotation about the origin: 90° anticlockwise (x, y) → (−y, x); 180° (x, y) → (−x, −y).", "Translation by (a, b): (x, y) → (x + a, y + b).  Enlargement, scale factor k, centre origin: (x, y) → (kx, ky); areas scale by k²."], "plain": "A vector has both size and direction — like saying '5 km north' instead of just '5 km'. You add vectors by adding the top numbers and the bottom numbers separately.", "examples": [{"q": "Given a = <span class=\"mx\"><span class=\"mr\"><span>4</span></span><span class=\"mr\"><span>−3</span></span></span> and b = <span class=\"mx\"><span class=\"mr\"><span>−1</span></span><span class=\"mr\"><span>5</span></span></span>, find a + 2b and |a|.", "steps": ["Step 1. 2b = <span class=\"mx\"><span class=\"mr\"><span>−2</span></span><span class=\"mr\"><span>10</span></span></span>.", "Step 2. a + 2b = <span class=\"mx\"><span class=\"mr\"><span>4 − 2</span></span><span class=\"mr\"><span>−3 + 10</span></span></span> = <b><span class=\"mx\"><span class=\"mr\"><span>2</span></span><span class=\"mr\"><span>7</span></span></span></b>.", "Step 3. |a| = √(4² + (−3)²) = √(16 + 9) = √25 = <b>5</b>."], "fig": null}, {"q": "The point P(3, −2) is reflected in the y-axis, then translated by (1, 4). Find the final position.", "steps": ["Step 1. Reflection in the y-axis changes the sign of x: (3, −2) → (−3, −2).", "Step 2. Translation adds the vector: (−3 + 1, −2 + 4).", "Step 3. Final position: <b>(−2, 2)</b>."], "fig": "<svg viewBox=\"0 0 320 260\" class=\"graph\" role=\"img\" aria-label=\"Graph\"><line x1=\"26.0\" y1=\"234.0\" x2=\"26.0\" y2=\"26.0\" class=\"gg\"/><text x=\"26.0\" y=\"143.0\" class=\"gt\" text-anchor=\"middle\">−5</text><line x1=\"52.8\" y1=\"234.0\" x2=\"52.8\" y2=\"26.0\" class=\"gg\"/><text x=\"52.8\" y=\"143.0\" class=\"gt\" text-anchor=\"middle\">−4</text><line x1=\"79.6\" y1=\"234.0\" x2=\"79.6\" y2=\"26.0\" class=\"gg\"/><text x=\"79.6\" y=\"143.0\" class=\"gt\" text-anchor=\"middle\">−3</text><line x1=\"106.4\" y1=\"234.0\" x2=\"106.4\" y2=\"26.0\" class=\"gg\"/><text x=\"106.4\" y=\"143.0\" class=\"gt\" text-anchor=\"middle\">−2</text><line x1=\"133.2\" y1=\"234.0\" x2=\"133.2\" y2=\"26.0\" class=\"gg\"/><text x=\"133.2\" y=\"143.0\" class=\"gt\" text-anchor=\"middle\">−1</text><line x1=\"160.0\" y1=\"234.0\" x2=\"160.0\" y2=\"26.0\" class=\"gg\"/><line x1=\"186.8\" y1=\"234.0\" x2=\"186.8\" y2=\"26.0\" class=\"gg\"/><text x=\"186.8\" y=\"143.0\" class=\"gt\" text-anchor=\"middle\">1</text><line x1=\"213.6\" y1=\"234.0\" x2=\"213.6\" y2=\"26.0\" class=\"gg\"/><text x=\"213.6\" y=\"143.0\" class=\"gt\" text-anchor=\"middle\">2</text><line x1=\"240.4\" y1=\"234.0\" x2=\"240.4\" y2=\"26.0\" class=\"gg\"/><text x=\"240.4\" y=\"143.0\" class=\"gt\" text-anchor=\"middle\">3</text><line x1=\"267.2\" y1=\"234.0\" x2=\"267.2\" y2=\"26.0\" class=\"gg\"/><text x=\"267.2\" y=\"143.0\" class=\"gt\" text-anchor=\"middle\">4</text><line x1=\"294.0\" y1=\"234.0\" x2=\"294.0\" y2=\"26.0\" class=\"gg\"/><text x=\"294.0\" y=\"143.0\" class=\"gt\" text-anchor=\"middle\">5</text><line x1=\"26.0\" y1=\"234.0\" x2=\"294.0\" y2=\"234.0\" class=\"gg\"/><text x=\"155.0\" y=\"237.5\" class=\"gt\" text-anchor=\"end\">−4</text><line x1=\"26.0\" y1=\"208.0\" x2=\"294.0\" y2=\"208.0\" class=\"gg\"/><text x=\"155.0\" y=\"211.5\" class=\"gt\" text-anchor=\"end\">−3</text><line x1=\"26.0\" y1=\"182.0\" x2=\"294.0\" y2=\"182.0\" class=\"gg\"/><text x=\"155.0\" y=\"185.5\" class=\"gt\" text-anchor=\"end\">−2</text><line x1=\"26.0\" y1=\"156.0\" x2=\"294.0\" y2=\"156.0\" class=\"gg\"/><text x=\"155.0\" y=\"159.5\" class=\"gt\" text-anchor=\"end\">−1</text><line x1=\"26.0\" y1=\"130.0\" x2=\"294.0\" y2=\"130.0\" class=\"gg\"/><line x1=\"26.0\" y1=\"104.0\" x2=\"294.0\" y2=\"104.0\" class=\"gg\"/><text x=\"155.0\" y=\"107.5\" class=\"gt\" text-anchor=\"end\">1</text><line x1=\"26.0\" y1=\"78.0\" x2=\"294.0\" y2=\"78.0\" class=\"gg\"/><text x=\"155.0\" y=\"81.5\" class=\"gt\" text-anchor=\"end\">2</text><line x1=\"26.0\" y1=\"52.0\" x2=\"294.0\" y2=\"52.0\" class=\"gg\"/><text x=\"155.0\" y=\"55.5\" class=\"gt\" text-anchor=\"end\">3</text><line x1=\"26.0\" y1=\"26.0\" x2=\"294.0\" y2=\"26.0\" class=\"gg\"/><text x=\"155.0\" y=\"29.5\" class=\"gt\" text-anchor=\"end\">4</text><line x1=\"26.0\" y1=\"130.0\" x2=\"294.0\" y2=\"130.0\" class=\"ga\"/><line x1=\"160.0\" y1=\"234.0\" x2=\"160.0\" y2=\"26.0\" class=\"ga\"/><circle cx=\"240.4\" cy=\"182.0\" r=\"3.5\" class=\"gp\"/><text x=\"246.4\" y=\"176.0\" class=\"gt gpt\">P</text><circle cx=\"79.6\" cy=\"182.0\" r=\"3.5\" class=\"gp\"/><text x=\"85.6\" y=\"176.0\" class=\"gt gpt\">P′</text><circle cx=\"106.4\" cy=\"78.0\" r=\"3.5\" class=\"gp\"/><text x=\"112.4\" y=\"72.0\" class=\"gt gpt\">P″</text></svg>"}]}], "questions": [{"type": "obj", "q": "Convert 243<sub>five</sub> to a base ten number.", "opts": ["63", "73", "78", "48"], "ans": 1, "sol": ["243<sub>five</sub> = 2 × 5<sup>2</sup> + 4 × 5<sup>1</sup> + 3 × 5<sup>0</sup>", "= 50 + 20 + 3 = 73"], "tip": null, "fig": null, "id": "bases-1", "topic": "bases"}, {"type": "obj", "q": "Express 45 in base two.", "opts": ["100101<sub>two</sub>", "101011<sub>two</sub>", "110101<sub>two</sub>", "101101<sub>two</sub>"], "ans": 3, "sol": ["45 ÷ 2 = 22 r 1; 22 ÷ 2 = 11 r 0; 11 ÷ 2 = 5 r 1; 5 ÷ 2 = 2 r 1; 2 ÷ 2 = 1 r 0; 1 ÷ 2 = 0 r 1", "Reading the remainders upwards: 101101<sub>two</sub>"], "tip": null, "fig": null, "id": "bases-2", "topic": "bases"}, {"type": "obj", "q": "If 23<sub>x</sub> = 17<sub>ten</sub>, find the value of x.", "opts": ["7", "5", "6", "8"], "ans": 0, "sol": ["23<sub>x</sub> = 2x + 3", "2x + 3 = 17 ⇒ 2x = 14 ⇒ x = 7"], "tip": null, "fig": null, "id": "bases-3", "topic": "bases"}, {"type": "obj", "q": "Evaluate 110<sub>two</sub> × 11<sub>two</sub>, leaving your answer in base two.", "opts": ["10010<sub>two</sub>", "11010<sub>two</sub>", "1001<sub>two</sub>", "10110<sub>two</sub>"], "ans": 0, "sol": ["110<sub>two</sub> = 6 and 11<sub>two</sub> = 3", "6 × 3 = 18", "18 = 16 + 2 = 10010<sub>two</sub>"], "tip": null, "fig": null, "id": "bases-4", "topic": "bases"}, {"type": "obj", "q": "Simplify 346<sub>seven</sub> + 254<sub>seven</sub>, giving your answer in base seven.", "opts": ["533<sub>seven</sub>", "643<sub>seven</sub>", "633<sub>seven</sub>", "623<sub>seven</sub>"], "ans": 2, "sol": ["Add column by column from the right, carrying 7s.", "6 + 4 = 10 = 1 × 7 + 3 → write 3, carry 1", "4 + 5 + 1 = 10 = 1 × 7 + 3 → write 3, carry 1", "3 + 2 + 1 = 6 → write 6", "Answer: 633<sub>seven</sub>"], "tip": null, "fig": null, "id": "bases-5", "topic": "bases"}, {"type": "obj", "q": "Which of the following numbers is the greatest?", "opts": ["11<sub>four</sub>", "101<sub>two</sub>", "12<sub>three</sub>", "10<sub>six</sub>"], "ans": 3, "sol": ["10<sub>six</sub> = 6", "12<sub>three</sub> = 3 + 2 = 5", "11<sub>four</sub> = 4 + 1 = 5", "101<sub>two</sub> = 4 + 1 = 5", "The greatest is 10<sub>six</sub>."], "tip": null, "fig": null, "id": "bases-6", "topic": "bases"}, {"type": "thy", "q": "(a) Convert 1011.101<sub>two</sub> to a base ten number.<br>(b) Find n if 124<sub>n</sub> = 232<sub>five</sub>.<br>(c) Express 67 in base three.", "sol": ["(a) 1011.101<sub>two</sub> = 1×2<sup>3</sup> + 0×2<sup>2</sup> + 1×2<sup>1</sup> + 1×2<sup>0</sup> + 1×2<sup>−1</sup> + 0×2<sup>−2</sup> + 1×2<sup>−3</sup>", "= 8 + 0 + 2 + 1 + 0.5 + 0 + 0.125 = <b>11.625</b>", "(b) 232<sub>five</sub> = 2×25 + 3×5 + 2 = 67", "124<sub>n</sub> = n<sup>2</sup> + 2n + 4, so n<sup>2</sup> + 2n + 4 = 67 ⇒ n<sup>2</sup> + 2n − 63 = 0", "(n + 9)(n − 7) = 0 ⇒ n = 7 (a base cannot be negative, and the digit 4 needs n > 4). <b>n = 7</b>", "(c) 67 ÷ 3 = 22 r 1; 22 ÷ 3 = 7 r 1; 7 ÷ 3 = 2 r 1; 2 ÷ 3 = 0 r 2", "Reading upwards: <b>2111<sub>three</sub></b>"], "marks": 10, "tip": null, "fig": null, "id": "bases-7", "topic": "bases"}, {"type": "thy", "q": "(a) Simplify 1101<sub>two</sub> + 111<sub>two</sub> − 1010<sub>two</sub>, leaving the answer in base two.<br>(b) Find y if 2y1<sub>three</sub> = 25<sub>ten</sub>.<br>(c) Write down the largest three-digit number in base six and express it in base ten.", "sol": ["(a) Convert to base ten: 1101<sub>two</sub> = 13, 111<sub>two</sub> = 7, 1010<sub>two</sub> = 10", "13 + 7 − 10 = 10 = <b>1010<sub>two</sub></b>", "(b) 2y1<sub>three</sub> = 2×9 + 3y + 1 = 19 + 3y", "19 + 3y = 25 ⇒ 3y = 6 ⇒ <b>y = 2</b> (valid, since 2 < 3)", "(c) The largest digit in base six is 5, so the number is 555<sub>six</sub>", "555<sub>six</sub> = 5×36 + 5×6 + 5 = <b>215</b>"], "marks": 10, "tip": null, "fig": null, "id": "bases-8", "topic": "bases"}, {"type": "obj", "q": "Find the value of 29 (mod 6).", "opts": ["4", "2", "3", "5"], "ans": 3, "sol": ["29 = 4 × 6 + 5", "29 ≡ 5 (mod 6)"], "tip": null, "fig": null, "id": "mod-1", "topic": "mod"}, {"type": "obj", "q": "Evaluate (17 × 23) (mod 5).", "opts": ["3", "1", "2", "4"], "ans": 1, "sol": ["17 ≡ 2 (mod 5) and 23 ≡ 3 (mod 5)", "2 × 3 = 6 ≡ 1 (mod 5)"], "tip": null, "fig": null, "id": "mod-2", "topic": "mod"}, {"type": "obj", "q": "Solve 3x ≡ 2 (mod 7).", "opts": ["x = 6", "x = 5", "x = 4", "x = 3"], "ans": 3, "sol": ["Test values: 3 × 3 = 9 = 7 + 2 ≡ 2 (mod 7)", "So x = 3"], "tip": "Check the other options too: 3×4 ≡ 5, 3×5 ≡ 1, 3×6 ≡ 4 (mod 7).", "fig": null, "id": "mod-3", "topic": "mod"}, {"type": "obj", "q": "Today is Wednesday. What day of the week will it be in 100 days' time?", "opts": ["Thursday", "Tuesday", "Friday", "Saturday"], "ans": 2, "sol": ["Days repeat every 7, so work in mod 7.", "100 = 14 × 7 + 2, so 100 ≡ 2 (mod 7)", "Two days after Wednesday is Friday."], "tip": null, "fig": null, "id": "mod-4", "topic": "mod"}, {"type": "obj", "q": "In modulo 9, find the additive inverse of 4.", "opts": ["5", "1", "4", "3"], "ans": 0, "sol": ["The additive inverse b satisfies 4 + b ≡ 0 (mod 9)", "4 + 5 = 9 ≡ 0, so b = 5"], "tip": null, "fig": null, "id": "mod-5", "topic": "mod"}, {"type": "obj", "q": "Find the remainder when 2<sup>10</sup> is divided by 11.", "opts": ["2", "1", "10", "0"], "ans": 1, "sol": ["2<sup>5</sup> = 32 = 2 × 11 + 10, so 2<sup>5</sup> ≡ 10 ≡ −1 (mod 11)", "2<sup>10</sup> = (2<sup>5</sup>)<sup>2</sup> ≡ (−1)<sup>2</sup> = 1 (mod 11)"], "tip": null, "fig": null, "id": "mod-6", "topic": "mod"}, {"type": "thy", "q": "(a) Construct a multiplication table in modulo 5 for the set {1, 2, 3, 4}.<br>(b) Use your table to find: (i) 3 × 4 (mod 5); (ii) the multiplicative inverse of 3; (iii) the value of x for which 4x ≡ 3 (mod 5).", "sol": ["(a) <table class=\"mt\"><tr><th>×</th><th>1</th><th>2</th><th>3</th><th>4</th></tr><tr><th>1</th><td>1</td><td>2</td><td>3</td><td>4</td></tr><tr><th>2</th><td>2</td><td>4</td><td>1</td><td>3</td></tr><tr><th>3</th><td>3</td><td>1</td><td>4</td><td>2</td></tr><tr><th>4</th><td>4</td><td>3</td><td>2</td><td>1</td></tr></table>", "(b)(i) From the table, row 3, column 4: <b>3 × 4 ≡ 2</b>", "(ii) Look for 1 in row 3: 3 × 2 ≡ 1, so the inverse of 3 is <b>2</b>", "(iii) Look for 3 in row 4: 4 × 2 ≡ 3, so <b>x = 2</b>"], "marks": 10, "tip": null, "fig": null, "id": "mod-7", "topic": "mod"}, {"type": "thy", "q": "(a) Kofi takes a tablet every 8 hours, starting at 6:00 a.m. on Monday. On what day and at what time does he take the 20th tablet?<br>(b) Evaluate (5 + 6) × 4 in modulo 7.<br>(c) Find all values of x, 0 ≤ x < 7, such that x<sup>2</sup> ≡ 2 (mod 7).", "sol": ["(a) Between the 1st and 20th tablets there are 19 intervals.", "19 × 8 = 152 hours = 6 × 24 + 8 = 6 days 8 hours", "Monday 6:00 a.m. + 6 days = Sunday 6:00 a.m.; + 8 hours = <b>Sunday, 2:00 p.m.</b>", "(b) 5 + 6 = 11 ≡ 4 (mod 7); 4 × 4 = 16 ≡ <b>2</b> (mod 7)", "(c) Squares mod 7: 0→0, 1→1, 2→4, 3→2, 4→2, 5→4, 6→1", "So <b>x = 3 or x = 4</b>"], "marks": 10, "tip": null, "fig": null, "id": "mod-8", "topic": "mod"}, {"type": "obj", "q": "Evaluate 2<span class=\"fr\"><span>1</span><span>3</span></span> ÷ 1<span class=\"fr\"><span>3</span><span>4</span></span>.", "opts": ["1<span class=\"fr\"><span>1</span><span>3</span></span>", "1<span class=\"fr\"><span>1</span><span>4</span></span>", "4<span class=\"fr\"><span>1</span><span>12</span></span>", "<span class=\"fr\"><span>3</span><span>4</span></span>"], "ans": 0, "sol": ["2<span class=\"fr\"><span>1</span><span>3</span></span> = <span class=\"fr\"><span>7</span><span>3</span></span> and 1<span class=\"fr\"><span>3</span><span>4</span></span> = <span class=\"fr\"><span>7</span><span>4</span></span>", "<span class=\"fr\"><span>7</span><span>3</span></span> × <span class=\"fr\"><span>4</span><span>7</span></span> = <span class=\"fr\"><span>4</span><span>3</span></span> = 1<span class=\"fr\"><span>1</span><span>3</span></span>"], "tip": null, "fig": null, "id": "approx-1", "topic": "approx"}, {"type": "obj", "q": "Express 0.0004072 in standard form.", "opts": ["4.072 × 10<sup>−5</sup>", "4.072 × 10<sup>4</sup>", "4.072 × 10<sup>−4</sup>", "4.072 × 10<sup>−3</sup>"], "ans": 2, "sol": ["Move the decimal point 4 places to the right to get 4.072.", "So 0.0004072 = 4.072 × 10<sup>−4</sup>"], "tip": null, "fig": null, "id": "approx-2", "topic": "approx"}, {"type": "obj", "q": "Round 0.0045678 to three significant figures.", "opts": ["0.0046", "0.00457", "0.005", "0.004568"], "ans": 1, "sol": ["The first significant figure is 4; the first three are 4, 5, 6.", "The next digit is 7 (≥ 5), so round 6 up to 7.", "0.0045678 ≈ 0.00457"], "tip": null, "fig": null, "id": "approx-3", "topic": "approx"}, {"type": "obj", "q": "Simplify <span class=\"fr\"><span>0.0018 × 0.24</span><span>0.36</span></span>.", "opts": ["0.012", "0.12", "0.0012", "0.00012"], "ans": 2, "sol": ["0.0018 × 0.24 = 0.000432", "0.000432 ÷ 0.36 = 0.0012"], "tip": null, "fig": null, "id": "approx-4", "topic": "approx"}, {"type": "obj", "q": "Express 0.272727… (0.27 recurring) as a fraction in its lowest terms.", "opts": ["<span class=\"fr\"><span>3</span><span>11</span></span>", "<span class=\"fr\"><span>27</span><span>100</span></span>", "<span class=\"fr\"><span>2</span><span>7</span></span>", "<span class=\"fr\"><span>11</span><span>40</span></span>"], "ans": 0, "sol": ["Let r = 0.2727…; then 100r = 27.2727…", "100r − r = 27 ⇒ 99r = 27 ⇒ r = <span class=\"fr\"><span>27</span><span>99</span></span> = <span class=\"fr\"><span>3</span><span>11</span></span>"], "tip": null, "fig": null, "id": "approx-5", "topic": "approx"}, {"type": "obj", "q": "A man spent <span class=\"fr\"><span>2</span><span>5</span></span> of his money on rent and <span class=\"fr\"><span>1</span><span>3</span></span> of the remainder on food. What fraction of his money is left?", "opts": ["<span class=\"fr\"><span>3</span><span>5</span></span>", "<span class=\"fr\"><span>1</span><span>5</span></span>", "<span class=\"fr\"><span>2</span><span>5</span></span>", "<span class=\"fr\"><span>4</span><span>15</span></span>"], "ans": 2, "sol": ["After rent: 1 − <span class=\"fr\"><span>2</span><span>5</span></span> = <span class=\"fr\"><span>3</span><span>5</span></span>", "Food: <span class=\"fr\"><span>1</span><span>3</span></span> × <span class=\"fr\"><span>3</span><span>5</span></span> = <span class=\"fr\"><span>1</span><span>5</span></span>", "Left: <span class=\"fr\"><span>3</span><span>5</span></span> − <span class=\"fr\"><span>1</span><span>5</span></span> = <span class=\"fr\"><span>2</span><span>5</span></span>"], "tip": null, "fig": null, "id": "approx-6", "topic": "approx"}, {"type": "thy", "q": "(a) Without using a calculator, evaluate (3<span class=\"fr\"><span>1</span><span>4</span></span> − 1<span class=\"fr\"><span>5</span><span>6</span></span>) ÷ 2<span class=\"fr\"><span>5</span><span>6</span></span>.<br>(b) By rounding each number to one significant figure, estimate <span class=\"fr\"><span>49.8 × 0.0312</span><span>0.195</span></span>.<br>(c) Find the exact value of the expression in (b), correct to three significant figures.", "sol": ["(a) 3<span class=\"fr\"><span>1</span><span>4</span></span> − 1<span class=\"fr\"><span>5</span><span>6</span></span> = <span class=\"fr\"><span>13</span><span>4</span></span> − <span class=\"fr\"><span>11</span><span>6</span></span> = <span class=\"fr\"><span>39</span><span>12</span></span> − <span class=\"fr\"><span>22</span><span>12</span></span> = <span class=\"fr\"><span>17</span><span>12</span></span>", "<span class=\"fr\"><span>17</span><span>12</span></span> ÷ <span class=\"fr\"><span>17</span><span>6</span></span> = <span class=\"fr\"><span>17</span><span>12</span></span> × <span class=\"fr\"><span>6</span><span>17</span></span> = <b><span class=\"fr\"><span>1</span><span>2</span></span></b>", "(b) 49.8 ≈ 50, 0.0312 ≈ 0.03, 0.195 ≈ 0.2 ⇒ <span class=\"fr\"><span>50 × 0.03</span><span>0.2</span></span> = <span class=\"fr\"><span>1.5</span><span>0.2</span></span> = <b>7.5</b>", "(c) 49.8 × 0.0312 = 1.55376; 1.55376 ÷ 0.195 = 7.968", "≈ <b>7.97</b> (3 s.f.)"], "marks": 10, "tip": null, "fig": null, "id": "approx-7", "topic": "approx"}, {"type": "thy", "q": "(a) A student measured the length of a rod as 4.8 cm instead of 5.0 cm. Calculate the percentage error.<br>(b) Evaluate <span class=\"fr\"><span>(6.3 × 10<sup>5</sup>) × (4 × 10<sup>−2</sup>)</span><span>1.8 × 10<sup>3</sup></span></span>, leaving your answer in standard form.<br>(c) A farmer gave <span class=\"fr\"><span>3</span><span>8</span></span> of his land to his first son and <span class=\"fr\"><span>2</span><span>5</span></span> of the remainder to his second son. He kept the rest, which was 15 hectares. What was the size of the whole farm?", "sol": ["(a) Error = 5.0 − 4.8 = 0.2 cm; percentage error = <span class=\"fr\"><span>0.2</span><span>5.0</span></span> × 100% = <b>4%</b>", "(b) Numerator: 6.3 × 4 × 10<sup>5 − 2</sup> = 25.2 × 10<sup>3</sup>", "<span class=\"fr\"><span>25.2 × 10<sup>3</sup></span><span>1.8 × 10<sup>3</sup></span></span> = 14 = <b>1.4 × 10<sup>1</sup></b>", "(c) Remainder after first son: 1 − <span class=\"fr\"><span>3</span><span>8</span></span> = <span class=\"fr\"><span>5</span><span>8</span></span>", "Second son: <span class=\"fr\"><span>2</span><span>5</span></span> × <span class=\"fr\"><span>5</span><span>8</span></span> = <span class=\"fr\"><span>1</span><span>4</span></span>", "Kept: <span class=\"fr\"><span>5</span><span>8</span></span> − <span class=\"fr\"><span>1</span><span>4</span></span> = <span class=\"fr\"><span>3</span><span>8</span></span> of the farm", "<span class=\"fr\"><span>3</span><span>8</span></span> × T = 15 ⇒ T = 15 × <span class=\"fr\"><span>8</span><span>3</span></span> = <b>40 hectares</b>"], "marks": 10, "tip": null, "fig": null, "id": "approx-8", "topic": "approx"}, {"type": "obj", "q": "Simplify 27<sup>2/3</sup> × 16<sup>−1/4</sup>.", "opts": ["<span class=\"fr\"><span>9</span><span>2</span></span>", "18", "6", "<span class=\"fr\"><span>3</span><span>2</span></span>"], "ans": 0, "sol": ["27<sup>2/3</sup> = (∛27)<sup>2</sup> = 3<sup>2</sup> = 9", "16<sup>−1/4</sup> = <span class=\"fr\"><span>1</span><span>16<sup>1/4</sup></span></span> = <span class=\"fr\"><span>1</span><span>2</span></span>", "9 × <span class=\"fr\"><span>1</span><span>2</span></span> = <span class=\"fr\"><span>9</span><span>2</span></span>"], "tip": null, "fig": null, "id": "indices-1", "topic": "indices"}, {"type": "obj", "q": "Solve 2<sup>x + 1</sup> = 32.", "opts": ["x = 4", "x = 5", "x = 3", "x = 6"], "ans": 0, "sol": ["32 = 2<sup>5</sup>, so 2<sup>x+1</sup> = 2<sup>5</sup>", "x + 1 = 5 ⇒ x = 4"], "tip": null, "fig": null, "id": "indices-2", "topic": "indices"}, {"type": "obj", "q": "Simplify (a<sup>3</sup> b<sup>−2</sup>)<sup>2</sup> ÷ (a<sup>4</sup> b<sup>−1</sup>).", "opts": ["<span class=\"fr\"><span>a<sup>10</sup></span><span>b<sup>5</sup></span></span>", "a<sup>2</sup> b<sup>3</sup>", "<span class=\"fr\"><span>a<sup>2</sup></span><span>b<sup>3</sup></span></span>", "<span class=\"fr\"><span>a</span><span>b<sup>3</sup></span></span>"], "ans": 2, "sol": ["(a<sup>3</sup> b<sup>−2</sup>)<sup>2</sup> = a<sup>6</sup> b<sup>−4</sup>", "a<sup>6</sup> b<sup>−4</sup> ÷ a<sup>4</sup> b<sup>−1</sup> = a<sup>6−4</sup> b<sup>−4−(−1)</sup> = a<sup>2</sup> b<sup>−3</sup>", "= <span class=\"fr\"><span>a<sup>2</sup></span><span>b<sup>3</sup></span></span>"], "tip": null, "fig": null, "id": "indices-3", "topic": "indices"}, {"type": "obj", "q": "Evaluate (<span class=\"fr\"><span>1</span><span>8</span></span>)<sup>−2/3</sup>.", "opts": ["−4", "<span class=\"fr\"><span>1</span><span>4</span></span>", "4", "16"], "ans": 2, "sol": ["(<span class=\"fr\"><span>1</span><span>8</span></span>)<sup>−2/3</sup> = 8<sup>2/3</sup>", "= (∛8)<sup>2</sup> = 2<sup>2</sup> = 4"], "tip": null, "fig": null, "id": "indices-4", "topic": "indices"}, {"type": "obj", "q": "Solve 9<sup>x</sup> = 27<sup>x − 1</sup>.", "opts": ["x = 1", "x = 3", "x = −3", "x = 2"], "ans": 1, "sol": ["9<sup>x</sup> = 3<sup>2x</sup> and 27<sup>x−1</sup> = 3<sup>3x−3</sup>", "2x = 3x − 3 ⇒ x = 3"], "tip": null, "fig": null, "id": "indices-5", "topic": "indices"}, {"type": "obj", "q": "Solve 5<sup>2x</sup> − 6(5<sup>x</sup>) + 5 = 0.", "opts": ["x = 0 or x = 1", "x = −1 or x = 0", "x = 1 or x = 5", "x = 0 only"], "ans": 0, "sol": ["Let y = 5<sup>x</sup>. Then y<sup>2</sup> − 6y + 5 = 0", "(y − 1)(y − 5) = 0 ⇒ y = 1 or y = 5", "5<sup>x</sup> = 1 ⇒ x = 0;  5<sup>x</sup> = 5 ⇒ x = 1"], "tip": null, "fig": null, "id": "indices-6", "topic": "indices"}, {"type": "thy", "q": "(a) Simplify <span class=\"fr\"><span>81<sup>3/4</sup> × 32<sup>−2/5</sup></span><span>125<sup>1/3</sup></span></span>.<br>(b) Solve 3<sup>2x + 1</sup> − 28(3<sup>x</sup>) + 9 = 0.", "sol": ["(a) 81<sup>3/4</sup> = (⁴√81)<sup>3</sup> = 3<sup>3</sup> = 27", "32<sup>−2/5</sup> = <span class=\"fr\"><span>1</span><span>(⁵√32)<sup>2</sup></span></span> = <span class=\"fr\"><span>1</span><span>4</span></span>", "125<sup>1/3</sup> = 5", "<span class=\"fr\"><span>27 × <span class=\"fr\"><span>1</span><span>4</span></span></span><span>5</span></span> = <b><span class=\"fr\"><span>27</span><span>20</span></span></b>", "(b) 3<sup>2x+1</sup> = 3 × (3<sup>x</sup>)<sup>2</sup>. Let y = 3<sup>x</sup>:", "3y<sup>2</sup> − 28y + 9 = 0 ⇒ (3y − 1)(y − 9) = 0", "y = <span class=\"fr\"><span>1</span><span>3</span></span> ⇒ 3<sup>x</sup> = 3<sup>−1</sup> ⇒ <b>x = −1</b>", "y = 9 ⇒ 3<sup>x</sup> = 3<sup>2</sup> ⇒ <b>x = 2</b>"], "marks": 10, "tip": null, "fig": null, "id": "indices-7", "topic": "indices"}, {"type": "thy", "q": "(a) Solve (<span class=\"fr\"><span>1</span><span>16</span></span>)<sup>x</sup> = 64<sup>x − 3</sup>.<br>(b) Expand and simplify (x<sup>1/2</sup> + x<sup>−1/2</sup>)<sup>2</sup>.<br>(c) Solve the simultaneous equations 2<sup>x</sup> × 4<sup>y</sup> = 64 and 3<sup>x</sup> ÷ 9<sup>y</sup> = <span class=\"fr\"><span>1</span><span>3</span></span>.", "sol": ["(a) (<span class=\"fr\"><span>1</span><span>16</span></span>)<sup>x</sup> = 2<sup>−4x</sup> and 64<sup>x−3</sup> = 2<sup>6x−18</sup>", "−4x = 6x − 18 ⇒ 10x = 18 ⇒ <b>x = <span class=\"fr\"><span>9</span><span>5</span></span></b> (= 1.8)", "(b) (x<sup>1/2</sup>)<sup>2</sup> + 2(x<sup>1/2</sup>)(x<sup>−1/2</sup>) + (x<sup>−1/2</sup>)<sup>2</sup>", "= <b>x + 2 + <span class=\"fr\"><span>1</span><span>x</span></span></b>", "(c) 2<sup>x</sup> × 2<sup>2y</sup> = 2<sup>6</sup> ⇒ x + 2y = 6 … (i)", "3<sup>x</sup> ÷ 3<sup>2y</sup> = 3<sup>−1</sup> ⇒ x − 2y = −1 … (ii)", "(i) + (ii): 2x = 5 ⇒ <b>x = <span class=\"fr\"><span>5</span><span>2</span></span></b>; then 2y = 6 − <span class=\"fr\"><span>5</span><span>2</span></span> = <span class=\"fr\"><span>7</span><span>2</span></span> ⇒ <b>y = <span class=\"fr\"><span>7</span><span>4</span></span></b>"], "marks": 12, "tip": null, "fig": null, "id": "indices-8", "topic": "indices"}, {"type": "obj", "q": "Evaluate log<sub>2</sub> 32 − log<sub>3</sub> 27.", "opts": ["2", "3", "1", "8"], "ans": 0, "sol": ["log<sub>2</sub> 32 = 5 since 2<sup>5</sup> = 32", "log<sub>3</sub> 27 = 3 since 3<sup>3</sup> = 27", "5 − 3 = 2"], "tip": null, "fig": null, "id": "logs-1", "topic": "logs"}, {"type": "obj", "q": "Simplify log<sub>10</sub> 8 + log<sub>10</sub> 5 − log<sub>10</sub> 4.", "opts": ["1", "2", "log<sub>10</sub> 9", "0"], "ans": 0, "sol": ["log<sub>10</sub> (<span class=\"fr\"><span>8 × 5</span><span>4</span></span>) = log<sub>10</sub> 10 = 1"], "tip": null, "fig": null, "id": "logs-2", "topic": "logs"}, {"type": "obj", "q": "Solve log<sub>x</sub> 81 = 4.", "opts": ["x = 27", "x = 4", "x = 3", "x = 9"], "ans": 2, "sol": ["x<sup>4</sup> = 81 = 3<sup>4</sup>", "x = 3"], "tip": null, "fig": null, "id": "logs-3", "topic": "logs"}, {"type": "obj", "q": "Given that log<sub>10</sub> 2 = 0.3010 and log<sub>10</sub> 3 = 0.4771, find log<sub>10</sub> 18.", "opts": ["1.0791", "1.2552", "0.7781", "1.5563"], "ans": 1, "sol": ["18 = 2 × 3<sup>2</sup>", "log 18 = log 2 + 2 log 3 = 0.3010 + 2(0.4771)", "= 0.3010 + 0.9542 = 1.2552"], "tip": null, "fig": null, "id": "logs-4", "topic": "logs"}, {"type": "obj", "q": "Solve log<sub>3</sub>(x + 5) − log<sub>3</sub>(x − 1) = 2.", "opts": ["2", "<span class=\"fr\"><span>4</span><span>7</span></span>", "<span class=\"fr\"><span>7</span><span>2</span></span>", "<span class=\"fr\"><span>7</span><span>4</span></span>"], "ans": 3, "sol": ["log<sub>3</sub> <span class=\"fr\"><span>x + 5</span><span>x − 1</span></span> = 2 ⇒ <span class=\"fr\"><span>x + 5</span><span>x − 1</span></span> = 3<sup>2</sup> = 9", "x + 5 = 9x − 9 ⇒ 8x = 14 ⇒ x = <span class=\"fr\"><span>7</span><span>4</span></span>", "Check: x − 1 = <span class=\"fr\"><span>3</span><span>4</span></span> > 0, so the solution is valid."], "tip": null, "fig": null, "id": "logs-5", "topic": "logs"}, {"type": "obj", "q": "Express 2 log a − ½ log b + log c as a single logarithm.", "opts": ["log <span class=\"fr\"><span>a<sup>2</sup> c</span><span>√b</span></span>", "log <span class=\"fr\"><span>2ac</span><span>√b</span></span>", "log (a<sup>2</sup> c√b)", "log <span class=\"fr\"><span>a<sup>2</sup></span><span>c√b</span></span>"], "ans": 0, "sol": ["2 log a = log a<sup>2</sup> and ½ log b = log √b", "log a<sup>2</sup> − log √b + log c = log <span class=\"fr\"><span>a<sup>2</sup> × c</span><span>√b</span></span>"], "tip": null, "fig": null, "id": "logs-6", "topic": "logs"}, {"type": "thy", "q": "(a) Without using tables, evaluate <span class=\"fr\"><span>log 8 − log 2</span><span>log 32 − log 4</span></span>.<br>(b) Solve log<sub>10</sub>(x<sup>2</sup> + 6) − log<sub>10</sub> x = log<sub>10</sub> 5.<br>(c) Given log 2 = 0.3010 and log 3 = 0.4771, evaluate log 7.2 without tables.", "sol": ["(a) log 8 − log 2 = log 4 = 2 log 2;  log 32 − log 4 = log 8 = 3 log 2", "<span class=\"fr\"><span>2 log 2</span><span>3 log 2</span></span> = <b><span class=\"fr\"><span>2</span><span>3</span></span></b>", "(b) log <span class=\"fr\"><span>x<sup>2</sup> + 6</span><span>x</span></span> = log 5 ⇒ x<sup>2</sup> + 6 = 5x", "x<sup>2</sup> − 5x + 6 = 0 ⇒ (x − 2)(x − 3) = 0 ⇒ <b>x = 2 or x = 3</b> (both positive, so both valid)", "(c) 7.2 = <span class=\"fr\"><span>72</span><span>10</span></span> = <span class=\"fr\"><span>2<sup>3</sup> × 3<sup>2</sup></span><span>10</span></span>", "log 7.2 = 3 log 2 + 2 log 3 − log 10 = 0.9030 + 0.9542 − 1 = <b>0.8572</b>"], "marks": 12, "tip": null, "fig": null, "id": "logs-7", "topic": "logs"}, {"type": "thy", "q": "(a) Using logarithms, solve 2<sup>x</sup> = 7, giving your answer correct to two decimal places. [log 2 = 0.3010, log 7 = 0.8451]<br>(b) Solve log<sub>3</sub> x + log<sub>9</sub> x = 3/2.<br>(c) Show that log<sub>a</sub> b × log<sub>b</sub> a = 1.", "sol": ["(a) x log 2 = log 7 ⇒ x = <span class=\"fr\"><span>0.8451</span><span>0.3010</span></span> = 2.8076… ≈ <b>2.81</b>", "(b) log<sub>9</sub> x = <span class=\"fr\"><span>log<sub>3</sub> x</span><span>log<sub>3</sub> 9</span></span> = ½ log<sub>3</sub> x", "log<sub>3</sub> x + ½ log<sub>3</sub> x = <span class=\"fr\"><span>3</span><span>2</span></span> ⇒ <span class=\"fr\"><span>3</span><span>2</span></span> log<sub>3</sub> x = <span class=\"fr\"><span>3</span><span>2</span></span> ⇒ log<sub>3</sub> x = 1 ⇒ <b>x = 3</b>", "(c) By change of base, log<sub>a</sub> b = <span class=\"fr\"><span>log b</span><span>log a</span></span> and log<sub>b</sub> a = <span class=\"fr\"><span>log a</span><span>log b</span></span>", "Product = <span class=\"fr\"><span>log b</span><span>log a</span></span> × <span class=\"fr\"><span>log a</span><span>log b</span></span> = 1 ∎"], "marks": 10, "tip": null, "fig": null, "id": "logs-8", "topic": "logs"}, {"type": "obj", "q": "Simplify √75 − √27.", "opts": ["4√3", "3√2", "2√3", "8√3"], "ans": 2, "sol": ["√75 = √(25 × 3) = 5√3", "√27 = √(9 × 3) = 3√3", "5√3 − 3√3 = 2√3"], "tip": null, "fig": null, "id": "surds-1", "topic": "surds"}, {"type": "obj", "q": "Rationalise <span class=\"fr\"><span>6</span><span>√3</span></span>.", "opts": ["2√3", "3√2", "<span class=\"fr\"><span>√3</span><span>2</span></span>", "6√3"], "ans": 0, "sol": ["<span class=\"fr\"><span>6</span><span>√3</span></span> × <span class=\"fr\"><span>√3</span><span>√3</span></span> = <span class=\"fr\"><span>6√3</span><span>3</span></span> = 2√3"], "tip": null, "fig": null, "id": "surds-2", "topic": "surds"}, {"type": "obj", "q": "Simplify (2√3 + √2)(2√3 − √2).", "opts": ["14", "12 − √6", "10", "8"], "ans": 2, "sol": ["This is (p + q)(p − q) = p<sup>2</sup> − q<sup>2</sup>", "(2√3)<sup>2</sup> − (√2)<sup>2</sup> = 12 − 2 = 10"], "tip": null, "fig": null, "id": "surds-3", "topic": "surds"}, {"type": "obj", "q": "Rationalise the denominator of <span class=\"fr\"><span>1</span><span>√5 − √3</span></span>.", "opts": ["<span class=\"fr\"><span>√5 + √3</span><span>2</span></span>", "√5 + √3", "<span class=\"fr\"><span>√5 + √3</span><span>8</span></span>", "<span class=\"fr\"><span>√5 − √3</span><span>2</span></span>"], "ans": 0, "sol": ["Multiply by the conjugate: <span class=\"fr\"><span>√5 + √3</span><span>(√5 − √3)(√5 + √3)</span></span>", "Denominator = 5 − 3 = 2 ⇒ <span class=\"fr\"><span>√5 + √3</span><span>2</span></span>"], "tip": null, "fig": null, "id": "surds-4", "topic": "surds"}, {"type": "obj", "q": "Simplify √50 + √18 − √8.", "opts": ["6√2", "4√2", "2√15", "10√2"], "ans": 0, "sol": ["√50 = 5√2, √18 = 3√2, √8 = 2√2", "5√2 + 3√2 − 2√2 = 6√2"], "tip": null, "fig": null, "id": "surds-5", "topic": "surds"}, {"type": "obj", "q": "If (√3 + 1)<sup>2</sup> = p + q√3, find p and q.", "opts": ["p = 4, q = 1", "p = 2, q = 2", "p = 3, q = 1", "p = 4, q = 2"], "ans": 3, "sol": ["(√3 + 1)<sup>2</sup> = 3 + 2√3 + 1 = 4 + 2√3", "So p = 4 and q = 2"], "tip": null, "fig": null, "id": "surds-6", "topic": "surds"}, {"type": "thy", "q": "(a) Simplify <span class=\"fr\"><span>3√2 − 2√3</span><span>3√2 + 2√3</span></span>, giving your answer in the form p − q√6.<br>(b) Given that x = 2 + √3, find the value of x + <span class=\"fr\"><span>1</span><span>x</span></span>.", "sol": ["(a) Multiply top and bottom by (3√2 − 2√3):", "Numerator: (3√2 − 2√3)<sup>2</sup> = 18 − 12√6 + 12 = 30 − 12√6", "Denominator: (3√2)<sup>2</sup> − (2√3)<sup>2</sup> = 18 − 12 = 6", "<span class=\"fr\"><span>30 − 12√6</span><span>6</span></span> = <b>5 − 2√6</b>", "(b) <span class=\"fr\"><span>1</span><span>x</span></span> = <span class=\"fr\"><span>1</span><span>2 + √3</span></span> × <span class=\"fr\"><span>2 − √3</span><span>2 − √3</span></span> = <span class=\"fr\"><span>2 − √3</span><span>4 − 3</span></span> = 2 − √3", "x + 1/x = (2 + √3) + (2 − √3) = <b>4</b>"], "marks": 10, "tip": null, "fig": null, "id": "surds-7", "topic": "surds"}, {"type": "thy", "q": "(a) Simplify <span class=\"fr\"><span>√12 × √18</span><span>√24</span></span>.<br>(b) Evaluate (√7 + √2)<sup>2</sup> − (√7 − √2)<sup>2</sup>.<br>(c) Express <span class=\"fr\"><span>4</span><span>2 + √2</span></span> in the form p + q√2.", "sol": ["(a) <span class=\"fr\"><span>√(12 × 18)</span><span>√24</span></span> = √<span class=\"fr\"><span>216</span><span>24</span></span> = √9 = <b>3</b>", "(b) (9 + 2√14) − (9 − 2√14) = <b>4√14</b>", "(c) <span class=\"fr\"><span>4</span><span>2 + √2</span></span> × <span class=\"fr\"><span>2 − √2</span><span>2 − √2</span></span> = <span class=\"fr\"><span>4(2 − √2)</span><span>4 − 2</span></span> = 2(2 − √2) = <b>4 − 2√2</b>"], "marks": 9, "tip": null, "fig": null, "id": "surds-8", "topic": "surds"}, {"type": "obj", "q": "Find the nth term of the sequence 3, 7, 11, 15, …", "opts": ["4n − 1", "n + 4", "4n + 3", "3n + 1"], "ans": 0, "sol": ["a = 3, d = 4", "T_n = 3 + (n − 1)4 = 4n − 1"], "tip": null, "fig": null, "id": "seq-1", "topic": "seq"}, {"type": "obj", "q": "Find the 10th term of the arithmetic progression 5, 8, 11, …", "opts": ["29", "35", "30", "32"], "ans": 3, "sol": ["a = 5, d = 3", "T<sub>10</sub> = 5 + 9 × 3 = 32"], "tip": null, "fig": null, "id": "seq-2", "topic": "seq"}, {"type": "obj", "q": "Find the sum of the first 20 terms of the AP 2, 5, 8, …", "opts": ["610", "590", "1220", "620"], "ans": 0, "sol": ["S<sub>20</sub> = <span class=\"fr\"><span>20</span><span>2</span></span>[2(2) + 19(3)]", "= 10 × 61 = 610"], "tip": null, "fig": null, "id": "seq-3", "topic": "seq"}, {"type": "obj", "q": "Find the 6th term of the geometric progression 2, 6, 18, …", "opts": ["162", "1458", "243", "486"], "ans": 3, "sol": ["a = 2, r = 3", "T_6 = 2 × 3<sup>5</sup> = 2 × 243 = 486"], "tip": null, "fig": null, "id": "seq-4", "topic": "seq"}, {"type": "obj", "q": "Find the sum to infinity of the GP 12, 6, 3, …", "opts": ["18", "24", "21", "36"], "ans": 1, "sol": ["a = 12, r = <span class=\"fr\"><span>1</span><span>2</span></span>", "S_∞ = <span class=\"fr\"><span>12</span><span>1 − <span class=\"fr\"><span>1</span><span>2</span></span></span></span> = 24"], "tip": null, "fig": null, "id": "seq-5", "topic": "seq"}, {"type": "obj", "q": "The terms x − 1, 2x and 4x − 3 are consecutive terms of an AP. Find x.", "opts": ["4", "2", "−4", "3"], "ans": 0, "sol": ["For an AP, 2(middle) = first + last", "2(2x) = (x − 1) + (4x − 3)", "4x = 5x − 4 ⇒ x = 4"], "tip": null, "fig": null, "id": "seq-6", "topic": "seq"}, {"type": "thy", "q": "The 3rd term of an arithmetic progression is 11 and the 8th term is 31.<br>(a) Find the first term and the common difference.<br>(b) Find the sum of the first 15 terms.<br>(c) Which term of the progression is 99?", "sol": ["(a) a + 2d = 11 … (i);  a + 7d = 31 … (ii)", "(ii) − (i): 5d = 20 ⇒ <b>d = 4</b>; then a = 11 − 8 = <b>3</b>", "(b) S<sub>15</sub> = <span class=\"fr\"><span>15</span><span>2</span></span>[2(3) + 14(4)] = <span class=\"fr\"><span>15</span><span>2</span></span> × 62 = <b>465</b>", "(c) 3 + (n − 1)4 = 99 ⇒ 4(n − 1) = 96 ⇒ n − 1 = 24 ⇒ <b>25th term</b>"], "marks": 10, "tip": null, "fig": null, "id": "seq-7", "topic": "seq"}, {"type": "thy", "q": "The second term of a GP is 6 and the fifth term is 162.<br>(a) Find the common ratio and the first term.<br>(b) Find the sum of the first six terms.<br>(c) A worker's starting salary is GH₵ 24,000 a year and it rises by 5% each year. Find the total amount earned in the first four years.", "sol": ["(a) ar = 6 and ar<sup>4</sup> = 162 ⇒ r<sup>3</sup> = <span class=\"fr\"><span>162</span><span>6</span></span> = 27 ⇒ <b>r = 3</b>; a = 6 ÷ 3 = <b>2</b>", "(b) S_6 = <span class=\"fr\"><span>2(3<sup>6</sup> − 1)</span><span>3 − 1</span></span> = 3<sup>6</sup> − 1 = <b>728</b>", "(c) The salaries form a GP with a = 24,000 and r = 1.05", "S_4 = <span class=\"fr\"><span>24000(1.05<sup>4</sup> − 1)</span><span>1.05 − 1</span></span> = <span class=\"fr\"><span>24000 × 0.21550625</span><span>0.05</span></span>", "= <b>GH₵ 103,443.00</b>"], "marks": 12, "tip": null, "fig": null, "id": "seq-8", "topic": "seq"}, {"type": "obj", "q": "If n(A) = 15, n(B) = 12 and n(A ∩ B) = 5, find n(A ∪ B).", "opts": ["27", "32", "22", "17"], "ans": 2, "sol": ["n(A ∪ B) = 15 + 12 − 5 = 22"], "tip": null, "fig": null, "id": "sets-1", "topic": "sets"}, {"type": "obj", "q": "In a class of 40 students, 25 study French, 20 study Twi and 8 study neither. How many study both?", "opts": ["13", "12", "8", "5"], "ans": 0, "sol": ["Students studying at least one = 40 − 8 = 32", "32 = 25 + 20 − x ⇒ x = 13"], "tip": null, "fig": null, "id": "sets-2", "topic": "sets"}, {"type": "obj", "q": "How many subsets does the set {a, b, c, d} have?", "opts": ["4", "15", "16", "8"], "ans": 2, "sol": ["Number of subsets = 2<sup>n</sup> = 2<sup>4</sup> = 16"], "tip": null, "fig": null, "id": "sets-3", "topic": "sets"}, {"type": "obj", "q": "If U = {1, 2, 3, …, 10} and P = {prime numbers in U}, find P′.", "opts": ["{2, 3, 5, 7}", "{1, 4, 6, 8, 10}", "{1, 4, 6, 8, 9, 10}", "{4, 6, 8, 9, 10}"], "ans": 2, "sol": ["P = {2, 3, 5, 7}", "P′ = the elements of U not in P = {1, 4, 6, 8, 9, 10}", "Remember that 1 is not a prime number."], "tip": null, "fig": null, "id": "sets-4", "topic": "sets"}, {"type": "obj", "q": "If A = {x : 2 < x ≤ 7, x is an integer}, find n(A).", "opts": ["4", "5", "6", "7"], "ans": 1, "sol": ["A = {3, 4, 5, 6, 7}", "n(A) = 5"], "tip": null, "fig": null, "id": "sets-5", "topic": "sets"}, {"type": "thy", "q": "In a survey of 100 students, 45 like Mathematics (M), 40 like English (E) and 38 like Science (S). 15 like M and E, 12 like E and S, 14 like M and S, and 5 like all three subjects.<br>(a) Draw a Venn diagram to show this information.<br>(b) How many students like none of the subjects?<br>(c) How many like Mathematics only?<br>(d) How many like exactly two subjects?", "sol": ["(a) Centre (all three) = 5. M∩E only = 15 − 5 = 10; E∩S only = 12 − 5 = 7; M∩S only = 14 − 5 = 9.", "M only = 45 − 10 − 9 − 5 = 21; E only = 40 − 10 − 7 − 5 = 18; S only = 38 − 7 − 9 − 5 = 17.", "(b) Total in the circles = 21 + 18 + 17 + 10 + 7 + 9 + 5 = 87 ⇒ none = 100 − 87 = <b>13</b>", "(c) Mathematics only = <b>21</b>", "(d) Exactly two = 10 + 7 + 9 = <b>26</b>"], "marks": 12, "tip": null, "fig": null, "id": "sets-6", "topic": "sets"}, {"type": "thy", "q": "U = {x : 1 ≤ x ≤ 15, x is an integer}, A = {multiples of 3} and B = {factors of 12}.<br>(a) List the elements of A and B.<br>(b) Find A ∩ B and A ∪ B.<br>(c) Find (A ∪ B)′ and n(A ∪ B)′.", "sol": ["(a) A = {3, 6, 9, 12, 15};  B = {1, 2, 3, 4, 6, 12}", "(b) A ∩ B = <b>{3, 6, 12}</b>;  A ∪ B = <b>{1, 2, 3, 4, 6, 9, 12, 15}</b>", "(c) (A ∪ B)′ = <b>{5, 7, 8, 10, 11, 13, 14}</b>, so n(A ∪ B)′ = <b>7</b>"], "marks": 9, "tip": null, "fig": null, "id": "sets-7", "topic": "sets"}, {"type": "obj", "q": "What is the contrapositive of the statement 'If it rains, the ground is wet'?", "opts": ["If the ground is wet, then it rained.", "If it does not rain, the ground is not wet.", "If the ground is not wet, then it did not rain.", "It rains and the ground is not wet."], "ans": 2, "sol": ["For p → q, the contrapositive is ~q → ~p.", "p: it rains; q: the ground is wet.", "~q → ~p: If the ground is not wet, then it did not rain."], "tip": null, "fig": null, "id": "logic-1", "topic": "logic"}, {"type": "obj", "q": "What is the negation of the statement 'All the students passed'?", "opts": ["All the students failed.", "Some students did not pass.", "Some students passed.", "No student passed."], "ans": 1, "sol": ["The negation of 'All X are Y' is 'At least one X is not Y'.", "So: Some students did not pass."], "tip": null, "fig": null, "id": "logic-2", "topic": "logic"}, {"type": "obj", "q": "p: 'Kofi is tall' and q: 'Kofi is strong'. What does p ∧ ~q mean?", "opts": ["Kofi is tall or not strong.", "If Kofi is tall, he is not strong.", "Kofi is tall but not strong.", "Kofi is not tall but strong."], "ans": 2, "sol": ["∧ means 'and'; ~q means 'Kofi is not strong'.", "p ∧ ~q: Kofi is tall and (but) not strong."], "tip": null, "fig": null, "id": "logic-3", "topic": "logic"}, {"type": "obj", "q": "If p is true and q is false, which of the following statements is true?", "opts": ["p ∧ q", "~p", "p ∨ q", "p → q"], "ans": 2, "sol": ["p ∨ q: T or F = T ✓", "p ∧ q: T and F = F", "p → q: T → F = F", "~p = F"], "tip": null, "fig": null, "id": "logic-4", "topic": "logic"}, {"type": "obj", "q": "Premises: 'All farmers are hardworking' and 'Ama is a farmer'. Which conclusion is valid?", "opts": ["Some farmers are not hardworking.", "Ama is hardworking.", "All hardworking people are farmers.", "Ama is not hardworking."], "ans": 1, "sol": ["The set of farmers lies inside the set of hardworking people.", "Ama is in the farmers set, so she must be in the hardworking set."], "tip": null, "fig": null, "id": "logic-5", "topic": "logic"}, {"type": "thy", "q": "(a) Copy and complete the truth table for p → q and ~q → ~p, and state what you notice.<br>(b) p: 'x is an even number'; q: 'x² is an even number'. Write down in words (i) p → q; (ii) its converse; (iii) its inverse.", "sol": ["(a) <table class=\"mt\"><tr><th>p</th><th>q</th><th>p → q</th><th>~q</th><th>~p</th><th>~q → ~p</th></tr><tr><td>T</td><td>T</td><td>T</td><td>F</td><td>F</td><td>T</td></tr><tr><td>T</td><td>F</td><td>F</td><td>T</td><td>F</td><td>F</td></tr><tr><td>F</td><td>T</td><td>T</td><td>F</td><td>T</td><td>T</td></tr><tr><td>F</td><td>F</td><td>T</td><td>T</td><td>T</td><td>T</td></tr></table>", "The last column matches the p → q column, so <b>p → q ≡ ~q → ~p</b> (a statement and its contrapositive are equivalent).", "(b)(i) If x is an even number, then x² is an even number.", "(ii) Converse (q → p): If x² is an even number, then x is an even number.", "(iii) Inverse (~p → ~q): If x is not an even number, then x² is not an even number."], "marks": 10, "tip": null, "fig": null, "id": "logic-6", "topic": "logic"}, {"type": "thy", "q": "Consider the statements:<br>1. All good students attend classes.<br>2. Some people who attend classes are prefects.<br>3. Esi does not attend classes.<br>Using a Venn diagram, decide whether each conclusion is valid: (i) Esi is not a good student. (ii) Some prefects are good students. (iii) Esi is not a prefect.", "sol": ["Draw U; inside it, a circle C (attend classes); put G (good students) entirely inside C; draw P (prefects) overlapping C.", "Esi lies outside C.", "(i) G is inside C and Esi is outside C, so Esi cannot be in G. <b>Valid.</b>", "(ii) P overlaps C, but it need not overlap G. <b>Not valid</b> (it may be true, but it does not have to be).", "(iii) Part of P may lie outside C, so Esi could still be a prefect. <b>Not valid.</b>"], "marks": 9, "tip": null, "fig": null, "id": "logic-7", "topic": "logic"}, {"type": "obj", "q": "GH₵ 360 is shared in the ratio 2 : 3 : 4. What is the largest share?", "opts": ["GH₵ 120", "GH₵ 180", "GH₵ 160", "GH₵ 80"], "ans": 2, "sol": ["Total parts = 2 + 3 + 4 = 9", "Largest share = <span class=\"fr\"><span>4</span><span>9</span></span> × 360 = GH₵ 160"], "tip": null, "fig": null, "id": "fin-1", "topic": "fin"}, {"type": "obj", "q": "A shirt marked GH₵ 250 is sold at a 12% discount. What is the selling price?", "opts": ["GH₵ 220", "GH₵ 280", "GH₵ 212", "GH₵ 238"], "ans": 0, "sol": ["Discount = 12% of 250 = GH₵ 30", "Selling price = 250 − 30 = GH₵ 220"], "tip": null, "fig": null, "id": "fin-2", "topic": "fin"}, {"type": "obj", "q": "Find the simple interest on GH₵ 5,000 at 8% per annum for 3 years.", "opts": ["GH₵ 6,200", "GH₵ 1,200", "GH₵ 400", "GH₵ 1,500"], "ans": 1, "sol": ["I = <span class=\"fr\"><span>PRT</span><span>100</span></span> = <span class=\"fr\"><span>5000 × 8 × 3</span><span>100</span></span> = GH₵ 1,200"], "tip": null, "fig": null, "id": "fin-3", "topic": "fin"}, {"type": "obj", "q": "GH₵ 2,000 is invested at 10% per annum compound interest. Find the amount after 2 years.", "opts": ["GH₵ 2,420", "GH₵ 2,200", "GH₵ 2,400", "GH₵ 2,440"], "ans": 0, "sol": ["A = 2000(1.1)<sup>2</sup> = 2000 × 1.21 = GH₵ 2,420"], "tip": null, "fig": null, "id": "fin-4", "topic": "fin"}, {"type": "obj", "q": "A trader bought an item for GH₵ 80 and sold it for GH₵ 100. Find the percentage profit.", "opts": ["125%", "80%", "25%", "20%"], "ans": 2, "sol": ["Profit = GH₵ 20", "Profit % = <span class=\"fr\"><span>20</span><span>80</span></span> × 100% = 25%"], "tip": "Percentage profit is always on the cost price, not the selling price.", "fig": null, "id": "fin-5", "topic": "fin"}, {"type": "obj", "q": "A car valued at GH₵ 120,000 depreciates by 15% each year. Find its value after 2 years.", "opts": ["GH₵ 88,200", "GH₵ 102,000", "GH₵ 86,700", "GH₵ 84,000"], "ans": 2, "sol": ["Value = 120,000 × (0.85)<sup>2</sup>", "= 120,000 × 0.7225 = GH₵ 86,700"], "tip": null, "fig": null, "id": "fin-6", "topic": "fin"}, {"type": "obj", "q": "5 men can do a piece of work in 12 days. How long will 4 men take, working at the same rate?", "opts": ["9.6 days", "15 days", "16 days", "10 days"], "ans": 1, "sol": ["Total work = 5 × 12 = 60 man-days", "4 men: 60 ÷ 4 = 15 days"], "tip": null, "fig": null, "id": "fin-7", "topic": "fin"}, {"type": "thy", "q": "(a) The exchange rates are $1 = GH₵ 15.50 and £1 = GH₵ 19.80. Convert £250 to dollars, correct to the nearest cent.<br>(b) A salesman earns a basic salary of GH₵ 1,800 a month plus a 4% commission on all sales above GH₵ 20,000. In one month his sales were GH₵ 65,000. Find his total earnings.<br>(c) In a certain country, the first GH₵ 500 of monthly income is tax-free, the next GH₵ 1,000 is taxed at 10% and the rest at 17.5%. Find the tax on the salesman's earnings in (b).", "sol": ["(a) £250 = 250 × 19.80 = GH₵ 4,950", "GH₵ 4,950 = <span class=\"fr\"><span>4950</span><span>15.50</span></span> = <b>$319.35</b>", "(b) Sales above GH₵ 20,000 = 65,000 − 20,000 = GH₵ 45,000", "Commission = 4% × 45,000 = GH₵ 1,800", "Total = 1,800 + 1,800 = <b>GH₵ 3,600</b>", "(c) First GH₵ 500: GH₵ 0", "Next GH₵ 1,000: 10% = GH₵ 100", "Rest: 3,600 − 1,500 = 2,100 at 17.5% = GH₵ 367.50", "Total tax = <b>GH₵ 467.50</b>"], "marks": 12, "tip": "The tax bands here are made up for practice. They are not Ghana's actual GRA rates.", "fig": null, "id": "fin-8", "topic": "fin"}, {"type": "thy", "q": "(a) A television costs GH₵ 4,800 cash. On hire purchase, a buyer pays a deposit of 25% of the cash price and 12 monthly instalments of GH₵ 350. Find (i) the hire purchase price; (ii) the extra amount paid as a percentage of the cash price.<br>(b) GH₵ 15,000 is invested at 12% per annum compound interest. Find the interest after 3 years.<br>(c) If x : y = 3 : 5 and y : z = 4 : 7, find x : y : z.", "sol": ["(a)(i) Deposit = 25% × 4,800 = GH₵ 1,200; instalments = 12 × 350 = GH₵ 4,200", "HP price = 1,200 + 4,200 = <b>GH₵ 5,400</b>", "(ii) Extra = GH₵ 600; <span class=\"fr\"><span>600</span><span>4800</span></span> × 100% = <b>12.5%</b>", "(b) A = 15,000 × 1.12<sup>3</sup> = 15,000 × 1.404928 = GH₵ 21,073.92", "Interest = 21,073.92 − 15,000 = <b>GH₵ 6,073.92</b>", "(c) Make y the same in both ratios: x : y = 12 : 20 and y : z = 20 : 35", "x : y : z = <b>12 : 20 : 35</b>"], "marks": 12, "tip": null, "fig": null, "id": "fin-9", "topic": "fin"}, {"type": "obj", "q": "y varies directly as x. If y = 12 when x = 4, find y when x = 7.", "opts": ["16", "21", "3", "28"], "ans": 1, "sol": ["y = kx ⇒ 12 = 4k ⇒ k = 3", "y = 3 × 7 = 21"], "tip": null, "fig": null, "id": "var-1", "topic": "var"}, {"type": "obj", "q": "y varies inversely as the square of x. If y = 8 when x = 2, find y when x = 4.", "opts": ["2", "4", "1", "16"], "ans": 0, "sol": ["y = <span class=\"fr\"><span>k</span><span>x<sup>2</sup></span></span> ⇒ 8 = <span class=\"fr\"><span>k</span><span>4</span></span> ⇒ k = 32", "y = <span class=\"fr\"><span>32</span><span>16</span></span> = 2"], "tip": null, "fig": null, "id": "var-2", "topic": "var"}, {"type": "obj", "q": "P varies jointly as Q and R. P = 24 when Q = 2 and R = 3. Find P when Q = 5 and R = 4.", "opts": ["96", "40", "60", "80"], "ans": 3, "sol": ["P = kQR ⇒ 24 = 6k ⇒ k = 4", "P = 4 × 5 × 4 = 80"], "tip": null, "fig": null, "id": "var-3", "topic": "var"}, {"type": "obj", "q": "T varies directly as the square root of L. If L is increased by 21%, find the percentage increase in T.", "opts": ["10%", "11%", "4.4%", "21%"], "ans": 0, "sol": ["T = k√L. New L = 1.21L", "New T = k√(1.21L) = 1.1 × k√L", "So T increases by 10%"], "tip": null, "fig": null, "id": "var-4", "topic": "var"}, {"type": "obj", "q": "Which of these relationships shows that y varies inversely as x?", "opts": ["y = kx", "y = kx<sup>2</sup>", "y = x + k", "xy = k"], "ans": 3, "sol": ["Inverse variation: y = <span class=\"fr\"><span>k</span><span>x</span></span>, which rearranges to xy = k (a constant)."], "tip": null, "fig": null, "id": "var-5", "topic": "var"}, {"type": "thy", "q": "y is partly constant and partly varies as x. When x = 2, y = 11, and when x = 4, y = 19.<br>(a) Find the relationship between x and y.<br>(b) Find y when x = 6.<br>(c) Find x when y = 43.", "sol": ["(a) y = a + bx", "11 = a + 2b … (i);  19 = a + 4b … (ii)", "(ii) − (i): 8 = 2b ⇒ b = 4; a = 11 − 8 = 3", "<b>y = 3 + 4x</b>", "(b) y = 3 + 24 = <b>27</b>", "(c) 43 = 3 + 4x ⇒ 4x = 40 ⇒ <b>x = 10</b>"], "marks": 10, "tip": null, "fig": null, "id": "var-6", "topic": "var"}, {"type": "thy", "q": "F varies directly as m and inversely as the square of d. F = 12 when m = 3 and d = 2.<br>(a) Find the formula connecting F, m and d.<br>(b) Find F when m = 5 and d = 4.<br>(c) Find d when F = 4 and m = 9.", "sol": ["(a) F = <span class=\"fr\"><span>km</span><span>d<sup>2</sup></span></span> ⇒ 12 = <span class=\"fr\"><span>3k</span><span>4</span></span> ⇒ k = 16 ⇒ <b>F = <span class=\"fr\"><span>16m</span><span>d<sup>2</sup></span></span></b>", "(b) F = <span class=\"fr\"><span>16 × 5</span><span>16</span></span> = <b>5</b>", "(c) 4 = <span class=\"fr\"><span>16 × 9</span><span>d<sup>2</sup></span></span> ⇒ d<sup>2</sup> = <span class=\"fr\"><span>144</span><span>4</span></span> = 36 ⇒ <b>d = 6</b>"], "marks": 9, "tip": null, "fig": null, "id": "var-7", "topic": "var"}, {"type": "obj", "q": "Evaluate the determinant of <span class=\"mx\"><span class=\"mr\"><span>3</span><span>2</span></span><span class=\"mr\"><span>5</span><span>4</span></span></span>.", "opts": ["22", "−2", "7", "2"], "ans": 3, "sol": ["|A| = (3)(4) − (2)(5) = 12 − 10 = 2"], "tip": null, "fig": null, "id": "matrix-1", "topic": "matrix"}, {"type": "obj", "q": "If A = <span class=\"mx\"><span class=\"mr\"><span>1</span><span>2</span></span><span class=\"mr\"><span>3</span><span>4</span></span></span> and B = <span class=\"mx\"><span class=\"mr\"><span>2</span><span>0</span></span><span class=\"mr\"><span>1</span><span>3</span></span></span>, find AB.", "opts": ["<span class=\"mx\"><span class=\"mr\"><span>2</span><span>0</span></span><span class=\"mr\"><span>3</span><span>12</span></span></span>", "<span class=\"mx\"><span class=\"mr\"><span>4</span><span>6</span></span><span class=\"mr\"><span>10</span><span>12</span></span></span>", "<span class=\"mx\"><span class=\"mr\"><span>2</span><span>4</span></span><span class=\"mr\"><span>10</span><span>14</span></span></span>", "<span class=\"mx\"><span class=\"mr\"><span>3</span><span>2</span></span><span class=\"mr\"><span>4</span><span>7</span></span></span>"], "ans": 1, "sol": ["Row 1: (1×2 + 2×1, 1×0 + 2×3) = (4, 6)", "Row 2: (3×2 + 4×1, 3×0 + 4×3) = (10, 12)"], "tip": null, "fig": null, "id": "matrix-2", "topic": "matrix"}, {"type": "obj", "q": "Find the value of x for which <span class=\"mx\"><span class=\"mr\"><span>x</span><span>3</span></span><span class=\"mr\"><span>2</span><span>4</span></span></span> is a singular matrix.", "opts": ["−<span class=\"fr\"><span>3</span><span>2</span></span>", "<span class=\"fr\"><span>2</span><span>3</span></span>", "6", "<span class=\"fr\"><span>3</span><span>2</span></span>"], "ans": 3, "sol": ["Singular ⇒ determinant = 0", "4x − 6 = 0 ⇒ x = <span class=\"fr\"><span>3</span><span>2</span></span>"], "tip": null, "fig": null, "id": "matrix-3", "topic": "matrix"}, {"type": "obj", "q": "Find the inverse of <span class=\"mx\"><span class=\"mr\"><span>2</span><span>1</span></span><span class=\"mr\"><span>5</span><span>3</span></span></span>.", "opts": ["<span class=\"mx\"><span class=\"mr\"><span>2</span><span>−5</span></span><span class=\"mr\"><span>−1</span><span>3</span></span></span>", "<span class=\"mx\"><span class=\"mr\"><span>−3</span><span>1</span></span><span class=\"mr\"><span>5</span><span>−2</span></span></span>", "<span class=\"mx\"><span class=\"mr\"><span>3</span><span>1</span></span><span class=\"mr\"><span>5</span><span>2</span></span></span>", "<span class=\"mx\"><span class=\"mr\"><span>3</span><span>−1</span></span><span class=\"mr\"><span>−5</span><span>2</span></span></span>"], "ans": 3, "sol": ["|A| = 6 − 5 = 1", "Swap a and d, change the signs of b and c, then divide by |A| = 1."], "tip": null, "fig": null, "id": "matrix-4", "topic": "matrix"}, {"type": "obj", "q": "If A = <span class=\"mx\"><span class=\"mr\"><span>3</span><span>1</span></span><span class=\"mr\"><span>0</span><span>2</span></span></span> and B = <span class=\"mx\"><span class=\"mr\"><span>1</span><span>4</span></span><span class=\"mr\"><span>2</span><span>−1</span></span></span>, find 2A − B.", "opts": ["<span class=\"mx\"><span class=\"mr\"><span>5</span><span>−2</span></span><span class=\"mr\"><span>−2</span><span>5</span></span></span>", "<span class=\"mx\"><span class=\"mr\"><span>2</span><span>−3</span></span><span class=\"mr\"><span>−2</span><span>3</span></span></span>", "<span class=\"mx\"><span class=\"mr\"><span>5</span><span>2</span></span><span class=\"mr\"><span>−2</span><span>3</span></span></span>", "<span class=\"mx\"><span class=\"mr\"><span>7</span><span>6</span></span><span class=\"mr\"><span>2</span><span>3</span></span></span>"], "ans": 0, "sol": ["2A = <span class=\"mx\"><span class=\"mr\"><span>6</span><span>2</span></span><span class=\"mr\"><span>0</span><span>4</span></span></span>", "2A − B = <span class=\"mx\"><span class=\"mr\"><span>6−1</span><span>2−4</span></span><span class=\"mr\"><span>0−2</span><span>4+1</span></span></span> = <span class=\"mx\"><span class=\"mr\"><span>5</span><span>−2</span></span><span class=\"mr\"><span>−2</span><span>5</span></span></span>"], "tip": null, "fig": null, "id": "matrix-5", "topic": "matrix"}, {"type": "thy", "q": "Use the matrix method to solve the simultaneous equations<br>2x + 3y = 13<br>x − y = −1", "sol": ["Write <span class=\"mx\"><span class=\"mr\"><span>2</span><span>3</span></span><span class=\"mr\"><span>1</span><span>−1</span></span></span><span class=\"mx\"><span class=\"mr\"><span>x</span></span><span class=\"mr\"><span>y</span></span></span> = <span class=\"mx\"><span class=\"mr\"><span>13</span></span><span class=\"mr\"><span>−1</span></span></span>", "|A| = (2)(−1) − (3)(1) = −5", "A<sup>−1</sup> = <span class=\"fr\"><span>1</span><span>−5</span></span><span class=\"mx\"><span class=\"mr\"><span>−1</span><span>−3</span></span><span class=\"mr\"><span>−1</span><span>2</span></span></span>", "<span class=\"mx\"><span class=\"mr\"><span>x</span></span><span class=\"mr\"><span>y</span></span></span> = <span class=\"fr\"><span>1</span><span>−5</span></span><span class=\"mx\"><span class=\"mr\"><span>−1</span><span>−3</span></span><span class=\"mr\"><span>−1</span><span>2</span></span></span><span class=\"mx\"><span class=\"mr\"><span>13</span></span><span class=\"mr\"><span>−1</span></span></span> = <span class=\"fr\"><span>1</span><span>−5</span></span><span class=\"mx\"><span class=\"mr\"><span>−13 + 3</span></span><span class=\"mr\"><span>−13 − 2</span></span></span> = <span class=\"fr\"><span>1</span><span>−5</span></span><span class=\"mx\"><span class=\"mr\"><span>−10</span></span><span class=\"mr\"><span>−15</span></span></span>", "<b>x = 2, y = 3</b>", "Check: 2(2) + 3(3) = 13 ✓ and 2 − 3 = −1 ✓"], "marks": 10, "tip": null, "fig": null, "id": "matrix-6", "topic": "matrix"}, {"type": "thy", "q": "P = <span class=\"mx\"><span class=\"mr\"><span>2</span><span>−1</span></span><span class=\"mr\"><span>3</span><span>4</span></span></span> and Q = <span class=\"mx\"><span class=\"mr\"><span>1</span><span>2</span></span><span class=\"mr\"><span>0</span><span>−3</span></span></span>.<br>(a) Find PQ.<br>(b) Show that |PQ| = |P| × |Q|.<br>(c) Solve P<span class=\"mx\"><span class=\"mr\"><span>x</span></span><span class=\"mr\"><span>y</span></span></span> = <span class=\"mx\"><span class=\"mr\"><span>1</span></span><span class=\"mr\"><span>18</span></span></span>.", "sol": ["(a) PQ = <span class=\"mx\"><span class=\"mr\"><span>2 + 0</span><span>4 + 3</span></span><span class=\"mr\"><span>3 + 0</span><span>6 − 12</span></span></span> = <b><span class=\"mx\"><span class=\"mr\"><span>2</span><span>7</span></span><span class=\"mr\"><span>3</span><span>−6</span></span></span></b>", "(b) |PQ| = (2)(−6) − (7)(3) = −12 − 21 = −33", "|P| = 8 + 3 = 11;  |Q| = −3 − 0 = −3;  11 × (−3) = −33 ✓", "(c) 2x − y = 1 and 3x + 4y = 18", "From the first equation, y = 2x − 1 ⇒ 3x + 8x − 4 = 18 ⇒ 11x = 22", "<b>x = 2, y = 3</b>"], "marks": 10, "tip": null, "fig": null, "id": "matrix-7", "topic": "matrix"}, {"type": "obj", "q": "Factorise 6x<sup>2</sup> − 7x − 3.", "opts": ["(3x − 1)(2x + 3)", "(3x + 1)(2x − 3)", "(6x + 1)(x − 3)", "(2x + 1)(3x − 3)"], "ans": 1, "sol": ["Product ac = 6 × (−3) = −18; find two numbers that multiply to −18 and add to −7: −9 and 2", "6x<sup>2</sup> − 9x + 2x − 3 = 3x(2x − 3) + 1(2x − 3) = (3x + 1)(2x − 3)"], "tip": null, "fig": null, "id": "alg-1", "topic": "alg"}, {"type": "obj", "q": "Solve <span class=\"fr\"><span>2x − 1</span><span>3</span></span> − <span class=\"fr\"><span>x + 2</span><span>4</span></span> = 1.", "opts": ["2", "<span class=\"fr\"><span>14</span><span>5</span></span>", "<span class=\"fr\"><span>22</span><span>5</span></span>", "4"], "ans": 2, "sol": ["Multiply every term by 12: 4(2x − 1) − 3(x + 2) = 12", "8x − 4 − 3x − 6 = 12", "5x = 22 ⇒ x = <span class=\"fr\"><span>22</span><span>5</span></span>"], "tip": null, "fig": null, "id": "alg-2", "topic": "alg"}, {"type": "obj", "q": "Make r the subject of the formula V = <span class=\"fr\"><span>πr<sup>2h</sup></span><span>3</span></span>.", "opts": ["r = <span class=\"fr\"><span>3V</span><span>πh</span></span>", "r = √(3Vπh)", "r = √(<span class=\"fr\"><span>3V</span><span>πh</span></span>)", "r = √(<span class=\"fr\"><span>V</span><span>3πh</span></span>)"], "ans": 2, "sol": ["Multiply both sides by 3: 3V = πr<sup>2h</sup>", "Divide by πh: r<sup>2</sup> = <span class=\"fr\"><span>3V</span><span>πh</span></span>", "Take the square root: r = √(<span class=\"fr\"><span>3V</span><span>πh</span></span>)"], "tip": null, "fig": null, "id": "alg-3", "topic": "alg"}, {"type": "obj", "q": "Solve simultaneously: 3x + 2y = 12 and x − y = −1.", "opts": ["x = 1, y = 2", "x = 3, y = 2", "x = 4, y = 0", "x = 2, y = 3"], "ans": 3, "sol": ["From the second equation, x = y − 1", "3(y − 1) + 2y = 12 ⇒ 5y = 15 ⇒ y = 3", "x = 3 − 1 = 2"], "tip": null, "fig": null, "id": "alg-4", "topic": "alg"}, {"type": "obj", "q": "Expand (2a − 3b)<sup>2</sup>.", "opts": ["4a<sup>2</sup> − 12ab + 9b<sup>2</sup>", "4a<sup>2</sup> + 12ab − 9b<sup>2</sup>", "4a<sup>2</sup> − 9b<sup>2</sup>", "4a<sup>2</sup> − 6ab + 9b<sup>2</sup>"], "ans": 0, "sol": ["(2a)<sup>2</sup> − 2(2a)(3b) + (3b)<sup>2</sup>", "= 4a<sup>2</sup> − 12ab + 9b<sup>2</sup>"], "tip": null, "fig": null, "id": "alg-5", "topic": "alg"}, {"type": "obj", "q": "If x = 2 and y = −3, evaluate <span class=\"fr\"><span>x<sup>2</sup> − y<sup>2</sup></span><span>x − y</span></span>.", "opts": ["1", "−1", "5", "−5"], "ans": 1, "sol": ["<span class=\"fr\"><span>x<sup>2</sup> − y<sup>2</sup></span><span>x − y</span></span> = <span class=\"fr\"><span>(x − y)(x + y)</span><span>x − y</span></span> = x + y", "= 2 + (−3) = −1"], "tip": null, "fig": null, "id": "alg-6", "topic": "alg"}, {"type": "thy", "q": "(a) Solve the simultaneous equations <span class=\"fr\"><span>x</span><span>2</span></span> + <span class=\"fr\"><span>y</span><span>3</span></span> = 4 and <span class=\"fr\"><span>x</span><span>4</span></span> − <span class=\"fr\"><span>y</span><span>6</span></span> = 0.<br>(b) A woman is four times as old as her son. In 20 years' time she will be twice as old as he will be. Find their present ages.", "sol": ["(a) Multiply the first equation by 6: 3x + 2y = 24 … (i)", "Multiply the second by 12: 3x − 2y = 0 … (ii)", "(i) + (ii): 6x = 24 ⇒ <b>x = 4</b>; then 2y = 3x = 12 ⇒ <b>y = 6</b>", "(b) Let the son be s years old; the woman is 4s.", "In 20 years: 4s + 20 = 2(s + 20)", "4s + 20 = 2s + 40 ⇒ 2s = 20 ⇒ s = 10", "<b>Son: 10 years; woman: 40 years</b>"], "marks": 10, "tip": null, "fig": null, "id": "alg-7", "topic": "alg"}, {"type": "thy", "q": "(a) Make l the subject of the formula T = 2π√(<span class=\"fr\"><span>l</span><span>g</span></span>).<br>(b) Hence find l when T = 2, g = 9.8 and π = <span class=\"fr\"><span>22</span><span>7</span></span>, correct to two decimal places.<br>(c) Factorise completely 3x<sup>3</sup> − 12x.", "sol": ["(a) Divide by 2π: <span class=\"fr\"><span>T</span><span>2π</span></span> = √(<span class=\"fr\"><span>l</span><span>g</span></span>)", "Square both sides: <span class=\"fr\"><span>T<sup>2</sup></span><span>4π<sup>2</sup></span></span> = <span class=\"fr\"><span>l</span><span>g</span></span>", "<b>l = <span class=\"fr\"><span>gT<sup>2</sup></span><span>4π<sup>2</sup></span></span></b>", "(b) l = <span class=\"fr\"><span>9.8 × 4</span><span>4 × (<span class=\"fr\"><span>22</span><span>7</span></span>)<sup>2</sup></span></span> = <span c on is the quadrilateral with corners (0, 0), (6, 0), (2, 4) and (0, 2).", "The lines meet where x + 2 = 6 − x ⇒ x = 2, y = 4", "(c) 3x + 2y: (0, 0) → 0;  (6, 0) → 18;  (2, 4) → 14;  (0, 2) → 4", "<b>Maximum = 18 at (6, 0)</b>"], "marks": 10, "tip": null, "fig": "<svg viewBox=\"0 0 320 260\" class=\"graph\" role=\"img\" aria-label=\"Graph\"><line x1=\"26.0\" y1=\"234.0\" x2=\"26.0\" y2=\"26.0\" class=\"gg\"/><line x1=\"64.3\" y1=\"234.0\" x2=\"64.3\" y2=\"26.0\" class=\"gg\"/><text x=\"64.3\" y=\"247.0\" class=\"gt\" text-anchor=\"middle\">1</text><line x1=\"102.6\" y1=\"234.0\" x2=\"102.6\" y2=\"26.0\" class=\"gg\"/><text x=\"102.6\" y=\"247.0\" class=\"gt\" text-anchor=\"middle\">2</text><line x1=\"140.9\" y1=\"234.0\" x2=\"140.9\" y2=\"26.0\" class=\"gg\"/><text x=\"140.9\" y=\"247.0\" class=\"gt\" text-anchor=\"middle\">3</text><line x1=\"179.1\" y1=\"234.0\" x2=\"179.1\" y2=\"26.0\" class=\"gg\"/><text x=\"179.1\" y=\"247.0\" class=\"gt\" text-anchor=\"middle\">4</text><line x1=\"217.4\" y1=\"234.0\" x2=\"217.4\" y2=\"26.0\" class=\"gg\"/><text x=\"217.4\" y=\"247.0\" class=\"gt\" text-anchor=\"middle\">5</text><line x1=\"255.7\" y1=\"234.0\" x2=\"255.7\" y2=\"26.0\" class=\"gg\"/><text x=\"255.7\" y=\"247.0\" class=\"gt\" text-anchor=\"middle\">6</text><line x1=\"294.0\" y1=\"234.0\" x2=\"294.0\" y2=\"26.0\" class=\"gg\"/><text x=\"294.0\" y=\"247.0\" class=\"gt\" text-anchor=\"middle\">7</text><line x1=\"26.0\" y1=\"234.0\" x2=\"294.0\" y2=\"234.0\" class=\"gg\"/><line x1=\"26.0\" y1=\"204.3\" x2=\"294.0\" y2=\"204.3\" class=\"gg\"/><text x=\"21.0\" y=\"207.8\" class=\"gt\" text-anchor=\"end\">1</text><line x1=\"26.0\" y1=\"174.6\" x2=\"294.0\" y2=\"174.6\" class=\"gg\"/><text x=\"21.0\" y=\"178.1\" class=\"gt\" text-anchor=\"end\">2</text><line x1=\"26.0\" y1=\"144.9\" x2=\"294.0\" y2=\"144.9\" class=\"gg\"/><text x=\"21.0\" y=\"148.4\" class=\"gt\" text-anchor=\"end\">3</text><line x1=\"26.0\" y1=\"115.1\" x2=\"294.0\" y2=\"115.1\" class=\"gg\"/><text x=\"21.0\" y=\"118.6\" class=\"gt\" text-anchor=\"end\">4</text><line x1=\"26.0\" y1=\"85.4\" x2=\"294.0\" y2=\"85.4\" class=\"gg\"/><text x=\"21.0\" y=\"88.9\" class=\"gt\" text-anchor=\"end\">5</text><line x1=\"26.0\" y1=\"55.7\" x2=\"294.0\" y2=\"55.7\" class=\"gg\"/><text x=\"21.0\" y=\"59.2\" class=\"gt\" text-anchor=\"end\">6</text><line x1=\"26.0\" y1=\"26.0\" x2=\"294.0\" y2=\"26.0\" class=\"gg\"/><text x=\"21.0\" y=\"29.5\" class=\"gt\" text-anchor=\"end\">7</text><line x1=\"26.0\" y1=\"234.0\" x2=\"26.0\" y2=\"26.0\" class=\"ga\"/><polygon points=\"26.0,234.0 255.7,234.0 102.6,115.1 26.0,174.6\" class=\"gs\"/><line x1=\"26.0\" y1=\"174.6\" x2=\"217.4\" y2=\"26.0\" class=\"gl\"/><line x1=\"26.0\" y1=\"55.7\" x2=\"255.7\" y2=\"234.0\" class=\"gl\"/><circle cx=\"102.6\" cy=\"115.1\" r=\"3.5\" class=\"gp\"/><text x=\"108.6\" y=\"109.1\" class=\"gt gpt\">(2, 4)</text></svg>", "id": "ineq-7", "topic": "ineq"}, {"type": "obj", "q": "Simplify <span class=\"fr\"><span>x<sup>2</sup> − 9</span><span>x<sup>2</sup> + x − 6</span></span>.", "opts": ["<span class=\"fr\"><span>3</span><span>2</span></span>", "<span class=\"fr\"><span>x + 3</span><span>x − 2</span></span>", "<span class=\"fr\"><span>x − 3</span><span>x + 2</span></span>", "<span class=\"fr\"><span>x − 3</span><span>x − 2</span></span>"], "ans": 3, "sol": ["<span class=\"fr\"><span>(x − 3)(x + 3)</span><span>(x + 3)(x − 2)</span></span> = <span class=\"fr\"><span>x − 3</span><span>x − 2</span></span>"], "tip": null, "fig": null, "id": "afunc-1", "topic": "afunc"}, {"type": "obj", "q": "Simplify <span class=\"fr\"><span>2</span><span>x − 1</span></span> − <span class=\"fr\"><span>1</span><span>x + 1</span></span>.", "opts": ["<span class=\"fr\"><span>3x + 1</span><span>x<sup>2</sup> − 1</span></span>", "<span class=\"fr\"><span>x + 1</span><span>x<sup>2</sup> − 1</span></span>", "<span class=\"fr\"><span>x + 3</span><span>x<sup>2</sup> − 1</span></span>", "<span class=\"fr\"><span>1</span><span>x<sup>2</sup> − 1</span></span>"], "ans": 2, "sol": ["LCM = (x − 1)(x + 1)", "<span class=\"fr\"><span>2(x + 1) − (x − 1)</span><span>(x − 1)(x + 1)</span></span> = <span class=\"fr\"><span>x + 3</span><span>x<sup>2</sup> − 1</span></span>"], "tip": null, "fig": null, "id": "afunc-2", "topic": "afunc"}, {"type": "obj", "q": "For what value of x is <span class=\"fr\"><span>x + 2</span><span>x<sup>2</sup> − 4x + 4</span></span> undefined?", "opts": ["0", "−2", "4", "2"], "ans": 3, "sol": ["x<sup>2</sup> − 4x + 4 = (x − 2)<sup>2</sup> = 0 ⇒ x = 2"], "tip": null, "fig": null, "id": "afunc-3", "topic": "afunc"}, {"type": "obj", "q": "If f(x) = 3x<sup>2</sup> − 2x + 1, find f(−2).", "opts": ["7", "17", "−15", "9"], "ans": 1, "sol": ["f(−2) = 3(4) − 2(−2) + 1 = 12 + 4 + 1 = 17"], "tip": null, "fig": null, "id": "afunc-4", "topic": "afunc"}, {"type": "obj", "q": "If g(x) = <span class=\"fr\"><span>x + 3</span><span>2</span></span>, find g<sup>−1</sup>(x).", "opts": ["<span class=\"fr\"><span>2</span><span>x + 3</span></span>", "2x + 3", "2x − 3", "<span class=\"fr\"><span>x − 3</span><span>2</span></span>"], "ans": 2, "sol": ["y = <span class=\"fr\"><span>x + 3</span><span>2</span></span> ⇒ swap: x = <span class=\"fr\"><span>y + 3</span><span>2</span></span>", "2x = y + 3 ⇒ y = 2x − 3"], "tip": null, "fig": null, "id": "afunc-5", "topic": "afunc"}, {"type": "obj", "q": "f(x) = 2x + 1 and g(x) = x<sup>2</sup>. Find f(g(3)).", "opts": ["13", "49", "36", "19"], "ans": 3, "sol": ["g(3) = 9", "f(9) = 2(9) + 1 = 19"], "tip": "g(f(3)) = 49 is a different question — the order matters.", "fig": null, "id": "afunc-6", "topic": "afunc"}, {"type": "thy", "q": "(a) Simplify <span class=\"fr\"><span>x<sup>2</sup> − 5x + 6</span><span>x<sup>2</sup> − 4</span></span> ÷ <span class=\"fr\"><span>x − 3</span><span>x<sup>2</sup> + 2x</span></span>.<br>(b) Solve <span class=\"fr\"><span>3</span><span>x − 1</span></span> − <span class=\"fr\"><span>2</span><span>x + 1</span></span> = 1.", "sol": ["(a) = <span class=\"fr\"><span>(x − 2)(x − 3)</span><span>(x − 2)(x + 2)</span></span> × <span class=\"fr\"><span>x(x + 2)</span><span>x − 3</span></span>", "= <b>x</b>", "(b) Multiply by (x − 1)(x + 1): 3(x + 1) − 2(x − 1) = x<sup>2</sup> − 1", "x + 5 = x<sup>2</sup> − 1 ⇒ x<sup>2</sup> − x − 6 = 0 ⇒ (x − 3)(x + 2) = 0", "<b>x = 3 or x = −2</b> (neither makes a denominator zero)"], "marks": 10, "tip": null, "fig": null, "id": "afunc-7", "topic": "afunc"}, {"type": "thy", "q": "f : x → 2x − 3 and g : x → <span class=\"fr\"><span>x + 1</span><span>x</span></span>, x ≠ 0.<br>(a) Find f(g(2)).<br>(b) Find f<sup>−1</sup>(x).<br>(c) Find the value of x for which f(x) = f<sup>−1</sup>(x).", "sol": ["(a) g(2) = <span class=\"fr\"><span>3</span><span>2</span></span>;  f(<span class=\"fr\"><span>3</span><span>2</span></span>) = 3 − 3 = <b>0</b>", "(b) y = 2x − 3 ⇒ swap: x = 2y − 3 ⇒ <b>f<sup>−1</sup>(x) = <span class=\"fr\"><span>x + 3</span><span>2</span></span></b>", "(c) 2x − 3 = <span class=\"fr\"><span>x + 3</span><span>2</span></span> ⇒ 4x − 6 = x + 3 ⇒ 3x = 9 ⇒ <b>x = 3</b>"], "marks": 9, "tip": null, "fig": null, "id": "afunc-8", "topic": "afunc"}, {"type": "obj", "q": "Find the area of a sector of a circle of radius 7 cm that subtends an angle of 72° at the centre. [π = <span class=\"fr\"><span>22</span><span>7</span></span>]", "opts": ["61.6 cm²", "8.8 cm²", "30.8 cm²", "154 cm²"], "ans": 2, "sol": ["Area = <span class=\"fr\"><span>72</span><span>360</span></span> × <span class=\"fr\"><span>22</span><span>7</span></span> × 7<sup>2</sup>", "= 0.2 × 154 = 30.8 cm²"], "tip": null, "fig": null, "id": "area-1", "topic": "area"}, {"type": "obj", "q": "Find the length of an arc that subtends 45° at the centre of a circle of radius 14 cm. [π = <span class=\"fr\"><span>22</span><span>7</span></span>]", "opts": ["11 cm", "5.5 cm", "22 cm", "77 cm"], "ans": 0, "sol": ["Arc = <span class=\"fr\"><span>45</span><span>360</span></span> × 2 × <span class=\"fr\"><span>22</span><span>7</span></span> × 14 = <span class=\"fr\"><span>1</span><span>8</span></span> × 88 = 11 cm"], "tip": null, "fig": null, "id": "area-2", "topic": "area"}, {"type": "obj", "q": "A trapezium has parallel sides of 8 cm and 12 cm, and a height of 5 cm. Find its area.", "opts": ["50 cm²", "60 cm²", "40 cm²", "100 cm²"], "ans": 0, "sol": ["Area = ½(8 + 12) × 5 = 50 cm²"], "tip": null, "fig": null, "id": "area-3", "topic": "area"}, {"type": "obj", "q": "A rectangle has a perimeter of 34 cm and a length of 12 cm. Find its area.", "opts": ["144 cm²", "70 cm²", "60 cm²", "204 cm²"], "ans": 2, "sol": ["2(12 + w) = 34 ⇒ w = 5 cm", "Area = 12 × 5 = 60 cm²"], "tip": null, "fig": null, "id": "area-4", "topic": "area"}, {"type": "obj", "q": "Find the area of a triangle with sides 13 cm, 14 cm and 15 cm.", "opts": ["84 cm²", "168 cm²", "42 cm²", "105 cm²"], "ans": 0, "sol": ["s = (13 + 14 + 15)/2 = 21", "Area = √[21 × 8 × 7 × 6] = √7056 = 84 cm²"], "tip": null, "fig": null, "id": "area-5", "topic": "area"}, {"type": "obj", "q": "Find the perimeter of a sector of radius 10.5 cm and angle 120°. [π = <span class=\"fr\"><span>22</span><span>7</span></span>]", "opts": ["43 cm", "64 cm", "22 cm", "32.5 cm"], "ans": 0, "sol": ["Arc = <span class=\"fr\"><span>120</span><span>360</span></span> × 2 × <span class=\"fr\"><span>22</span><span>7</span></span> × 10.5 = 22 cm", "Perimeter = 22 + 2(10.5) = 43 cm"], "tip": null, "fig": null, "id": "area-6", "topic": "area"}, {"type": "thy", "q": "A chord AB of a circle with centre O and radius 10 cm subtends an angle of 60° at O. [Take π = 3.142]<br>(a) Find the length of AB.<br>(b) Find the area of the minor segment.<br>(c) Find the perimeter of the minor segment.", "sol": ["(a) OA = OB = 10 cm and ∠AOB = 60°, so triangle AOB is equilateral ⇒ <b>AB = 10 cm</b>", "(b) Sector = <span class=\"fr\"><span>60</span><span>360</span></span> × 3.142 × 100 = 52.367 cm²", "Triangle = ½ × 10 × 10 × sin 60° = 43.301 cm²", "Segment = 52.367 − 43.301 = <b>9.07 cm²</b>", "(c) Arc
