s form).", "Step 3. <b>She has taught (or has been teaching) in this school for ten years.</b>"], "fig": null}]}, {"id": "concord", "name": "Concord (agreement)", "section": "Structure (Grammar)", "notes": ["A singular subject takes a singular verb, even when words come between them: 'The <b>list</b> of items <b>is</b> on the table.'", "With <i>neither…nor</i> and <i>either…or</i>, the verb agrees with the nearer subject.", "<i>Each, every, everyone, somebody, nobody, one of</i> are singular.", "'The number of…' is singular; 'A number of…' is plural.", "Nouns like <i>news, mathematics, measles, furniture, information, advice</i> take singular verbs."], "plain": "Concord means the verb must agree with its subject: one person 'walks', many people 'walk'. The danger is the words in between — cross them out and look only at the real subject.", "examples": [{"q": "Choose the correct verb: The box of tools (is / are) on the bench.", "steps": ["Step 1. Find the subject: it is <i>the box</i>, not <i>tools</i>.", "Step 2. 'of tools' only describes the box — cover it with your finger.", "Step 3. One box ⇒ singular verb: <b>The box of tools is on the bench.</b>"], "fig": null}, {"q": "Choose the correct verb: Neither the players nor the coach (was / were) happy.", "steps": ["Step 1. With <i>neither … nor</i>, the verb agrees with the subject NEARER to it.", "Step 2. The nearer subject is <i>the coach</i>, which is singular.", "Step 3. <b>Neither the players nor the coach was happy.</b>"], "fig": null}]}, {"id": "pron", "name": "Nouns, pronouns & determiners", "section": "Structure (Grammar)", "notes": ["Use the subject form after <i>than</i> when a verb is understood: 'He is taller than <b>I</b> (am).'", "After a preposition, use the object form: <i>between you and me</i>.", "A reflexive pronoun (<i>myself, themselves</i>) is used when subject and object are the same person.", "Countable nouns take <i>many, few, fewer</i>; uncountable nouns take <i>much, little, less</i>.", "<i>Its</i> = belonging to it;  <i>it's</i> = it is / it has."], "plain": "Pronouns stand in for nouns: he, she, it, they, him, them. Use the subject form (I, he, they) before a verb, and the object form (me, him, them) after a verb or a preposition.", "examples": [{"q": "Choose correctly: The teacher gave the books to Kofi and (I / me).", "steps": ["Step 1. 'to' is a preposition, so the object form is needed.", "Step 2. Test it by removing 'Kofi and': you would say 'gave the books to me', not 'to I'.", "Step 3. <b>The teacher gave the books to Kofi and me.</b>"], "fig": null}, {"q": "Choose correctly: My brother is taller than (I / me).", "steps": ["Step 1. The full sentence is 'taller than I am'.", "Step 2. Because a verb is understood after it, the subject form is used.", "Step 3. <b>My brother is taller than I (am).</b>"], "fig": null}]}, {"id": "prep", "name": "Prepositions & phrasal verbs", "section": "Structure (Grammar)", "notes": ["Learn verbs with their prepositions: <i>congratulate on, accuse of, insist on, comply with, deprive of, prefer to, different from, married to</i>.", "A phrasal verb's meaning is often nothing like the verb alone: <i>put off</i> = postpone, <i>call off</i> = cancel.", "<i>Look into</i> = investigate;  <i>look after</i> = take care of;  <i>look for</i> = search for;  <i>look up to</i> = respect.", "Do not add unnecessary prepositions: <i>discuss</i> (not 'discuss about'), <i>request</i> (not 'request for')."], "plain": "Prepositions are small words like in, on, at, to, from — and English fixes certain ones to certain verbs. There is no rule; they must be learnt as pairs: <i>depend ON, married TO, accused OF</i>.", "examples": [{"q": "Fill the gap: The success of the farm depends ___ regular rainfall.", "steps": ["Step 1. Think of the fixed pair for the verb <i>depend</i>.", "Step 2. We always say <i>depend <b>on</b></i> (never 'depend from' or 'depend of').", "Step 3. <b>The success of the farm depends on regular rainfall.</b>"], "fig": null}, {"q": "Give the meaning of the phrasal verbs: (a) call off (b) look after (c) turn down.", "steps": ["(a) <b>cancel</b> — The match was called off because of rain.", "(b) <b>take care of</b> — She looks after her grandmother.", "(c) <b>refuse / reject</b> — He turned down the offer."], "fig": null}]}, {"id": "adj", "name": "Adjectives, adverbs & comparison", "section": "Structure (Grammar)", "notes": ["Short adjectives: <i>-er/-est</i> (tall, taller, tallest). Longer ones: <i>more/most</i>.", "Never use both: <i>more taller</i> is wrong.", "Irregular: good/better/best, bad/worse/worst, little/less/least, many/more/most, far/farther/furthest.", "Use the comparative for two things and the superlative for more than two.", "Adjectives describe nouns; adverbs describe verbs, adjectives or other adverbs: 'He drives <b>carefully</b>.'"], "plain": "Adjectives describe nouns (a <i>tall</i> boy); adverbs describe verbs (he ran <i>quickly</i>). When comparing two things use the comparative (taller); for three or more use the superlative (tallest).", "examples": [{"q": "Choose correctly: Of the two sisters, Akua is the (older / oldest).", "steps": ["Step 1. How many are being compared? Two.", "Step 2. Two ⇒ comparative form.", "Step 3. <b>Akua is the older.</b> ('Oldest' would need three or more sisters.)"], "fig": null}, {"q": "Correct this sentence: He played very good in the match.", "steps": ["Step 1. The word describes HOW he played — a verb — so an adverb is needed.", "Step 2. The adverb of <i>good</i> is <i>well</i>.", "Step 3. <b>He played very well in the match.</b>"], "fig": null}]}, {"id": "tags", "name": "Question tags, conditionals & reported speech", "section": "Structure (Grammar)", "notes": ["A positive statement takes a negative tag, and a negative statement takes a positive tag.", "Special tags: 'Let's go, <b>shall we</b>?', 'I am right, <b>aren't I</b>?', 'Nobody came, <b>did they</b>?', 'Open the door, <b>will you</b>?'", "Type 2 conditional: 'If I <b>were</b> you, I <b>would</b> accept.'  Type 3: 'If he <b>had studied</b>, he <b>would have</b> passed.'", "In reported speech shift the tense back and change time and place words: <i>now → then, today → that day, here → there, tomorrow → the following day</i>."], "plain": "A question tag is the short question added to a statement: 'You are ready, aren't you?' The rule is simple — positive statement takes a negative tag, and negative statement takes a positive tag.", "examples": [{"q": "Add the tag: Ama has finished her work, ___?", "steps": ["Step 1. The statement is positive, so the tag must be negative.", "Step 2. Use the same helping verb, <i>has</i>, and the pronoun <i>she</i>.", "Step 3. <b>Ama has finished her work, hasn't she?</b>"], "fig": null}, {"q": "Report this: The teacher said, 'I will mark your books tomorrow.'", "steps": ["Step 1. The reporting verb <i>said</i> is past, so shift the tense back: will → would.", "Step 2. Change the pronouns: I → he/she, your → their.", "Step 3. Change the time word: tomorrow → the following day.", "<b>The teacher said that he would mark their books the following day.</b>"], "fig": null}]}, {"id": "clause", "name": "Clauses, phrases & sentence types", "section": "Structure (Grammar)", "notes": ["A phrase has no finite verb; a clause has one.", "Simple = one clause. Compound = two main clauses joined by <i>and, but, or, so</i>. Complex = a main clause plus a subordinate clause.", "Noun clause: does the work of a noun ('<i>What he said</i> surprised us').", "Adjectival (relative) clause: describes a noun ('the man <i>who called</i>').", "Adverbial clause: tells when, where, why, how or on what condition ('<i>because it rained</i>')."], "plain": "A phrase is a group of words with no verb in it; a clause has a verb. A main clause can stand alone; a subordinate clause cannot, and does the work of a noun, an adjective or an adverb.", "examples": [{"q": "Name the underlined clause and state its function: I know <u>that he is honest</u>.", "steps": ["Step 1. Does it have a verb? Yes — <i>is</i>. So it is a clause.", "Step 2. Ask 'know WHAT?' — the clause answers it, so it names a thing: it is doing a noun's work.", "Step 3. It is a <b>noun clause</b>, and its function is the <b>object of the verb 'know'</b>."], "fig": null}, {"q": "Say whether each sentence is simple, compound or complex.<br>(a) The rain stopped. (b) The rain stopped and we went out. (c) We went out when the rain stopped.", "steps": ["(a) One clause only ⇒ <b>simple</b>.", "(b) Two clauses that can each stand alone, joined by <i>and</i> ⇒ <b>compound</b>.", "(c) 'when the rain stopped' cannot stand alone ⇒ <b>complex</b>."], "fig": null}], "fig": "<svg viewBox=\"0 0 364 152\" class=\"dia\" role=\"img\" aria-label=\"Types of subordinate clause\" style=\"width:min(100%,418px)\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5.5\" markerHeight=\"5.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dah\"/></marker></defs><rect x=\"112.0\" y=\"10\" width=\"140\" height=\"42\" rx=\"7\" class=\"dfill\"/><text x=\"182.0\" y=\"27.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Subordinate</text><text x=\"182.0\" y=\"41.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">clauses</text><rect x=\"10.0\" y=\"92\" width=\"104\" height=\"50\" rx=\"7\" class=\"dbox\"/><text x=\"62.0\" y=\"113.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">Noun clause —</text><text x=\"62.0\" y=\"127.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">names a thing</text><path d=\"M182.0,52 L182.0,72 L62.0,72 L62.0,92\" class=\"dline\"/><rect x=\"130.0\" y=\"92\" width=\"104\" height=\"50\" rx=\"7\" class=\"dbox\"/><text x=\"182.0\" y=\"106.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">Adjectival —</text><text x=\"182.0\" y=\"120.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">describes a</text><text x=\"182.0\" y=\"134.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">noun</text><path d=\"M182.0,52 L182.0,72 L182.0,72 L182.0,92\" class=\"dline\"/><rect x=\"250.0\" y=\"92\" width=\"104\" height=\"50\" rx=\"7\" class=\"dbox\"/><text x=\"302.0\" y=\"106.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">Adverbial —</text><text x=\"302.0\" y=\"120.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">tells when,</text><text x=\"302.0\" y=\"134.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:12.5px\">why, how</text><path d=\"M182.0,52 L182.0,72 L302.0,72 L302.0,92\" class=\"dline\"/></svg>"}, {"id": "punct", "name": "Punctuation, capitals & spelling", "section": "Structure (Grammar)", "notes": ["Use a comma to separate items in a list and to mark off a non-defining clause.", "A colon introduces a list or an explanation; a semicolon joins two closely related main clauses.", "Apostrophes: <i>boy's</i> (one boy), <i>boys'</i> (more than one boy), <i>children's</i> (irregular plural).", "Capitalise names, days, months, nationalities, titles and the first word of a sentence — but not seasons or subjects (except languages).", "Watch the spelling of: <i>necessary, occurrence, separate, definitely, committee, receive, privilege, embarrass, maintenance</i>."], "plain": "Punctuation shows the reader where to pause and what belongs together. Two marks decide many exam questions: the comma (small pause, or marking off extra information) and the apostrophe (ownership).", "examples": [{"q": "Punctuate: my brother who lives in kumasi is a nurse", "steps": ["Step 1. Start with a capital letter and end with a full stop.", "Step 2. 'who lives in Kumasi' is extra information, so mark it off with a pair of commas.", "Step 3. Capitalise the place name.", "<b>My brother, who lives in Kumasi, is a nurse.</b>"], "fig": null}, {"q": "Where does the apostrophe go: (a) the boys books (one boy) (b) the boys books (many boys)?", "steps": ["Step 1. First decide who owns: one boy or many boys.", "(a) One boy owns them ⇒ add 's: <b>the boy's books</b>.", "(b) Many boys own them; <i>boys</i> already ends in s ⇒ add only the apostrophe: <b>the boys' books</b>."], "fig": null}]}, {"id": "voice", "name": "Active & passive voice", "section": "Structure (Grammar)", "notes": ["Passive = the right form of <i>be</i> + past participle: 'The letter <b>was written</b> by Kofi.'", "The object of the active sentence becomes the subject of the passive.", "Use <i>by</i> only when the doer matters; often it is left out.", "Keep the tense: writes → is written;  wrote → was written;  has written → has been written;  will write → will be written.", "Verbs like <i>have, resemble, lack, suit</i> have no passive form."], "plain": "In the active voice the doer comes first: 'The boy kicked the ball.' In the passive the thing done to comes first: 'The ball was kicked by the boy.' The passive is useful when the doer is unknown.", "examples": [{"q": "Change to the passive: The farmer harvested the maize last week.", "steps": ["Step 1. Move the object to the front: <i>The maize</i>.", "Step 2. Use the right form of <i>be</i> in the SAME tense (past simple) + past participle: <i>was harvested</i>.", "Step 3. Add the doer with 'by' if it matters.", "<b>The maize was harvested by the farmer last week.</b>"], "fig": null}, {"q": "Change to the active: The window was broken by the children.", "steps": ["Step 1. The doer is 'the children' — put them first.", "Step 2. Keep the tense: <i>was broken</i> (past) ⇒ <i>broke</i>.", "Step 3. <b>The children broke the window.</b>"], "fig": null}]}, {"id": "errors", "name": "Common errors & sentence improvement", "section": "Structure (Grammar)", "notes": ["Say <i>discuss</i> and <i>request</i>, not 'discuss about' or 'request for'.", "<i>Despite</i> and <i>in spite of</i> — never 'despite of'.", "<i>Prefer X to Y</i>, not 'prefer X than Y'.  <i>Different from</i>, not 'different than'.", "<i>Lend</i> = give out;  <i>borrow</i> = take. 'He lent me money' (not 'borrowed me money').", "'The reason is <b>that</b>…', not 'the reason is because'.", "'One of the boys <b>who have</b> come' — the verb follows <i>boys</i>; but 'One of the boys <b>is</b> here'."], "plain": "Many marks are lost not on hard grammar but on the same handful of slips. Learn these patterns by heart and you protect easy marks in both Paper 1 and your essays.", "examples": [{"q": "Correct: 'The committee have discuss about the matter and they decided to postpone it.'", "steps": ["Step 1. 'have discuss' — after <i>have</i> use the past participle: <b>have discussed</b>.", "Step 2. 'discuss about' — <i>discuss</i> takes no preposition: <b>discussed the matter</b>.", "Step 3. Keep the pronoun consistent with the collective noun.", "<b>The committee have discussed the matter and they decided to postpone it.</b> (Or, treating the committee as one body: 'The committee has discussed the matter and it decided…')"], "fig": null}, {"q": "Improve: 'Being that the road was bad, we reached late.'", "steps": ["Step 1. 'Being that' is not standard English in this sense.", "Step 2. Use <i>Since</i>, <i>Because</i> or <i>As</i>.", "Step 3. 'Reached' needs an object: reached home / arrived late.", "<b>Because the road was bad, we arrived late.</b>"], "fig": null}]}, {"id": "essay", "name": "Essay & letter writing", "section": "Comprehension, Summary & Essay", "notes": ["Essays are marked on Content, Organisation, Expression and Mechanical Accuracy — plan before you write.", "Formal letter: writer's address, date, receiver's address, salutation (Dear Sir/Madam), TITLE in capitals or underlined, body, 'Yours faithfully' + full name.", "Informal letter: writer's address and date only, 'Dear Ama', no title, 'Yours sincerely' / 'Your friend' + first name.", "'Yours faithfully' goes with 'Dear Sir/Madam'; 'Yours sincerely' goes with a name (Dear Mr Mensah).", "A speech needs vocatives (Mr Chairman, distinguished guests…) and an article needs a title and a by-line.", "Keep to the number of paragraphs your plan needs: introduction, three or four developed points, conclusion."], "plain": "An essay is marked on four things: content (your points), organisation (paragraphs), expression (grammar and vocabulary) and mechanical accuracy (spelling and punctuation). Plan for five minutes before you write — it is the cheapest way to gain marks.", "examples": [{"q": "How to plan any essay in five minutes.", "steps": ["Step 1. Underline the key words in the question: WHAT to write, to WHOM, and HOW MANY points.", "Step 2. Jot down four or five points in rough — one for each paragraph.", "Step 3. Decide the opening (state your stand or purpose) and the closing (a short, firm conclusion).", "Step 4. Write, giving each point its own paragraph with one example."], "fig": null}, {"q": "Set out a formal letter correctly.", "steps": ["Step 1. Your own address at the top right, with the date under it.", "Step 2. The receiver's address on the left, then the salutation: Dear Sir/Madam.", "Step 3. A title in capitals or underlined, then three or four paragraphs.", "Step 4. End with <i>Yours faithfully</i> (because you wrote Dear Sir/Madam), your signature and your full name in capitals."], "fig": "<svg viewBox=\"0 0 300 320\" class=\"dia\" role=\"img\" aria-label=\"Layout of a formal letter\" style=\"width:min(100%,345px)\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5.5\" markerHeight=\"5.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dah\"/></marker></defs><rect x=\"18\" y=\"12\" width=\"264\" height=\"296\" rx=\"6\" class=\"dbox\"/><text x=\"264.0\" y=\"40.0\" class=\"dmut\" text-anchor=\"end\">Your address</text><text x=\"264.0\" y=\"62.0\" class=\"dmut\" text-anchor=\"end\">Date</text><text x=\"36.0\" y=\"96.0\" class=\"dmut\" text-anchor=\"start\">The District Chief Executive</text><text x=\"36.0\" y=\"112.0\" class=\"dmut\" text-anchor=\"start\">(receiver's address)</text><text x=\"36.0\" y=\"148.0\" class=\"dtxt\" text-anchor=\"start\">Dear Sir / Madam,</text><text x=\"36.0\" y=\"176.0\" class=\"dtxt\" text-anchor=\"start\">TITLE IN CAPITALS</text><text x=\"36.0\" y=\"262.0\" class=\"dmut\" text-anchor=\"start\">Yours faithfully,</text><text x=\"36.0\" y=\"284.0\" class=\"dtxt\" text-anchor=\"start\">YOUR FULL NAME</text><rect x=\"36\" y=\"192\" width=\"228\" height=\"56\" rx=\"4\" class=\"dfill\" fill-opacity=\"0.35\"/><text x=\"150.0\" y=\"224.0\" class=\"dmut\" text-anchor=\"middle\">Body: 3 or 4 paragraphs</text></svg>"}]}, {"id": "report", "name": "Reports, speeches & articles", "section": "Comprehension, Summary & Essay", "notes": ["A REPORT has a title, says who asked for it, states the findings in order, and ends with conclusions and recommendations, then the writer's name and position.", "A SPEECH opens with vocatives — 'Mr Chairman, the Headmaster, distinguished guests, fellow students' — and addresses the audience directly throughout.", "An ARTICLE has a title and a by-line, is written for readers of a named magazine or newspaper, and ends with a clear conclusion.", "All three are marked on content, organisation, expression and mechanical accuracy — so plan before you write.", "Keep the tone formal for a report, warm but respectful for a speech, and lively but clean for an article."], "plain": "These three are 'writing for a purpose'. Ask yourself: who will read it, and what should they do afterwards? A report informs someone who must act; a speech moves an audience in front of you; an article interests a reader who chose to pick up the magazine.", "examples": [{"q": "Tell the three apart at a glance.", "steps": ["<b>Report</b> — title, terms of reference, findings, recommendations, writer's name and position. No salutation.", "<b>Speech</b> — vocatives at the start, direct address ('you', 'we') all through, and a closing thank-you.", "<b>Article</b> — title and by-line, written for named readers, a lively opening and a firm conclusion."], "fig": "<svg viewBox=\"0 0 384 96\" class=\"dia\" role=\"img\" aria-label=\"Report, speech and article\" style=\"width:min(100%,441px)\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5.5\" markerHeight=\"5.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dah\"/></marker></defs><text x=\"192.0\" y=\"15.0\" class=\"dmut\" text-anchor=\"middle\" style=\"font-size:12px\">Three forms, three purposes</text><rect x=\"10\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"62.0\" y=\"49.0\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Report: inform</text><text x=\"62.0\" y=\"64.0\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">& advise</text><rect x=\"140\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"192.0\" y=\"41.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Speech:</text><text x=\"192.0\" y=\"56.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">address an</text><text x=\"192.0\" y=\"71.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">audience</text><line x1=\"117.0\" y1=\"53.0\" x2=\"136.0\" y2=\"53.0\" class=\"dline\" marker-end=\"url(#ah)\"/><rect x=\"270\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"322.0\" y=\"41.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Article:</text><text x=\"322.0\" y=\"56.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">interest a</text><text x=\"322.0\" y=\"71.5\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">reader</text><line x1=\"247.0\" y1=\"53.0\" x2=\"266.0\" y2=\"53.0\" class=\"dline\" marker-end=\"url(#ah)\"/></svg>"}, {"q": "Write the opening of a speech on 'The dangers of drug abuse' to be delivered at a school assembly.", "steps": ["Step 1. Vocatives, in order of seniority.", "Step 2. State the subject and why it matters now.", "<div class=\"model\">Mr Chairman, the Headmaster, members of staff, invited guests, fellow students, good morning. I have been asked to speak on a subject that is quietly taking away our friends and classmates: the abuse of drugs. Before I sit down, I hope every one of us will see why a single tablet taken 'just to stay awake' can cost a whole future…</div>"], "fig": null}]}, {"id": "comp", "name": "Comprehension", "section": "Comprehension, Summary & Essay", "notes": ["Read the whole passage once for the general sense, then read the question and go back to find the exact place.", "Answer in your own words as far as possible, and in complete sentences.", "For 'what does the expression mean?', give the meaning IN THIS CONTEXT, not the dictionary meaning of each word.", "Grammatical-name questions need two parts: the NAME (e.g. adverbial clause of time) and the FUNCTION (what it modifies or does).", "Do not copy long stretches of the passage — lifting whole sentences loses marks."], "plain": "Comprehension is not a memory test — the answers are in the passage. Read once for the story, then read each question and go back to the exact line. Answer in your own words, in full sentences.", "examples": [{"q": "How to answer 'What is the meaning of the expression X as used in the passage?'", "steps": ["Step 1. Find the expression and read the sentence BEFORE and AFTER it.", "Step 2. Ask what the writer is saying at that point, not what the words mean separately.", "Step 3. Write it in your own words, in a complete sentence.", "Example: 'He was walking on eggshells' in a passage about an angry boss means <b>he was being very careful not to upset anyone.</b>"], "fig": null}, {"q": "How to answer 'What grammatical name is given to this expression and what is its function?'", "steps": ["Step 1. Two marks, two parts — always give BOTH.", "Step 2. Name it: noun clause, adjectival clause, adverbial clause of time/reason, or a phrase.", "Step 3. Say what work it does, naming the word it works with.", "Model answer: <b>It is an adverbial clause of time; it modifies the verb 'left'.</b>"], "fig": null}], "fig": "<svg viewBox=\"0 0 514 96\" class=\"dia\" role=\"img\" aria-label=\"How to attack a comprehension passage\" style=\"width:min(100%,520px)\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5.5\" markerHeight=\"5.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dah\"/></marker></defs><text x=\"257.0\" y=\"15.0\" class=\"dmut\" text-anchor=\"middle\" style=\"font-size:12px\">Comprehension in four steps</text><rect x=\"10\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"62.0\" y=\"49.0\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Read the whole</text><text x=\"62.0\" y=\"64.0\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">passage</text><rect x=\"140\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"192.0\" y=\"49.0\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Read the</text><text x=\"192.0\" y=\"64.0\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">question</text><line x1=\"117.0\" y1=\"53.0\" x2=\"136.0\" y2=\"53.0\" class=\"dline\" marker-end=\"url(#ah)\"/><rect x=\"270\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"322.0\" y=\"49.0\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Find the exact</text><text x=\"322.0\" y=\"64.0\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">line</text><line x1=\"247.0\" y1=\"53.0\" x2=\"266.0\" y2=\"53.0\" class=\"dline\" marker-end=\"url(#ah)\"/><rect x=\"400\" y=\"24\" width=\"104\" height=\"58\" rx=\"7\" class=\"dbox\"/><text x=\"452.0\" y=\"49.0\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">Answer in your</text><text x=\"452.0\" y=\"64.0\" class=\"dtxt\" text-anchor=\"middle\" style=\"font-size:13px\">own words</text><line x1=\"377.0\" y1=\"53.0\" x2=\"396.0\" y2=\"53.0\" class=\"dline\" marker-end=\"url(#ah)\"/></svg>"}, {"id": "summary", "name": "Summary writing", "section": "Comprehension, Summary & Essay", "notes": ["Answer ONLY the question asked — marks are lost for including points the question did not ask for.", "Use your own words; do not lift whole sentences from the passage.", "Write the number of sentences asked for, each a complete sentence, and each carrying ONE point.", "Leave out examples, illustrations and repetition — they are not points.", "Read the instruction carefully: 'in three sentences, one for each' means exactly three."], "plain": "Summary means saying the same thing in fewer words — and only what the question asks for. Marks are lost for adding your own opinion, copying long sentences, or writing more sentences than asked.", "examples": [{"q": "A passage lists reasons why young people leave villages. The question asks for THREE reasons in three sentences. How do you go about it?", "steps": ["Step 1. Underline every reason in the passage — ignore effects and solutions.", "Step 2. Group repeated points together; an example is not a separate point.", "Step 3. Write exactly three sentences, one point in each, in your own words.", "Model: <b>1. There are few jobs in the villages. 2. Social amenities such as electricity and clinics are lacking. 3. Farming brings low and uncertain incomes.</b>"], "fig": null}, {"q": "Reduce this to one short sentence: 'The headmaster, who has been in the school for many years and knows every student by name, said that he was not at all pleased with the way the students behaved.'", "steps": ["Step 1. Find the main idea: the headmaster was displeased with the students' behaviour.", "Step 2. Drop the extra information about his years and knowing names — it is not the point.", "Step 3. <b>The long-serving headmaster was displeased with the students' behaviour.</b>"], "fig": null}]}, {"id": "vowel", "name": "Vowel sounds & rhymes", "section": "Oral English", "notes": ["Spelling is not sound: <i>meat, great</i> and <i>heart</i> all have different vowels.", "Pure vowels do not glide: /iː/ (see), /ɪ/ (sit), /e/ (bed), /æ/ (cat), /ɑː/ (car), /ɒ/ (hot), /ɔː/ (born), /ʊ/ (put), /uː/ (food), /ʌ/ (cut), /ɜː/ (bird), /ə/ (about).", "Diphthongs glide from one vowel to another: /eɪ/ (day), /aɪ/ (my), /ɔɪ/ (boy), /əʊ/ (go), /aʊ/ (now), /ɪə/ (beer), /eə/ (care), /ʊə/ (tour).", "Two words rhyme when the sounds from the stressed vowel to the end are the same — <i>rough</i> and <i>stuff</i> rhyme, <i>rough</i> and <i>though</i> do not."], "plain": "In Oral English you match SOUNDS, not spellings. <i>Meat, great</i> and <i>heart</i> are spelt alike but sound different. Say the words quietly to yourself and listen to the vowel in the middle.", "examples": [{"q": "Which word has the same vowel sound as <i>cut</i>: <i>put, love, cute, cure</i>?", "steps": ["Step 1. Say <i>cut</i> — the vowel is the short /ʌ/ sound.", "Step 2. Test each one: <i>put</i> = /ʊ/, <i>love</i> = /ʌ/, <i>cute</i> = /juː/, <i>cure</i> = /ʊə/.", "Step 3. The answer is <b>love</b> — spelling with an <i>o</i> does not matter."], "fig": null}, {"q": "Which word does NOT rhyme with the others: <i>tough, rough, cough, puff</i>?", "steps": ["Step 1. Rhyme depends on the sound from the vowel to the end.", "Step 2. <i>Tough</i> = /tʌf/, <i>rough</i> = /rʌf/, <i>puff</i> = /pʌf/ — all the same ending.", "Step 3. <i>Cough</i> = /kɒf/, a different vowel, so <b>cough</b> is the odd one out."], "fig": null}]}, {"id": "cons", "name": "Consonants & consonant clusters", "section": "Oral English", "notes": ["Voiced and voiceless pairs: /p–b/, /t–d/, /k–ɡ/, /f–v/, /s–z/, /ʃ–ʒ/, /θ–ð/, /tʃ–dʒ/.", "The plural/third-person -s is /s/ after a voiceless sound (books), /z/ after a voiced one (bags) and /ɪz/ after s, z, ʃ, tʃ, dʒ (buses, watches).", "The past -ed is /t/ after voiceless (walked), /d/ after voiced (played) and /ɪd/ after t or d (wanted, ended).", "Silent letters: k in <i>knee</i>, b in <i>debt</i>, p in <i>psalm</i>, t in <i>listen</i>, h in <i>honest</i>, w in <i>write</i>, g in <i>gnaw</i>.", "A cluster is two or more consonants together with no vowel between: <i>spl</i>ash, stre<i>ngth</i>."], "plain": "Consonant questions test which sound a letter makes, and which letters are silent. Say the word aloud and feel your mouth: /s/ is hissed with no voice, /z/ buzzes in your throat.", "examples": [{"q": "How is the final -s pronounced in <i>dogs, cats</i> and <i>buses</i>?", "steps": ["Step 1. Feel the sound BEFORE the -s.", "Step 2. /ɡ/ in <i>dogs</i> is voiced (your throat buzzes) ⇒ the -s is <b>/z/</b>.", "Step 3. /t/ in <i>cats</i> is voiceless ⇒ the -s is <b>/s/</b>.", "Step 4. <i>Bus</i> already ends in a hissing sound ⇒ the ending is <b>/ɪz/</b>."], "fig": null}, {"q": "Which letter is silent in each word: <i>knife, debt, castle, honour</i>?", "steps": ["<i>knife</i> — the <b>k</b>;  <i>debt</i> — the <b>b</b>;  <i>castle</i> — the <b>t</b>;  <i>honour</i> — the <b>h</b>.", "Tip: learn silent letters in families — kn- (knee, knock, know), -stle (castle, whistle, listen)."], "fig": null}]}, {"id": "stress", "name": "Word stress, emphatic stress & intonation", "section": "Oral English", "notes": ["In every word of more than one syllable, one syllable is said with more force: <i>de-VEL-op-ment</i>.", "Stress can move as the word changes: PHO-to-graph, pho-TO-gra-pher, pho-to-GRAPH-ic.", "Many two-syllable words are nouns when stressed on the first syllable and verbs when stressed on the second: an <b>IN</b>crease / to in<b>CREASE</b>; a <b>RE</b>cord / to re<b>CORD</b>.", "Emphatic stress puts the force on the word that answers the question in the listener's mind.", "Statements, commands and wh-questions normally take a falling tune; yes/no questions take a rising tune."], "plain": "Stress is the syllable you say with more force: <i>TA-ble</i>, not <i>ta-BLE</i>. Emphatic stress is when you push one WORD in a sentence, and that word answers the listener's question.", "examples": [{"q": "Where is the stress in <i>examination</i>, and what happens in <i>photograph → photographer</i>?", "steps": ["Step 1. Break the word into syllables: e-xa-mi-NA-tion — the stress is on the <b>fourth</b> syllable.", "Step 2. Stress can move when a word changes: <b>PHO</b>-to-graph, but pho-<b>TO</b>-gra-pher.", "Step 3. Practise saying both aloud; the meaning does not change, only the beat."], "fig": null}, {"q": "In 'Kofi bought the book on TUESDAY', what question does the stress answer?", "steps": ["Step 1. Find the word said with extra force: TUESDAY.", "Step 2. That word gives the new or important information — the day.", "Step 3. It answers: <b>When did Kofi buy the book?</b>"], "fig": null}]}, {"id": "listen", "name": "Listening & spoken responses", "section": "Oral English", "notes": ["In the listening test you hear a word, a sentence or a short passage and answer multiple-choice questions, so listen for the exact sound or the exact detail asked for.", "Polite replies are tested: 'Would you mind opening the door?' → '<b>Not at all</b>' (never 'Yes, I mind').", "'Thank you' → 'You're welcome' / 'Don't mention it'.  'Sorry to disturb you' → 'That's all right'.", "A rising tune invites an answer (yes/no questions); a falling tune closes a statement, a command or a wh-question.", "Listen for the KEY word in a question: who, when, where, why, how many."], "plain": "The orals paper is about sound and about everyday spoken English. Half the marks come from knowing the natural reply to a polite expression — the kind of English you already speak, written down.", "examples": [{"q": "Why is 'Yes, I mind' wrong as a reply to 'Would you mind helping me?'", "steps": ["Step 1. 'Would you mind…?' literally asks whether the request troubles you.", "Step 2. If you are willing, you must say that it does NOT trouble you: 'Not at all' or 'Of course not' or 'Certainly'.", "Step 3. 'Yes, I mind' means you refuse — and it sounds rude, which is why it is never the key."], "fig": null}, {"q": "How to handle a listening passage you only partly hear.", "steps": ["Step 1. Do not panic or stop — the next question is already on its way.", "Step 2. Answer from what you did hear; the questions usually follow the order of the passage.", "Step 3. Mark the one you missed and return to it at the end rather than losing two or three more."], "fig": null}]}], "questions": [{"type": "obj", "q": "Choose the word that is nearest in meaning to the underlined word: The chief's <u>lucid</u> explanation calmed the angry youth.", "opts": ["angry", "clear", "loud", "lengthy"], "ans": 1, "sol": ["<i>Lucid</i> means easy to understand, clear and well expressed.", "The explanation calmed people, so a positive, clarifying word is needed: <b>clear</b>."], "tip": null, "fig": null, "id": "syn-1", "topic": "syn"}, {"type": "obj", "q": "Choose the word nearest in meaning to the underlined word: The headmaster was <u>adamant</u> about the new rules.", "opts": ["doubtful", "cheerful", "careless", "unyielding"], "ans": 3, "sol": ["<i>Adamant</i> = refusing to be persuaded, firm.", "The closest word is <b>unyielding</b>."], "tip": null, "fig": null, "id": "syn-2", "topic": "syn"}, {"type": "obj", "q": "Choose the word nearest in meaning to the underlined word: Farmers in the area have suffered a <u>meagre</u> harvest this year.", "opts": ["plentiful", "bitter", "early", "scanty"], "ans": 3, "sol": ["<i>Meagre</i> means small in quantity and not enough.", "<b>Scanty</b> carries the same idea; <i>plentiful</i> is its opposite."], "tip": null, "fig": null, "id": "syn-3", "topic": "syn"}, {"type": "obj", "q": "Choose the word nearest in meaning to the underlined word: Her <u>candid</u> remarks surprised the committee.", "opts": ["clever", "frank", "brief", "rude"], "ans": 1, "sol": ["<i>Candid</i> means honest and straightforward, saying what one really thinks.", "<b>Frank</b> is the synonym. <i>Rude</i> adds a negative tone that <i>candid</i> does not carry."], "tip": null, "fig": null, "id": "syn-4", "topic": "syn"}, {"type": "obj", "q": "Choose the word nearest in meaning to the underlined word: The new bridge has <u>alleviated</u> the traffic problem.", "opts": ["worsened", "studied", "solved", "eased"], "ans": 3, "sol": ["<i>Alleviate</i> = to make something less severe.", "<b>Eased</b> is closest. <i>Solved</i> is too strong — alleviating is not the same as removing completely."], "tip": null, "fig": null, "id": "syn-5", "topic": "syn"}, {"type": "obj", "q": "Choose the word nearest in meaning to the underlined word: The two brothers have a <u>cordial</u> relationship.", "opts": ["friendly", "distant", "formal", "business"], "ans": 0, "sol": ["<i>Cordial</i> means warm and friendly.", "The answer is <b>friendly</b>."], "tip": null, "fig": null, "id": "syn-6", "topic": "syn"}, {"type": "thy", "q": "Replace each underlined word with a word of similar meaning, without changing the meaning of the sentence.<br>(a) The minister gave an <u>ambiguous</u> answer.<br>(b) Poverty is <u>rampant</u> in the district.<br>(c) The student was <u>diligent</u> in her studies.<br>(d) He gave a <u>succinct</u> account of the accident.<br>(e) The crowd was <u>hostile</u> to the visitors.", "sol": ["(a) <b>unclear / vague</b> — capable of more than one meaning", "(b) <b>widespread / prevalent</b> — spreading unchecked", "(c) <b>hardworking / industrious</b>", "(d) <b>brief / concise</b> — short but complete", "(e) <b>unfriendly / antagonistic</b>"], "marks": 5, "tip": null, "fig": null, "id": "syn-7", "topic": "syn"}, {"type": "obj", "q": "Choose the word that is most nearly OPPOSITE in meaning to the underlined word: The judge described the evidence as <u>flimsy</u>.", "opts": ["recent", "honest", "lengthy", "solid"], "ans": 3, "sol": ["<i>Flimsy</i> evidence is weak and unconvincing.", "The opposite is evidence that is strong — <b>solid</b>."], "tip": null, "fig": null, "id": "ant-1", "topic": "ant"}, {"type": "obj", "q": "Choose the word most nearly OPPOSITE in meaning: The company made a <u>substantial</u> profit last year.", "opts": ["sudden", "steady", "quick", "negligible"], "ans": 3, "sol": ["<i>Substantial</i> = large in amount.", "<b>Negligible</b> means so small as to be not worth considering."], "tip": null, "fig": null, "id": "ant-2", "topic": "ant"}, {"type": "obj", "q": "Choose the word most nearly OPPOSITE in meaning: He is known for his <u>frugal</u> way of life.", "opts": ["generous", "simple", "extravagant", "quiet"], "ans": 2, "sol": ["<i>Frugal</i> means careful with money, spending little.", "<b>Extravagant</b> (spending too much) is the opposite. Note that <i>generous</i> is about giving, not spending on oneself."], "tip": null, "fig": null, "id": "ant-3", "topic": "ant"}, {"type": "obj", "q": "Choose the word most nearly OPPOSITE in meaning: The new prefect is very <u>humble</u>.", "opts": ["friendly", "arrogant", "obedient", "quiet"], "ans": 1, "sol": ["<i>Humble</i> = modest, not proud.", "The opposite is <b>arrogant</b>."], "tip": null, "fig": null, "id": "ant-4", "topic": "ant"}, {"type": "obj", "q": "Choose the correct negative form: The contract was declared ___ by the court.", "opts": ["disvalid", "invalid", "misvalid", "unvalid"], "ans": 1, "sol": ["The accepted negative form of <i>valid</i> is <b>invalid</b>.", "The other prefixes are not used with this word — negative prefixes must be learnt with the word."], "tip": null, "fig": null, "id": "ant-5", "topic": "ant"}, {"type": "obj", "q": "Choose the word most nearly OPPOSITE in meaning: Her account of the incident was <u>accurate</u>.", "opts": ["brief", "erroneous", "spoken", "detailed"], "ans": 1, "sol": ["<i>Accurate</i> = correct in every detail.", "<b>Erroneous</b> means containing errors."], "tip": null, "fig": null, "id": "ant-6", "topic": "ant"}, {"type": "thy", "q": "Give the opposite of each word and use it in a short sentence.<br>(a) legal &nbsp;(b) regular &nbsp;(c) mature &nbsp;(d) scarce &nbsp;(e) temporary", "sol": ["(a) <b>illegal</b> — It is illegal to fish with chemicals in the lagoon.", "(b) <b>irregular</b> — His irregular attendance affected his results.", "(c) <b>immature</b> — The mangoes were still immature when they were harvested.", "(d) <b>abundant / plentiful</b> — Water is abundant in the rainy season.", "(e) <b>permanent</b> — She was given a permanent appointment after two years.", "Note how the prefix changes with the first letter of the word: <i>il-</i> + legal, <i>ir-</i> + regular, <i>im-</i> + mature."], "marks": 5, "tip": null, "fig": null, "id": "ant-7", "topic": "ant"}, {"type": "obj", "q": "Choose the option that best explains the underlined expression: The two chiefs have decided to <u>bury the hatchet</u>.", "opts": ["stop farming", "make peace", "hide a weapon", "share the land"], "ans": 1, "sol": ["To <i>bury the hatchet</i> is to end a quarrel and become friends again.", "The answer is <b>make peace</b>."], "tip": null, "fig": null, "id": "idiom-1", "topic": "idiom"}, {"type": "obj", "q": "Choose the option that best explains the underlined expression: Kofi <u>let the cat out of the bag</u> about the surprise party.", "opts": ["revealed the secret", "created confusion", "told a lie", "ran away"], "ans": 0, "sol": ["<i>To let the cat out of the bag</i> means to disclose a secret, usually by accident."], "tip": null, "fig": null, "id": "idiom-2", "topic": "idiom"}, {"type": "obj", "q": "Choose the option that best explains the underlined expression: The two departments have been <u>at loggerheads</u> for months.", "opts": ["under investigation", "working together", "making progress", "in disagreement"], "ans": 3, "sol": ["To be <i>at loggerheads</i> is to be in strong disagreement."], "tip": null, "fig": null, "id": "idiom-3", "topic": "idiom"}, {"type": "obj", "q": "Choose the option that best explains the underlined expression: Ama had to <u>burn the midnight oil</u> before the examination.", "opts": ["keep a lamp burning", "study late into the night", "travel at night", "waste money"], "ans": 1, "sol": ["<i>Burning the midnight oil</i> means working or studying late into the night."], "tip": null, "fig": null, "id": "idiom-4", "topic": "idiom"}, {"type": "obj", "q": "Choose the correct collocation: The committee will ___ a decision at its next meeting.", "opts": ["take", "make out", "give", "do"], "ans": 0, "sol": ["We <i>take</i> a decision or <i>make</i> a decision; here only <b>take</b> is offered.", "<i>Do a decision</i> and <i>give a decision</i> are not standard English."], "tip": null, "fig": null, "id": "idiom-5", "topic": "idiom"}, {"type": "obj", "q": "Choose the option that best explains the underlined expression: The search for the missing file turned out to be <u>a wild goose chase</u>.", "opts": ["a dangerous hunt", "an exciting game", "a fruitless search", "a long journey"], "ans": 2, "sol": ["A <i>wild goose chase</i> is a hopeless search that wastes time."], "tip": null, "fig": null, "id": "idiom-6", "topic": "idiom"}, {"type": "thy", "q": "Explain the meaning of each idiom and use any THREE of them in sentences of your own.<br>(a) to smell a rat &nbsp;(b) to pay through the nose &nbsp;(c) to turn a deaf ear &nbsp;(d) a storm in a teacup &nbsp;(e) to take the bull by the horns", "sol": ["(a) <b>to suspect that something is wrong</b>", "(b) <b>to pay far more than a thing is worth</b>", "(c) <b>to refuse to listen</b>", "(d) <b>a great fuss over a small matter</b>", "(e) <b>to face a difficulty boldly</b>", "<div class=\"model\">Sample sentences: When the treasurer avoided the auditors, the members began to smell a rat. We paid through the nose for tomatoes during the dry season. The landlord turned a deaf ear to our complaints about the leaking roof.</div>"], "marks": 8, "tip": null, "fig": null, "id": "idiom-7", "topic": "idiom"}, {"type": "obj", "q": "The words <i>plaintiff, adjourn, verdict</i> and <i>bail</i> are associated with which field?", "opts": ["medicine", "banking", "law", "journalism"], "ans": 2, "sol": ["All four are courtroom terms: the plaintiff brings the case, the court may adjourn, the jury gives a verdict and an accused person may be granted bail."], "tip": null, "fig": null, "id": "reg-1", "topic": "reg"}, {"type": "obj", "q": "The words <i>carburettor, clutch, gasket</i> and <i>ignition</i> belong to the register of ___.", "opts": ["printing", "fishing", "carpentry", "motor vehicles"], "ans": 3, "sol": ["These are all parts or systems of a motor engine."], "tip": null, "fig": null, "id": "reg-2", "topic": "reg"}, {"type": "obj", "q": "In the sentence 'The doctor wrote out a ___ after examining the patient', the word that best completes it is ___.", "opts": ["prescription", "description", "proscription", "subscription"], "ans": 0, "sol": ["A <b>prescription</b> is the written instruction for medicine.", "<i>Proscription</i> means a ban; <i>subscription</i> is a payment; <i>description</i> is an account of something."], "tip": null, "fig": null, "id": "reg-3", "topic": "reg"}, {"type": "obj", "q": "The words <i>byline, masthead, editorial</i> and <i>scoop</i> belong to the register of ___.", "opts": ["journalism", "athletics", "banking", "weaving"], "ans": 0, "sol": ["They are newspaper terms: the byline names the writer, the masthead carries the paper's title, the editorial is the paper's opinion and a scoop is an exclusive story."], "tip": null, "fig": null, "id": "reg-4", "topic": "reg"}, {"type": "obj", "q": "A farmer who clears land and then makes long raised rows of soil before planting is said to be ___.", "opts": ["mulching", "pruning", "ridging", "harrowing"], "ans": 2, "sol": ["<b>Ridging</b> is making ridges. <i>Harrowing</i> breaks up clods, <i>mulching</i> covers the soil, and <i>pruning</i> cuts back branches."], "tip": null, "fig": null, "id": "reg-5", "topic": "reg"}, {"type": "obj", "q": "The words <i>aperture, shutter, negative</i> and <i>focus</i> are associated with ___.", "opts": ["photography", "tailoring", "surveying", "printing"], "ans": 0, "sol": ["All four are camera terms."], "tip": null, "fig": null, "id": "reg-6", "topic": "reg"}, {"type": "thy", "q": "Name the field (register) associated with each set of words, and add one more word of your own to each set.<br>(a) overdraft, teller, ledger<br>(b) anaesthetic, theatre, dosage<br>(c) chisel, mortise, plane<br>(d) dribble, offside, substitution<br>(e) warp, weft, loom", "sol": ["(a) <b>Banking</b> — e.g. statement, deposit, interest", "(b) <b>Medicine / surgery</b> — e.g. diagnosis, ward, syringe", "(c) <b>Carpentry</b> — e.g. joint, sandpaper, tenon", "(d) <b>Football (sports)</b> — e.g. penalty, kick-off, referee", "(e) <b>Weaving</b> — e.g. shuttle, thread, kente"], "marks": 10, "tip": null, "fig": null, "id": "reg-7", "topic": "reg"}, {"type": "obj", "q": "Choose the correct word: The headmaster gave us useful ___ about the examination.", "opts": ["advices", "advise", "advises", "advice"], "ans": 3, "sol": ["<i>Advice</i> is the noun and it is uncountable — never <i>advices</i>.", "<i>Advise</i> is the verb."], "tip": null, "fig": null, "id": "form-1", "topic": "form"}, {"type": "obj", "q": "Choose the correct word: The rise in fuel prices will ___ the cost of transport.", "opts": ["affective", "effect", "affect", "effective"], "ans": 2, "sol": ["<b>Affect</b> is the verb meaning 'to influence'.", "<i>Effect</i> is normally the noun ('the result'), as in 'the effect of the rise'."], "tip": null, "fig": null, "id": "form-2", "topic": "form"}, {"type": "obj", "q": "Choose the correct word: We bought pens and exercise books from the ___ shop.", "opts": ["stationeries", "stationery", "station", "stationary"], "ans": 1, "sol": ["<b>Stationery</b> (with an <i>e</i>) means writing materials.", "<i>Stationary</i> (with an <i>a</i>) means not moving. Remember: p<b>e</b>ns = station<b>e</b>ry."], "tip": null, "fig": null, "id": "form-3", "topic": "form"}, {"type": "obj", "q": "The noun formed from the verb <i>accept</i> is ___.", "opts": ["acceptment", "acceptation", "acception", "acceptance"], "ans": 3, "sol": ["The standard noun is <b>acceptance</b>."], "tip": null, "fig": null, "id": "form-4", "topic": "form"}, {"type": "obj", "q": "Choose the correct word: Her behaviour at the meeting was very ___ for a grown woman.", "opts": ["childish", "childlike", "childful", "childly"], "ans": 0, "sol": ["<b>Childish</b> is used disapprovingly, of silly or immature behaviour.", "<i>Childlike</i> is complimentary (innocent, trusting)."], "tip": null, "fig": null, "id": "form-5", "topic": "form"}, {"type": "obj", "q": "Choose the correct word: Honesty is the guiding ___ of the association.", "opts": ["principal", "principality", "principled", "principle"], "ans": 3, "sol": ["A <b>principle</b> is a rule or belief.", "A <i>principal</i> is the head of a school (or 'main')."], "tip": null, "fig": null, "id": "form-6", "topic": "form"}, {"type": "thy", "q": "Fill each gap with the correct form of the word in brackets.<br>(a) The manager's ___ (decide) surprised everyone.<br>(b) The workers demanded better ___ (accommodate).<br>(c) She spoke ___ (confidence) about her chances.<br>(d) This water is not ___ (drink).<br>(e) Their ___ (arrive) was delayed by the rain.", "sol": ["(a) <b>decision</b>", "(b) <b>accommodation</b>", "(c) <b>confidently</b> (adverb — it describes <i>spoke</i>)", "(d) <b>drinkable</b>", "(e) <b>arrival</b>"], "marks": 5, "tip": null, "fig": null, "id": "form-7", "topic": "form"}, {"type": "obj", "q": "Identify the figure of speech: 'The wind whispered through the palm trees.'", "opts": ["Metonymy", "Personification", "Simile", "Hyperbole"], "ans": 1, "sol": ["Whispering is a human action given to the wind, so it is <b>personification</b>."], "tip": null, "fig": null, "id": "fig-1", "topic": "fig"}, {"type": "obj", "q": "Identify the figure of speech: 'Kofi is a lion on the football field.'", "opts": ["Euphemism", "Irony", "Simile", "Metaphor"], "ans": 3, "sol": ["Kofi is said to <i>be</i> a lion — a direct comparison with no <i>like</i> or <i>as</i>, so it is a <b>metaphor</b>."], "tip": null, "fig": null, "id": "fig-2", "topic": "fig"}, {"type": "obj", "q": "Identify the figure of speech: 'I have told you a million times to close the gate.'", "opts": ["Hyperbole", "Paradox", "Litotes", "Metonymy"], "ans": 0, "sol": ["The number is a deliberate exaggeration for effect — <b>hyperbole</b>."], "tip": null, "fig": null, "id": "fig-3", "topic": "fig"}, {"type": "obj", "q": "Identify the figure of speech: 'His grandmother passed away last night.'", "opts": ["Simile", "Irony", "Euphemism", "Oxymoron"], "ans": 2, "sol": ["<i>Passed away</i> is a gentler expression for <i>died</i>, so it is a <b>euphemism</b>."], "tip": null, "fig": null, "id": "fig-4", "topic": "fig"}, {"type": "obj", "q": "Identify the figure of speech: 'The pen is mightier than the sword.'", "opts": ["Simile", "Onomatopoeia", "Metonymy", "Personification"], "ans": 2, "sol": ["The <i>pen</i> stands for writing and the <i>sword</i> for warfare — one thing named by something closely associated with it: <b>metonymy</b>."], "tip": null, "fig": null, "id": "fig-5", "topic": "fig"}, {"type": "obj", "q": "Identify the figure of speech: 'It was a deafening silence in the hall.'", "opts": ["Oxymoron", "Simile", "Hyperbole", "Alliteration"], "ans": 0, "sol": ["<i>Deafening</i> and <i>silence</i> contradict each other, and the two are placed side by side — an <b>oxymoron</b>."], "tip": null, "fig": null, "id": "fig-6", "topic": "fig"}, {"type": "thy", "q": "Name the figure of speech in each sentence and explain its effect in one line.<br>(a) The classroom was a zoo when the teacher stepped out.<br>(b) Peter picked a peck of pickled peppers.<br>(c) The car coughed, spluttered and finally died.<br>(d) O Death, where is thy sting?<br>(e) He is not a bad footballer at all.", "sol": ["(a) <b>Metaphor</b> — the noise and disorder of the class are compared directly with a zoo.", "(b) <b>Alliteration</b> — the repeated /p/ sound gives the line rhythm and makes it memorable.", "(c) <b>Personification</b> — the car is given human actions, which makes its breakdown vivid.", "(d) <b>Apostrophe</b> — death, which cannot reply, is addressed directly, giving the line dramatic force.", "(e) <b>Litotes (understatement)</b> — saying 'not bad' to mean 'very good' is a modest, emphatic way of praising him."], "marks": 10, "tip": null, "fig": null, "id": "fig-7", "topic": "fig"}, {"type": "obj", "q": "Choose the correct option: By the time we reached the cinema, the film ___.", "opts": ["has started", "had started", "was starting", "started"], "ans": 1, "sol": ["Two past actions: the film started FIRST, so it takes the past perfect — <b>had started</b>."], "tip": null, "fig": null, "id": "tense-1", "topic": "tense"}, {"type": "obj", "q": "Choose the correct option: She ___ in Kumasi since 2019.", "opts": ["had lived", "has lived", "lived", "is living"], "ans": 1, "sol": ["<i>Since 2019</i> links the past to the present, so the present perfect is used: <b>has lived</b>."], "tip": null, "fig": null, "id": "tense-2", "topic": "tense"}, {"type": "obj", "q": "Choose the correct option: If it rains tomorrow, we ___ the match.", "opts": ["postponed", "will be postponed", "would postpone", "will postpone"], "ans": 3, "sol": ["This is the first conditional: <i>if</i> + present simple, then <i>will</i> + bare infinitive."], "tip": null, "fig": null, "id": "tense-3", "topic": "tense"}, {"type": "obj", "q": "Choose the correct option: The students ___ their assignments before the teacher arrived.", "opts": ["finish", "had finished", "are finishing", "have finished"], "ans": 1, "sol": ["The finishing happened before another past event, so the past perfect is correct."], "tip": null, "fig": null, "id": "tense-4", "topic": "tense"}, {"type": "obj", "q": "Choose the correct option: Kofi said that he ___ to Accra the following week.", "opts": ["will travel", "would travel", "has travelled", "travels"], "ans": 1, "sol": ["In reported speech, <i>will</i> in the original becomes <b>would</b> after a past reporting verb."], "tip": null, "fig": null, "id": "tense-5", "topic": "tense"}, {"type": "obj", "q": "Choose the correct option: Look at those clouds! It ___ soon.", "opts": ["is going to rain", "rained", "rains", "has rained"], "ans": 0, "sol": ["Present evidence pointing to the near future takes <i>be going to</i>."], "tip": null, "fig": null, "id": "tense-6", "topic": "tense"}, {"type": "thy", "q": "Put the verb in brackets into the correct tense.<br>(a) When I arrived, the meeting (begin) ___ already.<br>(b) He (work) ___ in that bank for ten years now.<br>(c) While we (cook) ___, the lights went off.<br>(d) By next month, she (complete) ___ her training.<br>(e) I (not see) ___ him since Christmas.", "sol": ["(a) <b>had begun</b> — earlier of two past actions", "(b) <b>has worked / has been working</b> — started in the past and still true", "(c) <b>were cooking</b> — a longer action interrupted by a shorter one", "(d) <b>will have completed</b> — future perfect, finished before a future time", "(e) <b>have not seen</b> — present perfect with <i>since</i>"], "marks": 5, "tip": null, "fig": null, "id": "tense-7", "topic": "tense"}, {"type": "obj", "q": "Choose the correct option: Neither the teacher nor the students ___ present.", "opts": ["is", "was", "were", "has been"], "ans": 2, "sol": ["With <i>neither…nor</i>, the verb agrees with the subject nearer to it.", "<i>Students</i> is plural, so the verb is <b>were</b>."], "tip": null, "fig": null, "id": "concord-1", "topic": "concord"}, {"type": "obj", "q": "Choose the correct option: Each of the girls ___ a prize.", "opts": ["are winning", "has won", "have won", "win"], "ans": 1, "sol": ["<i>Each</i> is singular, so the verb must be singular: <b>has won</b>."], "tip": null, "fig": null, "id": "concord-2", "topic": "concord"}, {"type": "obj", "q": "Choose the correct option: The number of candidates ___ increasing every year.", "opts": ["are", "were", "is", "have been"], "ans": 2, "sol": ["'The number of…' is a singular expression (it names one figure).", "Compare: 'A number of candidates <i>are</i> waiting outside.'"], "tip": null, "fig": null, "id": "concord-3", "topic": "concord"}, {"type": "obj", "q": "Choose the correct option: Mathematics ___ my favourite subject.", "opts": ["have been", "are", "were", "is"], "ans": 3, "sol": ["Although it ends in -s, <i>mathematics</i> is a singular noun."], "tip": null, "fig": null, "id": "concord-4", "topic": "concord"}, {"type": "obj", "q": "Choose the correct option: The chairman, together with his committee members, ___ arrived.", "opts": ["has", "have", "were", "are"], "ans": 0, "sol": ["The phrase after <i>together with</i> does not change the subject.", "The subject is <i>the chairman</i> (singular), so the verb is <b>has</b>."], "tip": null, "fig": null, "id": "concord-5", "topic": "concord"}, {"type": "obj", "q": "Choose the correct option: Bread and butter ___ served every morning.", "opts": ["is", "were", "are", "have been"], "ans": 0, "sol": ["<i>Bread and butter</i> is treated as a single item of food, so the verb is singular."], "tip": null, "fig": null, "id": "concord-6", "topic": "concord"}, {"type": "thy", "q": "Correct the error of concord in each sentence and give a reason.<br>(a) One of the boys have lost his book.<br>(b) The furniture in the classrooms are old.<br>(c) Either the prefect or the teachers is to blame.<br>(d) Everybody were happy about the result.<br>(e) Ten thousand cedis are a lot of money.", "sol": ["(a) <b>has</b> — the subject is <i>one</i>, not <i>boys</i>.", "(b) <b>is</b> — <i>furniture</i> is an uncountable, singular noun.", "(c) <b>are</b> — with <i>either…or</i> the verb agrees with the nearer subject, <i>teachers</i>.", "(d) <b>was</b> — <i>everybody</i> is singular.", "(e) <b>is</b> — an amount of money is treated as one unit."], "marks": 5, "tip": null, "fig": null, "id": "concord-7", "topic": "concord"}, {"type": "obj", "q": "Choose the correct option: The money was shared between Kofi and ___.", "opts": ["me", "mine", "myself", "I"], "ans": 0, "sol": ["<i>Between</i> is a preposition, so it takes the object pronoun <b>me</b>."], "tip": null, "fig": null, "id": "pron-1", "topic": "pron"}, {"type": "obj", "q": "Choose the correct option: She writes better than ___.", "opts": ["mine", "I", "me", "myself"], "ans": 1, "sol": ["The full sentence is 'better than I <i>do</i>', so the subject form <b>I</b> is correct."], "tip": null, "fig": null, "id": "pron-2", "topic": "pron"}, {"type": "obj", "q": "Choose the correct option: There were ___ people at the rally than last year.", "opts": ["less", "lesser", "little", "fewer"], "ans": 3, "sol": ["<i>People</i> is countable, so use <b>fewer</b>. <i>Less</i> goes with uncountable nouns (less water)."], "tip": null, "fig": null, "id": "pron-3", "topic": "pron"}, {"type": "obj", "q": "Choose the correct option: The dog wagged ___ tail.", "opts": ["its'", "its", "it's", "their"], "ans": 1, "sol": ["<b>Its</b> shows possession. <i>It's</i> is short for <i>it is</i>."], "tip": null, "fig": null, "id": "pron-4", "topic": "pron"}, {"type": "obj", "q": "Choose the correct option: The committee has published ___ report.", "opts": ["it's", "theirs", "their", "its"], "ans": 3, "sol": ["A collective noun acting as one body takes a singular possessive: <b>its</b> report."], "tip": null, "fig": null, "id": "pron-5", "topic": "pron"}, {"type": "obj", "q": "Choose the correct option: The two brothers blamed ___ for the accident.", "opts": ["themselves", "his", "each other", "one another's"], "ans": 2, "sol": ["<b>Each other</b> is used for two people acting on one another; <i>one another</i> is preferred for more than two.", "<i>Themselves</i> would mean each brother blamed only himself."], "tip": null, "fig": null, "id": "pron-6", "topic": "pron"}, {"type": "thy", "q": "Rewrite each sentence correctly.<br>(a) Everyone must bring their own pen.<br>(b) Him and his friends went to the farm.<br>(c) The book is hers', not mine.<br>(d) There is less students in the class today.<br>(e) Me and Ama are cousins.", "sol": ["(a) <b>Everyone must bring his or her own pen.</b> (<i>Everyone</i> is singular; 'their' is accepted in informal use but not in the examination.)", "(b) <b>He and his friends went to the farm.</b> — subject form.", "(c) <b>The book is hers, not mine.</b> — possessive pronouns take no apostrophe.", "(d) <b>There are fewer students in the class today.</b>", "(e) <b>Ama and I are cousins.</b> — the subject form, and courtesy puts the other person first."], "marks": 5, "tip": null, "fig": null, "id": "pron-7", "topic": "pron"}, {"type": "obj", "q": "Choose the correct option: The class congratulated her ___ her success.", "opts": ["with", "about", "for", "on"], "ans": 3, "sol": ["The fixed pattern is <i>congratulate someone <b>on</b> something</i>."], "tip": null, "fig": null, "id": "prep-1", "topic": "prep"}, {"type": "obj", "q": "Choose the correct option: He was accused ___ stealing the money.", "opts": ["about", "with", "for", "of"], "ans": 3, "sol": ["<i>Accused <b>of</b></i> + the offence. (But: <i>charged <b>with</b></i> an offence.)"], "tip": null, "fig": null, "id": "prep-2", "topic": "prep"}, {"type": "obj", "q": "Choose the correct option: I prefer rice ___ yam.", "opts": ["to", "from", "than", "over"], "ans": 0, "sol": ["<i>Prefer X <b>to</b> Y</i>. <i>Than</i> is used with <i>rather</i>: 'I would rather eat rice than yam.'"], "tip": null, "fig": null, "id": "prep-3", "topic": "prep"}, {"type": "obj", "q": "Choose the option nearest in meaning to the underlined words: The meeting was <u>put off</u> until Friday.", "opts": ["announced", "postponed", "shortened", "cancelled"], "ans": 1, "sol": ["<i>Put off</i> means to move to a later time — <b>postponed</b>.", "To cancel completely would be <i>call off</i>."], "tip": null, "fig": null, "id": "prep-4", "topic": "prep"}, {"type": "obj", "q": "Choose the option nearest in meaning to the underlined words: The police promised to <u>look into</u> the matter.", "opts": ["investigate", "settle", "report", "ignore"], "ans": 0, "sol": ["<i>Look into</i> = <b>investigate</b>."], "tip": null, "fig": null, "id": "prep-5", "topic": "prep"}, {"type": "obj", "q": "Choose the correct option: The students were asked to comply ___ the new regulations.", "opts": ["for", "with", "on", "to"], "ans": 1, "sol": ["The fixed pattern is <i>comply <b>with</b></i>."], "tip": null, "fig": null, "id": "prep-6", "topic": "prep"}, {"type": "thy", "q": "Supply the correct preposition or particle.<br>(a) She is married ___ a teacher.<br>(b) The results are different ___ what we expected.<br>(c) The chief insisted ___ seeing the letter.<br>(d) The team was deprived ___ victory by a late goal.<br>(e) We must do away ___ these old rules.", "sol": ["(a) <b>to</b>", "(b) <b>from</b>", "(c) <b>on</b>", "(d) <b>of</b>", "(e) <b>with</b> (<i>do away with</i> = abolish)"], "marks": 5, "tip": null, "fig": null, "id": "prep-7", "topic": "prep"}, {"type": "obj", "q": "Choose the correct option: Of the two girls, Ama is the ___.", "opts": ["more tall", "most tall", "taller", "tallest"], "ans": 2, "sol": ["For a comparison of two, use the comparative: <b>taller</b>."], "tip": null, "fig": null, "id": "adj-1", "topic": "adj"}, {"type": "obj", "q": "Choose the correct option: This is the ___ film I have ever watched.", "opts": ["most interesting", "much interesting", "more interesting", "interestingest"], "ans": 0, "sol": ["<i>Interesting</i> is a long adjective, so the superlative is <b>most interesting</b>."], "tip": null, "fig": null, "id": "adj-2", "topic": "adj"}, {"type": "obj", "q": "Choose the correct option: The patient is feeling ___ today than yesterday.", "opts": ["best", "better", "more better", "gooder"], "ans": 1, "sol": ["<i>Good/well</i> has the irregular comparative <b>better</b>; never <i>more better</i>."], "tip": null, "fig": null, "id": "adj-3", "topic": "adj"}, {"type": "obj", "q": "Choose the correct option: He drove ___ and avoided the accident.", "opts": ["carefully", "more careful", "carefulness", "careful"], "ans": 0, "sol": ["The word describes HOW he drove, so an adverb is needed: <b>carefully</b>."], "tip": null, "fig": null, "id": "adj-4", "topic": "adj"}, {"type": "obj", "q": "Choose the correct option: Accra is ___ than Kumasi.", "opts": ["more larger", "large", "largest", "larger"], "ans": 3, "sol": ["Two places are compared, so the comparative <b>larger</b> is used."], "tip": null, "fig": null, "id": "adj-5", "topic": "adj"}, {"type": "obj", "q": "Choose the correct option: She sings ___ than her sister.", "opts": ["well", "gooder", "better", "best"], "ans": 2, "sol": ["The comparative of the adverb <i>well</i> is <b>better</b>."], "tip": null, "fig": null, "id": "adj-6", "topic": "adj"}, {"type": "thy", "q": "Rewrite each sentence correctly.<br>(a) He is the most cleverest boy in the class.<br>(b) This road is more wider than that one.<br>(c) She speaks English fluent.<br>(d) Of all the three candidates, he is the better.<br>(e) The food smells deliciously.", "sol": ["(a) <b>He is the cleverest boy in the class.</b>", "(b) <b>This road is wider than that one.</b>", "(c) <b>She speaks English fluently.</b> — an adverb is needed.", "(d) <b>Of all the three candidates, he is the best.</b> — more than two ⇒ superlative.", "(e) <b>The food smells delicious.</b> — after linking verbs (<i>smell, taste, look, feel, seem</i>) use an adjective."], "marks": 5, "tip": null, "fig": null, "id": "adj-7", "topic": "adj"}, {"type": "obj", "q": "Choose the correct tag: Let us begin the meeting, ___?", "opts": ["shan't we", "will we", "shall we", "do we"], "ans": 2, "sol": ["After <i>Let us/Let's</i>, the tag is always <b>shall we</b>."], "tip": null, "fig": null, "id": "tags-1", "topic": "tags"}, {"type": "obj", "q": "Choose the correct tag: You have finished your work, ___?", "opts": ["don't you", "haven't you", "have you", "didn't you"], "ans": 1, "sol": ["The statement is positive and uses <i>have</i>, so the tag is negative with the same auxiliary: <b>haven't you</b>."], "tip": null, "fig": null, "id": "tags-2", "topic": "tags"}, {"type": "obj", "q": "Choose the correct tag: Nobody informed the headmaster, ___?", "opts": ["did he", "were they", "did they", "didn't they"], "ans": 2, "sol": ["<i>Nobody</i> makes the statement negative, so the tag is positive; <i>nobody</i> is referred to as <b>they</b>."], "tip": null, "fig": null, "id": "tags-3", "topic": "tags"}, {"type": "obj", "q": "Choose the correct option: If I ___ you, I would apologise.", "opts": ["will be", "am", "were", "was"], "ans": 2, "sol": ["In a type 2 (unreal) conditional, <i>be</i> takes the form <b>were</b> for all persons."], "tip": null, "fig": null, "id": "tags-4", "topic": "tags"}, {"type": "obj", "q": "Choose the correct option: If she had taken the medicine, she ___ better by now.", "opts": ["would feel", "will feel", "had felt", "would have felt"], "ans": 3, "sol": ["A type 3 conditional (past unreal) takes <i>would have</i> + past participle."], "tip": null, "fig": null, "id": "tags-5", "topic": "tags"}, {"type": "obj", "q": "Choose the correct reported form: Ama said, 'I am travelling to Tamale today.'", "opts": ["Ama says that she was travelling to Tamale today.", "Ama said that she is travelling to Tamale today.", "Ama said that she was travelling to Tamale that day.", "Ama said that I was travelling to Tamale that day."], "ans": 2, "sol": ["The tense shifts back (<i>am → was</i>), the pronoun changes (<i>I → she</i>) and <i>today</i> becomes <b>that day</b>."], "tip": null, "fig": null, "id": "tags-6", "topic": "tags"}, {"type": "thy", "q": "(a) Add question tags: (i) He rarely comes to school, ___? (ii) Open the window, ___? (iii) I am your friend, ___?<br>(b) Report the following: The teacher said to the boys, 'Bring your books here tomorrow.'<br>(c) Complete: If the rain had stopped earlier, we ___ (finish) the work.", "sol": ["(a)(i) <b>does he</b> — <i>rarely</i> makes the statement negative in meaning, so the tag is positive.", "(ii) <b>will you</b> — imperatives take <i>will you</i> (or <i>won't you</i>).", "(iii) <b>aren't I</b> — the accepted tag for <i>I am</i>.", "(b) <b>The teacher told the boys to take their books there the following day.</b>", "Note the changes: <i>said to → told</i>, <i>bring → take</i>, <i>your → their</i>, <i>here → there</i>, <i>tomorrow → the following day</i>.", "(c) <b>would have finished</b>"], "marks": 8, "tip": null, "fig": null, "id": "tags-7", "topic": "tags"}, {"type": "obj", "q": "What is the function of the underlined clause? <u>That he was late</u> annoyed the teacher.", "opts": ["Noun clause, subject of the verb", "Adverbial clause of reason", "Adjectival clause qualifying 'teacher'", "Main clause"], "ans": 0, "sol": ["The clause names the thing that annoyed the teacher, so it does the work of a noun and is the subject of <i>annoyed</i>."], "tip": null, "fig": null, "id": "clause-1", "topic": "clause"}, {"type": "obj", "q": "What is the function of the underlined clause? The boy <u>who won the prize</u> is my brother.", "opts": ["Adverbial clause of time", "Adjectival clause qualifying 'boy'", "Noun clause, object", "Adverbial clause of manner"], "ans": 1, "sol": ["The clause tells us <i>which</i> boy, so it qualifies the noun — an adjectival (relative) clause."], "tip": null, "fig": null, "id": "clause-2", "topic": "clause"}, {"type": "obj", "q": "What is the function of the underlined clause? We stayed indoors <u>because it was raining</u>.", "opts": ["Noun clause, complement", "Adverbial clause of condition", "Adjectival clause", "Adverbial clause of reason"], "ans": 3, "sol": ["It answers the question <i>why</i>, so it is an adverbial clause of reason."], "tip": null, "fig": null, "id": "clause-3", "topic": "clause"}, {"type": "obj", "q": "Identify the sentence type: 'Ama cooked the food and Kofi washed the plates.'", "opts": ["Simple", "Compound-complex", "Complex", "Compound"], "ans": 3, "sol": ["Two main clauses joined by <i>and</i>, each able to stand alone — a <b>compound</b> sentence."], "tip": null, "fig": null, "id": "clause-4", "topic": "clause"}, {"type": "obj", "q": "Identify the sentence type: 'Although he was tired, he finished the work.'", "opts": ["Simple", "Compound-complex", "Complex", "Compound"], "ans": 2, "sol": ["<i>Although he was tired</i> is subordinate and cannot stand alone, so the sentence is <b>complex</b>."], "tip": null, "fig": null, "id": "clause-5", "topic": "clause"}, {"type": "obj", "q": "What is the function of the underlined phrase? The girl <u>in the blue uniform</u> is the head prefect.", "opts": ["Noun phrase, object", "Verb phrase", "Adjectival phrase qualifying 'girl'", "Adverbial phrase of place"], "ans": 2, "sol": ["It has no finite verb and it tells us which girl, so it is an adjectival phrase."], "tip": null, "fig": null, "id": "clause-6", "topic": "clause"}, {"type": "thy", "q": "State the function of each underlined group of words.<br>(a) <u>Running quickly</u>, the boy caught the bus.<br>(b) I do not know <u>where she keeps the key</u>.<br>(c) He spoke <u>as though he owned the school</u>.<br>(d) The house <u>that we bought last year</u> needs painting.<br>(e) <u>In the morning</u>, we set off for the farm.", "sol": ["(a) <b>Participial (adjectival) phrase</b> qualifying <i>the boy</i>.", "(b) <b>Noun clause</b>, object of the verb <i>know</i>.", "(c) <b>Adverbial clause of manner</b>, modifying <i>spoke</i>.", "(d) <b>Adjectival (relative) clause</b> qualifying <i>the house</i>.", "(e) <b>Adverbial phrase of time</b>, modifying <i>set off</i>."], "marks": 10, "tip": null, "fig": null, "id": "clause-7", "topic": "clause"}, {"type": "obj", "q": "Choose the correctly punctuated sentence.", "opts": ["The girls' dormitory which, was built last year is full.", "The girls dormitory, which was built last year is full.", "The girls' dormitory, which was built last year, is full.", "The girl's dormitory which was built last year, is full."], "ans": 2, "sol": ["The dormitory belongs to more than one girl ⇒ <i>girls'</i>.", "The non-defining clause <i>which was built last year</i> must be enclosed by a pair of commas."], "tip": null, "fig": null, "id": "punct-1", "topic": "punct"}, {"type": "obj", "q": "Choose the correct option: We bought the following items ___ rice, beans, oil and sugar.", "opts": ["-", ";", ":", ","], "ans": 2, "sol": ["A <b>colon</b> introduces a list after a complete statement."], "tip": null, "fig": null, "id": "punct-2", "topic": "punct"}, {"type": "obj", "q": "Which word is correctly spelt?", "opts": ["neccessary", "necessary", "nessessary", "necesary"], "ans": 1, "sol": ["<b>Necessary</b> — one c, two s's. A memory aid: one Collar, two Sleeves."], "tip": null, "fig": null, "id": "punct-3", "topic": "punct"}, {"type": "obj", "q": "Choose the correctly capitalised sentence.", "opts": ["We study French and Geography on Mondays in the harmattan season.", "We study french and geography on mondays in the Harmattan season.", "we study French and geography on Mondays in the harmattan Season.", "We Study French and Geography on mondays in the Harmattan Season."], "ans": 0, "sol": ["Languages (French) and days (Mondays) are capitalised; a school subject is capitalised when it is also a proper noun (Geography is accepted as a named subject).", "Seasons such as <i>harmattan</i> are not capitalised."], "tip": null, "fig": null, "id": "punct-4", "topic": "punct"}, {"type": "obj", "q": "Choose the correct option: ___ books are on the table.", "opts": ["The children's", "The childrens'", "The childrens", "The children"], "ans": 0, "sol": ["<i>Children</i> is already plural, so the possessive simply adds 's: <b>children's</b>."], "tip": null, "fig": null, "id": "punct-5", "topic": "punct"}, {"type": "obj", "q": "Which sentence uses the semicolon correctly?", "opts": ["The rain fell heavily; which abandoned the match.", "The rain fell heavily; and the match was abandoned.", "The rain fell heavily; the match was abandoned.", "The rain fell heavily; because the match was abandoned."], "ans": 2, "sol": ["A semicolon joins two complete, closely related statements without a conjunction."], "tip": null, "fig": null, "id": "punct-6", "topic": "punct"}, {"type": "thy", "q": "Rewrite the passage with the correct punctuation and capital letters.<br><i>on monday the head teacher mr mensah addressed the school he said honesty hard work and punctuality are the keys to success the students who were in the assembly hall applauded loudly</i>", "sol": ["<div class=\"model\">On Monday, the head teacher, Mr Mensah, addressed the school. He said, “Honesty, hard work and punctuality are the keys to success.” The students, who were in the assembly hall, applauded loudly.</div>", "Points to note: a capital letter begins each sentence and each proper noun (Monday, Mr Mensah);", "the appositive <i>Mr Mensah</i> is enclosed in commas;", "the spoken words take a comma before them, quotation marks around them and a capital letter at the start;", "the items in the list are separated by commas."], "marks": 10, "tip": null, "fig": null, "id": "punct-7", "topic": "punct"}, {"type": "obj", "q": "Change to the passive: 'The carpenter is repairing the desks.'", "opts": ["The desks are being repaired by the carpenter.", "The desks were being repaired by the carpenter.", "The desks have been repaired by the carpenter.", "The desks are repaired by the carpenter."], "ans": 0, "sol": ["Present continuous active → present continuous passive: <i>are being</i> + past participle."], "tip": null, "fig": null, "id": "voice-1", "topic": "voice"}, {"type": "obj", "q": "Change to the passive: 'Someone has stolen my bicycle.'", "opts": ["My bicycle is stolen.", "My bicycle has been stolen.", "My bicycle had been stolen.", "My bicycle was stolen by someone."], "ans": 1, "sol": ["Present perfect: <i>has been</i> + past participle. <i>Someone</i> is vague, so <i>by someone</i> is dropped."], "tip": null, "fig": null, "id": "voice-2", "topic": "voice"}, {"type": "obj", "q": "Change to the active: 'The prize was won by a Form Two student.'", "opts": ["A Form Two student was winning the prize.", "A Form Two student won the prize.", "A Form Two student has won the prize.", "The prize a Form Two student won."], "ans": 1, "sol": ["The doer becomes the subject and the tense stays simple past: <b>won</b>."], "tip": null, "fig": null, "id": "voice-3", "topic": "voice"}, {"type": "obj", "q": "Choose the correct passive form: 'They will announce the results next week.'", "opts": ["The results are announced next week.", "The results would be announced next week.", "The results will be announced next week.", "The results will announce next week."], "ans": 2, "sol": ["Future simple passive: <i>will be</i> + past participle."], "tip": null, "fig": null, "id": "voice-4", "topic": "voice"}, {"type": "obj", "q": "Choose the correct passive form: 'The teacher gave the boys some books.'", "opts": ["The boys were given some books.", "The boys had given some books.", "Some books were given the boys by the teacher's.", "The boys are given some books."], "ans": 0, "sol": ["With two objects, either may become the subject; the natural version is <b>The boys were given some books</b> (by the teacher)."], "tip": null, "fig": null, "id": "voice-5", "topic": "voice"}, {"type": "obj", "q": "Which sentence has NO passive form?", "opts": ["Kofi has a new phone.", "Kofi wrote a letter.", "They built the school.", "Kofi is cleaning the room."], "ans": 0, "sol": ["<i>Have</i> in the sense of possession cannot be made passive — we do not say 'A new phone is had by Kofi.'"], "tip": null, "fig": null, "id": "voice-6", "topic": "voice"}, {"type": "thy", "q": "Rewrite each sentence in the passive voice.<br>(a) The farmer planted maize on the ridges.<br>(b) The head teacher is addressing the students.<br>(c) They have completed the new library.<br>(d) Somebody must clean this classroom.<br>(e) The judge will deliver the verdict tomorrow.", "sol": ["(a) <b>Maize was planted on the ridges by the farmer.</b>", "(b) <b>The students are being addressed by the head teacher.</b>", "(c) <b>The new library has been completed.</b>", "(d) <b>This classroom must be cleaned.</b>", "(e) <b>The verdict will be delivered tomorrow.</b>"], "marks": 5, "tip": null, "fig": null, "id": "voice-7", "topic": "voice"}, {"type": "obj", "q": "Choose the word that has the same vowel sound as the one underlined: b<u>ir</u>d", "opts": ["learn", "board", "bread", "beard"], "ans": 0, "sol": ["<i>Bird</i> has the long vowel /ɜː/.", "<b>Learn</b> = /lɜːn/ — the same sound. <i>Beard</i> is /ɪə/, <i>board</i> is /ɔː/ and <i>bread</i> is /e/."], "tip": null, "fig": null, "id": "vowel-1", "topic": "vowel"}, {"type": "obj", "q": "Choose the word that has the same vowel sound as the one underlined: f<u>oo</u>d", "opts": ["rude", "foot", "good", "blood"], "ans": 0, "sol": ["<i>Food</i> has the long /uː/.", "<b>Rude</b> = /ruːd/. <i>Foot</i> and <i>good</i> have the short /ʊ/, and <i>blood</i> has /ʌ/."], "tip": null, "fig": null, "id": "vowel-2", "topic": "vowel"}, {"type": "obj", "q": "Choose the word whose vowel sound is DIFFERENT from the others.", "opts": ["heat", "seat", "meat", "great"], "ans": 3, "sol": ["<i>Meat, seat</i> and <i>heat</i> all have /iː/.", "<b>Great</b> is pronounced /ɡreɪt/, with the diphthong /eɪ/."], "tip": null, "fig": null, "id": "vowel-3", "topic": "vowel"}, {"type": "obj", "q": "Choose the word that rhymes with <i>rough</i>.", "opts": ["dough", "cough", "stuff", "through"], "ans": 2, "sol": ["<i>Rough</i> is /rʌf/.", "<b>Stuff</b> /stʌf/ rhymes with it. <i>Cough</i> = /kɒf/, <i>dough</i>
